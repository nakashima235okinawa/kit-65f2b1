<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ITC試験対策 その2（分野別ドリル） — PGL Ver.4.0 対応</title>
<style>
:root{
  --bg:#E9EBEE; --card:#FCFCFB; --ink:#17202B; --sub:#5C6672;
  --ai:#1F3A63; --shu:#B4362F; --midori:#2C6A4F; --rule:#C9CDD3; --gold:#8a6d1f;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:15px}
header{background:var(--ai);color:#fff;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-size:18px;margin:0;letter-spacing:.08em}
header .sub{font-size:11px;opacity:.75}
header .hspace{flex:1}
main{max-width:860px;margin:18px auto 40px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(23,32,43,.05)}
h2{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--ai);letter-spacing:.05em}
.muted{color:var(--sub);font-size:13px}
button{font-family:var(--sans);cursor:pointer;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:9px 16px;font-size:14px}
button.primary{background:var(--ai);border-color:var(--ai);color:#fff}
button.review{background:var(--shu);border-color:var(--shu);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px;cursor:pointer;transition:.12s;text-align:left}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:var(--ai);box-shadow:0 2px 8px rgba(31,58,99,.12)}}
.mode b{font-family:var(--serif);font-size:16px;color:var(--ai);display:block;margin-bottom:6px}
.mode .muted{font-size:12px}
.mode .cnt{font-size:12px;color:var(--ai);font-weight:700;margin-top:8px;display:block}
.mode .wrongbadge{display:inline-block;margin-left:8px;background:#faecea;border:1px solid var(--shu);color:var(--shu);border-radius:999px;padding:0 8px;font-size:11px;font-weight:700}
.reviewcard{border:1px solid var(--shu);background:#fdf6f4}
.reviewcard h2{color:var(--shu)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--sub)}
.tagchip{border:1px solid var(--rule);border-radius:999px;padding:1px 10px;background:#fff}
.tagchip.rv{border-color:var(--shu);color:var(--shu);background:#faecea}
.stem{white-space:pre-wrap;font-size:15px;margin:4px 0 14px}
.qno{font-family:var(--serif);color:var(--ai);font-weight:700;margin-right:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;background:#fff;padding:10px 12px;cursor:pointer;text-align:left;font-size:14px;line-height:1.7;width:100%}
.choice .pos{font-family:var(--serif);color:var(--ai);font-weight:700;min-width:1.4em}
.choice .tx{white-space:pre-wrap;flex:1}
@media (hover:hover) and (pointer:fine){.choice:hover{border-color:var(--ai)}}
.choice.ok{border-color:var(--midori);background:#eaf3ee;box-shadow:inset 0 0 0 1px var(--midori)}
.choice.ng{border-color:var(--shu);background:#faecea;box-shadow:inset 0 0 0 1px var(--shu)}
.choice.dim{opacity:.6}
.exp{margin-top:14px;border-left:4px solid var(--ai);background:#f2f4f8;border-radius:0 6px 6px 0;padding:12px 14px;font-size:13.5px}
.exp .vh{font-family:var(--serif);color:var(--ai);margin-bottom:6px;font-weight:700}
.navrow{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.navrow .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--rule);border-radius:5px;background:#fff;text-align:center;padding:6px 0;font-size:12px;font-variant-numeric:tabular-nums}
.cell.ok{background:#eaf3ee;border-color:var(--midori);color:var(--midori);font-weight:700}
.cell.ng{background:#faecea;border-color:var(--shu);color:var(--shu);font-weight:700}
.bar{height:10px;background:#e3e6ea;border-radius:5px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ai)}
.score-hero{text-align:center;padding:8px 0 12px}
.score-hero .big{font-family:var(--serif);font-size:44px;color:var(--ai);font-variant-numeric:tabular-nums}
.score-hero .of{color:var(--sub);font-size:15px}
.progress{height:6px;background:#e3e6ea;border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--ai)}
.wronglist{margin-top:6px}
.wrongrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.resumecard{border:1px solid var(--gold);background:#fffdf5}
.resumecard h2{color:var(--gold)}
.resumemode{border-color:var(--gold)}
@media (hover:hover) and (pointer:fine){.resumemode:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(138,109,31,.18)}}
.resumemode b{color:var(--gold)}
.pausebadge{display:inline-block;margin-left:8px;background:#fffaed;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 8px;font-size:11px;font-weight:700}
.pgchip{display:inline-block;margin-left:8px;border:1px solid var(--ai);color:var(--ai);background:#fff;border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:700;font-family:var(--sans);vertical-align:middle}
.exp .vh .pgchip{margin-left:10px}
.wrongrow .n{font-variant-numeric:tabular-nums;color:var(--shu);font-weight:700;min-width:2.5em}
footer{max-width:860px;margin:30px auto;padding:0 14px 30px;color:var(--sub);font-size:11.5px;line-height:1.9;border-top:1px solid var(--rule)}
</style>
</head>
<body>

  <h1>ITC試験対策 その2（分野別ドリル）</h1>

  <div class="hspace"></div>
  <button id="homebtn" class="ghost" style="color:#fff;border-color:rgba(255,255,255,.4);font-size:12px;padding:5px 12px">ホーム</button>
</header>
<main id="app"></main>

<script>
const CHAPTERS=[{"id":"part1","title":"第1部","sub":"デジタル経営について","questions":[{"id":1,"tag":"デジタル経営の定義","q":"ITコーディネータ協会は「デジタル経営」をどのような経営手法と位置づけているか。","choices":["データやデジタル技術を用いて事業のあり方そのものを変え、これまでにない顧客への価値を新しく生み出していく取り組みであるとされている。","膨大な量の情報を役立てることで、社会全体が創造性と活力をもって発展できる状態をつくること。","移り変わる事業環境を先読みしたうえで、方針に沿ってデータと技術を使いこなし、企業が無理なく伸び続けられるようにする手法。","情報や技術を人・物・資金に次ぐ資源とみなし、それを使いこなす力で他社に対する優位を築いていく考え方。"],"answer":2,"pgl_page":3,"explain":"経営環境の変化を洞察し、戦略に基づくデータとITの利活用で企業の持続的成長を導く手法、と定義されている。アはDX、ウはデジタル社会、エはITC制度発足当時の情報・ITの位置づけを指す。（参考：PGL Ver.4.0 第1部 第1章 P.3）","cite":"PGL Ver.4.0 第1部 第1章 P.3"},{"id":2,"tag":"ITC制度発足当時の位置づけ","q":"ITコーディネータの制度ができた2000年代の初め頃、経営の場で情報や技術はどう扱われるようになったか。","choices":["法律によって、大量の情報を活用することが企業の義務として定められるようになった。","経営と切り離せないものと広く理解され、DXという言葉が経営の中心に置かれるようになった。","業務を助ける道具にすぎないとされ、経営資源とは区別して管理する対象になった。","人・物・資金に並ぶ資源として扱われ、それを活かす力が他社との優劣を分けるようになった。"],"answer":3,"pgl_page":2,"explain":"ITの利活用能力が企業の競争優位を左右する鍵になったことが、ITCがIT経営を推進してきた理由とされている。（参考：PGL Ver.4.0 第1部 第1章 P.2）","cite":"PGL Ver.4.0 第1部 第1章 P.2"},{"id":3,"tag":"経営環境の変化への姿勢","q":"移り変わる経営環境に対して企業がとるべき姿勢として、ガイドラインの考え方に沿うものはどれか。","choices":["景気や社会の動き、技術の流れなどで環境は絶えず動いており、その動きを見逃さず手を打ち続けることが欠かせない。","先を読み切ることは難しいものなので、変化がはっきり形になって表れてから手を打てば足りる。","外から押し寄せる変化は自社の力では動かしようがないため、まずは社内の体制づくりの方を優先すべきであるとされている。","環境の変化への備えは、ある程度の規模を持つ企業でこそ重みを持つ課題である。"],"answer":0,"pgl_page":2,"explain":"経営環境は常に大きく動いており、企業はその変化を認識して対応することが重要とされている。（参考：PGL Ver.4.0 第1部 第1章 P.2）","cite":"PGL Ver.4.0 第1部 第1章 P.2"},{"id":4,"tag":"デジタル技術の活かし方","q":"進歩の速いデジタル技術について、企業に求められる向き合い方はどれか。","choices":["まずは業務を軽くする道具として根づかせ、新しい価値づくりへの応用は後の段階で考える。","技術の動きが落ち着いてから取り入れる方が、優位を保ちやすい。","手間を減らす道具にとどめず、新しいものを生み出す力としても使い、競う力を高めていく。","導入の可否はIT部門に委ね、経営側は資金面の判断だけを担う。"],"answer":2,"pgl_page":3,"explain":"効率化のツールとするだけでなく、イノベーションの実現にも利活用して競争力を高めることが求められている。（参考：PGL Ver.4.0 第1部 第1章 P.3）","cite":"PGL Ver.4.0 第1部 第1章 P.3"},{"id":5,"tag":"BizDevOps","q":"BizDevOpsとは何を指すか。","choices":["クラウドがあることを前提として、つくる側と動かす側とが密に手を組むやり方を積み上げてきたもの。","現実の場にある様々なデータをその場で拾い上げ、クラウドなどに貯めていく技術。","つくる側・動かす側の連携に事業側も加わり、製品やサービスを素早く世に出して直し続ける土台。","取引の安全性と見通しのよさを両立させ、供給網や契約の管理を変えていく技術。"],"answer":2,"pgl_page":3,"explain":"DevOpsにビジネス領域を巻き込み、ビジネス部門と開発・運用の各部門の連携を強めるプラットフォームとされる。アはDevOps、イはIoT、ウはブロックチェーンの説明。（参考：PGL Ver.4.0 第1部 第1章 P.3）","cite":"PGL Ver.4.0 第1部 第1章 P.3"},{"id":6,"tag":"事業価値","q":"デジタル経営が扱う4つの価値のうち、事業価値はどのように決まるとされているか。","choices":["この先の事業の姿や伸び方の見通しに加え、手元の資産と負債といった財務の状況も織り込んだうえで形づくられる。","顧客が受け取る利点と支払う対価の釣り合い、満足の度合い、そこで得た体験などから形づくられる。","商品が市場で競う力を得た状態を土台に、事業や市場の伸びしろ、運営の無駄のなさ、市場での戦い方などによって決まる。","利益の追求を超えて、社会が抱える課題の解決にどれだけ寄与したかによって決まる。"],"answer":2,"pgl_page":5,"explain":"PMfitを前提に、事業及び市場の潜在的成長力、効率的な事業運営、市場戦略等の要因で決まるとされる。イは顧客価値、ウは企業価値、エは社会価値。（参考：PGL Ver.4.0 第1部 第1章 P.5）","cite":"PGL Ver.4.0 第1部 第1章 P.5"},{"id":7,"tag":"社会価値","q":"社会価値について、ガイドラインの考え方に沿う説明はどれか。","choices":["企業価値を構成する一要素であり、財務の状況とあわせて評価される。","社会が抱える課題への寄与を指し、これに取り組むことは顧客価値・事業価値・企業価値のいずれにも及んでいく。","顧客への価値や事業としての価値を十分に確保できた企業が、その次の段階で考える対象になるとされる。","それぞれの事業が生む価値を足し合わせることによって形づくられる。"],"answer":1,"pgl_page":6,"explain":"社会課題への貢献を社会価値といい、これに取り組むことは他の3つの価値の向上に影響を与えるとされる。（参考：PGL Ver.4.0 第1部 第1章 P.6）","cite":"PGL Ver.4.0 第1部 第1章 P.6"},{"id":8,"tag":"価値観","q":"デジタル経営における「価値観」の説明として、ガイドラインの考え方に沿うものはどれか。","choices":["経営者個人の信条を指し、戦略づくりとは切り離して扱われるもの。","経営者や企業が4つの価値をどう受け止めているかを指し、これが異なれば描くあるべき姿も戦略も変わってくる。","企業の文化が育っていく過程の中で自然にできあがるものであり、意図して変えることはできないものであるとされている。","一度定まれば動かないため、環境が変わっても筋の通った戦略を保てるもの。"],"answer":1,"pgl_page":6,"explain":"価値観の違いはあるべき姿やデジタル経営戦略の違いとなって表れ、環境変化の認識によって価値観自体が変わることもあるとされる。（参考：PGL Ver.4.0 第1部 第1章 P.6）","cite":"PGL Ver.4.0 第1部 第1章 P.6"},{"id":9,"tag":"企業文化の育ち方","q":"企業文化の醸成について、ガイドラインの考え方に沿う説明はどれか。","choices":["日々の仕事を通じて少しずつ育つものであり、意図して働きかけることは控えるべきである。","経営理念を文書にした時点で定まるものであり、日常の活動の積み重ねとは結びつかない。","日々の積み重ねで少しずつ育つ一方で、ある程度は狙いをもって育てていく働きかけも要る。","人事部門が受け持つ専門の仕事であり、経営者が直に関わる筋合いのものではない。"],"answer":2,"pgl_page":8,"explain":"徐々に醸成されるものだが、ある程度意図をもって醸成していくことも必要とされている。（参考：PGL Ver.4.0 第1部 第2章 P.8）","cite":"PGL Ver.4.0 第1部 第2章 P.8"},{"id":10,"tag":"行動指針の役割","q":"企業としての行動指針は、企業文化とどう結びつくとされているか。","choices":["日々の業務手順を定めたものであり、文化を育てることとは別の目的で作られる。","指針がはっきりしていれば現場の判断や仕事への向き合い方に揃った調子が生まれ、その日々の積み重ねが文化として根づいていく。","経営理念を補うもので、現場がその場で判断する際に使われることは想定されていない。","細かく決めれば決めるほど従業員が自分の頭で考える余地を狭めることになるため、あえて曖昧にしておく方がよいものとされている。"],"answer":1,"pgl_page":8,"explain":"行動指針が明確であることで状況判断や取り組み姿勢に統一感が生まれ、それに沿った活動の積み重ねが企業文化として醸成されるとされる。（参考：PGL Ver.4.0 第1部 第2章 P.8）","cite":"PGL Ver.4.0 第1部 第2章 P.8"},{"id":11,"tag":"エンゲージメント","q":"エンゲージメントとは何を指すか。","choices":["従業員がその組織に留まり続けている年数の長さを表す指標。","従業員それぞれが持つ異なる背景や考え方を互いに認め合い、組織として受け入れていこうとする姿勢であるとされている。","従業員が仕事にどれだけ満ち足りているかを、数値で表した指標。","従業員が自分の仕事に強い関心と熱意を寄せ、組織がうまくいくよう自ら進んで力を尽くそうとする気持ち。"],"answer":3,"pgl_page":8,"explain":"エンゲージメントが高まると職場定着率がよくなり、従業員満足の向上にもつながるとされる。イはダイバーシティ。（参考：PGL Ver.4.0 第1部 第2章 P.8）","cite":"PGL Ver.4.0 第1部 第2章 P.8"},{"id":12,"tag":"経営者の役割","q":"デジタル経営における経営者の役割として、ガイドラインの考え方に沿うものはどれか。","choices":["先頭に立って進む方向と目標を指し示し、従業員や取引先などに変革へ踏み出す気持ちを起こさせる。","資金の判断に専念し、進む方向や目標を示す役目は推進者に任せるのが望ましい。","理念を定めるところまでを担い、実行の場面は開発と運用の責任者に任せる。","システムを入れるかどうかを決める立場にあり、事業そのものを変えることは現場の判断に委ねるものとされる。"],"answer":0,"pgl_page":9,"explain":"経営者自らがコミットして推進すると明言し、ステークホルダーが「自分ごと」として参画しない限りデジタル経営は実現できないとされる。（参考：PGL Ver.4.0 第1部 第3章 P.9）","cite":"PGL Ver.4.0 第1部 第3章 P.9"},{"id":13,"tag":"開発リーダーの役割","q":"開発リーダーが担う役割として、ガイドラインの考え方に沿うものはどれか。","choices":["システムを実際に使う現場のそばにいて顧客や現場の声を受け止め、環境の移り変わりへの気付きを拾い上げていく。","推進者と密に手を組みながら、システムが最終的にどれだけの事業価値を生むかを見据えて開発の陣頭に立つ。","デジタル経営に通じた専門家として助言と支援を行い、社内の人材を育てていく。","先頭に立って進む方向と目標を示し、関係者に変革へ踏み出す気持ちを起こさせる。"],"answer":1,"pgl_page":10,"explain":"開発リーダーは価値を生み出す仕組みを作る役割を担う。アは運用リーダー、イはデジタル経営支援者、エは経営者の役割。（参考：PGL Ver.4.0 第1部 第3章 P.10）","cite":"PGL Ver.4.0 第1部 第3章 P.10"},{"id":14,"tag":"デジタル経営支援者","q":"デジタル経営支援者のあり方として、ガイドラインの考え方に沿うものはどれか。","choices":["助言だけを担い、システムを自社で作るかどうかの検討には関わらない。","社内に相応の力を備えた人が見当たらない場合には、その役目をそのまま引き受け続けていくことが望ましい。","社内から立てるのが原則であり、外部の専門家が担うことは想定されていない。","推進者などの役目をただ肩代わりするのではなく、助言と支援を通じて、いずれ社内の人材がその役目を担えるよう育てていくのが望ましい。"],"answer":3,"pgl_page":11,"explain":"役割の代行ではなく、最終的に社内人材が役割を担えるよう育成することが望ましいとされる。また内製化の必要性を見極める支援も求められる。（参考：PGL Ver.4.0 第1部 第3章 P.11）","cite":"PGL Ver.4.0 第1部 第3章 P.11"},{"id":15,"tag":"主担当の対応","q":"ガイドラインが示す役割分担において、IT開発・導入プロセスで主担当となる二者の組合せはどれか。","choices":["経営者と、デジタル経営推進者","デジタル経営推進者と、運用リーダー","経営者と、開発リーダー","デジタル経営推進者と、開発リーダー"],"answer":3,"pgl_page":11,"explain":"IT開発・導入プロセスは、デジタル経営推進者と開発リーダーがともに主担当となる。（参考：PGL Ver.4.0 第1部 第3章 P.11）","cite":"PGL Ver.4.0 第1部 第3章 P.11"},{"id":16,"tag":"組織学習の主担当","q":"ガイドラインが示す役割分担において、組織学習で主担当となるのは誰か。","choices":["経営者","デジタル経営推進者","開発リーダー","運用リーダー"],"answer":0,"pgl_page":11,"explain":"組織学習は経営者が主担当であり、推進者・開発リーダー・運用リーダーは補佐にあたる。（参考：PGL Ver.4.0 第1部 第3章 P.11）","cite":"PGL Ver.4.0 第1部 第3章 P.11"},{"id":17,"tag":"ITCと同等の知識","q":"デジタル経営とITCの関わりについて、ガイドラインの考え方に沿う説明はどれか。","choices":["推進者や支援者はもとより、経営者や開発・運用の責任者もITCと同じ水準の知識や技能を備えているのが望ましい。","ITCに相当する知識や技能は、推進者と支援者にだけ求められる。","開発や運用の責任者は自分の担当領域に専念し、経営や事業への関わりは控える方がよい。","経営者は技術面の理解よりも、経営や事業の戦略づくりに専念する方がよい。"],"answer":0,"pgl_page":12,"explain":"5つの登場人物すべてがITCと同等の知識やスキルを備えていることが望ましく、開発・運用リーダーも経営や事業の理解を深めることが求められる。（参考：PGL Ver.4.0 第1部 第3章 P.12）","cite":"PGL Ver.4.0 第1部 第3章 P.12"},{"id":18,"tag":"実行基準と判断基準","q":"ガイドラインが掲げる二つの基準、すなわち実行基準と判断基準の関係として正しいものはどれか。","choices":["実行基準は力を入れるべき領域での進め方を、判断基準はそれを行う際の判断の視点となる基本原則を示す。","どちらも進め方を、粗さの異なる二段階で示したものである。","実行基準は判断の視点となる基本原則を、判断基準は具体的な進め方をそれぞれ示す。","実行基準は成長サイクルに、判断基準は価値実現サイクルにそれぞれ当てはめられる。"],"answer":0,"pgl_page":13,"explain":"実行基準＝進め方（プロセス）、判断基準＝基本原則という対応である。アは両者が入れ替わっている。（参考：PGL Ver.4.0 第1部 第4章 P.13）","cite":"PGL Ver.4.0 第1部 第4章 P.13"},{"id":19,"tag":"アクティビティを持たないプロセス","q":"6つのプロセスのうち、内部にアクティビティを持たず、プロセスそのものとして扱われるものの組合せはどれか。","choices":["デジタル経営戦略、IT開発・導入、価値提供・運用","変革・成長、IT開発・導入、価値提供・運用","変革・成長、デジタル経営実行計画、提供価値検証","デジタル経営戦略、デジタル経営実行計画、提供価値検証"],"answer":3,"pgl_page":14,"explain":"この3つはアクティビティを内包しないため、プロセス自体として記載される。変革・成長、IT開発・導入、価値提供・運用はそれぞれ2つのアクティビティを持つ。（参考：PGL Ver.4.0 第1部 第4章 P.14）","cite":"PGL Ver.4.0 第1部 第4章 P.14"},{"id":20,"tag":"2つのサイクルの動き方","q":"デジタル経営成長サイクルと価値実現サイクルの関係として、正しいものはどれか。","choices":["成長サイクルが動いている間は価値実現サイクルが止まる、順番に進む関係にある。","方針を決めてそれを実行するという前後関係はあるが、順番に進むのではなく同時に動いている。","二つは一本にまとめられ、単一のサイクルとして動かされる。","価値実現サイクルをやり切ったうえで、その結果を持って成長サイクルを始める関係にあるとされる。"],"answer":1,"pgl_page":14,"explain":"企業活動はゴーイングコンサーンが基本であり、価値の実現と提供は常に行われていなければならないため、2つのサイクルは並行実行とされる。（参考：PGL Ver.4.0 第1部 第4章 P.14）","cite":"PGL Ver.4.0 第1部 第4章 P.14"}]},{"id":"part2","title":"第2部","sub":"デジタル経営成長サイクル","questions":[{"id":1,"tag":"成長サイクルの役割","q":"デジタル経営成長サイクルは、何をするためのサイクルとされているか。","choices":["組み立てられた方針をもとに、実際に価値を生み出して届けるためのサイクル。","移り変わる事業環境をつかみ取り、変わるための方針を組み立てるためのサイクル。","二つのサイクルを横から支え、共通して使える力を提供する土台であるとされている。","システムをつくって入れる作業を、乱れなく進めるためのサイクル。"],"answer":1,"pgl_page":28,"explain":"経営環境の変化を的確に捉え、変革のための戦略を策定するサイクルである。策定した戦略は価値実現サイクルで実行され、成果が戻ってくる。（参考：PGL Ver.4.0 第2部 P.28）","cite":"PGL Ver.4.0 第2部 P.28"},{"id":2,"tag":"戦略展開後の動き","q":"組み立てた方針を価値実現サイクルへ渡した後、成長サイクルはどう動くとされているか。","choices":["渡した方針の実行が終わるまで、外の情報を集める手を止める。","一度渡した方針は、次に方針を立て直す時期が来るまで変えないことを原則とすることとされる。","見直しは、価値実現サイクルから結果が返ってきた時点でだけ行う。","渡した後も並行して環境の情報を集め続け、必要とあれば渡した方針そのものを見直す。"],"answer":3,"pgl_page":28,"explain":"成長サイクルは環状であり、戦略を展開した後も情報収集を継続し、必要に応じて見直しを行う。（参考：PGL Ver.4.0 第2部 P.28）","cite":"PGL Ver.4.0 第2部 P.28"},{"id":3,"tag":"経営者による情報収集","q":"成長サイクルにおける経営者の情報収集について、ガイドラインの考え方に沿うものはどれか。","choices":["情報を集める仕事は担当部門に任せ、経営者は上がってきた結果を吟味することに専念する。","公式に発表された情報だけを対象とし、それ以外は判断の材料にしない。","情報集めは全従業員が担うものであり、経営者が自ら動く必要はない。","変わるべき兆しをつかむ情報集めは、経営者が自身の経験や築いてきた人脈を活かし、先頭に立って行うべきである。"],"answer":3,"pgl_page":29,"explain":"経営者が率先して情報収集を行うと同時に、全従業員が情報収集に努められるよう支援しなければならないとされる。（参考：PGL Ver.4.0 第2部 P.29）","cite":"PGL Ver.4.0 第2部 P.29"},{"id":4,"tag":"推進者の関わり方","q":"成長サイクルにおけるデジタル経営推進者の関わり方として、ガイドラインの考え方に沿うものはどれか。","choices":["変革・成長プロセスでは経営者の指示を待ち、自分の担当分野で情報を集めることはしない。","推進者は価値実現サイクルに専念し、成長サイクルには関わらない。","価値実現サイクルから成長サイクルへ結果を返す役目は、経営者が中心となって果たす。","戦略づくりの場面では経営者を支え、仮説を立てて確かめる形で情報を集める際は、価値実現サイクルを動かす舵をとる。"],"answer":3,"pgl_page":30,"explain":"価値実現サイクルから成長サイクルへのフィードバックも推進者が中心となって行うため、ウは誤り。（参考：PGL Ver.4.0 第2部 P.30）","cite":"PGL Ver.4.0 第2部 P.30"},{"id":5,"tag":"成熟度の目標を置く理由","q":"デジタル経営成熟度について向上の目標を掲げるのは、なぜとされているか。","choices":["成熟度が上がるほど、選べる戦略の幅が広がるから。","成熟度の水準が、同業他社と比べる際の物差しになるから。","成熟度が上がると、価値実現サイクルを回す期間が短くなるから。","成熟度の目標が、経営者の実績を測る基準として使われるから。"],"answer":0,"pgl_page":31,"explain":"成熟度の向上は取り得る戦略の選択肢を増やすことにつながるため、向上目標を設定するとされる。（参考：PGL Ver.4.0 第2部 P.31）","cite":"PGL Ver.4.0 第2部 P.31"},{"id":6,"tag":"机上の分析の兼ね合い","q":"戦略づくりのために机上で情報を集めて分析することについて、ガイドラインが注意を促している点はどれか。","choices":["精度を上げるほど戦略が実を結びやすくなるため、時間を惜しまず行うのがよい。","手をかけすぎると、いざ動かす頃には戦略が古びてしまうため、程よい加減を見つける必要がある。","机上の分析は推進者に任せ、経営者は結果だけを確かめればよい。","机上の作業は行わず、実際に動かしてみることだけで情報を得る。"],"answer":1,"pgl_page":31,"explain":"時間をかけ過ぎると実行の時点で戦略が陳腐化する可能性があるため、適切なバランスが求められる。生の情報収集の一環として、価値実現サイクルを軽量に実行して仮説を検証することも検討される。（参考：PGL Ver.4.0 第2部 P.31）","cite":"PGL Ver.4.0 第2部 P.31"},{"id":7,"tag":"変革認識の進む順","q":"変革認識アクティビティの4つのタスクを、実施する順に並べたものはどれか。\na 現状分析と戦略評価\nb 外部環境の変化を認識\nc 変革の可能性を発見\nd 変革への意思決定","choices":["b → a → c → d","a → b → c → d","a → c → b → d","b → c → a → d"],"answer":1,"pgl_page":32,"explain":"自社の現状を分析して戦略を評価するところから始まり、外部環境の変化の認識、変革の可能性の発見を経て、意思決定に至る。（参考：PGL Ver.4.0 第2部 第1章 P.32）","cite":"PGL Ver.4.0 第2部 第1章 P.32"},{"id":8,"tag":"達成度評価から受け取るもの","q":"変革・成長プロセスは、デジタル経営戦略達成度評価のうちどの部分を受け取って使うとされているか。","choices":["目標と実績の差のうち、財務の数字に関わる部分。","達成度評価の全体であり、選り分けは行わない。","外の環境の移り変わりと、社内側での成熟度に関わる部分。","価値実現サイクルの各プロセスがどこまで進んだかを示す部分。"],"answer":2,"pgl_page":32,"explain":"達成度評価では目標値と実測値を対比して未達の原因を特定するが、変革・成長プロセスが受け取るのは外部環境の変化と内部環境の成熟度に関わる部分である。（参考：PGL Ver.4.0 第2部 第1章 P.32）","cite":"PGL Ver.4.0 第2部 第1章 P.32"},{"id":9,"tag":"外部環境の変化のつかみ方","q":"外部環境の変化を認識する際の考え方として、ガイドラインの考え方に沿うものはどれか。","choices":["業界に及ぶ変化は、今の業界の中を見渡せば十分につかむことができる。","読みにくい将来の変化は、確からしさが増すまで検討の対象にしない。","読みにくい将来の変化は、兆しを手がかりに何が起こり得るかを思い描き、その場合に想定される筋書きとして温めておく。","集める情報は国内の動きに絞り、海外の事例は対象としない。"],"answer":2,"pgl_page":33,"explain":"業界に影響する変化については、異業種や新興企業の参入、代替品など、業界内の分析だけでは得られない情報の収集が重要とされ、アは誤り。（参考：PGL Ver.4.0 第2部 第1章 P.33）","cite":"PGL Ver.4.0 第2部 第1章 P.33"},{"id":10,"tag":"変革の可能性を探る観点","q":"変革の可能性を探る手順の例のうち、「新たな価値の提供方法の可能性」に当たる検討はどれか。","choices":["顧客の区分を見直すなどして、これまでとは違う顧客がありうるかを考える。","デジタルの活用なども視野に入れ、製品やサービスの届け方に別の道がないかを考える。","利用者への聞き取りなどから新しい要望を掘り起こし、差し出せる価値を考える。","生み出すための活動や費用の構造を見直し、今より安く価値を届けられないかを探る。"],"answer":1,"pgl_page":33,"explain":"アは新たな顧客の可能性、イは新たなニーズと提供価値の可能性、エは内部活動やリソース見直しの可能性に対応する。（参考：PGL Ver.4.0 第2部 第1章 P.33）","cite":"PGL Ver.4.0 第2部 第1章 P.33"},{"id":11,"tag":"変革への意思決定の成果物","q":"変革認識アクティビティの最後のタスクから生まれる成果物の例はどれか。","choices":["変革構想書と、変革の表明","経営課題リスト","現状のデジタル経営成熟度","デジタル経営戦略企画書"],"answer":0,"pgl_page":34,"explain":"変革構想書はデジタル経営戦略プロセスへの入力となる。イは戦略プロセスの経営課題抽出、ウは成熟度向上アクティビティ、エは戦略策定タスクの成果物。（参考：PGL Ver.4.0 第2部 第1章 P.35）","cite":"PGL Ver.4.0 第2部 第1章 P.34"},{"id":12,"tag":"変革への思いを語る","q":"経営者や現場の気付きを組織内で共有する際、これまでとの違いがはっきり分かるよう留意する項目として、ガイドラインが挙げていないものはどれか。","choices":["見過ごせない環境の移り変わり","経営者が事業に寄せる思いや、使命、事業の本質","投資をどれだけの期間で回収できるかの見通し","抱えている問題意識と、危機感"],"answer":2,"pgl_page":34,"explain":"挙げられているのは重要な環境変化、経営者の事業への「思い」・使命・事業の本質、問題意識・危機意識の3点である。（参考：PGL Ver.4.0 第2部 第1章 P.34）","cite":"PGL Ver.4.0 第2部 第1章 P.34"},{"id":13,"tag":"評価視点の分かれ方","q":"デジタル経営成熟度の4つの評価視点のうち、価値実現サイクルの活動に関わる視点の組合せはどれか。","choices":["デジタル経営マインドと、デジタル経営ガバナンス","デジタル経営マインドと、デジタル環境","デジタル環境と、デジタル利活用","デジタル経営ガバナンスと、デジタル利活用"],"answer":2,"pgl_page":36,"explain":"マインドとガバナンスはデジタル経営全体に関わる視点であり、環境と利活用が価値実現サイクルの活動に関わる視点とされる。（参考：PGL Ver.4.0 第2部 第1章 P.36）","cite":"PGL Ver.4.0 第2部 第1章 P.36"},{"id":14,"tag":"成熟度を判断する情報の出どころ","q":"各評価視点で成熟度のレベルを判断するための情報は、どこから得るとされているか。","choices":["デジタル経営戦略プロセスで集めた経営環境の情報から","提供価値検証プロセスで得られた検証の結果から","外部の調査機関が公表する業界の比較データから","デジタル経営共通基盤に置かれた各アクティビティから"],"answer":3,"pgl_page":36,"explain":"成熟度レベルを判断する情報は、デジタル経営共通基盤の各アクティビティから取得する。（参考：PGL Ver.4.0 第2部 第1章 P.36）","cite":"PGL Ver.4.0 第2部 第1章 P.36"},{"id":15,"tag":"成熟度レベル3の段階","q":"デジタル経営成熟度のレベル3は、どのような段階とされているか。","choices":["一部にとどまるものの基本の型ができ、繰り返せるようになり理解も進んだ段階","組織の隅々にまで行き渡り、日々の仕事に欠かせないものになった段階","新しいものを生む姿勢が組織の気風となり、業界全体の先頭を走る段階","数値で管理する指標を使い、データに基づく判断と絶え間ない改善を進める段階"],"answer":1,"pgl_page":37,"explain":"レベル3は定義段階（統合）にあたる。アはレベル2（発展段階）、イはレベル4（管理段階）、ウはレベル5（最適化段階）である。（参考：PGL Ver.4.0 第2部 第1章 P.37）","cite":"PGL Ver.4.0 第2部 第1章 P.37"},{"id":16,"tag":"成熟度の目標の立て方","q":"デジタル経営成熟度の目標を立てる際の考え方として、ガイドラインの考え方に沿うものはどれか。","choices":["全体の項目を偏りなく伸ばしていくことが肝心であり、段を追って高めていく必要がある。","ある視点や項目だけが飛び抜けて高ければ、全体の力も引き上げられる。","どの企業も、最後にはすべての項目で最上位を目指すことが求められる。","今が最も低い段階にある項目は、途中を飛ばして一気に引き上げる方が効率がよいとされている。"],"answer":0,"pgl_page":38,"explain":"特定の項目だけが突出しても全体のパフォーマンスは向上せず、下位のレベルから急に引き上げるのではなく一段ずつ上げていく必要があるとされる。（参考：PGL Ver.4.0 第2部 第1章 P.38）","cite":"PGL Ver.4.0 第2部 第1章 P.38"},{"id":17,"tag":"戦略プロセスの役割","q":"デジタル経営戦略プロセスは何を受けて何を行うプロセスか。","choices":["組み立てられた戦略に基づき、具体的な実行の計画と日程を作る。","価値実現サイクルの実行結果を評価し、次の変革構想を作り上げる。","変革・成長プロセスで作られた変革構想と成熟度の評価・成長計画を受けて、戦略を組み立て、展開し、実行後の評価まで行う。","システムの調達要件をまとめ、外部への提案依頼を行う。"],"answer":2,"pgl_page":40,"explain":"デジタル経営戦略は、中長期に目指す方向性を示し、経営資源の配分やデータとITを利活用する行動計画を示して持続的な競争優位を確立するためのものとされる。（参考：PGL Ver.4.0 第2部 第2章 P.40）","cite":"PGL Ver.4.0 第2部 第2章 P.40"},{"id":18,"tag":"純粋リスクと投機的リスク","q":"経営リスクのうち「純粋リスク」に当たるものの組合せはどれか。\na 大地震\nb 情報漏洩\nc 新規事業への投資判断による損失\nd パンデミック","choices":["a、b、c","a、c、d","b、c、d","a、b、d"],"answer":3,"pgl_page":47,"explain":"純粋リスクは災害・事故・不祥事・情報漏洩・システムトラブル等の事象から生じるもの。cのように経営判断から生じる利益や損失は投機的リスクにあたる。（参考：PGL Ver.4.0 第2部 第2章 P.47）","cite":"PGL Ver.4.0 第2部 第2章 P.47"},{"id":19,"tag":"戦略目標の決め方","q":"デジタル経営戦略の目標を決める際の考え方として、ガイドラインの考え方に沿うものはどれか。","choices":["全社の途中指標の中には、各事業の最終目標が含まれる形になる。","最終目標は、途中の指標を積み上げてから決める。","目標は全社と各事業でそれぞれ別に立て、連動させる必要はない。","途中指標は達成時期の時点だけを対象とし、途中の段階では置かない。"],"answer":0,"pgl_page":48,"explain":"目標は企業全体と各事業で連動させる必要があり、KPIはCSFをもとに検討する。また途中段階の達成状況を把握するためのKPIも設定される。（参考：PGL Ver.4.0 第2部 第2章 P.48）","cite":"PGL Ver.4.0 第2部 第2章 P.48"},{"id":20,"tag":"達成度評価の引き継ぎ先","q":"デジタル経営戦略達成度評価の結果は、どこへ引き継がれるとされているか。","choices":["変革・成長プロセスへ引き継ぎ、次の変革構想を練るための材料とする。","デジタル経営実行計画プロセスへ引き継ぎ、実行計画の手直しに使う。","記録として保管し、次に戦略を立てる時期に参照する。","提供価値検証プロセスへ引き継ぎ、提供した価値を確かめ直すために使う。"],"answer":0,"pgl_page":51,"explain":"評価はプロセスの終着点ではなく、次の変革の出発点と捉える必要があるとされる。（参考：PGL Ver.4.0 第2部 第2章 P.42、PGL Ver.4.0 第2部 第2章 P.51）","cite":"PGL Ver.4.0 第2部 第2章 P.51"}]},{"id":"part3","title":"第3部","sub":"価値実現サイクル","questions":[{"id":1,"tag":"価値実現サイクルの構成","q":"価値実現サイクルを構成する4つのプロセスの組合せはどれか。","choices":["変革・成長、デジタル経営戦略、デジタル経営実行計画、IT開発・導入","デジタル経営実行計画、IT開発・導入、価値提供・運用、提供価値検証","デジタル経営戦略、IT開発・導入、価値提供・運用、提供価値検証","変革・成長、IT開発・導入、価値提供・運用、提供価値検証"],"answer":1,"pgl_page":54,"explain":"この4つで構成され、実行の結果に応じてそれぞれが繰り返される。（参考：PGL Ver.4.0 第3部 P.54）","cite":"PGL Ver.4.0 第3部 P.54"},{"id":2,"tag":"仮説・検証型が向く場面","q":"仮説・検証型の進め方が向いているのは、どのような変革テーマか。","choices":["求めるものが定まりきらず、途中で変わることの多いもの","決まった処理の流れが要る、基幹業務の作り替え","求めるものがはっきりしていて、先の見通しが立つもの","当初の計画どおりに運ぶことが望ましい、長期にわたるもの"],"answer":0,"pgl_page":55,"explain":"新規ビジネスの立ち上げや新しいサービス開発など、要求の不確定性が高いテーマに向く。他は計画・実行型の特徴。（参考：PGL Ver.4.0 第3部 P.55）","cite":"PGL Ver.4.0 第3部 P.55"},{"id":3,"tag":"実行の拠りどころ","q":"仮説・検証型と計画・実行型とで、実行の拠りどころとするものの組合せはどれか。","choices":["どちらも返ってきた反応を拠りどころとする","仮説・検証型は当初立てた計画、計画・実行型は返ってきた反応","どちらも当初立てた計画を拠りどころとする","仮説・検証型は返ってきた反応、計画・実行型は当初立てた計画"],"answer":3,"pgl_page":55,"explain":"仮説・検証型は利用状況や行動データ等のフィードバック、計画・実行型は日程や予算等の当初計画を指針とする。（参考：PGL Ver.4.0 第3部 P.55）","cite":"PGL Ver.4.0 第3部 P.55"},{"id":4,"tag":"新サービス開発の進め方","q":"ITを使った新しいサービスを生み出す場面での進め方として、ガイドラインの考え方に沿うものはどれか。","choices":["調べたり聞いたりする時間を十分にとれば、顧客の望むものを細かく描き切ることができるものとされている。","試作など確かめられる最小限のものを作り、評価と検証を重ねながら少しずつ進めるやり方が向いている。","顧客自身が答えを持っていないことが多いため、企画の段階では計画そのものが要らない。","求めるものと設計を細かく固めてから作り始めるやり方が向いている。"],"answer":1,"pgl_page":56,"explain":"顧客自身がニーズや求める機能の正解を知らないことが多く、最初から精緻に計画することは困難であるため、仮説・検証型が適用される。（参考：PGL Ver.4.0 第3部 P.56）","cite":"PGL Ver.4.0 第3部 P.56"},{"id":5,"tag":"2つの型の使い分け","q":"実際のプロジェクトにおける2つの型の使い方として、ガイドラインの考え方に沿うものはどれか。","choices":["厳しく分ける必要はなく、案件の性格に応じて一部に取り入れたり、組み合わせて用いる。","厳しく分けて使う必要があり、混ぜて用いてはならない。","組織の成熟度が一定に達するまでは、計画に沿って進める型だけを用いる。","新規事業なら仮説を確かめる型、既存事業なら計画に沿う型と、事業の種類で一律に決める。"],"answer":0,"pgl_page":58,"explain":"大枠の計画を定めながら部分的に仮説・検証で進め、全体の日程を守るといった組み合わせも可能とされる。（参考：PGL Ver.4.0 第3部 P.58）","cite":"PGL Ver.4.0 第3部 P.58"},{"id":6,"tag":"価値実現の主体","q":"価値実現サイクルにおいて、実行の主体となるのは誰か。","choices":["経営者","開発リーダー","デジタル経営推進者","デジタル経営支援者"],"answer":2,"pgl_page":59,"explain":"推進者が責任をもって顧客価値の実現を計画・実践し、結果を客観的に評価して再び計画につなげるサイクルを回す。（参考：PGL Ver.4.0 第3部 P.59）","cite":"PGL Ver.4.0 第3部 P.59"},{"id":7,"tag":"実行計画プロセスの役割","q":"デジタル経営実行計画プロセスは何を行うプロセスか。","choices":["システムを作って導入し、価値を最大にするための仕組みを整える。","戦略で掲げた顧客への価値や事業の仕組みを形にする製品・サービスを定め、業務やシステムのあるべき姿を描く。","導入された仕組みを使いこなし、実際に価値を届ける。","届けた価値の状況を確かめ、より良くしていく。"],"answer":1,"pgl_page":62,"explain":"イはIT開発・導入、ウは価値提供・運用、エは提供価値検証の役割。（参考：PGL Ver.4.0 第3部 第1章 P.62）","cite":"PGL Ver.4.0 第3部 第1章 P.62"},{"id":8,"tag":"実行計画プロセスの順","q":"デジタル経営実行計画プロセスのタスクを、実施する順に並べたものはどれか。\na データとITの調査\nb 現状業務・システムの調査・分析\nc 戦略実現案の検討\nd 評価指標の設計","choices":["a → b → c → d","b → c → a → d","b → a → c → d","b → a → d → c"],"answer":2,"pgl_page":62,"explain":"現状を調べて分析し、データとITを調べ、実現案を検討したうえで、評価指標を設計する順である。（参考：PGL Ver.4.0 第3部 第1章 P.62）","cite":"PGL Ver.4.0 第3部 第1章 P.62"},{"id":9,"tag":"社外の利用者が対象の場合","q":"社外の顧客や取引先に新しいサービスを届ける場合、実行計画はどう進めるのがよいとされているか。","choices":["まず仮説を置いて調査と計画を進め、確かめたうえで計画や作る機能を練り直す。","社外への確認は行わず、業務に詳しい社内の人の知見だけで要件を固める。","社外の相手から時間をもらって詳しく聞き取り、材料を揃えてから計画することとされる。","調べずにひととおり作ってしまい、顧客の反応を見てから計画を立てる。"],"answer":0,"pgl_page":63,"explain":"社外の利用者に詳細な調査の時間を割いてもらうことは難しく、本来欲しい情報を集めにくいためである。（参考：PGL Ver.4.0 第3部 第1章 P.63）","cite":"PGL Ver.4.0 第3部 第1章 P.63"},{"id":10,"tag":"利用者調査の狙い","q":"実行計画プロセスにおける利用者調査は、何を狙って行うとされているか。","choices":["まだ誰も気付いていない、まったく新しい問題を掘り当てること。","利用者の属性を統計としてまとめること。","競合他社の製品やサービスの機能を漏れなく並べ上げること。","利用者が現に困っている問題を拾い上げること。"],"answer":3,"pgl_page":64,"explain":"利用者が達成したいこと、行動と感情、障害となって苦痛に感じていること等の観点で調査を深めていく。（参考：PGL Ver.4.0 第3部 第1章 P.64）","cite":"PGL Ver.4.0 第3部 第1章 P.64"},{"id":11,"tag":"PoCで気をつけること","q":"PoCを行う際に気をつけるべき点として、ガイドラインが挙げているものはどれか。","choices":["新しい技術に幅広く触れることが目的なので、対象を絞らず試してみるのがよい。","ただ製品や技術を触るだけに終わらないよう、狙いと確かめる点、判断の物差しを先に決めておく。","先入観を避けるため、判断の物差しは結果が出そろってから決める。","確かめるのは技術面の相性に絞り、運用面の課題は本番に入れてから見る。"],"answer":1,"pgl_page":65,"explain":"検証によって運用面の課題が見つかることもあり、技術面だけでなく結果を総合的に評価して適用の可否を判断する。（参考：PGL Ver.4.0 第3部 第1章 P.65）","cite":"PGL Ver.4.0 第3部 第1章 P.65"},{"id":12,"tag":"不採用の施策を残す理由","q":"検討したが採らなかった施策も記録に残しておくべきとされるのは、なぜか。","choices":["監査の際に、検討の抜けがないことを示す証跡として求められるから。","次の予算を組む際に、その費用を計上する必要があるから。","採らなかった施策の数が、意思決定の妥当さを測る物差しになるから。","優先度の高いものを実行するだけで課題がすべて片づくことは少なく、後から実行する場面や、似た別の課題に効く見込みがあるから。"],"answer":3,"pgl_page":66,"explain":"不採用となった施策を追加で実行する場面も多く、似た別の課題に有効な可能性もあるとされる。（参考：PGL Ver.4.0 第3部 第1章 P.66）","cite":"PGL Ver.4.0 第3部 第1章 P.66"},{"id":13,"tag":"机上で選べない場合","q":"机上の議論だけでは施策を選び切れない場合、どうするとされているか。","choices":["試作や最小限の機能を定めてIT開発・導入へつなぎ、サイクルを回して実際に確かめる計画にする。","候補をすべて本格的に実行し、結果を比べて絞る。","選べるようになるまで、関係者による検討を重ねる。","選定そのものを外部の専門家に委ねる。"],"answer":0,"pgl_page":66,"explain":"机上で評価できない場合は、実際に作って価値実現サイクルを通して実証する計画とする。（参考：PGL Ver.4.0 第3部 第1章 P.66）","cite":"PGL Ver.4.0 第3部 第1章 P.66"},{"id":14,"tag":"競争領域と共通領域","q":"自社独自の開発が必要な「競争領域」の例として、ガイドラインが挙げているものはどれか。","choices":["勤怠や労務の管理、給与の計算","受発注の処理や、請求と入金の管理","独自の製法による製造の工程を見張り、制御して管理する仕組み","会計の仕訳から決算に至る一連の処理"],"answer":2,"pgl_page":67,"explain":"他は法令や業界で共通する業務領域の例として挙げられている。（参考：PGL Ver.4.0 第3部 第1章 P.67）","cite":"PGL Ver.4.0 第3部 第1章 P.67"},{"id":15,"tag":"先行指標","q":"評価指標を設計する際の「先行指標であること」とは、どのような考え方か。","choices":["恣意を排するため、数値として取れるデータを指標にする必要がある。","売上のような結果は後から分かる指標で次の手に結びつけにくいため、この先を見通せる指標が要る。","過去や他社と比べられるよう、比率などを使って見比べられるようにする。","データを見て、次に何をすべきかが分かる指標である必要がある。"],"answer":1,"pgl_page":68,"explain":"イは定量指標であること、ウは比較可能であること、エは次の行動につながることの説明。（参考：PGL Ver.4.0 第3部 第1章 P.68）","cite":"PGL Ver.4.0 第3部 第1章 P.68"},{"id":16,"tag":"見張る指標の絞り込み","q":"モニタリングの対象とする重要な指標について、ガイドラインの考え方に沿うものはどれか。","choices":["測れるものを可能な限り挙げ、漏れなく見張る。","指標の選定は現場に任せ、経営層は結果だけを見る。","事業の段階や狙いに応じて選び、あまり多くを対象に含めないことが肝心である。","一度決めたら、事業の段階が変わっても指標は変えない。"],"answer":2,"pgl_page":68,"explain":"最終目標に関わる業務や顧客行動とそれを測る指標を洗い出すが、対象を広げすぎないことが重要とされる。（参考：PGL Ver.4.0 第3部 第1章 P.68）","cite":"PGL Ver.4.0 第3部 第1章 P.68"},{"id":17,"tag":"RFPによる評価","q":"RFPを用いて提案を評価する方法について、ガイドラインの考え方に沿うものはどれか。","choices":["依頼先は1社に絞り、比べて評価することはしないのが通例である。","要件は大まかにとどめ、細部は提案する側に委ねることを原則とする。","調達の要件を決める必要があるため、自社で要件をはっきりさせられなければならない。","発行は開発の責任者だけで判断でき、経営者の承認は要らない。"],"answer":2,"pgl_page":69,"explain":"要件を詳細に決められれば目的に沿った提案を得られるが、時間がかかり、事前に細かく決めることに向かない場合もあるとされる。（参考：PGL Ver.4.0 第3部 第1章 P.69）","cite":"PGL Ver.4.0 第3部 第1章 P.69"},{"id":18,"tag":"IT開発の進む順","q":"IT開発アクティビティのタスクを、実施する順に並べたものはどれか。\na 要件の確認と開発・調達の準備\nb 調達実施\nc 開発による要件の実現\nd テスト","choices":["b → a → c → d","a → b → c → d","a → c → b → d","a → b → d → c"],"answer":1,"pgl_page":73,"explain":"準備、調達、開発、テストの順である。（参考：PGL Ver.4.0 第3部 第2章 P.73）","cite":"PGL Ver.4.0 第3部 第2章 P.73"},{"id":19,"tag":"開発段階での運用リーダー","q":"IT開発の段階で運用リーダーはどう関わるとされているか。","choices":["開発の責任者に代わって、体制や日程の変更を決める。","引き継ぎを受けるまでは関わらず、価値提供・運用の段階から加わる。","運用や保守で培った経験をもとに、運用面の課題や要件への影響をつかみ、開発の責任者と手を組んで支える。","調達の要件を明らかにし、調達できる単位に整理する。"],"answer":2,"pgl_page":73,"explain":"運用リーダーは開発段階から運用上の課題や影響を把握し、開発リーダーと連携・協力・支援を行う。（参考：PGL Ver.4.0 第3部 第2章 P.73）","cite":"PGL Ver.4.0 第3部 第2章 P.73"},{"id":20,"tag":"テストの計画","q":"テストについてガイドラインが注意を促している点はどれか。","choices":["種類や範囲の決め方を誤ると、どれだけ厳重に行っても弱点や不具合が残りうるため、あらかじめ計画を立てて臨み方を検討する。","テストの計画は、実施した内容を記録するために終わってから作る。","厳重に行えば、種類や範囲の決め方によらず弱点や不具合は残らない。","実施の範囲は外部の開発先に任せ、発注側は関わらない。"],"answer":0,"pgl_page":78,"explain":"網羅的に実施し効率を図るため、あらかじめテスト計画を立てて適切なテストアプローチを検討する。（参考：PGL Ver.4.0 第3部 第2章 P.78）","cite":"PGL Ver.4.0 第3部 第2章 P.78"},{"id":21,"tag":"新環境への展開時の確認","q":"新しい環境へ仕組みを展開する際の確認について、ガイドラインの考え方に沿うものはどれか。","choices":["各機能が正しく動くことの確認に絞り、他の面は運用が始まってから見る。","確認は外部の開発先に任せ、導入する企業側は中身を把握しない。","各機能が正しく動くことに加え、安全性や処理能力、使い続けられるかといった面も確かめ、危険を小さく抑える。","本番へ移す際の控えの取り方は、問題が起きてから考える。"],"answer":2,"pgl_page":79,"explain":"本番環境への移行手順とバックアップ方法を検討し、代替策や復旧手順を前もって備えることも重要とされる。（参考：PGL Ver.4.0 第3部 第2章 P.79）","cite":"PGL Ver.4.0 第3部 第2章 P.79"},{"id":22,"tag":"利活用開始の判断","q":"ITサービスの利活用を始めるかどうかの判断について、ガイドラインの考え方に沿うものはどれか。","choices":["テストの結果や教育・訓練の状況などから導入全体を評価し、運用の責任者など必要な関係者の評価も踏まえて総合的に判断する。","始めてよいかどうかは、運用の責任者が単独で判断する。","総合的なテストに通った時点で、開発の責任者の判断だけで始められる。","判断の結果は、導入がすべて終わってからまとめて経営者に報告する。"],"answer":0,"pgl_page":80,"explain":"開発リーダーは判断結果を経営者や推進者に報告して承認を受け、その後で価値提供・運用へ引き継ぐ。（参考：PGL Ver.4.0 第3部 第2章 P.80）","cite":"PGL Ver.4.0 第3部 第2章 P.80"},{"id":23,"tag":"顧客視点での価値の描き方","q":"価値提供業務を始めるにあたり、顧客の側から見た価値を思い描く際に使える考え方として、ガイドラインが挙げているものはどれか。","choices":["ポートフォリオマネジメントと、プログラムマネジメント","サービスレベルアグリーメントと、サービスレベルマネジメント","リスクアセスメントと、リスクコントロール","カスタマージャーニーと、カスタマーエクスペリエンス"],"answer":3,"pgl_page":82,"explain":"顧客が購入・利用に至るまでの思考や感情、体験を旅路になぞらえて捉える考え方などを用いることができる。（参考：PGL Ver.4.0 第3部 第3章 P.82）","cite":"PGL Ver.4.0 第3部 第3章 P.82"},{"id":24,"tag":"外部委託時の水準の担保","q":"価値提供の業務を外部に委託する場合の留意点として、ガイドラインの考え方に沿うものはどれか。","choices":["水準の決め方や保ち方は、業務の実情を知る委託先の裁量に委ねる。","契約を結べば品質は担保されるため、委託元で水準を測る指標を持つ必要はない。","委託する業務が顧客へどんな価値をどの水準で届けるのかを明らかにして要件にまとめ、取り決めを交わすことで水準を担保する。","契約では価格と納期だけをはっきりさせ、価値の水準は日々のやり取りに委ねる。"],"answer":2,"pgl_page":82,"explain":"あわせて推進者は、水準を把握するのに必要な指標を定め、管理の仕組みを確立するとされる。（参考：PGL Ver.4.0 第3部 第3章 P.82）","cite":"PGL Ver.4.0 第3部 第3章 P.82"},{"id":25,"tag":"システム監査を行う頻度","q":"価値提供・運用プロセスにおけるシステム監査について、ガイドラインの考え方に沿うものはどれか。","choices":["サイクルを回すたびに、毎回必ず実施しなければならない。","導入した最初の年に一度行えば足りる。","外部から求められた場合にだけ実施する。","そのつど必ず行うべきものとは限らないが、狙いに照らしてふさわしい時機を選んで実施すべきである。"],"answer":3,"pgl_page":84,"explain":"必要に応じて、導入したIT資源に対する監査を実施するとされる。（参考：PGL Ver.4.0 第3部 第3章 P.84）","cite":"PGL Ver.4.0 第3部 第3章 P.84"},{"id":26,"tag":"内部監査と外部監査","q":"システム監査における内部監査と外部監査について、正しい説明はどれか。","choices":["内部監査は自組織の監査部門などが行い、仕組みの効率や安全性を評価して良くしていくことを狙いとする。","内部監査は組織の外の第三者が行い、外部監査は自組織の監査部門などが行う。","どちらも、定められた基準や規制に沿っているかを評価することを狙いとする。","監査の計画は内部・外部で同じ様式を使い、毎回同じ内容で作る。"],"answer":0,"pgl_page":88,"explain":"外部監査は組織外の第三者が行い、特定の基準や規制に準拠しているかを評価するために実施される。（参考：PGL Ver.4.0 第3部 第3章 P.88）","cite":"PGL Ver.4.0 第3部 第3章 P.88"},{"id":27,"tag":"システム監査の手順","q":"システム監査の基本的な手順を、実施する順に並べたものはどれか。\na 予備調査\nb 本調査\nc 監査計画の作成\nd 報告\ne フォローアップ","choices":["a → b → c → d → e","a → c → b → d → e","c → b → a → d → e","c → a → b → d → e"],"answer":3,"pgl_page":88,"explain":"計画の作成、予備調査、本調査、報告、フォローアップの順。ただし目的や範囲により手順が調整されるのが通例とされる。（参考：PGL Ver.4.0 第3部 第3章 P.88）","cite":"PGL Ver.4.0 第3部 第3章 P.88"},{"id":28,"tag":"監査人の独立性","q":"システム監査についてガイドラインが述べている留意点はどれか。","choices":["監査の持ち主としての責任は、実施を託される社内の監査部門や社外の専門企業の側が負うものとされている。","監査の計画は、最初に作ったものを毎回そのまま使うのが望ましい。","監査の狙いと範囲は監査人が決め、経営者は結果の報告だけを受ける。","日常の見張りと監査との大きな違いは独立性にあり、監査人は関係者から独立した立場で臨む必要がある。"],"answer":3,"pgl_page":89,"explain":"経営者が監査のオーナーシップを持つことが重要であり、監査計画は毎回目的を明確にして作成する必要があるとされる。（参考：PGL Ver.4.0 第3部 第3章 P.89）","cite":"PGL Ver.4.0 第3部 第3章 P.89"},{"id":29,"tag":"利活用状況の検証","q":"提供価値検証プロセスにおけるITサービス利活用の検証について、ガイドラインの考え方に沿うものはどれか。","choices":["システムがどれだけ動いていたかという技術面の数値だけで確かめる。","使った人の数や頻度、関与の度合い、水準の守られ方など様々な角度から確かめ、聞き取りなどを通じて利用者の声も集める。","取り決めた水準を満たしていれば、確認としては十分である。","確認は、使い始めた直後に一度行えば足りる。"],"answer":1,"pgl_page":90,"explain":"定期的な検証により、持続的な価値提供と顧客満足の向上のための情報や気付きを集めることができるとされる。（参考：PGL Ver.4.0 第3部 第4章 P.90）","cite":"PGL Ver.4.0 第3部 第4章 P.90"},{"id":30,"tag":"各プロセスへの差し戻し先","q":"提供価値検証プロセスから価値実現サイクルの各プロセスへ改善点を返す際の考え方として、正しいものはどれか。","choices":["改善点はすべてデジタル経営実行計画へまとめて返す。","仕組みを作って入れることに関わる改善点はIT開発・導入へ、使いこなしや運用に関わる改善点は価値提供・運用へ返す。","改善点はデジタル経営戦略プロセスへ直接返す。","改善点は記録として残すだけで、各プロセスへは返さない。"],"answer":1,"pgl_page":92,"explain":"各プロセスは返された内容に基づき、必要に応じて共通基盤から適切なアクティビティを組み込んで改善を行う。（参考：PGL Ver.4.0 第3部 第4章 P.92）","cite":"PGL Ver.4.0 第3部 第4章 P.92"},{"id":31,"tag":"実行計画へ返す内容","q":"提供価値検証プロセスからデジタル経営実行計画プロセスへ返される内容として、ガイドラインの考え方に沿うものはどれか。","choices":["各プロセスや作業の単位では手の打ちようがない、計画そのものの見直しを要する課題である。","日々の手順の軽い手直しなど、担当の単位で片づく課題に限られる。","評価の物差し自体の見直しは前提にあたるため、返す内容には含まれない。","新しい商機の発見は組織内での共有にとどめ、返す内容には含めない。"],"answer":0,"pgl_page":93,"explain":"大きな社会の変化、技術革新で従来のサービスが立ち行かなくなる、規制や法律による市場の変化などが例に挙げられ、評価基準自体の見直しも含まれる。（参考：PGL Ver.4.0 第3部 第4章 P.93）","cite":"PGL Ver.4.0 第3部 第4章 P.93"}]},{"id":"part4","title":"第4部","sub":"デジタル経営共通基盤","questions":[{"id":1,"tag":"共通基盤の位置づけ","q":"デジタル経営共通基盤とは何か。","choices":["成熟度を外部の機関が評価するために定められた基準の体系。","成長サイクルの実行状況を外から検査するための、独立した組織。","価値実現サイクルの中に置かれる、6番目のプロセス。","デジタル経営を滞りなく回し続けるために、サイクルをまたいで共通に用いる活動のまとまり。"],"answer":3,"pgl_page":96,"explain":"CB-1からCB-5までの5つのアクティビティで構成される。（参考：PGL Ver.4.0 第4部 P.96）","cite":"PGL Ver.4.0 第4部 P.96"},{"id":2,"tag":"サイクルマネジメントの狙い","q":"サイクルマネジメントはどのような手法か。","choices":["チームの内外の関係を築き、機敏さと信頼を高めて意思疎通と協力を円滑にする。","組織の全員が経験から学び、知識を共有し応用することで変化に応え価値を生む。","各プロセスの成果を捉えて分析し、目標に向けて良くしていく活動。","価値実現サイクル全体を最も良い状態にするための手法で、プロセスを定め、文書にし、設計・実行・改善を重ねる。"],"answer":3,"pgl_page":96,"explain":"アはコミュニケーション、ウはモニタリング＆コントロール、エは組織学習の説明。（参考：PGL Ver.4.0 第4部 P.96）","cite":"PGL Ver.4.0 第4部 P.96"},{"id":3,"tag":"組織学習と成熟度","q":"組織学習とデジタル経営成熟度の関係について、ガイドラインの考え方に沿うものはどれか。","choices":["組織学習は成熟度の評価とは切り離された活動として置かれている。","両者は背中合わせの関係にあると捉え、組織学習に取り組むことでデジタル経営の水準を引き上げていく。","組織学習は、成熟度が一定の段階に達した企業から取りかかるべき活動である。","組織学習の成果は、成熟度の評価項目には反映されない。"],"answer":1,"pgl_page":97,"explain":"組織学習の取り組みの見直しは、成熟度レベルの向上アクティビティで設定される目標をもとに行われる。（参考：PGL Ver.4.0 第4部 P.97、PGL Ver.4.0 第4部 第5章 P.118）","cite":"PGL Ver.4.0 第4部 P.97"},{"id":4,"tag":"仮説検証の起点","q":"デジタル経営における仮説検証は、何から始まるとされているか。","choices":["あるべき姿を描くことから","施策を実行に移すことから","現状をつかむことから","評価の物差しを定めることから"],"answer":2,"pgl_page":97,"explain":"仮説は自社が目指すべき姿とそのために必要な施策を具体的に示すもので、実際に確かめながら修正と再検証を重ねて精度を高めていく。（参考：PGL Ver.4.0 第4部 P.97）","cite":"PGL Ver.4.0 第4部 P.97"},{"id":5,"tag":"共通基盤のタスク構造","q":"デジタル経営共通基盤の各アクティビティが概ね持つ3つのタスクの組合せはどれか。","choices":["計画を立てる、実行を管理する、結果を報告する","全体の方式とルールを定める、プロセスへ実装する、実行の状況をつかむ","現状をつかむ、目標を定める、差を分析する","情報を集める、影響を評価する、対策を実装する"],"answer":1,"pgl_page":98,"explain":"この3つのタスク構造を持つとされる。（参考：PGL Ver.4.0 第4部 P.98）","cite":"PGL Ver.4.0 第4部 P.98"},{"id":6,"tag":"組織学習を主導する人","q":"組織学習について、ガイドラインの考え方に沿う説明はどれか。","choices":["開発の責任者と運用の責任者が中心となって進める活動である。","絶えず良くして育てていくうえで欠かせない取り組みであるため、経営者が旗を振る必要がある。","人材開発の部門が単独で受け持つ、専門の活動である。","外部の支援者がその立場から主導する活動である。"],"answer":1,"pgl_page":98,"explain":"CB-1からCB-4については、推進者・開発リーダー・運用リーダーがリーダーシップを発揮するとされる。（参考：PGL Ver.4.0 第4部 P.97、PGL Ver.4.0 第4部 P.98）","cite":"PGL Ver.4.0 第4部 P.98"},{"id":7,"tag":"サイクルとプロジェクトの違い","q":"サイクルマネジメントとプロジェクトマネジメントの違いとして、正しいものはどれか。","choices":["前者は当てはめるべきプロセスと流れを最も良い状態にする包括的な進め方であり、後者は区切られた期間の中で定められた成果を出すことに重きを置く。","前者が、区切られた期間の中で定められた成果を出すことに重きを置く側である。","両者は同じ考え方であり、呼び名が違うだけである。","サイクルマネジメントはIT部門が、プロジェクトマネジメントは経営層が受け持つ。"],"answer":0,"pgl_page":100,"explain":"サイクルマネジメントはプロセス間の目詰まりや無駄を見つけ、サイクル全体を最適化する。（参考：PGL Ver.4.0 第4部 第1章 P.100）","cite":"PGL Ver.4.0 第4部 第1章 P.100"},{"id":8,"tag":"プロセス定義で決める項目","q":"サイクルマネジメントでプロセスを定義する際に明らかにする項目の組合せはどれか。","choices":["想定される危険の一覧、起こる見込み、影響の大きさ、備え","予算、人数、外部への委託の割合、稼働の状況","何のために行うか、日程、受け取るものと渡すもの、主な活動、責任を負う人","評価の物差し、目標の数値、実績の数値、その差"],"answer":2,"pgl_page":100,"explain":"価値実現サイクルの各プロセスについて、これらの項目を明らかにする必要があるとされる。（参考：PGL Ver.4.0 第4部 第1章 P.100）","cite":"PGL Ver.4.0 第4部 第1章 P.100"},{"id":9,"tag":"プロセス実行の担い手","q":"サイクルマネジメントにおけるプロセスの実行について、ガイドラインの考え方に沿うものはどれか。","choices":["実行の担い手はサイクルマネジメントの責任者であり、各プロセスの責任者は記録を保管するだけである。","定めたとおりに実行されたかどうかの記録は、問題が起きたプロセスについてだけ残す。","問題が起きた場合、サイクルマネジメントの責任者はそのプロセスを止め、計画の段階へ差し戻す。","実行の担い手は各プロセスの責任者であり、サイクルマネジメントの責任者は実行の状況をつかみ、問題が起きたときに手を差し伸べる。"],"answer":3,"pgl_page":101,"explain":"あわせて、定義した内容が実行されたかの記録を蓄積するとされ、記録は問題の有無を問わず残される。（参考：PGL Ver.4.0 第4部 第1章 P.101）","cite":"PGL Ver.4.0 第4部 第1章 P.101"},{"id":10,"tag":"両者の間に位置するマネジメント","q":"サイクルマネジメントを実行することで、サイクルマネジメントとプロジェクトマネジメントの間に位置づけられるマネジメントの組合せはどれか。","choices":["ナレッジマネジメントと、インシデントマネジメント","リスクマネジメントと、コンプライアンスマネジメント","ポートフォリオマネジメントと、プログラムマネジメント","サービスレベルマネジメントと、キャパシティマネジメント"],"answer":2,"pgl_page":101,"explain":"多くの組織的な取り組みを継続的に評価するものと、それを見据えて全体を管理し価値実現を図るものである。（参考：PGL Ver.4.0 第4部 第1章 P.101）","cite":"PGL Ver.4.0 第4部 第1章 P.101"},{"id":11,"tag":"部門をまたぐ連携","q":"部門をまたいだ協力を進めるうえで重要とされるものはどれか。","choices":["部門間の調整は各部門長の話し合いに委ね、経営者は結果を確認するにとどめるものとされる。","意思疎通の道具を全社に導入することが、最も効き目のある手立てである。","外部の支援者が、その立場から部門間の協力を主導する。","経営者が部門をまたぐ協力を進める姿勢を見せることで、組織全体に意識づけができる。"],"answer":3,"pgl_page":103,"explain":"部門の壁を越えて円滑な意思疎通を図るには、経営者のコミットメントが重要とされる。（参考：PGL Ver.4.0 第4部 第2章 P.103）","cite":"PGL Ver.4.0 第4部 第2章 P.103"},{"id":12,"tag":"傾聴力","q":"意思疎通に必要な力としての「傾聴力」の説明はどれか。","choices":["会議や話し合いの場を滞りなく進めるための力である。","伝える側の意図をはっきり示すための表現の力である。","参加者の意見を偏りなく扱い、納得のいく合意へ導く力である。","相手の話から新しい着想や課題を見つけ出すことができ、相手の気持ちに寄り添って信頼を築くこともできる力である。"],"answer":3,"pgl_page":103,"explain":"アとウはファシリテーション・スキルの説明にあたる。（参考：PGL Ver.4.0 第4部 第2章 P.103）","cite":"PGL Ver.4.0 第4部 第2章 P.103"},{"id":13,"tag":"コミュニケーションとエンゲージメント","q":"コミュニケーションとステークホルダー・エンゲージメントの狙いの違いとして、正しいものはどれか。","choices":["コミュニケーションは関係を築くことを、ステークホルダー・エンゲージメントは情報を伝えることを狙いとすることを基本とする。","コミュニケーションは情報を伝えることを、ステークホルダー・エンゲージメントは関係を築き対話を促すことを狙いとする。","両者は同じ意味であり、分けずに一つの活動として扱う。","ステークホルダー・エンゲージメントは、社外の関係者だけを対象とする。"],"answer":1,"pgl_page":104,"explain":"それぞれの目的や役割、相互の関係をはっきりさせたうえで、効果的な進め方を定めるとされる。（参考：PGL Ver.4.0 第4部 第2章 P.104）","cite":"PGL Ver.4.0 第4部 第2章 P.104"},{"id":14,"tag":"コミュニケーションプロトコル","q":"コミュニケーションプロトコルとは何を指すか。","choices":["関係者の間で共有する情報の区分と、やり取りの方式を定めたもので、更新の頻度や必要な細かさ、問題を上位へ上げる筋道も含む。","会議で用いる議事録や報告書の書式を揃えるための文書の標準。","ネットワーク上でシステム同士が情報をやり取りするための技術的な決まり。","機密にあたる情報を共有の対象から外し、公開できる情報だけを流すための取り決め。"],"answer":0,"pgl_page":105,"explain":"情報には内部と外部、機密と公開、概略と詳細など様々な区分があるとされる。（参考：PGL Ver.4.0 第4部 第2章 P.105）","cite":"PGL Ver.4.0 第4部 第2章 P.105"},{"id":15,"tag":"コミュニケーションの4象限","q":"コミュニケーションを頻度と密度の2軸で整理したとき、頻度も密度も高い位置にあたるものはどれか。","choices":["伝達","会話","エンゲージメント","共有"],"answer":2,"pgl_page":106,"explain":"頻度も密度も低い位置にあたるのが「伝達」であり、その対極に位置づけられる。（参考：PGL Ver.4.0 第4部 第2章 P.106）","cite":"PGL Ver.4.0 第4部 第2章 P.106"},{"id":16,"tag":"役割と責任を明確にする狙い","q":"関係者の役割と責任をはっきりさせる狙いとして、ガイドラインが挙げている3つの組合せはどれか。","choices":["意思決定を早めること、もめ事を防ぐこと、法令の遵守を強めること","意思疎通を滞りなくすること、業務の効率を上げること、信頼関係を築くこと","意思疎通を滞りなくすること、意思決定を早めること、もめ事を防ぐこと","業務の効率を上げること、信頼関係を築くこと、法令の遵守を強めること"],"answer":2,"pgl_page":106,"explain":"誰が何をすべきかが分かることで必要な情報を適切な相手に適切な時機に届けられ、意思決定が速まり、責任の所在が明らかになる。（参考：PGL Ver.4.0 第4部 第2章 P.106）","cite":"PGL Ver.4.0 第4部 第2章 P.106"},{"id":17,"tag":"モニタリングの最初の一歩","q":"モニタリング＆コントロールの最初の段階で行うこととして、正しいものはどれか。","choices":["実績のデータを集めて蓄えることを始める。","手を打つべき領域を特定する。","価値実現の状況や進み具合を測る指標が組み込まれているかを確かめ、計画で定めた目標を測れる形に直していく。","計画書を関係者に配る。"],"answer":2,"pgl_page":109,"explain":"価値実現を確かめられる指標があることで、提供価値検証プロセスで正しくサイクルを回せるようになる。（参考：PGL Ver.4.0 第4部 第3章 P.109）","cite":"PGL Ver.4.0 第4部 第3章 P.109"},{"id":18,"tag":"継続的と定期的","q":"日常の中で行うモニタリングと、期間を区切って行うモニタリングの関係として、正しいものはどれか。","choices":["期間を区切って確実に行っていれば、日常の中でのものは省いてよい。","日常の中でのものだけでは環境の変化などをすべて捉えきれず、それを補うのが期間を区切って行うものである。","日常の中でのものは経営者が、期間を区切ったものは現場の担当者が担い手となる。","日常の中でのものが働いている組織では、期間を区切ったものは要らない。"],"answer":1,"pgl_page":110,"explain":"両者を組み合わせて効果的かつ効率的な仕組みを築くことが重要とされる。（参考：PGL Ver.4.0 第4部 第3章 P.110、PGL Ver.4.0 第4部 第3章 P.111）","cite":"PGL Ver.4.0 第4部 第3章 P.110"},{"id":19,"tag":"独立モニタリング","q":"「独立モニタリング」とは何を指すか。","choices":["外部の機関による監査や、法令を守れているか、内部の統制を良くできているかなど、狙いや対象を絞って確かめたいときに効き目のあるもの。","業務の担当者が上長から独立した立場で、日常の中で行う自己点検。","日常のものと期間を区切ったものを置き換えるもので、導入すれば両者は不要になる。","価値実現サイクルの全プロセスを常時くまなく見張る仕組み。"],"answer":0,"pgl_page":111,"explain":"日常のものや期間を区切ったものではカバーできない、特定の狙いや対象を集中して評価できる。（参考：PGL Ver.4.0 第4部 第3章 P.111）","cite":"PGL Ver.4.0 第4部 第3章 P.111"},{"id":20,"tag":"証拠の特定","q":"実績データを分析・評価する際の「証拠の特定」について、正しいものはどれか。","choices":["証拠の特定はシステム監査で行う作業であり、差の分析では数値の比較に専念する。","証拠の特定は、担当者の経験に基づく感覚で行う。","証拠の特定は、実績が目標を下回った場合にだけ行えばよい。","業務の処理が意図したとおりに行われたことを確かめる証拠を見定めることが肝心で、これを誤ると差の分析そのものが意味を失いかねない。"],"answer":3,"pgl_page":111,"explain":"そのため証拠の特定を含め、評価の方針や精度、対象、技法などを明らかにした評価計画を作る必要があるとされる。（参考：PGL Ver.4.0 第4部 第3章 P.111）","cite":"PGL Ver.4.0 第4部 第3章 P.111"},{"id":21,"tag":"是正措置の例","q":"手を打つべき領域が見つかった場合に講じる措置の例として、ガイドラインが挙げているものの組合せはどれか。\na プロセスの改善\nb 資源の配分の変更\nc 従業員への追加の訓練\nd 目標数値の引き下げ","choices":["a、b、d","a、c、d","a、b、c","b、c、d"],"answer":2,"pgl_page":112,"explain":"プロセスの改善、リソース配分の変更、従業員への追加トレーニング等が挙げられており、目標数値の引き下げは含まれない。（参考：PGL Ver.4.0 第4部 第3章 P.112）","cite":"PGL Ver.4.0 第4部 第3章 P.112"},{"id":22,"tag":"セキュリティの担い手","q":"セキュリティの確保について、ガイドラインの考え方に沿うものはどれか。","choices":["特定の役割や部門だけの責任ではなく企業全体で臨むべき課題であり、従業員一人ひとりが意識を持ち、自ら進んで手を打つ姿勢が要る。","専門の部門と運用の責任者が専任で担うべき領域である。","経営者は方針を示すところまでを担い、実務には関わらない。","脅威が高度になる中では、外部の専門機関へすべて委ねることが原則である。"],"answer":0,"pgl_page":113,"explain":"経営者や推進者、開発・運用の責任者だけが責任を負うのではないとされる。（参考：PGL Ver.4.0 第4部 第4章 P.113）","cite":"PGL Ver.4.0 第4部 第4章 P.113"},{"id":23,"tag":"セキュリティのタスクの進め方","q":"セキュリティに関する一連のタスクの進め方として、ガイドラインの考え方に沿うものはどれか。","choices":["順番どおりに行う必要は必ずしもなく状況に応じて選ぶが、すべてのタスクを漏れなく、絶えず繰り返して行うことが肝心である。","組織に関わりの深いタスクだけを選べばよく、関わりの薄いものは外してよい。","最初のタスクから順に片づけなければ、次へ進めない。","ひととおり行って体制が整った後は、事故が起きた場合にだけ行えばよい。"],"answer":0,"pgl_page":113,"explain":"取り組みの順序は、組織が置かれた状況やこれまでの取り組み具合によって変わるとされる。（参考：PGL Ver.4.0 第4部 第4章 P.113）","cite":"PGL Ver.4.0 第4部 第4章 P.113"},{"id":24,"tag":"セキュリティ水準の決め方","q":"セキュリティの水準や指標を定める際の考え方として、ガイドラインの考え方に沿うものはどれか。","choices":["水準は高いほどよく、事業への差し障りにかかわらず最も厳しい対策をとるべきである。","業界で通用している水準をそのまま採り、自社としての目標は定めない。","水準の判断は外部の専門家にすべて委ねるべきである。","行き過ぎた対策は事業や業務を無用に締めつけかねず、場合によっては危険をあえて受け入れる考え方をとるべきこともある。"],"answer":3,"pgl_page":115,"explain":"守るべきものを守ることと価値を届けることの両面を踏まえ、ふさわしい水準を考える必要があるとされる。（参考：PGL Ver.4.0 第4部 第4章 P.115）","cite":"PGL Ver.4.0 第4部 第4章 P.115"},{"id":25,"tag":"技術的対策と人手による運用","q":"セキュリティ対策の実装について、ガイドラインの考え方に沿うものはどれか。","choices":["技術面の対策は仕組みによって制御できる形が望ましく、どうしても人の手で管理するときには、作業の誤りや負荷の高まりを招きうる点に留意する。","技術面の対策を十分に施せば、組織や人、物理面の対策は要らなくなる。","人手による対処は融通が利くため、技術的な仕組みによる制御より優先する。","すべて自動で動く仕組みが整うまでは、部分的な対策の導入は控えるべきである。"],"answer":0,"pgl_page":116,"explain":"目標とする水準を達成するための対策には、組織的・人的なもの、技術的なもの、物理的なものがある。（参考：PGL Ver.4.0 第4部 第4章 P.116）","cite":"PGL Ver.4.0 第4部 第4章 P.116"},{"id":26,"tag":"組織学習とは","q":"組織学習とは何を指す仕組みか。","choices":["一人ひとりの学びを組織の全員で分かち合って応用し、価値を生み出していく仕組み。","従業員個人の腕を上げることを目的とした、研修制度の総称。","プロジェクトが終わった際に行う、振り返りの会の仕組み。","外部の教育機関と手を組んで人材を育てる制度。"],"answer":0,"pgl_page":118,"explain":"個人の知を組織で共有し、発展させ、応用し、再び個人の知として取り込む流れを繰り返すことで、難しい課題に応えられる個人と組織をつくり上げるとされる。（参考：PGL Ver.4.0 第4部 第5章 P.118）","cite":"PGL Ver.4.0 第4部 第5章 P.118"},{"id":27,"tag":"組織学習の見直しの拠りどころ","q":"組織学習の取り組みを見直す際、何をもとに行うとされているか。","choices":["提供価値検証プロセスで得られた検証の結果","デジタル経営成熟度レベルの向上アクティビティで定められた成熟度の目標","モニタリング＆コントロールで測られる実績の指標","人事評価制度における従業員の達成状況"],"answer":1,"pgl_page":118,"explain":"組織学習が根づけばデジタル経営のマインドやガバナンスが鍛えられ、結果として環境や利活用の水準も上がるとされる。（参考：PGL Ver.4.0 第4部 第5章 P.118）","cite":"PGL Ver.4.0 第4部 第5章 P.118"},{"id":28,"tag":"従業員の動機付けを担う人","q":"組織学習の環境を整える取り組みのうち、「従業員の動機付け」を担うのは誰か。","choices":["経営者","人材開発部門","組織学習推進チーム","事業部門"],"answer":0,"pgl_page":118,"explain":"経営者が従業員と目的や使命、目指す姿、価値観を分かち合い、組織学習への意思を示すことで意欲と裁量を高めるとされる。（参考：PGL Ver.4.0 第4部 第5章 P.118）","cite":"PGL Ver.4.0 第4部 第5章 P.118"},{"id":29,"tag":"推進チームを作る担い手","q":"組織学習の環境を整える取り組みのうち、「組織学習推進チームの形成」を担うのは誰か。","choices":["経営者","経営者と人事部門","事業部門と人材開発部門","開発リーダーと運用リーダー"],"answer":2,"pgl_page":119,"explain":"働き方改革の推進は経営者と人事部門、従業員の動機付けは経営者の役割とされる。（参考：PGL Ver.4.0 第4部 第5章 P.119）","cite":"PGL Ver.4.0 第4部 第5章 P.119"},{"id":30,"tag":"暗黙知を形式知にする手法","q":"個人の中にある知を、他の人にも分かる形へ変えていく手法として、ガイドラインが挙げていないものはどれか。","choices":["自身の経験や学びを語ること","システム監査を実施すること","経験を積んだ人が仕事の中で教えること","文書や動画として記録に残すこと"],"answer":1,"pgl_page":120,"explain":"挙げられているのはストーリーテリング、ドキュメンテーション、会議・ディスカッション、コーチング・メンターシップ、研修・勉強会である。（参考：PGL Ver.4.0 第4部 第5章 P.120）","cite":"PGL Ver.4.0 第4部 第5章 P.120"},{"id":31,"tag":"仕組み化と標準化","q":"組織学習における「仕組みの構築と標準化」について、ガイドラインの考え方に沿うものはどれか。","choices":["個人の中にある知を、他の人に分かる形へ変える段階を経ずに、そのまま業務のルールとして文書にする。","組織で共有された知は、例外なくすべて標準化の対象とする。","業務の標準化は現場の裁量を狭めるため、データの扱い方の統一だけにとどめる。","共有された知のうち、仕組みにして揃えられる部分を見定め、業務の進め方の標準化を進める。"],"answer":3,"pgl_page":121,"explain":"ITシステムを使いながら業務の標準化を進め、データを活かす仕組みも整えて扱い方も揃えていくとされる。（参考：PGL Ver.4.0 第4部 第5章 P.121）","cite":"PGL Ver.4.0 第4部 第5章 P.121"},{"id":32,"tag":"内面化","q":"組織学習における「内面化」とは何を指すか。","choices":["共有された知が組織の資産として蓄えられ、個人の側へ戻ることはないことであるとされている。","共有された知が一人ひとりに吸収され、その人自身の中にある知として身につくこと。","個人の中にある知を、言葉や文書に表して分かち合える形にすること。","共有された知同士を結びつけ、新しい見方を生み出すこと。"],"answer":1,"pgl_page":121,"explain":"内面化により、一人ひとりが新しい着想を得て、新しい行動を起こす可能性が生まれる。ウは形式知化、エは連結の説明。（参考：PGL Ver.4.0 第4部 第5章 P.121）","cite":"PGL Ver.4.0 第4部 第5章 P.121"}]}];
const POS=["ア","イ","ウ","エ"];
const K_STATE="itc-drill2-state-v1";
const K_WRONG="itc-drill2-wrong-v1";
const K_SESS="itc-drill2-sessions-v1";
const app=document.getElementById("app");
let S={screen:"menu",ch:0,idx:0,sel:null,rec:{},mode:"chapter",list:null};
let WRONG={};
let SESS={};   /* 章ごとの中断状態: {chapterId:{idx,rec,ts}} */

function save(){try{
  localStorage.setItem(K_STATE,JSON.stringify(S));
  localStorage.setItem(K_WRONG,JSON.stringify(WRONG));
  localStorage.setItem(K_SESS,JSON.stringify(SESS));
}catch(e){}}
function load(){
  try{const v=localStorage.getItem(K_STATE);if(v)S=Object.assign(S,JSON.parse(v));}catch(e){}
  try{const w=localStorage.getItem(K_WRONG);if(w)WRONG=JSON.parse(w)||{};}catch(e){WRONG={}}
  try{const s=localStorage.getItem(K_SESS);if(s)SESS=JSON.parse(s)||{};}catch(e){SESS={}}
}
/* 現在の進捗を章ごとに記録（中断に備えて毎回呼ぶ） */
function stash(){
  if(S.mode!=="chapter")return;
  const c=CHAPTERS[S.ch]; if(!c)return;
  const n=Object.keys(S.rec).length;
  if(n===0&&S.idx===0){delete SESS[c.id];return;}
  if(n>=c.questions.length){delete SESS[c.id];return;}   /* 完了したら消す */
  SESS[c.id]={idx:S.idx,rec:S.rec,ts:Date.now()};
}
function fmtDate(ts){
  const d=new Date(ts),p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function key(ci,qi){return ci+":"+qi;}

/* 現在の出題リストを返す（章モード＝その章／復習モード＝間違えた問題） */
function curList(){
  if(S.mode==="review") return (S.list||[]);
  return CHAPTERS[S.ch].questions.map((q,i)=>key(S.ch,i));
}
function getQ(k){const[ci,qi]=k.split(":").map(Number);return CHAPTERS[ci].questions[qi];}
function getChTitle(k){return CHAPTERS[+k.split(":")[0]].title;}
function wrongKeys(){return Object.keys(WRONG);}
function wrongOfCh(ci){return wrongKeys().filter(k=>+k.split(":")[0]===ci).length;}

function render(){
  if(S.screen==="menu")return renderMenu();
  if(S.screen==="result")return renderResult();
  renderQuiz();
}

function renderMenu(){
  const nw=wrongKeys().length;
  let h="";
  if(nw>0){
    h+=`<div class="card reviewcard"><h2>間違えた問題の復習</h2>
      <div class="muted">これまでに間違えた問題が <b style="color:var(--shu)">${nw}問</b> あります。正解できた問題はこの一覧から自動的に外れます。</div>
      <div class="navrow"><button id="startreview" class="review">復習する（${nw}問）</button>
      <button id="clearwrong" class="ghost">一覧をクリア</button></div></div>`;
  }
  /* 中断中の章があれば最上部に「続きから」カードを出す */
  const paused=CHAPTERS.map((c,i)=>({c,i,s:SESS[c.id]})).filter(x=>x.s);
  if(paused.length){
    h+=`<div class="card resumecard"><h2>続きから再開</h2>
      <div class="muted">前回とちゅうで終えた章があります。解答した内容はそのまま残っています。</div><div class="modes" style="margin-top:12px">`;
    paused.sort((a,b)=>b.s.ts-a.s.ts).forEach(x=>{
      const total=x.c.questions.length, done=Object.keys(x.s.rec).length;
      const pct=Math.round(done/total*100);
      h+=`<button class="mode resumemode" data-resume="${x.i}"><b>${esc(x.c.title)}</b>
        <div class="muted">問${x.s.idx+1} から再開　（${done} / ${total}問 解答済み）</div>
        <div class="progress" style="margin:8px 0 6px"><i style="width:${pct}%"></i></div>
        <span class="cnt">最終 ${fmtDate(x.s.ts)}</span></button>`;
    });
    h+='</div></div>';
  }
  h+='<div class="card"><h2>章を選択</h2><div class="modes">';
  CHAPTERS.forEach((c,i)=>{
    const w=wrongOfCh(i), s=SESS[c.id];
    const done=s?Object.keys(s.rec).length:0;
    h+=`<button class="mode" data-ch="${i}"><b>${esc(c.title)}</b><div class="muted">${esc(c.sub)}</div>
      <span class="cnt">${c.questions.length}問${w?`<span class="wrongbadge">要復習 ${w}</span>`:""}${s?`<span class="pausebadge">とちゅう ${done}/${c.questions.length}</span>`:""}</span></button>`;
  });
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll("[data-resume]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.resume, s=SESS[CHAPTERS[i].id];
    S.ch=i;S.mode="chapter";S.list=null;S.idx=s.idx;S.sel=null;S.rec=Object.assign({},s.rec);S.screen="quiz";
    save();render();
  });
  app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.ch, c=CHAPTERS[i], s=SESS[c.id];
    if(s){
      const done=Object.keys(s.rec).length;
      if(confirm(`「${c.title}」は問${s.idx+1}まで解答した記録が残っています（${done}/${c.questions.length}問）。\n\nOK：続きから再開\nキャンセル：最初からやり直す`)){
        S.ch=i;S.mode="chapter";S.list=null;S.idx=s.idx;S.sel=null;S.rec=Object.assign({},s.rec);S.screen="quiz";
        save();render();return;
      }
      delete SESS[c.id];
    }
    S.ch=i;S.mode="chapter";S.list=null;S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();
  });
  const sr=document.getElementById("startreview");
  if(sr)sr.onclick=()=>{
    S.mode="review";S.list=wrongKeys();S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();
  };
  const cw=document.getElementById("clearwrong");
  if(cw)cw.onclick=()=>{if(confirm("間違えた問題の一覧をすべて消します。よろしいですか？")){WRONG={};save();render();}};
}

function renderQuiz(){
  const list=curList();
  if(!list.length){S.screen="menu";save();return render();}
  if(S.idx>=list.length)S.idx=list.length-1;
  const k=list[S.idx],q=getQ(k);
  const answered=S.sel!==null;
  const ok=answered&&S.sel===q.answer;
  const nAns=Object.keys(S.rec).length;
  const pct=Math.round(nAns/list.length*100);
  const isRv=S.mode==="review";
  let h=`<div class="card${isRv?" reviewcard":""}">
    <div class="qmeta">
      <span class="tagchip${isRv?" rv":""}">${isRv?"復習":esc(CHAPTERS[S.ch].title)}</span>
      <span class="tagchip">${esc(isRv?getChTitle(k)+"｜"+q.tag:q.tag)}</span>
      <span class="muted" style="margin-left:auto">${S.idx+1} / ${list.length}　解答済み ${nAns}</span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="stem"><span class="qno">問${S.idx+1}．</span>${esc(q.q)}</div>
    <div class="choices">`;
  q.choices.forEach((c,i)=>{
    let cls="";
    if(answered){cls=(i===q.answer)?"ok":(i===S.sel?"ng":"dim");}
    h+=`<button class="choice ${cls}" data-i="${i}" ${answered?"disabled":""}><span class="pos">${POS[i]}</span><span class="tx">${esc(c)}</span></button>`;
  });
  h+="</div>";
  if(answered){
    let note="";
    if(isRv&&ok)note='<div style="margin-top:8px;color:var(--midori);font-weight:700">正解できたので、復習一覧から外しました。</div>';
    const pg=q.pgl_page?`<span class="pgchip">PGL p.${q.pgl_page}</span>`:"";
    h+=`<div class="exp"><div class="vh">${ok?"○ 正解":"✕ 不正解 ─ 正解は「"+POS[q.answer]+"」"}${pg}</div><div>${esc(q.explain)}</div>${note}</div>`;
  }
  h+=`</div><div class="navrow">
    <button id="prev" ${S.idx===0?"disabled":""}>← 前へ</button>
    <button id="pause" class="ghost">とちゅうでやめる</button>
    <div class="spacer"></div>
    <button id="next" class="primary" ${answered?"":"disabled"}>${S.idx===list.length-1?"結果を見る":"次へ →"}</button>
  </div>
  <div class="muted" style="margin-top:8px;font-size:12px">解答した内容は自動で保存されます。とちゅうでやめても、次に開いたとき同じ場所から続けられます。</div>`;
  app.innerHTML=h;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(S.sel!==null)return;
    S.sel=+b.dataset.i;
    const correct=(S.sel===q.answer);
    S.rec[k]=correct;
    if(correct){delete WRONG[k];}else{WRONG[k]=1;}
    stash();save();render();
  });
  document.getElementById("prev").onclick=()=>{if(S.idx>0){S.idx--;S.sel=null;stash();save();render();}};
  document.getElementById("pause").onclick=()=>{
    stash();S.screen="menu";S.sel=null;save();render();
  };
  document.getElementById("next").onclick=()=>{
    if(S.idx===list.length-1){
      if(S.mode==="chapter"){const c=CHAPTERS[S.ch];if(c)delete SESS[c.id];}  /* 完走したら中断記録を消す */
      S.screen="result";
    }else{S.idx++;S.sel=null;stash();}
    save();render();
  };
}

function renderResult(){
  const list=S.mode==="review"?(S.list||[]):CHAPTERS[S.ch].questions.map((q,i)=>key(S.ch,i));
  const total=list.length;
  const score=list.filter(k=>S.rec[k]===true).length;
  const pct=total?Math.round(score/total*100):0;
  const missed=list.filter(k=>S.rec[k]===false);
  const title=S.mode==="review"?"復習":CHAPTERS[S.ch].title;
  let h=`<div class="card${S.mode==="review"?" reviewcard":""}">
    <h2>${esc(title)}　結果</h2>
    <div class="score-hero"><div class="big">${score}<span class="of"> / ${total}</span></div><div class="muted">正答率 ${pct}%</div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="grid">`;
  list.forEach((k,i)=>{
    const r=S.rec[k];
    h+=`<div class="cell ${r===true?"ok":(r===false?"ng":"")}" title="${esc(getQ(k).tag)}">${i+1}</div>`;
  });
  h+="</div>";
  if(missed.length){
    h+=`<div class="wronglist"><h2 style="margin-top:18px;font-size:15px">間違えた問題（${missed.length}問）</h2>`;
    missed.forEach(k=>{
      const i=list.indexOf(k);
      const wq=getQ(k);
      h+=`<div class="wrongrow"><span class="n">問${i+1}</span><span>${esc(getChTitle(k))}｜${esc(wq.tag)}</span>${wq.pgl_page?`<span class="pgchip" style="margin-left:auto">PGL p.${wq.pgl_page}</span>`:""}</div>`;
    });
    h+="</div>";
  }
  const nw=wrongKeys().length;
  h+=`<div class="navrow">`;
  if(missed.length)h+=`<button id="redo" class="review">この回の間違いをやり直す（${missed.length}問）</button>`;
  h+=`<button id="again">もう一度最初から</button>
      <button id="tomenu" class="ghost">ホームへ</button></div>`;
  if(nw)h+=`<div class="muted" style="margin-top:10px">復習一覧には現在 ${nw}問 たまっています。ホームからいつでも復習できます。</div>`;
  h+="</div>";
  app.innerHTML=h;
  const rd=document.getElementById("redo");
  if(rd)rd.onclick=()=>{S.mode="review";S.list=missed.slice();S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();};
  document.getElementById("again").onclick=()=>{
    if(S.mode==="review"){S.list=list.slice();}
    S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();
  };
  document.getElementById("tomenu").onclick=()=>{S.screen="menu";save();render();};
}

document.getElementById("homebtn").onclick=()=>{
  if(S.screen==="quiz")stash();
  S.screen="menu";S.sel=null;save();render();
};
/* タブを閉じる・アプリを離れる直前にも保存 */
w_beforeunload();
function w_beforeunload(){
  window.addEventListener("beforeunload",()=>{if(S.screen==="quiz")stash();save();});
  document.addEventListener("visibilitychange",()=>{if(document.hidden){if(S.screen==="quiz")stash();save();}});
}
load();
if(S.screen==="quiz"){
  const l=curList();
  if(!l.length||!CHAPTERS[S.ch]){S.screen="menu";S.mode="chapter";}
}
render();
</script>
</body>
