<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ITC試験対策 その2（分野別ドリル） — PGL Ver.4.0 対応</title>
<style>
:root{
  --bg:#E9EBEE; --card:#FCFCFB; --ink:#17202B; --sub:#5C6672;
  --ai:#1F3A63; --shu:#B4362F; --midori:#2C6A4F; --rule:#C9CDD3; --gold:#8a6d1f;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:15px}
header{background:var(--ai);color:#fff;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-size:18px;margin:0;letter-spacing:.08em}
header .sub{font-size:11px;opacity:.75}
header .hspace{flex:1}
main{max-width:860px;margin:18px auto 40px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(23,32,43,.05)}
h2{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--ai);letter-spacing:.05em}
.muted{color:var(--sub);font-size:13px}
button{font-family:var(--sans);cursor:pointer;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:9px 16px;font-size:14px}
button.primary{background:var(--ai);border-color:var(--ai);color:#fff}
button.review{background:var(--shu);border-color:var(--shu);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px;cursor:pointer;transition:.12s;text-align:left}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:var(--ai);box-shadow:0 2px 8px rgba(31,58,99,.12)}}
.mode b{font-family:var(--serif);font-size:16px;color:var(--ai);display:block;margin-bottom:6px}
.mode .muted{font-size:12px}
.mode .cnt{font-size:12px;color:var(--ai);font-weight:700;margin-top:8px;display:block}
.mode .wrongbadge{display:inline-block;margin-left:8px;background:#faecea;border:1px solid var(--shu);color:var(--shu);border-radius:999px;padding:0 8px;font-size:11px;font-weight:700}
.reviewcard{border:1px solid var(--shu);background:#fdf6f4}
.reviewcard h2{color:var(--shu)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--sub)}
.tagchip{border:1px solid var(--rule);border-radius:999px;padding:1px 10px;background:#fff}
.tagchip.rv{border-color:var(--shu);color:var(--shu);background:#faecea}
.stem{white-space:pre-wrap;font-size:15px;margin:4px 0 14px}
.qno{font-family:var(--serif);color:var(--ai);font-weight:700;margin-right:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;background:#fff;padding:10px 12px;cursor:pointer;text-align:left;font-size:14px;line-height:1.7;width:100%}
.choice .pos{font-family:var(--serif);color:var(--ai);font-weight:700;min-width:1.4em}
.choice .tx{white-space:pre-wrap;flex:1}
@media (hover:hover) and (pointer:fine){.choice:hover{border-color:var(--ai)}}
.choice.ok{border-color:var(--midori);background:#eaf3ee;box-shadow:inset 0 0 0 1px var(--midori)}
.choice.ng{border-color:var(--shu);background:#faecea;box-shadow:inset 0 0 0 1px var(--shu)}
.choice.dim{opacity:.6}
.exp{margin-top:14px;border-left:4px solid var(--ai);background:#f2f4f8;border-radius:0 6px 6px 0;padding:12px 14px;font-size:13.5px}
.exp .vh{font-family:var(--serif);color:var(--ai);margin-bottom:6px;font-weight:700}
.navrow{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.navrow .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--rule);border-radius:5px;background:#fff;text-align:center;padding:6px 0;font-size:12px;font-variant-numeric:tabular-nums}
.cell.ok{background:#eaf3ee;border-color:var(--midori);color:var(--midori);font-weight:700}
.cell.ng{background:#faecea;border-color:var(--shu);color:var(--shu);font-weight:700}
.bar{height:10px;background:#e3e6ea;border-radius:5px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ai)}
.score-hero{text-align:center;padding:8px 0 12px}
.score-hero .big{font-family:var(--serif);font-size:44px;color:var(--ai);font-variant-numeric:tabular-nums}
.score-hero .of{color:var(--sub);font-size:15px}
.progress{height:6px;background:#e3e6ea;border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--ai)}
.wronglist{margin-top:6px}
.wrongrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.pgchip{display:inline-block;margin-left:8px;border:1px solid var(--ai);color:var(--ai);background:#fff;border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:700;font-family:var(--sans);vertical-align:middle}
.exp .vh .pgchip{margin-left:10px}
.wrongrow .n{font-variant-numeric:tabular-nums;color:var(--shu);font-weight:700;min-width:2.5em}
footer{max-width:860px;margin:30px auto;padding:0 14px 30px;color:var(--sub);font-size:11.5px;line-height:1.9;border-top:1px solid var(--rule)}
</style>
</head>
<body>

  <h1>ITC試験対策 その2（分野別ドリル）</h1>

  <button id="homebtn" class="ghost" style="color:#fff;border-color:rgba(255,255,255,.4);font-size:12px;padding:5px 12px">ホーム</button>

  解説中の「PGL p.◯◯」は、お手元の『ITコーディネータ プロセスガイドライン Ver.4.0』の該当ページを示す参照です。
  成績データはこの端末のブラウザ内（localStorage）にのみ保存され、外部送信は行いません。<span style="opacity:.55">　ITC試験対策 その2（分野別ドリル）　app v1.2.0</span>
</footer>

<script>
const CHAPTERS=[{"id":"general","title":"全体共通","sub":"ITCの役割・実践力・心得","questions":[{"id":1,"tag":"ITCの基本姿勢","q":"ITコーディネータ（ITC）がデジタル経営支援者として企業に関わる際の基本姿勢について、適切な記述はどれか。","choices":["助言や支援を通じて、最終的には社内人材がデジタル経営推進者等の役割を自ら担えるよう育成していく。","ITCはプロジェクトリーダーとして、現場の意思決定権をすべて引き受けるべきである。","経営者やデジタル経営推進者の役割を、ITCが継続的に代行し続けることが望ましい。","デジタル経営成長サイクルの成果物作成のみを担当し、価値実現サイクル以降はITベンダーに一任する。"],"answer":0,"explain":"ITCは助言・支援を通じて社内人材の自立を促す立場。役割の恒久的な代行や意思決定権の独占は目指す姿ではない（PGL p.11）。","pgl_page":11},{"id":2,"tag":"ITCの実践力","q":"ITCに求められる「実践力」を構成する三つの知の組み合わせとして、適切なものはどれか。","choices":["専門知・技術知・経験知","専門知・行動知・意識知","行動知・戦略知・実務知","意識知・組織知・業務知"],"answer":1,"explain":"ITCの実践力は「専門知」「行動知」「意識知」の三つで構成される（PGL p.12）。","pgl_page":12},{"id":3,"tag":"実践知の強化","q":"ITCの実践力強化に関する記述として、適切なものはどれか。","choices":["専門知のみを繰り返し学習していれば、行動知や意識知は特別な取り組みなしに自然と身につく。","知識と実践知をもとに実務経験を積み重ねることで、実践知はさらに強化されていく。","実践知は資格取得時点で完成しており、その後の実務経験による変化はない。","実践知の強化は、外部研修の受講回数のみによって測定される。"],"answer":1,"explain":"実践知は実務経験の積み重ねによって強化されていくものであり、資格取得時点で完成するものではない（PGL p.12）。","pgl_page":12},{"id":4,"tag":"ケーススタディ：オーナー交代","q":"B社では実行計画書の作成とベンダー確定まで進み、経営トップからデジタル経営推進者へプロジェクトオーナーの権限が委譲された。この後のデジタル経営支援者としてより適切な関わり方はどれか。","choices":["経営者へのアドバイザーから、デジタル経営推進者へのアドバイザーへと役割を移行しつつ、プロジェクト完了まで関与を続ける。","オーナーが交代した場合であっても、これまでと変わらず経営者のみを対象としたアドバイザーの立場で、従来どおり関わり続ける。","権限委譲を機に、以降の工程はITベンダーの主導に完全に委ねる。","権限委譲後は現場の実務作業のみを直接担当し、アドバイザーの立場からは退く。"],"answer":0,"explain":"オーナー交代に応じて支援対象を移行しつつ、完了まで一貫して関与を続けるのが適切（PGL p.11）。","pgl_page":11},{"id":5,"tag":"解答の心得：あるべき解","q":"PGLに基づく問題解決において重視される考え方として、適切なものはどれか。","choices":["実務上の制約を最優先し、常に実現可能な現実解のみを選択する。","現実解とあるべき解は常に一致するため、区別して考える必要はないと考えられている。","あるべき姿の検討は理想論であるため、実務判断では考慮しない。","現実にそぐわない面があっても、現実解よりも「あるべき解」を優先して選択する。"],"answer":3,"explain":"PGLでは現実解よりも「あるべき解」を優先する考え方が基本とされる（PGL p.13）。","pgl_page":13},{"id":6,"tag":"解答の心得：全体解","q":"複数のプロセスにまたがる課題を検討する際の基本的な考え方として、適切なものはどれか。","choices":["各プロセス担当者がそれぞれの範囲内で最適な部分解を出せば、全体としても最適になる。","部分最適な解よりも、全体として整合性の取れた「全体解」を選択する。","部分解を積み上げていく方式は、全体解よりも常に優先されるべきである。","全体解の検討は上位者の役割であり、現場のITCが意識する必要はない。"],"answer":1,"explain":"部分解の積み上げより、全体として整合性の取れた解を優先するのが基本的な考え方（PGL p.24）。","pgl_page":24},{"id":7,"tag":"解答の心得：課題の原因","q":"実践段階で発生した課題への対応の考え方として、適切なものはどれか。","choices":["実践段階で生じた課題は、もっぱらその段階を担当した者のスキル不足のみに原因があると捉える。","上位ステップまで遡って原因を検討することは、実務上非効率であるため避ける。","課題の原因は個別のシステムトラブルに限定して捉え、計画内容の見直しは行わない。","実践時の課題は、企画・計画など上位ステップに原因があると捉えて対応策を検討する。"],"answer":3,"explain":"実践段階の課題は、企画・計画など上位ステップに原因を求めて対応策を検討するのが基本姿勢（PGL p.13）。","pgl_page":13},{"id":8,"tag":"解答の心得：判断の立場","q":"問題の解答に迷った場合にとるべき基本姿勢として、適切なものはどれか。","choices":["ITベンダーの立場に立って、開発のしやすさを優先して判断する。","現場担当者の負担軽減を最優先の判断基準とする。","デジタル経営を推進する経営者の立場に立って、選択肢を判断する。","ITCが最も答えやすい選択肢を優先して選ぶ。"],"answer":2,"explain":"判断に迷った場合は、デジタル経営を行う経営者の立場に立って選択するのが基本（PGL p.13）。","pgl_page":13},{"id":9,"tag":"デジタル経営の目的：価値創造","q":"デジタル経営が目指す価値創造の対象として、適切な組み合わせはどれか。","choices":["顧客価値・株主価値・従業員価値・ブランド価値","事業価値・技術価値・組織価値・業界価値","顧客価値・事業価値・企業価値・社会価値","企業価値・投資価値・市場価値・競争価値"],"answer":2,"explain":"デジタル経営が目指す価値創造は「顧客価値・事業価値・企業価値・社会価値」の4つ（PGL p.6）。","pgl_page":6},{"id":10,"tag":"デジタル経営の目的：三方良し","q":"デジタル経営の目的を「三方良し」の観点で表した記述として、適切なものはどれか。","choices":["相手良し・自分良し・世間良しの実現を目指すものである。","顧客良し・ベンダー良し・自社良しの実現を目指すものである。","現在良し・将来良し・過去良しの実現を目指すものである。","経営者良し・従業員良し・株主良しの実現を目指すものである。"],"answer":0,"explain":"デジタル経営の目的は価値創造、または「相手良し・自分良し・世間良し」の三方良しとして説明される（PGL p.6）。","pgl_page":6},{"id":11,"tag":"ITCの中立性","q":"ITCが企業を支援する際に求められる立場として、適切なものはどれか。","choices":["中立性よりも、案件の早期成約を優先する立場をとる。","過去に取引実績のあるITベンダーを優先的に推薦する立場をとるものとする。","特定のITベンダーや製品に偏らず、中立的な立場から助言・支援を行う。","経営者の意向よりも、ITベンダーの提案内容を優先して支援する。"],"answer":2,"explain":"ITCは特定ベンダー・製品に偏らない中立的な立場から助言・支援を行うことが求められる（PGL p.11）。","pgl_page":11},{"id":12,"tag":"ITCと守秘義務","q":"ITCが支援先企業の情報を取り扱う際の基本姿勢として、適切なものはどれか。","choices":["支援を通じて知り得た経営情報や機密情報について、守秘義務を遵守する。","機密情報であっても、業界の一般的な傾向として公表することは問題ない。","支援実績として、他社への提案時に企業名を明示して活用する。","守秘義務は契約書に明記されている場合に限り、遵守すればよい。"],"answer":0,"explain":"ITCは支援を通じて知り得た情報について守秘義務を遵守する基本姿勢が求められる（PGL p.11）。","pgl_page":11},{"id":13,"tag":"ITCとITベンダーの関係","q":"ITCとITベンダーとの関係について、適切な記述はどれか。","choices":["ITCはITベンダーの選定において、価格の安さのみを判断基準とすべきである。","ITCはITベンダーの立場に立ち、発注者への提案内容を代弁する役割を担う。","ITCとITベンダーは利害が対立する関係であるため、直接のやり取りは避けるべきである。","ITCは発注者側の立場に立ちつつ、ITベンダーとも公正・透明な関係を保ち協働する。"],"answer":3,"explain":"ITCは発注者側の立場を基本としつつ、ITベンダーとも公正・透明な関係で協働する（PGL p.11）。","pgl_page":11},{"id":14,"tag":"ITCの継続的な自己研鑽","q":"ITCに求められる継続的な取り組みとして、適切なものはどれか。","choices":["技術動向や経営環境の変化を踏まえ、専門知・行動知・意識知を継続的に更新していく。","専門知の更新のみを継続して行っていれば、行動知や意識知の更新までは不要なものと考えられている。","自己研鑽は個人の裁量に委ねられ、支援活動とは無関係である。","資格取得時に得た知識のみで、以降の学習は不要である。"],"answer":0,"explain":"ITCには専門知・行動知・意識知を継続的に更新していく自己研鑽の姿勢が求められる（PGL p.12）。","pgl_page":12},{"id":15,"tag":"経営者との信頼関係","q":"ITCが経営者との信頼関係を築くうえで重視すべき姿勢として、適切なものはどれか。","choices":["経営者の意向には常に迎合し、異なる見解があっても指摘しない。","信頼関係の構築よりも、成果物の納期遵守のみを最優先とする。","経営者の「思い」や事業ドメインへの理解を深め、対等な立場で対話を重ねる。","経営者との対話は初回の契約時のみに限定し、以降は書面のやり取りに徹する。"],"answer":2,"explain":"経営者の「思い」への理解を深め、対等な立場での対話を重ねることが信頼関係構築の基本（PGL p.11）。","pgl_page":11},{"id":16,"tag":"ケーススタディ：丸投げ","q":"経営者から「デジタル化の判断はすべて任せる」と丸投げされた場合のデジタル経営支援者としてより適切な対応はどれか。","choices":["丸投げは支援対象外であるとして、支援自体を中止する。","経営者への説明を省略し、ITCの判断のみで計画を確定させる。","経営者の意向をそのまま尊重し、以降の意思決定についてはすべてITCの側が代行して進めていく。","経営者に意思決定への関与を促しつつ、判断に必要な情報や選択肢を整理して提示する。"],"answer":3,"explain":"意思決定を代行するのではなく、経営者自身の関与を促しながら判断材料を整理・提示するのが適切（PGL p.11）。","pgl_page":11},{"id":17,"tag":"ケーススタディ：ベンダー主導","q":"プロジェクトの検討がITベンダー主導で進み始め、経営者の意向が反映されにくくなっている場面での対応として、適切なものはどれか。","choices":["ベンダーとの関係悪化を避けるため、状況を静観し続ける。","経営者の「思い」や事業目標に立ち返り、ベンダー提案との整合性を確認しながら軌道修正を図る。","経営者に軌道修正の必要性を伝えず、現状のまま進行させる。","ベンダー側の専門性を最大限に尊重し、以降の検討についてはすべてベンダーの判断に委ねることとする。"],"answer":1,"explain":"経営者の意向・目標に立ち返り、ベンダー提案との整合性を確認しながら軌道修正を図るのが適切（PGL p.11）。","pgl_page":11},{"id":18,"tag":"ケーススタディ：現場との対立","q":"デジタル化の方向性をめぐり経営者と現場の間で意見対立が生じている場合、デジタル経営支援者としてより適切な対応はどれか。","choices":["現場の意見のみを採用し、経営者への説明は事後報告にとどめる。","対立の解消は経営者の役割であるとして、ITCは関与しない。","双方の気付きや懸念を可視化し、共有する場を設けることで理解と共感の形成を促す。","経営者の意向をあくまで優先することとし、現場から出ている懸念は取り上げずに計画を進めていく。"],"answer":2,"explain":"経営者・現場双方の気付きを可視化・共有し、理解と共感の形成を促すのが基本的な対応（PGL p.11）。","pgl_page":11},{"id":19,"tag":"複眼的視点","q":"ITCがデジタル経営支援者として発揮すべき視点について、適切な記述はどれか。","choices":["複眼的視点は理想論であり、実務では単一の専門視点で十分である。","経営視点とIT視点の両方を併せ持ち、経営とITを橋渡しする複眼的な視点で助言を行う。","経営視点のみに特化し、IT面の実現可能性は検討対象としない。","IT視点のみに特化し、経営判断は経営者に完全に委ねるべきであると位置づけられるものとされる。"],"answer":1,"explain":"経営とITの両視点を併せ持ち、両者を橋渡しする複眼的視点がITCには求められる（PGL p.11）。","pgl_page":11},{"id":20,"tag":"ITCの最終ゴール","q":"ITCによる支援が目指す最終的な状態として、適切な記述はどれか。","choices":["ITCが恒久的に経営者の意思決定を代行し続ける状態。","あらゆる業務をITベンダーへ外部委託することにより、社内人材の関与を最小限にまで抑えた状態。","デジタル化プロジェクトが一度完了し、以降の見直しを行わない状態。","社内人材がデジタル経営推進者等の役割を自ら担い、自立的にデジタル経営を継続できる状態。"],"answer":3,"explain":"ITCの支援は、社内人材が自立的にデジタル経営を継続できる状態を最終的なゴールとする（PGL p.11）。","pgl_page":11}]},{"id":"part1","title":"第1部","sub":"デジタル経営について","questions":[{"id":1,"tag":"デジタル経営の定義","q":"PGL4.0における「デジタル経営」の定義に関する記述として、適切なものはどれか。","choices":["デジタル経営とは、クラウドシステムを積極的に導入することにより、既存のレガシーシステムから脱却すること自体を最終的な目的として位置づける経営手法である。","デジタル経営とは、IT投資額を可能な限り最大化したうえで、システムの高度化を進めること自体を最終的な目的とする経営手法である。","デジタル経営とは、経営環境の変化に関わらず、あらかじめ定めた計画を一切変更せず遂行する経営手法である。","デジタル経営とは、経営環境の変化を洞察し、戦略に基づいたデータとITの利活用による経営の変革によって、企業の健全で持続的な成長を導く経営手法である。"],"answer":3,"explain":"デジタル経営は、経営環境の変化を洞察し、データとITの利活用による経営変革で持続的な成長を導く手法。レガシー脱却やIT投資額そのものが目的ではない（PGL p.3）。","pgl_page":3},{"id":2,"tag":"価値創造の構造","q":"デジタル経営が目標とする価値創造の構造として、適切な記述はどれか。","choices":["顧客価値の創造によってまず社会価値が高まり、その社会価値の向上が事業価値を押し上げ、最終的に企業価値の向上へとつながっていくという順序で構成されるものとされる。","事業価値を先に設定し、それに基づいて顧客価値と社会価値の目標を定めることで価値創造を行う。","事業に事業価値を設定し企業価値としてまとめたうえで、事業価値に基づき顧客価値を、企業価値に基づき社会価値を決定する方針をとる。","顧客価値を創造することで事業価値を高め、複数の事業価値の向上が企業価値の向上につながる。社会課題への貢献である社会価値は、他のすべての価値創造に影響を与える。"],"answer":3,"explain":"顧客価値→事業価値→企業価値という積み上げの構造であり、社会価値はすべての価値創造に横断的に影響を与える位置づけ（PGL p.6）。","pgl_page":6},{"id":3,"tag":"企業文化形成","q":"企業文化形成の位置付けに関し、適切と思われる記述はどれか。","choices":["経営理念に基づく行動理念は、それぞれの事業部の単位ごとに個別に策定されるものであり、全社に共通して適用される行動指針をあらためて定める必要は特にないものとされる。","企業文化は、経営理念とは独立して、ESGやSDGsの社会全体の動きにのみ基づいて策定されるものである。","経営理念に向けて「如何に行動するか」の行動理念が策定され、具体的な行動指針を作り、経営者の説明と動機づけによってエンゲージメントが醸成され企業文化が形成される。","企業文化は事業ビジョン達成のための指針として策定され、事業目標達成そのものをエンゲージメント達成の唯一の目標とする方針をとる。"],"answer":2,"explain":"行動理念策定→行動指針作成→経営者の説明・動機づけ→エンゲージメント醸成→企業文化形成、という流れが基本（PGL p.7）。","pgl_page":7},{"id":4,"tag":"デジタル経営人材の役割","q":"デジタル経営を支える人材の役割について、適切な記述はどれか。","choices":["運用リーダーの役割は、価値を生み出す仕組みを新たに設計することにあり、開発リーダーとは独立してシステムを開発する方針をとる。","開発リーダーの役割は、生み出された価値を安定的に運用し続けていくことにあり、事業価値の認識については運用リーダーの側が担うべき事項であるとされる。","デジタル経営支援者は、社内の専任担当者として位置づけられ、外部の専門家がこの役割を担うことは想定されていない。","開発リーダーの役割は、価値を生み出す仕組みを作ることにあり、デジタル経営推進者との密接な協力関係のもとITシステムが生み出す事業価値を認識する。"],"answer":3,"explain":"開発リーダーの役割は「価値を生み出す仕組みを作る」こと。安定運用は運用リーダーの役割であり、デジタル経営支援者は外部専門家として位置づけられる（PGL p.9）。","pgl_page":9},{"id":5,"tag":"主担当の考え方","q":"デジタル経営を支える人材の役割で「主担当」として適切な記述はどれか。","choices":["デジタル経営戦略プロセスは、開発リーダーと運用リーダーによって「主担当」を担うものとされる。","デジタル経営実行計画プロセスは、開発リーダーのみによって「主担当」を担う。","セキュリティは、デジタル経営推進者、開発リーダー、運用リーダーで「主担当」を担う。","提供価値検証プロセスは、経営者とデジタル経営推進者のみで「主担当」を担う。"],"answer":2,"explain":"セキュリティは複数の役割が連携して主担当を担うプロセスであり、デジタル経営推進者・開発リーダー・運用リーダーの3者が該当する（PGL p.10）。","pgl_page":10},{"id":6,"tag":"実行基準と判断基準","q":"PGL4.0が説く「実行基準」と「判断基準」の考え方について、適切な記述はどれか。","choices":["実行基準はデジタル経営プロセス（デジタル経営成長サイクル,価値実現サイクル）とデジタル経営共通基盤の進め方に適用され、判断基準も同様にすべてのプロセスへ等しく適用されるものにあたるとされるものとされる。","実行基準は、デジタル経営で注力すべき重要な活動領域での「進め方（プロセス）」を表すものであり、判断基準は各プロセスの実行における判断の視点としての「基本原則」である。","判断基準はデジタル経営プロセス（デジタル経営成長サイクル,価値実現サイクル）にのみ適用され、デジタル経営共通基盤には適用されない。","実行基準と判断基準はいずれもデジタル経営共通基盤にのみ適用され、デジタル経営成長サイクル・価値実現サイクルの各プロセスには適用されない。"],"answer":1,"explain":"実行基準＝重要領域の「進め方」、判断基準＝各プロセス実行時の「基本原則」という役割の違いが核心。判断基準はデジタル経営共通基盤を含む横断的な共通プロセスに適用される（PGL p.13）。","pgl_page":13},{"id":7,"tag":"C1・C2・CBの関係性","q":"デジタル経営プロセスの関係性（デジタル経営成長サイクル、価値実現サイクル、デジタル経営共通基盤）について、適切な記述はどれか。","choices":["デジタル経営プロセスはデジタル経営成長サイクル、価値実現サイクル、デジタル経営共通基盤からなるプロセスであり、相互に強い関係を持つ実践プロセスである。","デジタル経営共通基盤は価値実現サイクルにのみ適用されるプロセスであり、デジタル経営成長サイクル側では機能しない。","デジタル経営プロセスはデジタル経営成長サイクル、価値実現サイクル、デジタル経営共通基盤からなるプロセスであり、デジタル経営共通基盤は両サイクルとは独立した監視プロセスとして機能する。","デジタル経営成長サイクルと価値実現サイクルは互いに無関係に並行実施されるサイクルであり、経営方針の決定と実行の順序性は特に定められていない。"],"answer":0,"explain":"デジタル経営成長サイクル・価値実現サイクル・デジタル経営共通基盤は相互に強い関係を持つ実践プロセス。デジタル経営共通基盤は独立した監視プロセスではなく、デジタル経営成長サイクル・価値実現サイクル双方に関わる横断的な基盤として機能する（PGL p.14）。","pgl_page":14},{"id":8,"tag":"顧客価値創造の原則","q":"デジタル経営の基本原則のうち「顧客価値創造の原則」として、最も適切な記述はどれか。","choices":["自社のビジョンやパーパスから顧客価値を発想し、実現すべき具体的な価値とその実現方法を設計する。顧客価値をイノベーションや業務改革の核に据える。","リーダーが明確なメッセージを発信し理解と共感を高めることで、良好なユーザーエクスペリエンスを提供し続けることが、顧客価値創造の原則そのものである。","戦略に沿った価値実現が計画通り進んでいるかをモニターし、タイムリーに可視化することが顧客価値創造の原則の中心である。","仕事のあらゆる場面でデータ収集・可視化・評価を意識し、データを重視した判断をする体制に変えることが顧客価値創造の原則である。"],"answer":0,"explain":"イは利用者動機付けの原則、ウはモニタリングに関する原則、エはデータ重視の原則の説明であり、いずれも顧客価値創造の原則とは異なる（PGL p.24）。","pgl_page":24},{"id":9,"tag":"利用者動機付けの原則","q":"「利用者動機付けの原則」の実践方法として、適切なものはどれか。","choices":["利用者との関係を深める必要はなく、システムの機能さえ充実していれば利用者の動機づけは自然に達成される。","動機づけは初期導入時の一度きりの説明会で完結するものであり、継続的な働きかけは不要である。","良好なユーザーエクスペリエンスを提供し続けることで、ユーザーの参画意識を高めていく。","利用者の動機づけは経営者のみが担う役割であり、現場のリーダー層が関与する必要はない。"],"answer":2,"explain":"利用者動機付けの原則は、良好なユーザーエクスペリエンスを継続的に提供し、参画意識を高めていくもの。機能の充実だけで自動的に達成されるものではない（PGL p.25）。","pgl_page":25},{"id":10,"tag":"デジタル経営サイクルの特徴","q":"デジタル経営サイクルの特徴に関する記述として、適切なものはどれか。","choices":["仮説検証は不確実性を嫌う手法であるため、デジタル経営サイクルでは可能な限り仮説検証を用いず、事前に確定した計画のみに基づいて進める。","デジタル経営サイクルは一度計画を策定した後は見直しを行わず、当初の計画通りに実行を完了させることを重視する。","計画情報と実行情報は紙ベースで管理することが推奨され、IT化による差異分析の迅速化は想定されていない。","経営戦略に沿ってIT資源を調達する際にPoC（Proof of Concept）を用いることで、より要求に整合した調達を可能にする。"],"answer":3,"explain":"デジタル経営サイクルは仮説検証によって環境変化を正確に把握し判断を迅速化する仕組み。PoCの活用もその一環であり、計画情報・実行情報のIT化による迅速な差異分析も重視される（PGL p.14）。","pgl_page":14},{"id":11,"tag":"デジタル経営プロセスの全体構成","q":"デジタル経営プロセスの全体構成において、デジタル経営共通基盤が果たす機能として、適切な記述はどれか。","choices":["デジタル経営共通基盤は、デジタル経営成長サイクル・価値実現サイクルそれぞれのプロセスを横断的に支え、両サイクルの実践を下支えする機能を担う。","デジタル経営共通基盤は、デジタル経営成長サイクル・価値実現サイクルの実行結果を事後的に監査するためだけの独立機関にあたるものと考えられている。","デジタル経営共通基盤は、価値実現サイクルにのみ適用される機能であり、デジタル経営成長サイクル側では機能しない。","デジタル経営共通基盤は、経営者のみが利用する意思決定支援ツールを指す用語である。"],"answer":0,"explain":"デジタル経営共通基盤はデジタル経営成長サイクル・価値実現サイクルを横断的に支え、両サイクルの実践を下支えする機能を担う。独立監査機関や価値実現サイクル限定の機能ではない（PGL p.14）。","pgl_page":14},{"id":12,"tag":"C1・C2サイクルの繰り返し","q":"デジタル経営成長サイクル（デジタル経営成長サイクル）と価値実現サイクル（価値実現サイクル）の実施サイクルについて、適切な記述はどれか。","choices":["デジタル経営成長サイクルと価値実現サイクルは同一のタイミングで同時に開始・終了する必要がある。","デジタル経営成長サイクルが完了した後は価値実現サイクルを実施する必要はなく、デジタル経営成長サイクルの結果のみで経営が完結する方針をとることを基本とする。","デジタル経営成長サイクルは経営環境の変化を捉えるタイミングで機能し、価値実現サイクルはデジタル経営成長サイクルの方針のもとで継続的に繰り返し実施される。","デジタル経営成長サイクルは毎日実施され、価値実現サイクルは期変わりなど長期的なタイミングでのみ実施される。"],"answer":2,"explain":"デジタル経営成長サイクルは経営環境変化のタイミングで機能し、価値実現サイクルはその方針のもとで継続的に繰り返される。両者は逆の頻度関係にある（PGL p.14）。","pgl_page":14},{"id":13,"tag":"デジタル成熟度の位置づけ","q":"デジタル経営成熟度を評価する目的について、適切な記述はどれか。","choices":["成熟度評価はIT部門の業務効率のみを測定するための指標である。","自社のデジタル経営の到達度を可視化し、次に目指すべき成長の方向性を明確にするために評価する。","成熟度評価は他社との優劣を競うことのみを目的として実施する。","成熟度評価は一度実施すれば十分であり、継続的に見直す必要は特にないものとされることとなっている。"],"answer":1,"explain":"成熟度評価は自社の到達度を可視化し、次に目指すべき成長の方向性を明確にすることを目的とする（PGL p.17）。","pgl_page":17},{"id":14,"tag":"サイクルと成熟度の連動","q":"デジタル経営成長サイクルとデジタル経営成熟度の連動について、適切な記述はどれか。","choices":["成熟度は一度目標を設定すると、デジタル経営成長サイクル・価値実現サイクルのサイクルを経ずに自動的に向上することを基本とする。","成熟度は価値実現サイクルの取り組みとは無関係に、デジタル経営共通基盤の評価のみによって決定される。","デジタル経営成長サイクルで設定した成熟度目標に向けて、価値実現サイクルでの取り組みを通じて段階的に成熟度の向上を図っていく。","成熟度目標はデジタル経営成長サイクルでは扱わず、価値実現サイクルで独自に設定される。"],"answer":2,"explain":"デジタル経営成長サイクルで設定した成熟度目標に向け、価値実現サイクルでの取り組みを通じて段階的に成熟度の向上を図っていく連動関係がある（PGL p.17）。","pgl_page":17},{"id":15,"tag":"デジタル経営人材のミッション","q":"デジタル経営推進者に求められるミッションとして、適切な記述はどれか。","choices":["システムの詳細設計やプログラムの開発作業そのものを、専任の担当者として一手に引き受ける役割である。","経営者の変革の意思を組織全体に伝え、ステークホルダーの理解と協力を得ながら変革を推進していく。","経営者に代わって最終的な投資判断を単独で決定する。","IT資源の調達交渉のみを専任で担当し、他の役割には関与しないこととされている。"],"answer":1,"explain":"デジタル経営推進者は、経営者の変革の意思を組織へ伝え、ステークホルダーの理解と協力を得ながら変革を推進するミッションを担う（PGL p.9）。","pgl_page":9},{"id":16,"tag":"デジタル経営プロセス：総合","q":"デジタル経営プロセス全体の考え方を踏まえた記述として、適切なものはどれか。","choices":["経営環境の変化を捉える変革・成長プロセスを起点に、デジタル経営成長サイクルから価値実現サイクルへと経営方針が引き継がれ、デジタル経営共通基盤がそれを横断的に支える構造になっている。","デジタル経営プロセスは価値実現サイクルのみによって完結するものであり、デジタル経営成長サイクルやデジタル経営共通基盤についてはあくまで補助的な位置づけにとどまるものとされる。","デジタル経営プロセスにおいて、デジタル経営共通基盤はデジタル経営成長サイクルにのみ関係し、価値実現サイクルの実践には関与しない。","デジタル経営プロセスは、経営環境が変化しない限り変革・成長プロセスを実施する必要がない一方、デジタル経営共通基盤は毎日更新される。"],"answer":0,"explain":"変革・成長プロセスを起点にデジタル経営成長サイクルから価値実現サイクルへ経営方針が引き継がれ、デジタル経営共通基盤がそれを横断的に支えるという全体構造の理解がポイント（PGL p.14）。","pgl_page":14},{"id":17,"tag":"デジタル技術の進化","q":"デジタル技術の進化と企業の対応に関する記述として、適切なものはどれか。","choices":["デジタル技術は業務効率化のための道具であり、イノベーションの実現とは切り離して考えるべきものと考えられている。","デジタル技術の導入は他社が十分に成熟させてから追随することが、最も確実な進め方である。","デジタル技術の進化は自社の競争力とは無関係であるため、既存の仕組みを維持することが望ましい。","デジタル技術は効率化の手段にとどまらず、イノベーションの実現にも利活用して競争力を高めていく必要がある。"],"answer":3,"explain":"デジタル技術は効率化のツールにとどまらず、イノベーションの実現に利活用して競争力を高めることが求められる（PGL p.2）。","pgl_page":2},{"id":18,"tag":"経営環境の変化","q":"経営環境の変化に対する企業の姿勢について、適切な記述はどれか。","choices":["経営環境は景気や社会情勢、技術トレンド等により常に変化しており、企業はその変化を認識し対応することが重要である。","経営環境の変化は一時的な現象にすぎないため、企業は既定の方針を変えずに対応すべきであると位置づけられるものとされる。","経営環境の変化への対応は大企業に限られる課題であり、中小企業では考慮する必要がない。","経営環境の変化については、外部の調査機関の分析結果を待ってから対応を検討すればよい。"],"answer":0,"explain":"経営環境は常に大きく変化しており、企業はこの変化を常に認識して対応することが重要とされる（PGL p.4）。","pgl_page":4},{"id":19,"tag":"経営理念と行動理念","q":"経営理念と行動理念の関係について、適切な記述はどれか。","choices":["経営理念と行動理念は同一のものを指す用語であり、区別して策定する必要はない。","経営理念に向けて「如何に行動するか」を示すものが行動理念であり、そこから具体的な行動指針が作られる。","行動理念を先に策定し、その内容にあわせて経営理念を後から定義していく順序が基本にあたるものと考えられている。","行動理念は各事業部が個別に定めるものであり、全社で共有する必要はない。"],"answer":1,"explain":"経営理念に向けて「如何に行動するか」を示すのが行動理念であり、そこから具体的な行動指針が作られていく（PGL p.7）。","pgl_page":7},{"id":20,"tag":"ITCの位置づけ","q":"デジタル経営におけるITコーディネータの位置づけについて、適切な記述はどれか。","choices":["ITコーディネータは企業内の専任職位であり、外部から関与することは想定されていない。","デジタル経営支援者として企業のデジタル経営について熟知し、助言や支援を行う役割を担う。","ITコーディネータはシステム開発の実装作業を主たる業務とする技術専門職である。","ITコーディネータは経営者に代わって意思決定を行う権限を持つ役割として位置づけられる。"],"answer":1,"explain":"ITCはデジタル経営支援者として、デジタル経営について熟知し助言や支援を行う役割を担う（PGL p.11）。","pgl_page":11}]},{"id":"part2","title":"第2部","sub":"デジタル経営成長サイクル（P1・P2）","questions":[{"id":1,"tag":"P1の位置づけ","q":"変革・成長プロセスのデジタル経営成長サイクルにおける機能について、適切な記述はどれか。","choices":["変革・成長プロセスは、経営環境の変化を的確に捉えて変革構想書と成熟度目標を作成し、その成果物を価値実現サイクルの各プロセスへ直接アウトプットし、デジタル経営戦略プロセスを経由せず実行段階に引き継がれる。","変革・成長プロセスは、価値実現サイクルと常時同期して機能し、日々の業務運用のたびに変革構想書を更新するプロセスである。","変革・成長プロセスは、IT開発・導入プロセスの進捗管理を主たる機能とするプロセスである。","変革・成長プロセスは、デジタル経営戦略プロセスからの評価報告をもとに外部環境の変化を分析し、変革構想書と目標とする成熟度をまとめてデジタル経営戦略プロセスへアウトプットする。"],"answer":3,"explain":"変革・成長プロセスはデジタル経営戦略プロセスからの評価報告をもとに外部環境を分析し、変革構想書と成熟度目標を作成してデジタル経営戦略プロセスへアウトプットする。価値実現サイクルへの直接アウトプットやIT開発・導入プロセスの進捗管理は誤り（PGL p.31）。","pgl_page":31},{"id":2,"tag":"P1-1とP1-2の連携","q":"変革認識アクティビティとデジタル経営成熟度レベルの向上アクティビティの連携について、適切な記述はどれか。","choices":["変革認識アクティビティは、価値実現サイクルの評価結果を直接受け取り、その内容にもとづいて成熟度レベルを機械的に確定する役割を担う。","変革認識アクティビティと成熟度レベルの向上アクティビティは、それぞれ独立したタスクとして並行に実施され、互いの成果物を参照し合うことはない。","変革認識アクティビティが外部環境分析と変革構想書の作成を行い、その結果を受けて成熟度レベルの向上アクティビティが目標レベルを検討・確定し、デジタル経営戦略プロセスへ提供する。","デジタル経営成熟度レベルの向上アクティビティが先に目標とする成熟度レベルを設定し、その確定した目標をもとに変革認識アクティビティが外部環境分析と変革構想書の作成を行う。"],"answer":2,"explain":"変革認識アクティビティ（変革認識）→デジタル経営成熟度レベルの向上アクティビティ（成熟度レベル確定）の順序性がポイント。変革認識アクティビティの変革構想書を受けてデジタル経営成熟度レベルの向上アクティビティが成熟度目標を検討する（PGL p.31）。","pgl_page":31},{"id":3,"tag":"変革構想書と事業ビジョン","q":"「変革構想書」と「事業ビジョン」の関係について、最も適切な記述はどれか。","choices":["変革構想書はCSFそのものを指し示すための用語であり、事業ビジョンについてはKGIとKPIを組み合わせて構成された指標の集合体として定義されるものであるとされている。","変革構想書と事業ビジョンは同一のものを指す用語であり、PGL4.0において明確な区別はされていない。","変革構想書は中期経営計画によって定義されたビジョンを指し、事業ビジョンは経営者の「思い」を反映したグランドデザインを指す。","変革構想書は経営者の事業ドメインへの「思い」を反映したグランドデザインであり、事業ビジョンは変革構想書を踏まえ、CSFやビジネスモデル等を加えて具体化したものである。"],"answer":3,"explain":"変革構想書＝経営者の「思い」のグランドデザイン、事業ビジョン＝それを具体化したもの、という段階の違いが核心（PGL p.34）。","pgl_page":34},{"id":4,"tag":"ケーススタディ","q":"中堅製造業のF社では、社長が「デジタル化はやるべきだと思うが、何から手をつければよいか分からない」と悩んでいる。デジタル経営支援者としてより適切なアドバイスはどれか。","choices":["業界の成功事例のIT導入手順を確認し、それをそのまま自社の進め方として踏襲することを優先することを基本方針として助言する。","社長がまだ判断に迷っている段階においては、デジタル経営推進者に対して検討の一切をすべて一任することとし、社長自身は事後の承認に回るよう助言する。","社長自身の事業ドメインへの「思い」を丁寧に引き出し、ステークホルダーが共感できる明瞭なストーリーとして変革構想にまとめることから始めるよう助言する。","まずはIT投資の予算枠を確保したうえで、ベンダー選定を優先して進めるよう助言する。"],"answer":2,"explain":"段階を飛ばした対処（予算確保優先、丸投げ等）は不適切。まず経営者の思いを引き出し、共感を得るプロセスを重視するのが基本原則（PGL p.34）。","pgl_page":34},{"id":5,"tag":"変革の気付きの共有","q":"変革の必要性についての気付きの扱いに関して、適切な記述はどれか。","choices":["変革の気付きの共有は、変革構想書がすべて完成した後の段階で初めて実施すれば十分である。","経営者だけが気付いた変革の必要性は、機密情報として一部の役員のみに留め、現場には展開しない方が組織の混乱を防げる。","経営者及び現場からの気付きを可視化し組織内で共有することで、変革の必要性への理解と共感につなげる工夫が重要である。","変革の気付きは定量データのみで示すべきであり、現場からの定性的な声は変革構想に反映すべきではない。"],"answer":2,"explain":"経営者・現場双方の気付きを可視化・共有し、理解と共感につなげることが重視される（PGL p.34）。","pgl_page":34},{"id":6,"tag":"成熟度の評価視点","q":"デジタル経営成熟度の4つの評価視点の分類について、適切な記述はどれか。","choices":["デジタル経営全体に関わる視点は「デジタル経営マインド」と「デジタル経営ガバナンス」であり、価値実現サイクルの視点は「デジタル利活用」と「デジタル環境」である。","4つの評価視点はすべて価値実現サイクルに固有のものであり、デジタル経営成長サイクル側では評価の対象にならない。","デジタル経営全体に関わる視点は「デジタル利活用」と「デジタル環境」であり、価値実現サイクルの視点は「デジタル経営マインド」と「デジタル経営ガバナンス」である。","デジタル経営成熟度は「デジタル経営マインド」と「デジタル経営ガバナンス」の2つの視点のみで評価される仕組みである。"],"answer":0,"explain":"デジタル経営全体＝マインド・ガバナンス／価値実現サイクル＝利活用・環境、という対応関係を正確に覚えることが重要（PGL p.36）。","pgl_page":36},{"id":7,"tag":"成熟度レベル３","q":"企業組織として目指す最初のデジタル経営成熟度の段階はレベル３であるとされる。レベル３に相当する記述はどれか。","choices":["組織全体で統合が進み、日常業務の遂行に不可欠な存在として定着している段階である。","定量的に管理されたKPI等の指標を用いて、データを活用した意思決定と継続的な改善を実現している段階である。","革新そのものが組織文化の一部となり、業界全体のイノベーションを牽引する立場にある段階である。","部分的ではあるが基本的な枠組みが形成され、再現性と理解度が向上してきている段階である。"],"answer":3,"explain":"レベル３＝「部分的な枠組み形成、再現性・理解度の向上」の段階であり、企業が最初に目指す到達点とされる（PGL p.37）。","pgl_page":37},{"id":8,"tag":"P1⇔P2のループ","q":"変革・成長プロセスとデジタル経営戦略プロセスのフィードバックループについて、適切な記述はどれか。","choices":["価値実現サイクルの実行結果は、デジタル経営戦略プロセスを経由せず、変革・成長プロセスへ直接フィードバックされる。","変革・成長プロセスはデジタル経営戦略プロセスの実行計画そのものを直接作成し、デジタル経営戦略プロセス側は結果の評価のみを担当する。","デジタル経営戦略プロセスは、価値実現サイクル実施後の評価結果を受け、達成度を評価したうえで、次期構想策定の材料として変革・成長プロセスへ提供する。","変革・成長プロセスとデジタル経営戦略プロセスは互いに独立して機能し、価値実現サイクルの実行結果はデジタル経営共通基盤にのみフィードバックされることとなっている。"],"answer":2,"explain":"価値実現サイクルの実行結果はデジタル経営戦略プロセスで評価され、次期構想の材料として変革・成長プロセスへ提供される、というフィードバックの流れが基本（PGL p.33）。","pgl_page":33},{"id":9,"tag":"ケーススタディ","q":"小売業のG社は、初めてデジタル経営の取り組みに着手する段階にあり、社長は「うちはレベル５（最高レベル）をいきなり目指したい」と発言している。デジタル経営支援者としてより適切なアドバイスはどれか。","choices":["レベルの設定は価値実現サイクルの実行後に事後的に決めればよいため、現段階での検討は不要である旨を伝える。","現状の内部・外部環境と組織の実態を踏まえて変革構想を整理したうえで、無理のない段階的な目標レベルを検討・確定するよう助言する。","社長の意向を尊重し、レベル5相当の体制構築とそれに見合う投資計画をただちに策定するよう支援する。","成熟度レベルの決定は経営者が独断で行うべき事項であり、デジタル経営支援者としては関与を控えるべきである旨を旨をあらためて伝える。"],"answer":1,"explain":"段階を飛ばしていきなり最高レベルを目指すのは不適切。変革認識アクティビティ→デジタル経営成熟度レベルの向上アクティビティの手順を踏み、段階的な目標設定を支援するのが基本（PGL p.38）。","pgl_page":38},{"id":10,"tag":"総合問題","q":"変革・成長プロセスの位置づけとデジタル経営成長サイクルの特徴に関する記述のうち、適切なものはどれか。","choices":["変革・成長プロセスは、提供価値検証プロセスの代替となる機能にあたるものであり、価値実現サイクルにおける一連の評価そのものを担う存在としてあらためて位置づけられている。","変革・成長プロセスは、期変わりなど経営環境の変化を捉えるタイミングで機能し、変革構想書と成熟度目標をデジタル経営戦略プロセスへアウトプットすることで、デジタル経営成長サイクルから価値実現サイクルへの経営方針の伝達を担う起点となる。","変革・成長プロセスは、IT開発・導入プロセスと直接連携し、開発作業の進捗そのものを管理する役割を持つ。","変革・成長プロセスは、価値実現サイクルと常時同期して機能するプロセスであり、日々の業務運用のたびに変革構想書を更新する方針をとる。"],"answer":1,"explain":"変革・成長プロセスは常時稼働するプロセスではなく、経営環境変化のタイミングで機能し、デジタル経営成長サイクルから価値実現サイクルへの橋渡し役を担う点が要点（PGL p.31）。","pgl_page":31},{"id":11,"tag":"P2の位置づけ","q":"デジタル経営戦略プロセスの位置づけについて、適切な記述はどれか。","choices":["デジタル経営戦略プロセスは、価値実現サイクルにおける実行の結果を直接的に評価したうえで、次期に向けた新たな変革構想書を作成していくプロセスにあたるものとされている。","デジタル経営戦略プロセスは、デジタル経営共通基盤に属するプロセスであり、デジタル経営成長サイクルには含まれない。","デジタル経営戦略プロセスは、IT資源の調達交渉のみを行うプロセスであり、戦略の策定は含まない。","デジタル経営戦略プロセスは、変革・成長プロセスで示された変革構想書と成熟度目標を受けて、事業ビジョンやビジネスモデル等の具体的な戦略を策定するプロセスである。"],"answer":3,"explain":"デジタル経営戦略プロセスは変革・成長プロセスからの変革構想書・成熟度目標を受け、事業ビジョンやビジネスモデル等の戦略を具体化するプロセス（PGL p.40）。","pgl_page":40},{"id":12,"tag":"デジタル経営戦略成果物","q":"デジタル経営戦略プロセスの主な成果物として、適切な記述はどれか。","choices":["事業ビジョン、ビジネスモデル、CSF、KGI・KPI等を盛り込んだデジタル経営戦略が成果物となる。","デジタル経営戦略プロセスの成果物は、IT資源の詳細な調達契約書そのものである。","デジタル経営戦略プロセスの成果物は、日々の業務オペレーションマニュアルである。","デジタル経営戦略プロセスの成果物は、開発したシステムのテスト計画書と、その実施結果をまとめたテスト結果報告書にあたるものと考えられている。"],"answer":0,"explain":"デジタル経営戦略プロセスの成果物は、事業ビジョン・ビジネスモデル・CSF・KGI/KPI等を盛り込んだデジタル経営戦略である（PGL p.49）。","pgl_page":49},{"id":13,"tag":"仮説検証（P2）","q":"デジタル経営戦略プロセスにおける仮説検証の考え方として、適切な記述はどれか。","choices":["不確実性の高い外部環境を踏まえ、戦略の妥当性について仮説を立てて検証し、必要に応じて戦略を見直していく。","仮説検証は一度実施すれば十分であり、戦略策定プロセス内で繰り返す必要はない。","仮説検証はIT開発・導入プロセスでのみ実施され、デジタル経営戦略プロセスの段階では用いない。","仮説検証は一定の失敗のリスクを伴う進め方であるため、デジタル経営戦略プロセスの段階においては極力避けるべき手法であるとされる。"],"answer":0,"explain":"不確実性の高い環境下では、戦略の妥当性について仮説検証を繰り返し、必要に応じて見直していく姿勢が重要（PGL p.42）。","pgl_page":42},{"id":14,"tag":"あるべき姿構築手順","q":"デジタル経営戦略プロセスにおける「あるべき姿」の構築手順として、適切な記述はどれか。","choices":["変革構想書を踏まえ、事業ビジョンやビジネスモデル、CSF等を段階的に具体化しながら、あるべき姿を構築していく。","あるべき姿については、現状の業務プロセスを大きく変えずそのまま踏襲していくことによって構築されるものであるとされる。","あるべき姿は経営者の関与なしに、デジタル経営推進者が単独で確定する。","あるべき姿の構築は、IT開発・導入プロセスが完了した後に初めて着手する方針をとる。"],"answer":0,"explain":"変革構想書を踏まえ、事業ビジョン・ビジネスモデル・CSF等を段階的に具体化しながらあるべき姿を構築していく（PGL p.45）。","pgl_page":45},{"id":15,"tag":"デジタル経営戦略の留意点","q":"デジタル経営戦略プロセスを進める際の留意点として、適切な記述はどれか。","choices":["外部環境の変化を踏まえつつ、経営者の「思い」との整合性を確認しながら戦略を具体化していく。","戦略策定においては、外部環境よりも社内の既存システムの制約を優先する方針をとることを基本とする。","一度策定した戦略は環境変化に関わらず変更せず、当初計画どおりに進める。","戦略の具体化はIT部門のみで完結させ、経営者の関与は最小限にとどめる。"],"answer":0,"explain":"外部環境の変化を踏まえ、経営者の「思い」との整合性を確認しながら戦略を具体化していくことが留意点（PGL p.45）。","pgl_page":45},{"id":16,"tag":"KGIとKPI","q":"デジタル経営戦略におけるKGIとKPIの関係について、適切な記述はどれか。","choices":["KGIとKPIは同一の指標を指す用語であり、使い分ける必要はない。","KGIは最終的に達成すべき目標指標であり、KPIはその達成過程を測る中間的な指標として設定される。","KGIは現場の担当者が設定し、KPIについては経営者が設定するという形で、両者の役割分担が定められている。","KPIを先に確定し、その積み上げによって事後的にKGIを決定する。"],"answer":1,"explain":"KGIは最終目標指標、KPIはその達成過程を測る中間指標という位置づけの違いがポイント（PGL p.48）。","pgl_page":48},{"id":17,"tag":"デジタル経営戦略：総合","q":"デジタル経営戦略プロセスの全体像に関する記述として、適切なものはどれか。","choices":["デジタル経営戦略プロセスの段階においては、外部環境の分析や仮説検証といった作業はいっさい行わず、もっぱら社内にこれまで蓄積されてきた各種資料の整理と体裁を整える作業のみを行うものとされている。","変革・成長プロセスからの変革構想書と成熟度目標を受け、外部環境分析や仮説検証を経て、事業ビジョン・ビジネスモデル・CSF・KGI・KPI等からなるデジタル経営戦略を策定し、価値実現サイクルへと引き継ぐ。","デジタル経営戦略プロセスで策定した戦略は、価値実現サイクルに引き継がれることなく、デジタル経営戦略プロセス内で完結して評価される。","デジタル経営戦略プロセスは、変革・成長プロセスの内容とは無関係に、独自の観点から戦略を一から策定するプロセスにあたるものとされる。"],"answer":1,"explain":"変革・成長プロセスからのインプットを受け、外部環境分析・仮説検証を経て戦略を策定し、価値実現サイクルへ引き継ぐという一連の流れが全体像（PGL p.40）。","pgl_page":40},{"id":18,"tag":"変革の可能性の発見","q":"変革認識アクティビティにおける「変革の可能性の発見」に関する記述として、適切なものはどれか。","choices":["変革の可能性の検討は、変革構想書を作成し終えたあとの段階で行うものである。","外部環境の変化の認識を踏まえ、自社にとっての変革の可能性を発見していく活動である。","変革の可能性は経営者個人の直感のみで判断されるものであり、分析の対象とはならない。","変革の可能性の発見は、価値実現サイクルの実行結果からのみ導かれるものである。"],"answer":1,"explain":"外部環境の変化の認識を踏まえたうえで、自社にとっての変革の可能性を発見していく活動として位置づけられる（PGL p.33）。","pgl_page":33},{"id":19,"tag":"現状分析と戦略評価","q":"変革認識アクティビティにおける「現状分析と戦略評価」の位置づけとして、適切な記述はどれか。","choices":["現状分析は外部環境のみを対象とし、自社の内部については分析の対象としない。","現状分析と戦略評価は、変革への意思決定を終えたあとに実施される確認作業であるとされる。","変革認識の出発点として自社の現状を分析し、これまでの戦略を評価することから始まる。","戦略評価は財務指標のみを用いて行われ、それ以外の観点は考慮されない。"],"answer":2,"explain":"変革認識アクティビティは現状分析と戦略評価から始まり、そこから外部環境の変化の認識へと進んでいく（PGL p.33）。","pgl_page":33},{"id":20,"tag":"データ・IT利活用方針","q":"デジタル経営戦略プロセスにおける「データ・IT利活用方針の定義」に関する記述として、適切なものはどれか。","choices":["データやITの利活用方針は各事業部が個別に定めるものであり、全社方針としてはまとめない。","データ・IT利活用方針はIT部門のみで検討する技術方針であり、経営戦略とは切り離される。","データ・IT利活用方針は、IT開発・導入の作業がすべて完了したあとに定義する。","あるべき姿の構築を踏まえ、データとITをどのように利活用するかの全社方針を定義する。"],"answer":3,"explain":"あるべき姿の構築を踏まえ、データとITの利活用に関する全社方針を定義することが求められる（PGL p.46）。","pgl_page":46}]},{"id":"part3","title":"第3部","sub":"価値実現サイクル（C2・P3〜P6）","questions":[{"id":1,"tag":"C2の位置づけ","q":"価値実現サイクルの位置づけについて、適切な記述はどれか。","choices":["価値実現サイクルは、経営環境の変化を捉えて変革構想書を作成するプロセスであり、デジタル経営成長サイクルの一部として位置づけられると定義されている。","価値実現サイクルは、デジタル経営共通基盤に含まれる一つの機能にあたるものであり、デジタル経営成長サイクルの側で示された経営方針とは完全に切り離された、まったく独立した形で実施されるものであると位置づけられている。","価値実現サイクルは、デジタル経営成長サイクルで示された経営方針に基づき、デジタル経営実行計画プロセスからIT開発・導入、価値提供・運用、提供価値検証までを継続的に繰り返すサイクルである。","価値実現サイクルは一度実施すれば完了し、以降繰り返す必要のない単発のプロセスである。"],"answer":2,"explain":"価値実現サイクルはデジタル経営成長サイクルの経営方針を受け、デジタル経営実行計画プロセス〜提供価値検証プロセスを継続的に繰り返すサイクル。変革構想書は変革・成長プロセスの役割であり、デジタル経営共通基盤の一機能でもない（PGL p.53）。","pgl_page":53},{"id":2,"tag":"仮説検証の適用分野","q":"価値実現サイクルにおける仮説検証の適用分野として、適切な記述はどれか。","choices":["仮説検証については確実性の高い定型的な業務にのみ適用することとし、不確実性の高い事項に対しては用いないものとされる。","仮説検証は開発が完了した後の運用段階に限定して適用される。","仮説検証はデジタル経営戦略プロセス（デジタル経営戦略プロセス）でのみ適用され、価値実現サイクルでは用いない。","要件定義や開発方針の妥当性、提供後の価値創出効果など、価値実現サイクルの各段階で不確実性の高い事項について仮説検証を適用する。"],"answer":3,"explain":"仮説検証は価値実現サイクルの各段階（要件定義、開発方針、価値創出効果等）で不確実性の高い事項に適用される（PGL p.53）。","pgl_page":53},{"id":3,"tag":"C2の登場人物と役割","q":"価値実現サイクルに関わる登場人物とその役割について、適切な記述はどれか。","choices":["経営者・デジタル経営推進者・開発リーダー・運用リーダーなどが、それぞれの専門性を活かしながら連携して価値実現サイクルを推進する。","価値実現サイクルに関わる登場人物は外部のITベンダーに限定されるものであり、社内の人材がその推進に関与することは特に想定されていない。","価値実現サイクルはIT開発リーダーのみが単独で担当し、経営者や運用リーダーは関与しないこととされている。","価値実現サイクルでは役割分担を定めず、その都度担当者を無作為に割り振る。"],"answer":0,"explain":"価値実現サイクルは経営者・推進者・開発リーダー・運用リーダー等が連携して推進する。単独担当や外部限定という記述は誤り（PGL p.53）。","pgl_page":53},{"id":4,"tag":"C2プロセスの関係","q":"価値実現サイクル内の各プロセスの関係について、適切な記述はどれか。","choices":["提供価値検証プロセスにおける評価の結果はデジタル経営実行計画プロセスの側へフィードバックされることがなく、それぞれのプロセスが分断されたまま、全体として一連のサイクルとしては機能しない構造になっているものとされている。","IT開発・導入プロセスと価値提供・運用プロセスは同時並行で完全に独立して実施され、成果物の受け渡しは発生しない。","デジタル経営実行計画プロセスで策定した計画に基づき、IT開発・導入、価値提供・運用を経て、提供価値検証プロセスで評価し、次のサイクルに活かす。","デジタル経営実行計画プロセスから提供価値検証プロセスまでの各プロセスは独立しており、前段階の成果物を後段階が参照する必要は特にないものとされる。"],"answer":2,"explain":"デジタル経営実行計画プロセスの計画をもとにIT開発・導入プロセス→価値提供・運用プロセスと進み、提供価値検証プロセスでの評価結果を次のサイクルに活かす、という一連の連携関係が価値実現サイクルの基本構造（PGL p.53）。","pgl_page":53},{"id":5,"tag":"P3の機能","q":"デジタル経営実行計画プロセスの機能について、適切な記述はどれか。","choices":["デジタル経営実行計画プロセスは、デジタル経営共通基盤に属し、デジタル経営成長サイクル・価値実現サイクルいずれにも含まれない。","デジタル経営戦略プロセスで策定した戦略を踏まえ、実行計画・体制・スケジュール・予算等を具体化し、IT開発・導入プロセスへつなげる。","デジタル経営実行計画プロセスは、システムの詳細設計とプログラム開発そのものを担当するプロセスである。","デジタル経営実行計画プロセスは、提供価値検証プロセスの評価結果を受けて、次期の経営戦略を策定するプロセスにあたるものとされるものとされる。"],"answer":1,"explain":"デジタル経営実行計画プロセスはデジタル経営戦略プロセスの戦略を踏まえ、実行計画・体制・スケジュール・予算等を具体化しIT開発・導入プロセスへつなげる役割を担う（PGL p.62）。","pgl_page":62},{"id":6,"tag":"データとIT資源調査","q":"デジタル経営実行計画プロセスにおけるデータとIT資源の調査に関する記述として、適切なものはどれか。","choices":["実行計画の具体化にあたり、既存のデータ資産やIT資源の現状を調査し、必要な調達・整備の方針を検討する。","データとIT資源の調査は、システム稼働開始後に初めて実施すればよい。","IT資源の調査は、デジタル経営共通基盤のセキュリティ担当のみが行う業務にあたるものと考えられている。","既存のデータ資産の調査は不要であり、新規調達のみを検討すればよい。"],"answer":0,"explain":"実行計画の具体化段階で既存データ資産・IT資源の現状を調査し、調達・整備方針を検討することが求められる（PGL p.65）。","pgl_page":65},{"id":7,"tag":"P3タスクの成果物","q":"デジタル経営実行計画プロセスの主な成果物として、適切な記述はどれか。","choices":["デジタル経営実行計画プロセスの成果物は、システムのセキュリティ監査報告書である。","デジタル経営実行計画プロセスの成果物は、提供価値検証プロセスの評価レポートにあたるものと考えられている。","実行計画書、体制図、スケジュール、予算計画等、実行段階に向けた具体的な計画がまとめられる。","デジタル経営実行計画プロセスの成果物は、システム稼働後に用いられるヘルプデスクの対応マニュアルにあたるものとされる。"],"answer":2,"explain":"デジタル経営実行計画プロセスの成果物は実行計画書・体制図・スケジュール・予算計画等、実行段階に向けた具体的な計画（PGL p.63）。","pgl_page":63},{"id":8,"tag":"RFPの記述","q":"IT資源調達に用いるRFP（提案依頼書）の記述について、適切な記述はどれか。","choices":["RFPには具体的な要件をあえて記載することなく、提案するベンダー側の自由な発想のみに委ねるものとされる。","RFPは調達価格のみを記載すればよく、機能要件や納期は含める必要がない。","RFPの作成はITベンダーが行うものであり、発注者側は関与しない。","要件や調達条件を明確に記述し、提案するITベンダーが的確な提案を作成できるようにする。"],"answer":3,"explain":"RFPは要件や調達条件を明確に記述し、ベンダーが的確な提案を作成できるようにすることが目的（PGL p.69）。","pgl_page":69},{"id":9,"tag":"IT導入・利活用開始","q":"IT開発・導入プロセスにおけるシステムの導入・利活用開始に関する記述として、適切なものはどれか。","choices":["システムの導入・利活用開始は、開発完了後に思いつきで対応すれば十分である。","開発したシステムを円滑に利用開始できるよう、利用者への教育やマニュアル整備等の準備を計画的に進める。","導入・利活用開始の準備は、IT開発リーダーのみが単独で判断し、利用者への説明は不要である。","利用者への教育やマニュアル整備は、価値提供・運用プロセスが完了した後に検討すれば足りるものとされる。"],"answer":1,"explain":"円滑な利用開始のため、利用者教育やマニュアル整備等の準備を計画的に進めることが重要（PGL p.80）。","pgl_page":80},{"id":10,"tag":"P5の位置づけ","q":"価値提供・運用プロセスの位置づけについて、適切な記述はどれか。","choices":["IT開発・導入プロセスで構築したシステムを用いて、実際に価値を提供し安定的に運用していくプロセスである。","価値提供・運用プロセスは、提供価値検証プロセスにおける検証がすべて完了した後になって初めて開始されるプロセスにあたるものとされる。","価値提供・運用プロセスは、システムの要件定義の工程から設計の工程までを一貫して担当するプロセスであるとされる。","価値提供・運用プロセスは、経営戦略の策定を行うプロセスであり、デジタル経営戦略プロセスの一部として位置づけられる。"],"answer":0,"explain":"価値提供・運用プロセスはIT開発・導入プロセスで構築したシステムを用いて実際に価値を提供し、安定的に運用していくプロセス（PGL p.81）。","pgl_page":81},{"id":11,"tag":"P5-1とP5-2の役割の違い","q":"価値提供・運用プロセスにおけるIT利活用による価値の提供アクティビティとITサービス運用アクティビティの役割の違いについて、適切な記述はどれか。","choices":["IT利活用による価値の提供アクティビティとITサービス運用アクティビティについてはまったく同一の業務内容を指し示すものであり、両者をあえて区別して取り扱う意味は特にないものとされている。","IT利活用による価値の提供アクティビティはセキュリティ管理を専門に担当し、ITサービス運用アクティビティは価値提供業務を担当する方針をとる。","IT利活用による価値の提供アクティビティはシステム開発を担当し、ITサービス運用アクティビティは経営戦略の見直しを担当する。","IT利活用による価値の提供アクティビティは価値を安定的に提供する業務を担い、ITサービス運用アクティビティはシステムやサービスレベルを維持・管理する業務を担うという役割の違いがある。"],"answer":3,"explain":"IT利活用による価値の提供アクティビティ＝価値提供業務、ITサービス運用アクティビティ＝システム・サービスレベルの維持管理、という役割の違いがポイント（PGL p.81）。","pgl_page":81},{"id":12,"tag":"ヘルプデスクとSLM","q":"価値提供・運用プロセスにおけるヘルプデスクとSLM（サービスレベルマネジメント）の役割として、適切な記述はどれか。","choices":["ヘルプデスクとSLMについては、いずれもIT開発・導入プロセスの側に属する業務として位置づけられているものとされる。","SLMは利用者からの問い合わせ対応そのものを指す用語であり、ヘルプデスクとは同義であると考えられている。","ヘルプデスクは利用者からの問い合わせや障害対応の窓口を担い、SLMはサービスレベルを維持・改善するための管理活動を担う。","ヘルプデスクは経営者からの問い合わせのみに対応する窓口であり、一般利用者は対象外である。"],"answer":2,"explain":"ヘルプデスク＝問い合わせ・障害対応窓口、SLM＝サービスレベルの維持・改善管理という役割の違いがポイント（PGL p.85）。","pgl_page":85},{"id":13,"tag":"提供価値検証プロセス（P6）の位置づけ","q":"提供価値検証プロセスの位置づけについて、適切な記述はどれか。","choices":["提供価値検証プロセスは、IT開発・導入プロセスの開発作業そのものを担当するプロセスにあたるものとされることとなっている。","提供価値検証プロセスの評価結果は、以降のサイクルには一切反映されず、記録として保管するのみである。","価値提供・運用プロセスを通じて実現された価値を評価し、その結果を次のデジタル経営成長サイクル・価値実現サイクルサイクルの改善に活かす。","提供価値検証プロセスは、デジタル経営戦略プロセスの一部として、戦略策定と同時に実施される。"],"answer":2,"explain":"提供価値検証プロセスは価値提供・運用プロセスで実現された価値を評価し、その結果を次のデジタル経営成長サイクル・価値実現サイクルサイクルの改善に活かす役割を担う（PGL p.90）。","pgl_page":90},{"id":14,"tag":"C2の総合問題","q":"価値実現サイクル全体の考え方を踏まえた記述として、適切なものはどれか。","choices":["価値実現サイクルはIT開発・導入プロセスと価値提供・運用プロセスのみで構成され、デジタル経営実行計画プロセスと提供価値検証プロセスは含まれない。","価値実現サイクルに含まれる各プロセスは一度実施すればそれで完了するものであり、そこで得られた結果が次のサイクルへ反映されることはないものとされている。","価値実現サイクルはデジタル経営成長サイクルとは独立して機能し、デジタル経営成長サイクルからの経営方針を踏まえる必要はない。","デジタル経営実行計画プロセスで計画を具体化し、IT開発・導入プロセスで開発・導入を行い、価値提供・運用プロセスで価値を提供・運用し、提供価値検証プロセスで検証した結果を次のサイクルに活かすという一連の流れで構成される。"],"answer":3,"explain":"デジタル経営実行計画プロセス（計画）→IT開発・導入プロセス（開発・導入）→価値提供・運用プロセス（提供・運用）→提供価値検証プロセス（検証）という一連の流れで構成され、結果を次サイクルへ活かす（PGL p.53）。","pgl_page":53},{"id":15,"tag":"目標の理解と詳細化","q":"デジタル経営実行計画プロセスにおける「目標の理解と詳細化」に関する記述として、適切なものはどれか。","choices":["目標の詳細化は開発作業の完了後に行えばよく、計画の初期段階では不要なものと考えられている。","目標の理解は開発ベンダーの役割であり、発注者側で詳細化する必要はない。","目標は経営戦略に記載された内容をそのまま用い、詳細化の作業は行わない。","デジタル経営戦略で示された目標を理解し、実行計画に落とし込める粒度まで詳細化していく。"],"answer":3,"explain":"戦略で示された目標を理解し、実行計画に落とし込める粒度まで詳細化することが計画づくりの出発点となる（PGL p.63）。","pgl_page":63},{"id":16,"tag":"現状業務・システムの調査","q":"デジタル経営実行計画プロセスにおける現状業務・システムの調査・分析に関する記述として、適切なものはどれか。","choices":["現状調査は外部ベンダーが単独で実施し、社内の関係者は関与しない。","現状の業務フローやシステム概要、課題等を調査・分析し、実行計画づくりの前提情報として整理する。","現状の調査はシステム稼働後に実施すれば足り、計画段階では不要である。","現状の調査における対象はシステムのみに限定することとし、業務プロセスについては調査の対象に含めないものとされる。"],"answer":1,"explain":"現状業務フロー・システム概要・課題等を調査・分析し、実行計画づくりの前提情報として整理することが求められる（PGL p.64）。","pgl_page":64},{"id":17,"tag":"戦略実現案の検討","q":"デジタル経営実行計画プロセスにおける「戦略実現案の検討」に関する記述として、適切なものはどれか。","choices":["施策の候補はすべて同時に実行することとし、優先順位や投資対効果は検討しない。","施策の一覧を整理し、優先順位や投資対効果を評価したうえで実現案を検討する。","戦略実現案の検討はIT部門のみで完結させ、経営層は関与しない。","戦略実現案は前年度の施策をそのまま踏襲することを基本とする。"],"answer":1,"explain":"施策を一覧化し、優先順位や投資対効果を評価したうえで戦略実現案を検討することが求められる（PGL p.66）。","pgl_page":66},{"id":18,"tag":"IT資源の検証・受入れ","q":"IT開発アクティビティにおけるIT資源の検証・受入れに関する記述として、適切なものはどれか。","choices":["調達したIT資源が要件を満たしているかを検証したうえで受入れを行う。","IT資源の検証は稼働開始後に利用者からの申告があった場合にのみ実施する。","IT資源の検証は開発ベンダーの社内工程であり、発注者は関与しない。","調達したIT資源は納品された時点で受入完了とし、検証の工程は設けない。"],"answer":0,"explain":"調達したIT資源が要件を満たしているかを検証したうえで受入れを行うことが求められる（PGL p.76）。","pgl_page":76},{"id":19,"tag":"価値提供結果の可視化","q":"IT利活用による価値の提供アクティビティにおける「価値提供結果の可視化」に関する記述として、適切なものはどれか。","choices":["収集した価値提供状況の情報を整理し、報告書や改善案・アクションプランとしてまとめる。","価値提供結果の可視化は、次期の予算編成時にまとめて実施すればよい。","価値提供の結果は担当者が把握していれば足り、報告書としてまとめる必要はないものとされる。","可視化の対象は財務数値のみとし、業務上の変化は対象に含めない。"],"answer":0,"explain":"収集した価値提供状況の情報を整理し、報告書や改善案・アクションプランとしてまとめることが求められる（PGL p.84）。","pgl_page":84},{"id":20,"tag":"P6のフィードバック先","q":"提供価値検証プロセスにおけるフィードバックに関する記述として、適切なものはどれか。","choices":["検証結果のフィードバック先はデジタル経営共通基盤のみに限られるものであり、他のプロセスへ渡されることはないものとされる。","検証結果は価値実現サイクルの各プロセスと、デジタル経営実行計画プロセスの双方へフィードバックされる。","検証結果は記録として保管するのみで、他プロセスへのフィードバックは行われない。","検証結果のフィードバックは経営者への口頭報告のみで完結する。"],"answer":1,"explain":"検証結果は価値実現サイクル各プロセスへのフィードバックと、デジタル経営実行計画プロセスへのフィードバックの双方が行われる（PGL p.93）。","pgl_page":93},{"id":21,"tag":"実行計画の体制設計","q":"デジタル経営実行計画プロセスにおける推進体制の設計に関する記述として、適切なものはどれか。","choices":["推進に必要な役割と責任を明確にし、社内外の関係者を含めた実行体制を計画段階で設計する。","推進体制の設計については開発作業に着手したあとの段階で、必要に応じて行えばよいものとされる。","推進体制は開発ベンダーの側が用意するものであり、発注者が設計に関与することはない。","推進体制については特に文書化せず、担当者間の口頭での合意にとどめておくものとされる。"],"answer":0,"explain":"必要な役割と責任を明確にし、社内外の関係者を含めた実行体制を計画段階で設計しておくことが求められる（PGL p.62）。","pgl_page":62},{"id":22,"tag":"スケジュールの策定","q":"デジタル経営実行計画プロセスにおけるスケジュール策定に関する記述として、適切なものはどれか。","choices":["スケジュールは開発ベンダーが提示した内容をそのまま採用することとし、発注者側での検討は行わない。","施策の優先順位や依存関係を踏まえ、マイルストーンを設定したスケジュールを策定する。","スケジュールについては大枠の完了時期のみを定め、途中の中間目標は設定しないものとされる。","スケジュールは一度策定した後は、進捗の状況にかかわらず変更しないことが原則とされている。"],"answer":1,"explain":"施策の優先順位や依存関係を踏まえたうえで、マイルストーンを設定したスケジュールを策定することが求められる（PGL p.62）。","pgl_page":62},{"id":23,"tag":"IT投資対効果の評価","q":"デジタル経営実行計画プロセスにおけるIT投資対効果の評価に関する記述として、適切なものはどれか。","choices":["投資対効果の評価は投資の実行が完了したあとに、実績値のみを用いて行うものとされる。","投資対効果の評価対象は削減できるコストのみに限られ、創出される価値は含まれない。","投資額と期待される効果を見積もり、投資の妥当性を評価したうえで意思決定につなげる。","投資対効果の評価はIT部門の内部で完結させ、経営層への報告は行わないものとされる。"],"answer":2,"explain":"投資額と期待される効果を見積もり、投資の妥当性を評価したうえで意思決定につなげることが求められる（PGL p.70）。","pgl_page":70},{"id":24,"tag":"リスクと前提条件の整理","q":"デジタル経営実行計画プロセスにおけるリスクと前提条件の整理に関する記述として、適切なものはどれか。","choices":["リスクの洗い出しは実際に問題が顕在化した段階で、その都度行えばよいものとされる。","計画の段階でのリスク整理は不確実性が高いため、あえて実施しない方針が推奨されているとされる。","前提条件については関係者の暗黙の了解にとどめ、あえて文書化しないものとされている。","計画の前提となる条件と想定されるリスクを洗い出し、対応方針とあわせて計画に織り込む。"],"answer":3,"explain":"計画の前提条件と想定されるリスクを洗い出し、対応方針とあわせて実行計画に織り込むことが求められる（PGL p.62）。","pgl_page":62},{"id":25,"tag":"調達方式の選定","q":"IT資源の調達方式の選定に関する記述として、適切なものはどれか。","choices":["自社開発・パッケージ導入・クラウドサービス利用等の選択肢を比較し、要件に適した方式を選定する。","調達方式は自社開発を原則とし、外部のサービスを利用する選択肢は検討の対象としない。","調達方式の選定については価格の比較のみによって決定し、要件との適合性までは考慮しないものとされる。","調達方式については開発ベンダーの提案をそのまま採用し、比較検討は行わないものとされる。"],"answer":0,"explain":"自社開発・パッケージ導入・クラウド利用等の選択肢を比較し、要件に適した調達方式を選定することが求められる（PGL p.69）。","pgl_page":69},{"id":26,"tag":"契約締結時の留意点","q":"IT資源の調達における契約締結時の留意点として、適切な記述はどれか。","choices":["契約内容の確認はベンダー側に任せ、発注者は署名のみを行えばよいものとされている。","作業範囲・成果物・検収条件・責任分担等を明確にしたうえで契約を締結する。","契約書には金額と納期のみを記載すればよく、成果物の内容は含めないものとされる。","契約の締結は開発作業がある程度進んだ段階で、事後的に行えばよいものとされる。"],"answer":1,"explain":"作業範囲・成果物・検収条件・責任分担等を明確にしたうえで契約を締結することが求められる（PGL p.75）。","pgl_page":75},{"id":27,"tag":"開発方式の選択","q":"IT開発アクティビティにおける開発方式の選択に関する記述として、適切なものはどれか。","choices":["開発方式は常にウォーターフォール型を採用することとし、他の方式は検討の対象としない。","開発方式の選択は開発ベンダーの裁量にすべて委ね、発注者は関与しないものとされている。","要件の確実性や変更の起こりやすさ等を踏まえ、対象に適した開発方式を選択する。","開発方式については開発作業に着手したあとで、状況に応じて随時変更していくものとされる。"],"answer":2,"explain":"要件の確実性や変更の起こりやすさ等を踏まえ、対象に適した開発方式を選択することが求められる（PGL p.73）。","pgl_page":73},{"id":28,"tag":"品質管理の考え方","q":"IT開発アクティビティにおける品質管理の考え方として、適切な記述はどれか。","choices":["品質の確認はシステムの稼働開始後に、利用者からの申告に基づいて行うものとされる。","品質管理は開発ベンダーの社内工程であり、発注者が関与することは想定されていない。","品質については納期を優先する場面では、確認の工程を省略することが認められている。","開発の各工程で品質基準を定めて確認を行い、後工程への不具合の持ち越しを防ぐ。"],"answer":3,"explain":"開発の各工程で品質基準を定めて確認を行い、後工程への不具合の持ち越しを防ぐことが品質管理の基本となる（PGL p.77）。","pgl_page":77},{"id":29,"tag":"移行計画","q":"IT導入アクティビティにおける移行計画に関する記述として、適切なものはどれか。","choices":["既存システムからのデータ移行や並行稼働の方式等を計画し、業務への影響を抑えた切替えを行う。","移行の作業は稼働開始日に一斉に実施することとし、事前の計画は特に必要ないものとされる。","データ移行については移行後に不整合が判明した時点で、個別に対応すればよいものとされる。","移行計画の策定はもっぱら開発ベンダーの担当であり、発注者側の業務部門は関与しないものとされる。"],"answer":0,"explain":"既存システムからのデータ移行や並行稼働の方式等を計画し、業務への影響を抑えた切替えを行うことが求められる（PGL p.79）。","pgl_page":79},{"id":30,"tag":"利用者教育","q":"IT導入アクティビティにおける利用者教育に関する記述として、適切なものはどれか。","choices":["利用者教育はシステムの操作方法のみを対象とし、業務の変更点は説明の対象に含めない。","対象となる利用者の役割に応じた教育内容を設計し、円滑な利用開始につなげる。","教育の実施は稼働開始後に、問い合わせが増えた段階で対応すればよいものとされる。","利用者教育については各利用部門の自主的な取り組みに委ね、計画には含めないものとされる。"],"answer":1,"explain":"対象となる利用者の役割に応じた教育内容を設計し、円滑な利用開始につなげることが求められる（PGL p.79）。","pgl_page":79},{"id":31,"tag":"稼働判定","q":"IT導入アクティビティにおける稼働判定に関する記述として、適切なものはどれか。","choices":["稼働の可否は当初予定していた稼働日を基準に判断し、準備状況は考慮しないものとされる。","稼働判定は開発ベンダーが単独で行うものであり、発注者側の確認は不要とされている。","あらかじめ定めた判定基準に照らして準備状況を確認し、稼働の可否を判断する。","稼働判定については明確な基準を設けず、関係者の総意によって都度決定するものとされる。"],"answer":2,"explain":"あらかじめ定めた判定基準に照らして準備状況を確認し、稼働の可否を判断することが求められる（PGL p.80）。","pgl_page":80},{"id":32,"tag":"業務手順の整備","q":"IT利活用による価値の提供アクティビティにおける業務手順の整備に関する記述として、適切なものはどれか。","choices":["業務手順は各担当者がそれぞれの経験に基づいて運用し、文書化は行わないものとされる。","業務手順の整備はシステムの稼働から一定期間が経過したあとで着手すればよいとされる。","業務手順については開発ベンダーが作成したマニュアルをそのまま用いれば足りるとされる。","新しい業務の進め方を手順として整備し、担当者が同じ品質で業務を遂行できるようにする。"],"answer":3,"explain":"新しい業務の進め方を手順として整備し、担当者が同じ品質で業務を遂行できるようにすることが求められる（PGL p.82）。","pgl_page":82},{"id":33,"tag":"要員計画と教育プラン","q":"IT利活用による価値の提供アクティビティにおける要員計画に関する記述として、適切なものはどれか。","choices":["価値提供業務に必要な要員数とスキルを見積もり、要員計画と教育プランを整える。","要員計画については実際に人手が不足した段階で、その都度対応すればよいものとされる。","必要なスキルの検討は行わず、既存の担当者をそのまま配置すれば足りるものとされる。","要員の計画と教育のプランは人事部門が単独で決定し、業務部門は関与しないものとされる。"],"answer":0,"explain":"価値提供業務に必要な要員数とスキルを見積もり、要員計画と教育プランを整えることが求められる（PGL p.82）。","pgl_page":82},{"id":34,"tag":"価値提供状況の情報収集","q":"IT利活用による価値の提供アクティビティにおける情報収集に関する記述として、適切なものはどれか。","choices":["情報の収集対象は財務データのみに限定し、利用者からの声は対象に含めないものとされる。","価値提供の状況を示す定量・定性の情報を収集し、蓄積して評価に活用できるようにする。","収集した情報は担当者が個人的に保管しておけばよく、組織的な蓄積は行わないものとされる。","情報の収集は年度末にまとめて実施することとし、日常的な収集は行わないものとされる。"],"answer":1,"explain":"価値提供の状況を示す定量・定性の情報を収集し、蓄積して評価に活用できるようにすることが求められる（PGL p.83）。","pgl_page":83},{"id":35,"tag":"サービスレベルの合意","q":"ITサービス運用アクティビティにおけるサービスレベルの合意に関する記述として、適切なものはどれか。","choices":["サービスレベルは運用を担当する部門が単独で決定し、利用部門との合意は不要とされる。","サービスレベルについては具体的な水準を定めず、努力目標として扱うものとされている。","提供するITサービスの水準を利用部門と合意し、その内容を明確にして運用する。","サービスレベルの合意はシステムの稼働から数年が経過したあとで行えばよいとされる。"],"answer":2,"explain":"提供するITサービスの水準を利用部門と合意し、その内容を明確にしたうえで運用することが求められる（PGL p.84）。","pgl_page":84},{"id":36,"tag":"インシデント管理","q":"ITサービス運用アクティビティにおけるインシデント管理に関する記述として、適切なものはどれか。","choices":["インシデントの対応は担当者がその都度判断して進めることとし、手順は定めないものとされる。","インシデントの記録は復旧が完了した時点で破棄し、蓄積は行わないものとされている。","インシデント管理はシステム部門の内部で完結させ、利用部門への連絡は行わないとされる。","発生した障害等を記録して対応状況を管理し、サービスの早期復旧と再発防止につなげる。"],"answer":3,"explain":"発生した障害等を記録して対応状況を管理し、サービスの早期復旧と再発防止につなげることが求められる（PGL p.87）。","pgl_page":87},{"id":37,"tag":"システム監査の目的","q":"ITサービス運用アクティビティにおけるシステム監査の目的として、適切な記述はどれか。","choices":["ITシステムの信頼性や安全性、効率性を独立した立場から点検し、改善につなげる。","システム監査は担当者の勤務評価を行うことを主たる目的として実施されるものである。","システム監査の目的は監査報告書という文書を作成すること自体にあるものとされる。","システム監査はもっぱら外部への説明のためだけに行われるものであり、社内の改善には用いないとされる。"],"answer":0,"explain":"システム監査はITシステムの信頼性・安全性・効率性を独立した立場から点検し、改善につなげることを目的とする（PGL p.88）。","pgl_page":88},{"id":38,"tag":"評価指標の測定","q":"提供価値検証プロセスにおける評価指標の測定に関する記述として、適切なものはどれか。","choices":["評価指標の測定は担当者の主観的な印象に基づいて行うことが基本とされている。","あらかじめ設定した評価指標に基づき、実績値を測定して目標との差異を確認する。","測定した実績値は記録として保管するのみとし、目標との比較は行わないものとされる。","評価指標の測定はプロジェクトの終了時に一度だけ実施すれば足りるものとされる。"],"answer":1,"explain":"あらかじめ設定した評価指標に基づき実績値を測定し、目標との差異を確認することが求められる（PGL p.65）。","pgl_page":65},{"id":39,"tag":"検証結果の報告","q":"提供価値検証プロセスにおける検証結果の報告に関する記述として、適切なものはどれか。","choices":["検証の結果は担当者の間で共有するにとどめ、経営層への報告は行わないものとされる。","報告の内容は良好な結果のみを取り上げ、課題については触れないものとされている。","検証結果を整理して経営層や関係者へ報告し、次の意思決定の材料として提供する。","検証結果の報告は次年度の予算編成の時期にまとめて行えばよいものとされる。"],"answer":2,"explain":"検証結果を整理して経営層や関係者へ報告し、次の意思決定の材料として提供することが求められる（PGL p.92）。","pgl_page":92},{"id":40,"tag":"改善策の立案","q":"提供価値検証プロセスにおける改善策の立案に関する記述として、適切なものはどれか。","choices":["改善策の立案は差異が大きい場合に限り、小さな差異については対応しないものとされる。","改善策については現場の担当者が個別に判断して実施し、計画には反映しないものとされる。","改善策の検討は次回の検証の時期まで待ってから、まとめて着手すればよいものとされる。","検証で明らかになった課題の要因を分析し、次のサイクルにつなげる改善策を立案する。"],"answer":3,"explain":"検証で明らかになった課題の要因を分析し、次のサイクルにつなげる改善策を立案することが求められる（PGL p.92）。","pgl_page":92}]},{"id":"part4","title":"第4部","sub":"デジタル経営共通基盤（CB）","questions":[{"id":1,"tag":"CBの位置づけ","q":"デジタル経営共通基盤の位置づけについて、適切な記述はどれか。","choices":["デジタル経営共通基盤は、IT開発・導入プロセスの別名であり、独立した基盤ではない。","デジタル経営共通基盤は、価値実現サイクルにのみ関係する機能であり、デジタル経営成長サイクル側の活動には関与しない。","デジタル経営共通基盤は、デジタル経営成長サイクル・価値実現サイクルの各プロセスを横断的に支える基盤であり、サイクルマネジメント・コミュニケーション・モニタリング・セキュリティ・組織学習等で構成される。","デジタル経営共通基盤は、デジタル経営成長サイクル・価値実現サイクルの各サイクルとは完全に独立した形で実施される監査専門の機能にあたるものであり、日常的な業務に対する支援は行わないものと位置づけられている。"],"answer":2,"explain":"デジタル経営共通基盤はデジタル経営成長サイクル・価値実現サイクルを横断的に支える基盤であり、サイクルマネジメント・コミュニケーション・モニタリング・セキュリティ・組織学習等で構成される（PGL p.95）。","pgl_page":95},{"id":2,"tag":"サイクルマネジメント（CB-1）","q":"サイクルマネジメント「サイクルマネジメント」の役割について、適切な記述はどれか。","choices":["デジタル経営成長サイクル・価値実現サイクルの各プロセスが計画通りに進行しているかを管理し、必要に応じて計画の見直しや調整を行う。","サイクルマネジメントは、デジタル経営成長サイクル・価値実現サイクルのいずれのプロセスにも関与しない独立した機能として位置づけられる。","サイクルマネジメントは、システムのセキュリティ対策のみを担当する機能である。","サイクルマネジメントは、組織学習の仕組みづくりのみを担当する機能である。"],"answer":0,"explain":"サイクルマネジメントはデジタル経営成長サイクル・価値実現サイクルの進行状況を管理し、必要に応じて計画の見直し・調整を行う機能（PGL p.100）。","pgl_page":100},{"id":3,"tag":"コミュニケーションの言葉定義（CB-2）","q":"コミュニケーション「コミュニケーション」における言葉の定義の重要性について、適切な記述はどれか。","choices":["経営者・現場・ITベンダー等、立場の異なるステークホルダー間で用語の解釈がずれないよう、共通の言葉の定義を整えることが重要である。","言葉の定義は専門用語に限られ、一般的な業務用語では特に統一の必要はない。","言葉の定義については、もっぱらITベンダーの内部においてのみ統一しておけばよいものであり、発注者の側とあらためて共有する必要はないものと考えられている。","言葉の定義は一度統一すれば、プロジェクトの進行に応じて見直す必要はない。"],"answer":0,"explain":"立場の異なるステークホルダー間で用語の解釈がずれないよう共通の言葉の定義を整えることが重要（PGL p.104）。","pgl_page":104},{"id":4,"tag":"コミュニケーション計画（CB-2）","q":"コミュニケーション「コミュニケーション」におけるコミュニケーション計画の考え方として、適切な記述はどれか。","choices":["コミュニケーション計画は経営者向けの報告のみを対象とし、現場との情報共有は対象外であると位置づけられる。","コミュニケーションは都度の判断に任せ、事前の計画は不要である。","コミュニケーション計画は一度作成すれば、プロジェクトの状況変化に関わらず変更しない。","誰に、何を、いつ、どのような手段で伝えるかをあらかじめ計画し、関係者間の情報共有を円滑にする。"],"answer":3,"explain":"誰に・何を・いつ・どのような手段で伝えるかをあらかじめ計画することが情報共有を円滑にする基本（PGL p.104）。","pgl_page":104},{"id":5,"tag":"コミュニケーションの4象限（CB-2）","q":"コミュニケーション「コミュニケーション」における「コミュニケーションの4象限」の考え方として、適切な記述はどれか。","choices":["コミュニケーションの4象限は、経営者・現場・ベンダー・顧客の4者を指す用語にあたるものとされるものとされる。","コミュニケーションの4象限は、報告書の書式を4種類に統一するための分類である。","情報の重要度や緊急度など複数の軸で整理し、状況に応じて適切なコミュニケーション手段や頻度を使い分ける。","コミュニケーションの4象限は、プロジェクトの4つの完了条件を指す用語である。"],"answer":2,"explain":"情報の重要度・緊急度等の軸で整理し、状況に応じて手段や頻度を使い分ける考え方が4象限の趣旨（PGL p.106）。","pgl_page":106},{"id":6,"tag":"モニタリングの位置づけ（CB-3）","q":"モニタリング＆コントロール「モニタリング」の位置づけについて、適切な記述はどれか。","choices":["デジタル経営成長サイクル・価値実現サイクルの各プロセスの実行状況やKPIの達成状況を継続的に把握し、経営判断に必要な情報を提供する。","モニタリングは、IT開発・導入プロセスの技術的な検証のみを対象とする機能であると定義されている。","モニタリングは、経営者向けの機能ではなく、現場担当者のみが利用する機能である。","モニタリングは、プロジェクト完了後に一度だけ実施すれば十分な機能である。"],"answer":0,"explain":"モニタリングはデジタル経営成長サイクル・価値実現サイクルの実行状況・KPI達成状況を継続的に把握し、経営判断に必要な情報を提供する機能（PGL p.109）。","pgl_page":109},{"id":7,"tag":"モニタリングの役割（CB-3）","q":"モニタリング＆コントロール「モニタリング」の役割として、適切な記述はどれか。","choices":["モニタリングの役割は、過去の実績を記録として保管することのみである。","モニタリングにおいては、計画との差異が生じた場合であっても関係者への共有までは行わず、記録として残すことにとどめるものとされる。","計画と実績の差異を可視化し、タイムリーに関係者へ共有することで、早期の意思決定と軌道修正を支援する。","モニタリングは、経営者による最終的な意思決定を代行する役割を担う。"],"answer":2,"explain":"計画と実績の差異を可視化しタイムリーに共有することで、早期の意思決定・軌道修正を支援するのがモニタリングの役割（PGL p.109）。","pgl_page":109},{"id":8,"tag":"モニタリングのタイプ（CB-3）","q":"モニタリング＆コントロール「モニタリング」におけるモニタリングのタイプについて、適切な記述はどれか。","choices":["モニタリングのタイプは1種類のみであり、対象や目的に関わらず同一の方法で実施されるものとされる。","モニタリングのタイプは、セキュリティ対策の種類のみを指す用語である。","モニタリングのタイプは、組織学習の進め方の分類を指す用語である。","進捗モニタリングや品質モニタリングなど、対象や目的に応じて複数のタイプが使い分けられる。"],"answer":3,"explain":"進捗・品質等、対象や目的に応じて複数のモニタリングのタイプが使い分けられる（PGL p.111）。","pgl_page":111},{"id":9,"tag":"モニタリングの分析・評価（CB-3）","q":"モニタリング＆コントロール「モニタリング」における分析・評価の考え方として、適切な記述はどれか。","choices":["モニタリングを通じて収集したデータについては、特段の分析を行うことなくそのまま保管しておけば十分なものと考えられている。","差異の原因分析は、プロジェクト完了後に一度だけ実施すればよい。","収集したデータをもとに計画との差異を分析し、その原因を評価したうえで、必要な対応策の検討につなげる。","モニタリングの分析・評価は、システム部門のみが行う技術的な作業である。"],"answer":2,"explain":"収集データをもとに差異を分析し原因を評価したうえで、対応策の検討につなげることが分析・評価の目的（PGL p.111）。","pgl_page":111},{"id":10,"tag":"セキュリティの位置づけ（CB-4）","q":"セキュリティ「セキュリティ」の位置づけについて、適切な記述はどれか。","choices":["セキュリティは、IT開発・導入プロセスが完了した後にのみ検討すればよい機能にあたるものとされるものとされる。","デジタル経営成長サイクル・価値実現サイクルの各プロセスを通じて、情報資産を脅威から保護し、安全にデジタル経営を推進するための基盤機能である。","セキュリティは、経営者の意思決定には関与せず、IT部門のみが扱う技術的な機能である。","セキュリティは、価値提供・運用プロセスにのみ関係し、他のプロセスとは無関係である。"],"answer":1,"explain":"セキュリティはデジタル経営成長サイクル・価値実現サイクルの各プロセスを通じて情報資産を保護し、安全にデジタル経営を推進する基盤機能（PGL p.113）。","pgl_page":113},{"id":11,"tag":"セキュリティの役割（CB-4）","q":"セキュリティ「セキュリティ」の役割として、適切な記述はどれか。","choices":["情報資産の機密性・完全性・可用性を維持し、事業継続に必要な安全性を確保する。","セキュリティの役割は、システムのデザインを美しく整えることである。","セキュリティの役割は、開発コストを最小化することのみである。","セキュリティの役割は、利用者の操作性を最優先に高めることのみに限られるものとされる。"],"answer":0,"explain":"セキュリティの役割は、情報資産の機密性・完全性・可用性を維持し事業継続に必要な安全性を確保すること（PGL p.113）。","pgl_page":113},{"id":12,"tag":"セキュリティの共有（CB-4）","q":"セキュリティ「セキュリティ」に関する社内での共有のあり方について、適切な記述はどれか。","choices":["セキュリティに関する情報については、もっぱらIT部門の内部のみで完結させることとし、経営者への共有までは不要なものと考えられている。","セキュリティに関する方針やリスクについて、経営者を含む関係者間で共通認識を持てるよう情報を共有する。","セキュリティリスクは機密性が高いため、関係者間での共有自体を避けるべきである。","セキュリティ方針は一度策定すれば、以降は関係者へ周知する必要はない。"],"answer":1,"explain":"セキュリティ方針やリスクについて、経営者を含む関係者間で共通認識を持てるよう共有することが重要（PGL p.113）。","pgl_page":113},{"id":13,"tag":"セキュリティの脅威・脆弱性（CB-4）","q":"セキュリティ「セキュリティ」における脅威と脆弱性の考え方について、適切な記述はどれか。","choices":["脅威と脆弱性は同一の概念であり、区別して検討する必要はない。","脆弱性については一度洗い出しておけば固定的なものであり、その後の環境変化に応じた見直しまでは不要なものと考えられている。","脅威への対策は、脆弱性の把握を行わずに一般的な対策を講じれば十分である。","自社のシステムや業務プロセスに存在する脆弱性を把握し、それを狙う脅威を想定したうえで対策を講じる。"],"answer":3,"explain":"自社の脆弱性を把握し、それを狙う脅威を想定したうえで対策を講じることがセキュリティ対策の基本（PGL p.113）。","pgl_page":113},{"id":14,"tag":"組織学習の位置づけ（CB-5）","q":"組織学習「組織学習」の位置づけについて、適切な記述はどれか。","choices":["デジタル経営の取り組みを通じて得られた知見や経験を組織全体で蓄積・共有し、継続的な成長につなげる基盤機能である。","組織学習とは、個々人が自主的に行う自己研鑽のみを指し示すものであり、組織としての仕組みづくりとは無関係であると考えられている。","組織学習は、プロジェクト終了時に一度だけ実施する振り返り会のみを指す。","組織学習は、IT開発・導入プロセスの技術的な知識共有のみを対象とする。"],"answer":0,"explain":"組織学習は取り組みで得られた知見・経験を組織全体で蓄積・共有し、継続的な成長につなげる基盤機能（PGL p.118）。","pgl_page":118},{"id":15,"tag":"組織学習の成長サイクル（CB-5）","q":"組織学習「組織学習」における成長サイクルの考え方として、適切な記述はどれか。","choices":["組織学習は個人の学習にとどまり、組織としての循環的なプロセスにはならない。","組織学習の成長サイクルは、失敗事例を扱わず、成功事例のみを対象とする。","組織学習の成長サイクルについては、一度確立してしまえばその後の見直しを要しない固定的な仕組みにあたるものと考えられている。","取り組みの経験から学びを得て、それを組織のノウハウとして蓄積し、次の取り組みに活かしていく循環的なプロセスである。"],"answer":3,"explain":"経験から学びを得て組織のノウハウとして蓄積し、次の取り組みに活かす循環的なプロセスが組織学習の成長サイクル（PGL p.119）。","pgl_page":119},{"id":16,"tag":"CBのタスク構造","q":"デジタル経営共通基盤の各アクティビティが持つ基本的なタスク構造として、適切な記述はどれか。","choices":["対象範囲の設定のみを行い、実装や状況把握は各プロセスの裁量に委ねられる。","全体方式・ルールの設定、プロセスへの実装、実行状況把握の3つを繰り返す構造となっている。","各プロセスにおける実行状況の把握のみを繰り返し行っていくことによって、成熟度を段階的に高めていく構造となっている。","計画・実行・評価・改善の4段階を一度だけ実施して完了する構造となっている。"],"answer":1,"explain":"デジタル経営共通基盤の各アクティビティは「全体方式・ルールの設定」「プロセスへの実装」「実行状況把握」の3つを繰り返す構造を持つ（PGL p.97）。","pgl_page":97},{"id":17,"tag":"サイクルマネジメントとPM","q":"サイクルマネジメントとプロジェクトマネジメントの違いについて、適切な記述はどれか。","choices":["サイクルマネジメントはIT部門のみが扱い、プロジェクトマネジメントは経営層のみが扱う。","サイクルマネジメントとプロジェクトマネジメントは同一の概念であり、呼称が異なるだけである。","サイクルマネジメントは決められた期間内における特定の成果の達成に重点を置き、プロジェクトマネジメントについては組織全体の最適化に重点を置くという違いがある。","サイクルマネジメントは適用すべきプロセスとフローの最適化に重点を置き、プロジェクトマネジメントは決められた期間内に特定の結果を達成することに重点を置く。"],"answer":3,"explain":"サイクルマネジメントはプロセスとフローの最適化による全体最適、プロジェクトマネジメントは期間内の成果達成という重点の違いがある（PGL p.100）。","pgl_page":100},{"id":18,"tag":"パフォーマンス指標の確認","q":"モニタリング＆コントロールにおける「パフォーマンス指標の確認」に関する記述として、適切なものはどれか。","choices":["パフォーマンス指標の確認は、是正措置を講じたあとにのみ実施する。","パフォーマンス指標は一度設定すれば、以降の見直しは不要である。","モニタリングの前提として、確認すべきパフォーマンス指標を明確にしておく必要がある。","パフォーマンス指標は開発ベンダーが設定するものであり、発注者は関与しないものとされる。"],"answer":2,"explain":"モニタリングを行う前提として、確認すべきパフォーマンス指標を明確にしておくことが求められる（PGL p.109）。","pgl_page":109},{"id":19,"tag":"セキュリティレベル・指標","q":"セキュリティにおける「セキュリティレベル・指標の策定」に関する記述として、適切なものはどれか。","choices":["セキュリティのレベルについては業界の標準として示されているものをそのまま採用することとし、自社としての独自の目標設定は行わないものとされる。","セキュリティの目標レベルと評価指標を定義し、状況把握のためのデータ定義やアラート設定を行う。","セキュリティレベルの策定は外部の診断機関に一任し、社内では関与しない。","セキュリティ指標は事故が発生した時点で初めて策定すればよい。"],"answer":1,"explain":"セキュリティの目標レベルと評価指標を定義し、状況把握のためのデータ定義やアラート設定を行うことが求められる（PGL p.115）。","pgl_page":115},{"id":20,"tag":"組織学習の環境整備","q":"組織学習における「環境整備」に関する記述として、適切なものはどれか。","choices":["組織学習の環境整備は人材開発部門のみで完結させ、経営者は関与しないこととされている。","従業員の動機付けや働き方改革の推進、推進チームの形成等を経営者が主導して進める。","環境整備は短期の取り組みであり、数か月で完了させることが前提となる。","組織学習の環境整備は、成熟度目標を達成したあとに着手すればよい。"],"answer":1,"explain":"組織学習の環境整備は、従業員の動機付け・働き方改革の推進・推進チームの形成等を経営者が主導して進めるものとされる（PGL p.118）。","pgl_page":118}]},{"id":"applied","title":"応用問題","sub":"全範囲のケーススタディを横断演習","questions":[{"id":1,"tag":"全体共通｜契約と役割範囲","q":"支援契約の範囲を超える追加作業を、経営者から善意で次々と依頼されるようになった。デジタル経営支援者としてより適切な対応はどれか。","choices":["依頼内容と当初の支援目的との関係を確認し、必要に応じて範囲や条件を経営者と協議して合意し直す。","契約書に記載された作業のみを機械的にこなすこととし、範囲外の相談については一切応じない姿勢を貫く。","経営者との関係悪化を避けることを最優先し、範囲外であっても依頼された作業をすべて無償で引き受け続ける。","追加作業の要否についての判断は経営者に委ね、支援者の側からは範囲について何も言及しないまま作業を続ける。"],"answer":0,"explain":"依頼内容と支援目的の関係を確認し、範囲や条件を協議して合意し直すのが適切。無償で抱え込む対応も、機械的な線引きも、健全な支援関係を損なう（PGL p.11）。","pgl_page":11},{"id":2,"tag":"全体共通｜専門外領域への対応","q":"支援先から、自身の専門領域を大きく外れる高度な技術的判断を求められた。デジタル経営支援者としてより適切な対応はどれか。","choices":["支援者としての信頼を失うことを避けるため、確信が持てない場合でも自分の推測に基づいて判断を提示する。","自身の知見の限界を率直に伝えたうえで、必要な専門家の関与を提案し、判断材料が揃うよう調整する。","自身の専門外の領域であることを理由に、その論点そのものを検討の対象から外すよう経営者に対して促す。","判断はいったん保留したまま、支援先が自力で結論を出すのを待つこととし、以降その論点には一切触れない。"],"answer":1,"explain":"知見の限界を率直に伝え、専門家の関与を提案して判断材料を揃えるのが適切。推測での断定も、論点の切り捨ても支援先の不利益になる（PGL p.11）。","pgl_page":11},{"id":3,"tag":"全体共通｜複数部門の利害調整","q":"デジタル化の優先順位をめぐり、営業部門と製造部門がそれぞれ自部門の課題を最優先すべきと主張して調整がつかない。より適切な対応はどれか。","choices":["部門間の調整はそれぞれの責任者に委ねることとし、支援者は結論が出るまでのあいだ関与を控えて見守る。","経営戦略上の目標に照らして各課題の位置づけを整理し、全体最適の観点から優先順位を議論する場をつくる。","社内で特に発言力の強い部門の主張をそのまま採用することとし、早期に結論を出して検討を前に進める。","両部門から出された要望を機械的に均等分割し、それぞれに半分ずつ予算と工数を配分する案を提示することとする。"],"answer":1,"explain":"部分最適の主張を足し合わせるのではなく、経営戦略上の目標に照らして全体最適の観点から優先順位を議論することが基本姿勢（PGL p.24）。","pgl_page":24},{"id":4,"tag":"全体共通｜支援の引き際","q":"支援開始から二年が経過し、社内の推進体制が整い、担当者が自ら判断を下せるようになってきた。より適切な対応はどれか。","choices":["すでに自立できていると判断できるため、次回の打合せを最後として予告なく支援を打ち切ることとする。","支援先との関係が良好であることを踏まえ、これまでと同じ関与度合いを維持したまま契約を更新する。","担当者の成長は一時的なものであると考え、判断の妥当性を支援者が引き続きすべて確認する体制を維持する。","支援者の関与度合いを段階的に下げ、社内人材が自立して継続できる状態への移行を計画的に進める。"],"answer":3,"explain":"社内人材の自立が支援の最終ゴールであり、関与度合いを段階的に下げて移行を計画的に進めるのが適切。突然の打ち切りも過剰な関与継続も望ましくない（PGL p.11）。","pgl_page":11},{"id":5,"tag":"第1部｜デジタル経営構造","q":"老舗の卸売業I社は、長年の商習慣を前提とした業務プロセスのままデジタル化を検討している。デジタル経営支援者としてより適切な助言はどれか。","choices":["既存の商習慣を前提とするのではなく、あるべき姿から発想し、業務プロセス自体の見直しも視野に入れて検討するよう助言する。","既存の商習慣を変えることは混乱を招くため、現状の業務プロセスに合わせてシステム化することを基本方針として助言することとする。","商習慣の見直しは経営判断ではなく、システム部門の技術的な検討事項として進めるよう助言する。","デジタル化の検討は業務プロセスとは切り離し、まずIT資源の調達から着手するよう助言する。"],"answer":0,"explain":"現状の商習慣に合わせるのではなく、あるべき姿から発想し業務プロセス自体の見直しを視野に入れるのが基本姿勢（PGL p.14）。","pgl_page":14},{"id":6,"tag":"第1部｜企業文化形成","q":"J社では新しい行動指針を策定したが、現場からの反発が強く、浸透が進んでいない。デジタル経営支援者としてより適切な助言はどれか。","choices":["行動指針は経営トップダウンで決定された事項であるため、説明を省略して周知徹底のみを図るよう、これまでの方針どおり助言する。","現場の反発が収まるまで、行動指針の運用自体を一旦中止するよう助言する。","経営者自らが行動指針の背景にある「思い」を丁寧に説明し、現場との対話を重ねて理解と共感の醸成を図るよう助言する。","反発が強い部署については、行動指針の適用対象から除外するよう助言する。"],"answer":2,"explain":"経営者自らが「思い」を説明し、現場との対話を重ねて理解と共感を醸成することが浸透の基本アプローチ（PGL p.7）。","pgl_page":7},{"id":7,"tag":"第1部｜顧客価値創造の原則","q":"K社は自社の技術力を起点に新製品を企画したが、顧客への価値提案が曖昧なまま開発を進めようとしている。デジタル経営支援者としてより適切な助言はどれか。","choices":["自社の技術力を起点とした企画であるならば、顧客への価値提案については開発がすべて完了した後の段階で検討すれば十分であると判断して助言する。","顧客への価値提案よりも、開発スケジュールの遵守を優先するよう助言する。","顧客価値の検討はマーケティング部門の担当領域であり、開発チームは関与不要と助言する。","自社のビジョンやパーパスから顧客価値を発想し直し、実現すべき価値とその実現方法を明確にしたうえで開発を進めるよう助言する。"],"answer":3,"explain":"ビジョンやパーパスから顧客価値を発想し直し、価値とその実現方法を明確にしてから開発を進めるのが顧客価値創造の原則に沿った助言（PGL p.24）。","pgl_page":24},{"id":8,"tag":"第1部｜利用者動機付けの原則","q":"L社では新システム導入後、利用者からの利用率が低迷している。デジタル経営支援者としてより適切な助言はどれか。","choices":["利用率向上のため、利用を義務化する規則を設けるだけで十分であると助言する。","システムの機能をさらに追加すれば、利用者の動機づけは自動的に高まると助言する。","良好なユーザーエクスペリエンスの提供や継続的な働きかけを通じて、利用者の理解と参画意識を高めるよう助言する。","利用率の低迷はもっぱら利用者の側の意識に起因する問題であるため、提供側として特段の対応をとる必要はないと判断して助言する。"],"answer":2,"explain":"機能追加や義務化だけでなく、良好なUXの提供と継続的な働きかけによって理解・参画意識を高めることが本質的な対応（PGL p.25）。","pgl_page":25},{"id":9,"tag":"第1部｜社会価値","q":"食品加工業のA社では、収益改善を目的にデジタル化を検討しているが、環境負荷や地域雇用への影響は検討対象に含めていない。より適切な助言はどれか。","choices":["社会的な影響の検討はもっぱら自治体や業界団体が担う役割であるとして、自社では扱わないよう助言する。","社会的な影響への配慮については、当初の収益目標を達成したあとの段階であらためて検討すればよいと助言する。","収益の改善が第一の目的である以上、社会的な影響については検討の対象に含めなくてよいと助言する。","社会課題への貢献は他の価値創造にも影響を与えるため、社会価値の観点も含めて検討するよう助言する。"],"answer":3,"explain":"社会価値は顧客価値・事業価値・企業価値のすべてに影響を与える位置づけであり、収益目的の検討であっても含めて考えることが求められる（PGL p.6）。","pgl_page":6},{"id":10,"tag":"第1部｜エンゲージメント","q":"B社では従業員満足度調査の点数向上のみを目標に施策を打っているが、業務改善や価値創造にはつながっていない。より適切な助言はどれか。","choices":["調査の点数が着実に向上している以上、現行の施策はすでに成功しているとみなし、そのまま継続するよう、そのまま助言する。","点数の向上のみを目的とせず、経営理念や行動指針との結びつきを示し、価値創造につながる関与を高めるよう助言する。","満足度調査そのものをいったん取りやめ、以降は従業員の意識に関する測定を行わない方針とするよう助言する。","点数が特に低く出ている部署のみを対象として、個別の改善指導を行うことに専念するよう助言する。"],"answer":1,"explain":"エンゲージメントは満足度の点数そのものではなく、理念や行動指針と結びついた関与の深さが本質であり、価値創造につなげる視点が必要（PGL p.26）。","pgl_page":26},{"id":11,"tag":"第1部｜仮説検証の適用","q":"C社の経営者は「途中で方針が変わるのは計画の甘さの表れだ」と考え、一度立てた計画の変更を認めない方針を示している。より適切な助言はどれか。","choices":["変化の激しい環境では仮説検証を通じて計画を修正することが前提であると伝え、見直しの仕組みを組み込むよう助言する。","計画としての一貫性を保つことが何より重要であるとして、現在の方針をそのまま維持するよう助言する。","計画変更を認めない方針のもとで、当初計画が達成できなかった場合は担当者の責任として処理するよう助言する。","計画そのものをあらかじめ策定することをやめ、その場の状況に応じてその都度判断していく運用へ切り替えるよう助言する。"],"answer":0,"explain":"デジタル経営では仮説検証を繰り返して計画を修正していくことが前提であり、見直しの仕組みを組み込むことが求められる（PGL p.42）。","pgl_page":42},{"id":12,"tag":"第1部｜人材役割の兼務","q":"従業員30名のD社では、デジタル経営推進者・開発リーダー・運用リーダーを専任で置く余力がない。より適切な助言はどれか。","choices":["各役割の呼称のみを形式的に割り当てておくこととし、実際の業務分担については特に定めなくてよいと助言する。","企業の規模や状況に応じて役割を兼務する形も想定されるため、担うべき機能を整理し現実的な体制を設計するよう助言する。","外部のITベンダーにすべての役割を委ねることとし、社内では担当者を誰も置かない体制とするよう助言する。","専任の担当者を置く余力のない企業ではデジタル経営を推進すること自体が難しいため、当面は着手を見送るよう、そのまま助言する。"],"answer":1,"explain":"推進体制は企業の事情や規模により形態が異なるとされており、機能を整理したうえで兼務も含めた現実的な体制を設計することが適切（PGL p.9）。","pgl_page":9},{"id":13,"tag":"第2部｜ビジネスモデル","q":"M社は新規事業のビジネスモデルを検討する際、既存事業と同一の収益構造をそのまま踏襲しようとしている。デジタル経営支援者としてより適切な助言はどれか。","choices":["新規事業であっても、ビジネスモデルの検討自体は不要であると助言する。","ビジネスモデルの検討はIT開発・導入プロセスの段階で行えば十分であると助言する。","既存事業と同一の収益構造を用いることが最も効率的であるため、そのまま採用することを基本方針として助言することを基本とする。","事業ビジョンで描いた新たな価値提供の形に即して、収益構造や提供方法を含むビジネスモデルを改めて設計し直すよう助言する。"],"answer":3,"explain":"既存事業の収益構造をそのまま流用するのではなく、事業ビジョンに即してビジネスモデルを設計し直すのが適切（PGL p.45）。","pgl_page":45},{"id":14,"tag":"第2部｜CSF","q":"N社は複数のKPIを設定したが、どれも同程度に重要だと考え、優先順位をつけていない。デジタル経営支援者としてより適切な助言はどれか。","choices":["設定したKPIについてはすべてを同時並行で追いかけていくべきものであり、それぞれに優先順位をつける必要は特にないと判断して助言する。","事業ビジョンやKGI達成に向けて特に重視すべき成功要因（CSF）を明確にし、それに基づいてKPIの優先順位を整理するよう助言する。","CSFはKPI達成後に事後的に振り返るための指標であると助言する。","CSFの設定はIT部門の技術的な検討事項であり、経営戦略とは切り離すよう助言する。"],"answer":1,"explain":"CSF（重要成功要因）を明確にし、それに基づいてKPIの優先順位を整理するのが適切な進め方（PGL p.48）。","pgl_page":48},{"id":15,"tag":"第2部｜P1とP2の連携","q":"O社では変革構想書は完成しているが、デジタル経営戦略の検討がその内容を十分に踏まえずに進められている。デジタル経営支援者としてより適切な助言はどれか。","choices":["変革構想書は参考情報にすぎないため、戦略検討では特に踏まえる必要はないと助言する。","変革構想書に込められた経営者の「思い」との整合性を確認しながら、事業ビジョンやビジネスモデル等の戦略を具体化するよう助言する。","変革構想書とデジタル経営戦略は別のプロジェクトとして独立に進めるべきであると助言する。","戦略の検討が先行している場合においては、後から変革構想書の内容のほうを戦略の内容に合わせて修正していけばよいと判断して助言する。"],"answer":1,"explain":"変革構想書に込められた経営者の「思い」との整合性を確認しながら戦略を具体化するのが変革・成長プロセスとデジタル経営戦略プロセスの正しい連携（PGL p.33）。","pgl_page":33},{"id":16,"tag":"第2部｜変革の表明","q":"E社の経営者は変革構想をまとめたが、社内への発信は管理職向けの資料配付のみで済ませようとしている。より適切な助言はどれか。","choices":["資料を配付しさえすれば内容は十分に伝わるため、それ以上の社内発信は特に不要であると助言する。","変革構想の社内共有には情報漏えいのリスクが伴うため、共有する対象範囲をさらに絞り込むよう助言する。","社内に向けた発信については、変革の取り組みが具体的な成果を出したあとの段階で行えばよいと助言する。","経営者自身の言葉で変革への意思を表明し、関係者が共感できる形で伝える機会を設けるよう助言する。"],"answer":3,"explain":"変革の表明は経営者自身の言葉でステークホルダーの共感を得られる形で行うことが重要であり、資料配付のみでは不十分（PGL p.34）。","pgl_page":34},{"id":17,"tag":"第2部｜成熟度の現状把握","q":"F社では目標とする成熟度レベルの議論が先行し、現状の成熟度がどの水準にあるかを把握しないまま計画を立てようとしている。より適切な助言はどれか。","choices":["目標とする水準が明確になっているのであれば現状把握は不要であるとして、そのまま計画策定を進めるよう助言する。","現状の把握については、計画の実行を開始したあとの段階で並行して行っていけばよいと助言する。","まず現状の成熟度を4つの評価視点から把握し、そのうえで目標とするレベルを設定するよう助言する。","現状の把握は外部の評価機関にすべて任せることとし、社内では一切関与しない方針とするよう助言する。"],"answer":2,"explain":"現状の成熟度を把握したうえで目標レベルを設定するのが本来の順序であり、現状把握を省いた目標設定は実効性を欠く（PGL p.36）。","pgl_page":36},{"id":18,"tag":"第2部｜経営課題の抽出","q":"G社では経営環境情報を大量に収集したが、整理されないまま蓄積され、戦略検討に活かされていない。より適切な助言はどれか。","choices":["情報が十分に活用されていないのであれば、情報収集の取り組みそのものを取りやめるよう助言する。","収集した情報を分析して自社の経営課題を抽出し、戦略検討の出発点として位置づけるよう助言する。","収集した情報の整理については担当者個人の判断に委ねることとし、経営層は関与しないよう助言する。","収集する情報は多ければ多いほど有用であるとして、さらに情報の収集を積極的に続けるよう助言する。"],"answer":1,"explain":"経営環境情報は収集して終わりではなく、分析して経営課題を抽出し、戦略検討につなげることが求められる（PGL p.44）。","pgl_page":44},{"id":19,"tag":"第2部｜経営リスク評価","q":"H社ではデジタル経営戦略の策定にあたり、期待できる効果のみを検討し、想定されるリスクの評価を行っていない。より適切な助言はどれか。","choices":["戦略の策定過程で想定される経営リスクを評価し、その対応方針も含めて検討するよう助言する。","戦略の段階では効果の検討を優先することとし、リスクの評価については実行段階で行えばよいと助言する。","リスクを詳細に検討すると意思決定が滞ってしまうため、あえて評価しない現在の方針を維持するよう助言する。","リスクの評価は保険や法務を担当する部門が扱う事項であるとして、戦略検討には含めないよう助言する。"],"answer":0,"explain":"デジタル経営戦略の策定過程には経営リスクの評価・対応が含まれており、効果の検討のみで進めるのは適切ではない（PGL p.47）。","pgl_page":47},{"id":20,"tag":"第3部｜プロジェクト進捗KPI","q":"P社では、開発プロジェクトの進捗管理において、消化した工数のみを進捗指標としている。デジタル経営支援者としてより適切な助言はどれか。","choices":["工数消化率だけでなく、成果物の完成度や品質を反映したKPIを組み合わせて進捗を評価するよう助言する。","進捗管理は開発リーダーの裁量に完全に委ね、KPIの設定自体を廃止するよう助言する。","工数消化率のみで進捗を管理する方法が最も客観的であるため、そのまま継続することを基本方針として助言する。","進捗管理は提供価値検証プロセス（提供価値検証プロセス）の段階でまとめて行えばよいと助言する。"],"answer":0,"explain":"工数消化率だけに頼らず、成果物の完成度・品質を反映したKPIを組み合わせて評価するのが適切（PGL p.109）。","pgl_page":109},{"id":21,"tag":"第3部｜要件定義","q":"Q社では要件定義の段階で、現場の要望をすべて漏れなく反映しようとして要件が際限なく膨らんでいる。デジタル経営支援者としてより適切な助言はどれか。","choices":["要件が膨らんでも、予算やスケジュールへの影響は考慮せず進めるよう助言する。","要件定義は開発リーダーのみで完結させ、現場の要望収集自体を省略するよう助言する。","現場から寄せられた要望についてはすべてを漏れなく要件として反映すべきものであり、優先順位づけの作業は不要であると判断して助言する。","事業ビジョンやCSFとの整合性を踏まえて要件の優先順位を整理し、実現すべき価値に照らして取捨選択するよう助言する。"],"answer":3,"explain":"事業ビジョン・CSFとの整合性を踏まえ、優先順位づけと取捨選択を行うことが要件定義の適切な進め方（PGL p.64）。","pgl_page":64},{"id":22,"tag":"第3部｜IT投資予算","q":"R社では、IT投資予算を前年度の実績のみを基準に機械的に決定しようとしている。デジタル経営支援者としてより適切な助言はどれか。","choices":["事業ビジョンやデジタル経営戦略で描いた価値創出の内容を踏まえて、投資対効果の観点からIT投資予算を検討するよう助言する。","IT投資予算の決定についてはIT部門の裁量にすべて委ねることとし、経営戦略の内容との関連付けまでは不要であると判断して助言する。","前年度実績を基準とする方法が最も合理的であるため、そのまま採用するよう助言する。","IT投資予算は一度決定した後は、事業環境が変化しても見直さないよう助言する。"],"answer":0,"explain":"前年度実績のみに頼らず、事業ビジョン・デジタル経営戦略との整合性や投資対効果を踏まえて検討するのが適切（PGL p.70）。","pgl_page":70},{"id":23,"tag":"第3部｜ベンダー選定","q":"S社では、提案価格の安さのみを基準にITベンダーを選定しようとしている。デジタル経営支援者としてより適切な助言はどれか。","choices":["価格の安さが最も重要な選定基準であるため、他の要素は考慮しないよう助言する。","価格だけでなく、提案内容の実現性や実績、サポート体制等を含めて総合的に評価し選定するよう助言する。","ベンダー選定においては提案内容を確認せず、実績のある企業を無条件に選ぶよう、これまでの方針どおり助言する。","ベンダー選定は現場担当者の個人的な人脈のみに基づいて決定するよう助言する。"],"answer":1,"explain":"価格のみに偏らず、実現性・実績・サポート体制等を含め総合的に評価するのが適切なベンダー選定（PGL p.69）。","pgl_page":69},{"id":24,"tag":"第3部｜システム監査","q":"T社では、システム監査の結果、複数の指摘事項が見つかったが、担当部門が対応の優先順位をつけずに放置している。デジタル経営支援者としてより適切な助言はどれか。","choices":["監査で見つかった指摘事項は、次回監査までまとめて対応すればよいと助言する。","指摘事項のリスクの大きさや事業への影響を踏まえて優先順位をつけ、計画的に是正対応を進めるよう助言する。","指摘事項への対応はシステム部門の裁量に完全に委ね、経営層への報告は不要であるものと判断して助言することとする。","監査の指摘事項はすべて同時に一斉着手すべきであり、優先順位づけは不要であると助言する。"],"answer":1,"explain":"リスクの大きさや事業への影響を踏まえて優先順位をつけ、計画的に是正対応を進めるのが適切（PGL p.88）。","pgl_page":88},{"id":25,"tag":"第3部｜変更管理","q":"U社では、稼働中のシステムに対する変更要望が現場から都度出され、正式な手続きを経ずに個別対応で改修が繰り返されている。デジタル経営支援者としてより適切な助言はどれか。","choices":["変更管理のプロセスを整備し、影響範囲やリスクを評価したうえで正式な承認を経て変更を反映する体制を構築するよう助言する。","変更管理のプロセスを整備するには相応のコストがかかるため、当面のあいだは現状の進め方のまま運用を続けることを基本方針として助言する。","変更管理は開発リーダーの裁量のみに委ね、正式な承認手続きは不要であると助言する。","現場の要望に迅速に応えることが最優先であるため、個別対応を継続するよう助言する。"],"answer":0,"explain":"影響範囲・リスクを評価したうえで正式な承認を経る変更管理プロセスを整備することが適切（PGL p.87）。","pgl_page":87},{"id":26,"tag":"第3部｜PoCの活用","q":"I社では、無償試用期間のあるクラウドサービスについて、提供されている機能の多さのみを見て採用を決めようとしている。より適切な助言はどれか。","choices":["機能が多いサービスほど将来の事業拡張にも対応できるため、現在の判断のままで問題ないと助言する。","試用できる期間は短く十分な判断材料にはならないため、試用は行わず提案書のみで評価を進めるよう助言する。","クラウドサービスの評価にあたっては、各社の提示する価格を比較するだけで足りるものと助言する。","事前に評価基準となる要件を定めたうえで試用し、その要件を満たせるかを検証して評価するよう助言する。"],"answer":3,"explain":"サービスや製品が持つ機能で評価するのではなく、事前に評価基準（要件）を決めておき、それを満たせるかを検証することが求められる（PGL p.65）。","pgl_page":65},{"id":27,"tag":"第3部｜評価指標の設計","q":"J社では、価値提供の評価指標として売上高のみを設定している。より適切な助言はどれか。","choices":["評価指標の設計は現場の担当者に任せることとし、経営層は結果の数値のみを確認すればよいと助言する。","売上高は最終的な事業成果を端的に表す指標であるため、それだけを設定していれば十分であると助言する。","売上高のような結果指標に加え、次のアクションにつながる先行指標も組み合わせて設計するよう助言する。","評価指標については定性的な情報のみで構成することとし、数値による測定は行わないよう助言する。"],"answer":2,"explain":"売上高等の結果は遅行指標であり次の行動に結びつけづらいため、先行指標を組み合わせて設計することが求められる（PGL p.65）。","pgl_page":65},{"id":28,"tag":"第3部｜テスト工程","q":"K社の開発プロジェクトでは、納期が迫っているためテスト工程を大幅に短縮し、稼働後に不具合対応する方針が検討されている。より適切な助言はどれか。","choices":["テストの実施範囲については開発ベンダー側の判断に完全に委ねることとし、発注者はいっさい関与しないよう助言する。","納期を守ることが何よりも最優先であるため、テスト工程は省略したうえで稼働を開始するよう助言する。","テスト結果の記録を残す工程の意義を確認し、優先度を踏まえた現実的なテスト計画を再検討するよう助言する。","テストは稼働を開始したあとの運用の中で、実際の利用者に確認してもらう形へ切り替えるよう助言する。"],"answer":2,"explain":"テストは結果の記録を残して品質を担保する工程であり、単純な省略ではなく優先度を踏まえた計画の再検討が適切（PGL p.77）。","pgl_page":77},{"id":29,"tag":"第3部｜インシデント対応","q":"L社では、システム障害が発生するたびに個別に復旧対応を行っているが、原因の記録や再発防止の検討は行われていない。より適切な助言はどれか。","choices":["インシデントの報告と対応手順を整備し、原因究明と再発防止までを一連の流れとして実施するよう助言する。","原因の究明には時間がかかるため、障害が頻発するようになった段階で着手すればよいと助言する。","障害対応の記録は開発ベンダーの側が保有してさえいれば足りるものとして、自社では管理しないよう助言する。","障害からの復旧さえ完了していれば対応としては十分であるため、記録を残す必要はないと助言する。"],"answer":0,"explain":"インシデント報告と対応手順の整備に加え、原因究明と再発防止対策までを一連の流れとして実施することが求められる（PGL p.87）。","pgl_page":87},{"id":30,"tag":"第4部｜コミュニケーションの欠如","q":"V社のプロジェクトでは、経営者への報告が滞り、現場の進捗状況が経営層に正しく伝わっていない状態が続いている。デジタル経営支援者としてより適切な助言はどれか。","choices":["コミュニケーション計画を見直し、報告のタイミングや手段を明確にして、経営層との情報共有を定着させるよう助言する。","報告が滞っている場合は、プロジェクト自体を中止するよう助言する。","経営者への報告は、プロジェクト完了時に一度だけ行えば十分であると助言する。","経営者に対する報告についてはもっぱら現場の判断に任せることとし、特段の仕組みづくりまでは不要であると判断して助言する。"],"answer":0,"explain":"コミュニケーション計画を見直し、報告のタイミング・手段を明確化して情報共有を定着させることが適切（PGL p.105）。","pgl_page":105},{"id":31,"tag":"第4部｜モニタリング体制","q":"W社では、モニタリング指標を数多く設定しているが、誰がどの指標を確認するのかが明確になっておらず、異常が見逃されがちである。デジタル経営支援者としてより適切な助言はどれか。","choices":["指標の数を減らさずに、確認者を定めないまま運用を継続するよう助言する。","モニタリング体制の整備よりも、指標の見た目のデザインを優先するよう助言する。","指標ごとに確認者と報告のルートを明確にしたモニタリング体制を整備し、異常の早期発見につなげるよう助言する。","異常の発見については事後に実施する監査の場でまとめて行えばよいため、あらためて体制を整備する必要はないと判断して助言する。"],"answer":2,"explain":"指標ごとに確認者・報告ルートを明確にした体制を整備し、異常の早期発見につなげることが適切（PGL p.111）。","pgl_page":111},{"id":32,"tag":"第4部｜開発進捗管理","q":"X社の開発プロジェクトでは、進捗報告が担当者の主観的な感覚のみに基づいて行われている。デジタル経営支援者としてより適切な助言はどれか。","choices":["担当者の主観的な報告が最も実態を反映しているため、そのまま継続することを基本方針として助言することを基本とする。","進捗報告の仕組みづくりは不要であり、完了時に一度だけ確認すればよいと助言する。","進捗管理は経営者の関与を排除し、現場担当者のみで完結させるよう助言する。","客観的な指標やマイルストーンを設定し、それに基づいて進捗を定量的に把握・報告する体制を整えるよう助言する。"],"answer":3,"explain":"主観的な感覚だけに頼らず、客観的な指標・マイルストーンに基づく定量的な進捗把握・報告体制を整えるのが適切（PGL p.109）。","pgl_page":109},{"id":33,"tag":"第4部｜セキュリティ対策","q":"Y社では、セキュリティ対策として最新のツール導入のみに注力し、社員への教育や運用ルールの整備が後回しになっている。デジタル経営支援者としてより適切な助言はどれか。","choices":["ツールの導入だけでなく、社員教育や運用ルールの整備も含めた総合的なセキュリティ対策を進めるよう助言する。","最新ツールの導入さえ行えば、セキュリティ対策としては十分であると助言する。","セキュリティ対策はIT部門の専任事項であり、他部門の社員への教育は不要であるものと判断して助言することとする。","社員教育や運用ルールの整備は、ツール導入が完了した数年後に検討すればよいと助言する。"],"answer":0,"explain":"ツール導入だけでなく、社員教育・運用ルール整備も含めた総合的な対策を進めることが重要（PGL p.114）。","pgl_page":114},{"id":34,"tag":"第4部｜組織学習の特徴","q":"Z社では、プロジェクトで得られた教訓が担当者個人の経験にとどまり、他のプロジェクトや部署に共有されていない。デジタル経営支援者としてより適切な助言はどれか。","choices":["教訓は担当者個人の財産であるため、他部署への共有は不要であると助言する。","教訓の共有は失敗事例に限定し、成功事例は共有しなくてよいと助言する。","得られた教訓やノウハウを組織的に記録・共有する仕組みを整え、他のプロジェクトや部署でも活用できるようにするよう助言する。","組織として共有する仕組みをつくるには相応のコストがかかるため、当面のあいだは個々人の記憶に頼っていくことを基本として助言する。"],"answer":2,"explain":"教訓やノウハウを組織的に記録・共有する仕組みを整え、他のプロジェクトや部署でも活用できるようにするのが適切（PGL p.120）。","pgl_page":120},{"id":35,"tag":"第4部｜プロセス定義","q":"M社では、各プロセスの責任者やインプット・アウトプットが明文化されないまま、担当者の経験に頼って業務が回っている。より適切な助言はどれか。","choices":["現状で業務が問題なく回っている以上、あらためて明文化する必要は特にないものと助言する。","プロセスの定義については外部のコンサルタントに一任することとし、社内では関与しないよう助言する。","各プロセスの目的・スケジュール・インプットとアウトプット・責任者を定義し、文書化して共有するよう助言する。","明文化を進めると担当者それぞれの裁量をかえって狭めることになるため、あえて行わない方針を維持するよう助言する。"],"answer":2,"explain":"プロセスの目的・スケジュール・インプット/アウトプット・責任者を明確にし、文書化して共有することがサイクルマネジメントの基本（PGL p.100）。","pgl_page":100},{"id":36,"tag":"第4部｜用語の共通理解","q":"N社のプロジェクトでは、経営層と開発ベンダーが同じ用語を異なる意味で使っており、認識の食い違いから手戻りが生じている。より適切な助言はどれか。","choices":["用語の解釈に違いが生じることは避けられないため、その都度その場で確認する運用を続けるよう助言する。","用語の統一はもっぱらベンダー側の社内事情であるとして、発注者は関与しない方針とするよう助言する。","認識の食い違いが生じた場合には、常に経営層の側の解釈のほうを正しいものとして処理するよう助言する。","関係者間で用いる用語の定義を整理して共有し、共通の理解のもとで意思疎通できる状態をつくる。"],"answer":3,"explain":"立場の異なる関係者間で用語の解釈がずれないよう、共通の言葉の定義を整えることがコミュニケーションの基本（PGL p.104）。","pgl_page":104},{"id":37,"tag":"第4部｜是正措置","q":"O社では、モニタリングで目標との差異が検出されているが、報告されるだけで具体的な対応につながっていない。より適切な助言はどれか。","choices":["差異の検出と報告ができている以上、モニタリングの役割としては果たされているものと助言する。","差異が生じている指標については測定の対象から外すこととし、達成できている指標のみを管理するよう助言する。","検出された差異については、次回の評価時期が来るまでしばらく様子を見るのが妥当であると助言する。","差異の原因を分析したうえで是正措置を講じ、その結果を評価して次につなげる流れを整えるよう助言する。"],"answer":3,"explain":"差異の分析から是正措置の実施、結果の評価までを一連の流れとして回すことがモニタリングとコントロールの要点（PGL p.112）。","pgl_page":112},{"id":38,"tag":"第4部｜暗黙知の形式知化","q":"P社では、熟練者の作業ノウハウが本人の経験のみに蓄積され、他の従業員に引き継がれないまま退職者が出始めている。より適切な助言はどれか。","choices":["熟練者のノウハウは本人に固有のものであり共有は困難であるとして、当面の対応を見送るよう助言する。","ノウハウの継承については個々の従業員それぞれの自助努力に委ねることとし、会社としての仕組みは設けないよう助言する。","ドキュメント化や動画の記録、勉強会などを通じて暗黙知を形式知へ変換し、組織で共有できるようにするよう助言する。","熟練者が実際に退職する時期を迎えるまでのあいだ、業務内容を変更せずに現状のまま維持するよう助言する。"],"answer":2,"explain":"ドキュメンテーションや動画記録、勉強会等を通じて暗黙知を形式知へ変換し、組織で共有できるようにすることが組織学習の基本（PGL p.120）。","pgl_page":120},{"id":39,"tag":"全体共通｜情報管理","q":"支援先A社の経営課題を分析する過程で、他社支援で得た類似業種の具体的なデータが参考になると気づいた。より適切な対応はどれか。","choices":["情報の取り扱いについての判断は支援先の経営者に委ね、支援者としては特に配慮しない。","他社から得た機密情報は用いず、公開情報や一般化された知見の範囲で分析を進める。","他社名を伏せさえすれば具体的な数値の共有には問題がないとして、そのまま用いる。","支援先の利益になる情報であるため、他社名と具体的な数値をそのまま共有して分析に用いる。"],"answer":1,"explain":"支援を通じて知り得た機密情報は守秘義務の対象であり、他社名を伏せても具体的なデータの流用は適切ではない。公開情報や一般化された知見の範囲で分析する（PGL p.11）。","pgl_page":11},{"id":40,"tag":"第2部｜戦略の展開","q":"B社ではデジタル経営戦略を策定したが、各部門の年度計画には反映されておらず、現場の業務は従来のまま進んでいる。より適切な助言はどれか。","choices":["戦略は方向性を示すものであるため、各部門の年度計画に反映させる必要は特にないものと判断して助言する。","現場の業務が滞りなく回っているのであれば、戦略との整合は問わなくてよいと助言する。","策定した戦略を中期経営計画や各部門の計画へ展開し、現場の活動と結びつける仕組みを整えるよう助言する。","戦略と現場の乖離が大きい場合は、戦略そのものを現場の実態に合わせて作り直すよう助言する。"],"answer":2,"explain":"策定した戦略は中期経営計画や部門計画へ展開し、現場の活動と結びつけることで初めて機能する。展開の工程を欠いたままでは戦略が形骸化する（PGL p.49）。","pgl_page":49}]}];
const POS=["ア","イ","ウ","エ"];
const K_STATE="itc-drill2-state-v1";
const K_WRONG="itc-drill2-wrong-v1";
const app=document.getElementById("app");
let S={screen:"menu",ch:0,idx:0,sel:null,rec:{},mode:"chapter",list:null};
let WRONG={};

function save(){try{localStorage.setItem(K_STATE,JSON.stringify(S));localStorage.setItem(K_WRONG,JSON.stringify(WRONG));}catch(e){}}
function load(){
  try{const v=localStorage.getItem(K_STATE);if(v)S=Object.assign(S,JSON.parse(v));}catch(e){}
  try{const w=localStorage.getItem(K_WRONG);if(w)WRONG=JSON.parse(w)||{};}catch(e){WRONG={}}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function key(ci,qi){return ci+":"+qi;}

/* 現在の出題リストを返す（章モード＝その章／復習モード＝間違えた問題） */
function curList(){
  if(S.mode==="review") return (S.list||[]);
  return CHAPTERS[S.ch].questions.map((q,i)=>key(S.ch,i));
}
function getQ(k){const[ci,qi]=k.split(":").map(Number);return CHAPTERS[ci].questions[qi];}
function getChTitle(k){return CHAPTERS[+k.split(":")[0]].title;}
function wrongKeys(){return Object.keys(WRONG);}
function wrongOfCh(ci){return wrongKeys().filter(k=>+k.split(":")[0]===ci).length;}

function render(){
  if(S.screen==="menu")return renderMenu();
  if(S.screen==="result")return renderResult();
  renderQuiz();
}

function renderMenu(){
  const nw=wrongKeys().length;
  let h="";
  if(nw>0){
    h+=`<div class="card reviewcard"><h2>間違えた問題の復習</h2>
      <div class="muted">これまでに間違えた問題が <b style="color:var(--shu)">${nw}問</b> あります。正解できた問題はこの一覧から自動的に外れます。</div>
      <div class="navrow"><button id="startreview" class="review">復習する（${nw}問）</button>
      <button id="clearwrong" class="ghost">一覧をクリア</button></div></div>`;
  }
  h+='<div class="card"><h2>章を選択</h2><div class="modes">';
  CHAPTERS.forEach((c,i)=>{
    const w=wrongOfCh(i);
    h+=`<button class="mode" data-ch="${i}"><b>${esc(c.title)}</b><div class="muted">${esc(c.sub)}</div>
      <span class="cnt">${c.questions.length}問${w?`<span class="wrongbadge">要復習 ${w}</span>`:""}</span></button>`;
  });
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
    S.ch=+b.dataset.ch;S.mode="chapter";S.list=null;S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();
  });
  const sr=document.getElementById("startreview");
  if(sr)sr.onclick=()=>{
    S.mode="review";S.list=wrongKeys();S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();
  };
  const cw=document.getElementById("clearwrong");
  if(cw)cw.onclick=()=>{if(confirm("間違えた問題の一覧をすべて消します。よろしいですか？")){WRONG={};save();render();}};
}

function renderQuiz(){
  const list=curList();
  if(!list.length){S.screen="menu";save();return render();}
  if(S.idx>=list.length)S.idx=list.length-1;
  const k=list[S.idx],q=getQ(k);
  const answered=S.sel!==null;
  const ok=answered&&S.sel===q.answer;
  const nAns=Object.keys(S.rec).length;
  const pct=Math.round(nAns/list.length*100);
  const isRv=S.mode==="review";
  let h=`<div class="card${isRv?" reviewcard":""}">
    <div class="qmeta">
      <span class="tagchip${isRv?" rv":""}">${isRv?"復習":esc(CHAPTERS[S.ch].title)}</span>
      <span class="tagchip">${esc(isRv?getChTitle(k)+"｜"+q.tag:q.tag)}</span>
      <span class="muted" style="margin-left:auto">${S.idx+1} / ${list.length}　解答済み ${nAns}</span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="stem"><span class="qno">問${S.idx+1}．</span>${esc(q.q)}</div>
    <div class="choices">`;
  q.choices.forEach((c,i)=>{
    let cls="";
    if(answered){cls=(i===q.answer)?"ok":(i===S.sel?"ng":"dim");}
    h+=`<button class="choice ${cls}" data-i="${i}" ${answered?"disabled":""}><span class="pos">${POS[i]}</span><span class="tx">${esc(c)}</span></button>`;
  });
  h+="</div>";
  if(answered){
    let note="";
    if(isRv&&ok)note='<div style="margin-top:8px;color:var(--midori);font-weight:700">正解できたので、復習一覧から外しました。</div>';
    const pg=q.pgl_page?`<span class="pgchip">PGL p.${q.pgl_page}</span>`:"";
    h+=`<div class="exp"><div class="vh">${ok?"○ 正解":"✕ 不正解 ─ 正解は「"+POS[q.answer]+"」"}${pg}</div><div>${esc(q.explain)}</div>${note}</div>`;
  }
  h+=`</div><div class="navrow">
    <button id="prev" ${S.idx===0?"disabled":""}>← 前へ</button>
    <div class="spacer"></div>
    <button id="next" class="primary" ${answered?"":"disabled"}>${S.idx===list.length-1?"結果を見る":"次へ →"}</button>
  </div>`;
  app.innerHTML=h;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(S.sel!==null)return;
    S.sel=+b.dataset.i;
    const correct=(S.sel===q.answer);
    S.rec[k]=correct;
    if(correct){delete WRONG[k];}else{WRONG[k]=1;}
    save();render();
  });
  document.getElementById("prev").onclick=()=>{if(S.idx>0){S.idx--;S.sel=null;save();render();}};
  document.getElementById("next").onclick=()=>{
    if(S.idx===list.length-1){S.screen="result";}else{S.idx++;S.sel=null;}
    save();render();
  };
}

function renderResult(){
  const list=S.mode==="review"?(S.list||[]):CHAPTERS[S.ch].questions.map((q,i)=>key(S.ch,i));
  const total=list.length;
  const score=list.filter(k=>S.rec[k]===true).length;
  const pct=total?Math.round(score/total*100):0;
  const missed=list.filter(k=>S.rec[k]===false);
  const title=S.mode==="review"?"復習":CHAPTERS[S.ch].title;
  let h=`<div class="card${S.mode==="review"?" reviewcard":""}">
    <h2>${esc(title)}　結果</h2>
    <div class="score-hero"><div class="big">${score}<span class="of"> / ${total}</span></div><div class="muted">正答率 ${pct}%</div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="grid">`;
  list.forEach((k,i)=>{
    const r=S.rec[k];
    h+=`<div class="cell ${r===true?"ok":(r===false?"ng":"")}" title="${esc(getQ(k).tag)}">${i+1}</div>`;
  });
  h+="</div>";
  if(missed.length){
    h+=`<div class="wronglist"><h2 style="margin-top:18px;font-size:15px">間違えた問題（${missed.length}問）</h2>`;
    missed.forEach(k=>{
      const i=list.indexOf(k);
      const wq=getQ(k);
      h+=`<div class="wrongrow"><span class="n">問${i+1}</span><span>${esc(getChTitle(k))}｜${esc(wq.tag)}</span>${wq.pgl_page?`<span class="pgchip" style="margin-left:auto">PGL p.${wq.pgl_page}</span>`:""}</div>`;
    });
    h+="</div>";
  }
  const nw=wrongKeys().length;
  h+=`<div class="navrow">`;
  if(missed.length)h+=`<button id="redo" class="review">この回の間違いをやり直す（${missed.length}問）</button>`;
  h+=`<button id="again">もう一度最初から</button>
      <button id="tomenu" class="ghost">ホームへ</button></div>`;
  if(nw)h+=`<div class="muted" style="margin-top:10px">復習一覧には現在 ${nw}問 たまっています。ホームからいつでも復習できます。</div>`;
  h+="</div>";
  app.innerHTML=h;
  const rd=document.getElementById("redo");
  if(rd)rd.onclick=()=>{S.mode="review";S.list=missed.slice();S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();};
  document.getElementById("again").onclick=()=>{
    if(S.mode==="review"){S.list=list.slice();}
    S.idx=0;S.sel=null;S.rec={};S.screen="quiz";save();render();
  };
  document.getElementById("tomenu").onclick=()=>{S.screen="menu";save();render();};
}

document.getElementById("homebtn").onclick=()=>{S.screen="menu";save();render();};
load();
if(S.screen==="quiz"){
  const l=curList();
  if(!l.length||!CHAPTERS[S.ch]){S.screen="menu";S.mode="chapter";}
}
render();
</script>
</body>
</html>
