<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>検印台帳（関係者用）</title>
<style>
:root{--bg:#E9EBEE;--ai:#1F3A63;--ink:#17202B;--sub:#5C6672;--rule:#C9CDD3;--shu:#B4362F;
--serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;
--sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.gate{background:#FCFCFB;border:1px solid var(--rule);border-radius:8px;padding:30px 28px;
max-width:400px;width:100%;box-shadow:0 2px 10px rgba(23,32,43,.08);text-align:center}
h1{font-family:var(--serif);font-size:18px;color:var(--ai);margin:0 0 6px;letter-spacing:.06em}
.sub{font-size:12.5px;color:var(--sub);line-height:1.9;margin-bottom:20px}
input{width:100%;border:1px solid var(--rule);border-radius:6px;padding:11px 13px;
font-size:16px;font-family:var(--sans);text-align:center;letter-spacing:.05em}
input:focus{outline:2px solid var(--ai);outline-offset:-1px}
button{width:100%;margin-top:12px;background:var(--ai);color:#fff;border:1px solid var(--ai);
border-radius:6px;padding:12px;font-size:14.5px;font-family:var(--sans);cursor:pointer;font-weight:700}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--shu);font-size:13px;margin-top:12px;min-height:1.4em}
.note{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);
font-size:11.5px;color:var(--sub);line-height:1.9;text-align:left}
</style>
</head>
<body>
<div class="gate">
  <h1>検印台帳</h1>
  <div class="sub">ITC試験対策 その2（分野別ドリル）<br>校正用・関係者以外の閲覧はご遠慮ください</div>
  <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button id="go">開く</button>
  <div class="err" id="err"></div>
  <div class="note">
    ※ 簡易的な目隠しです。厳密なアクセス制限ではありません。<br>
    ※ 判定内容はこの端末のブラウザ内にのみ保存されます。
  </div>
</div>

const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open_(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b2a(P.s),iterations:P.n,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(P.i)},key,b2a(P.c));
  return new TextDecoder().decode(plain);
}
const pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err");
async function submit(){
  err.textContent="";go.disabled=true;go.textContent="確認中…";
  try{
    const html=await open_(pw.value);
    document.open();document.write(html);document.close();
  }catch(e){
    err.textContent="パスワードが違います。";
    go.disabled=false;go.textContent="開く";pw.select();
  }
}
go.onclick=submit;
pw.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
pw.focus();
</script>
