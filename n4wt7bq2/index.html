<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロセス連携ドリル｜PGL Ver.4.0</title>
<style>
:root{
  --ground:#0F141C;
  --surface:#18202B;
  --surface-2:#1E2836;
  --line:#2B3849;
  --text:#E6E9EE;
  --muted:#8D99AC;
  --correct:#55B98A;
  --wrong:#E4695F;
  --amber:#E8B14A;
  --display:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --body:"Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 64px}

/* ---------- 共通 ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--body);font-size:15px;font-weight:600;
  padding:14px 22px;border-radius:2px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);cursor:pointer;
  transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn-primary{background:var(--amber);color:#14181F;border-color:var(--amber)}
.btn-primary:hover{background:#F0C167}
.btn-ghost{background:transparent}

/* ---------- スタート ---------- */
#start{padding-top:56px}
.title{font-family:var(--display);font-size:34px;line-height:1.25;font-weight:600;letter-spacing:.02em;margin:14px 0 10px}
.title em{font-style:normal;color:var(--amber)}
.lede{color:var(--muted);font-size:14px;line-height:1.85;margin-bottom:34px}
.field{margin-bottom:26px}
.field-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;display:block}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{
  display:flex;align-items:center;gap:12px;padding:13px 15px;
  border:1px solid var(--line);background:var(--surface);border-radius:2px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.chip:hover{border-color:#3D4D63}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip .box{
  flex:0 0 16px;height:16px;border:1px solid #46566E;border-radius:1px;position:relative;transition:.15s;
}
.chip .box::after{
  content:"";position:absolute;inset:3px;background:var(--amber);transform:scale(0);transition:transform .12s;
}
.chip.on{border-color:var(--amber);background:var(--surface-2)}
.chip.on .box{border-color:var(--amber)}
.chip.on .box::after{transform:scale(1)}
.chip .name{font-size:14px;font-weight:600;flex:1}
.chip .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.toggle-row{display:flex;gap:8px}
.toggle-row .chip{flex:1}

/* ---------- 続きから／記録 ---------- */
.resume{
  border:1px solid var(--amber);background:rgba(232,177,74,.07);
  border-radius:2px;padding:16px;margin-bottom:26px;
}
.resume .rlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--amber);margin-bottom:8px}
.resume .rtext{font-size:14px;color:#C4CCD8;line-height:1.7;margin-bottom:14px}
.resume .rtext b{color:var(--text);font-family:var(--mono);font-size:16px}

.rec{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:16px;margin-bottom:26px}
.rec-top{display:flex;gap:18px;margin-bottom:16px}
.rec-cell{flex:1}
.rec-cell .n{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1}
.rec-cell .n.warn{color:var(--amber)}
.rec-cell .l{font-size:11px;color:var(--muted);margin-top:6px}
.rec-row{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:12.5px}
.rec-row .rn{flex:1;color:#C4CCD8}
.rec-row .rb{flex:0 0 62px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rec-row .rb i{display:block;height:100%;background:var(--correct)}
.rec-row .rv{flex:0 0 40px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
.linkbtn{
  background:none;border:none;color:var(--muted);font-family:var(--body);font-size:12px;
  text-decoration:underline;cursor:pointer;padding:6px 0;
}
.linkbtn:hover{color:var(--wrong)}
.chip.off{opacity:.4;pointer-events:none}

/* ---------- 進捗レール ---------- */
#rail{
  position:sticky;top:0;z-index:5;background:var(--ground);
  padding:14px 0 12px;display:flex;gap:3px;align-items:center;
}
.tick{flex:1;height:3px;background:var(--line);border-radius:2px;transition:background .2s}
.tick.ok{background:var(--correct)}
.tick.ng{background:var(--wrong)}
.tick.now{background:var(--amber)}

/* ---------- 問題 ---------- */
.meta{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 18px}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted)}
.counter b{color:var(--text);font-size:18px;font-weight:600}
.stem{
  font-family:var(--display);font-size:19px;line-height:1.85;letter-spacing:.02em;
  margin-bottom:26px;
}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;
  padding:15px 16px;border:1px solid var(--line);background:var(--surface);
  border-radius:2px;cursor:pointer;color:var(--text);
  font-family:var(--body);font-size:15px;line-height:1.7;
  transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:#4A5C76;background:var(--surface-2)}
.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .key{
  flex:0 0 22px;height:22px;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;color:var(--muted);
  border:1px solid var(--line);border-radius:1px;margin-top:1px;
}
.opt.correct{border-color:var(--correct);background:rgba(85,185,138,.10)}
.opt.correct .key{border-color:var(--correct);color:var(--correct)}
.opt.wrong{border-color:var(--wrong);background:rgba(228,105,95,.10)}
.opt.wrong .key{border-color:var(--wrong);color:var(--wrong)}
.opt.dim{opacity:.42}

/* ---------- 経路バー（シグネチャ） ---------- */
.reveal{margin-top:24px;animation:rise .3s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}

.verdict{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-bottom:16px}
.verdict.ok{color:var(--correct)}
.verdict.ng{color:var(--wrong)}
.verdict .mark{font-family:var(--mono);font-size:17px}

.route{
  border:1px solid var(--line);background:var(--surface);
  padding:20px 16px 16px;border-radius:2px;margin-bottom:16px;
}
.route-label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--amber);
  text-align:center;margin-bottom:9px;
}
.route-line{display:flex;align-items:center;gap:0}
.node{
  flex:0 1 auto;font-size:12.5px;font-weight:700;line-height:1.45;text-align:center;
  padding:8px 9px;border:1px solid #3A4A60;border-radius:2px;background:var(--surface-2);
}
.node.dest{border-color:var(--amber);color:var(--amber)}
.arrow{flex:1 1 auto;display:flex;align-items:center;min-width:26px}
.arrow .shaft{flex:1;height:1px;background:var(--amber)}
.arrow .head{
  width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;
  border-left:7px solid var(--amber);
}
.route-note{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
.role-badge{
  border:1px solid var(--amber);background:rgba(232,177,74,.08);color:var(--amber);
  padding:13px 15px;border-radius:2px;margin-bottom:16px;
  font-size:13.5px;font-weight:700;text-align:center;letter-spacing:.03em;
}

.explain{
  font-size:14px;line-height:1.95;color:#C4CCD8;
  border-left:2px solid var(--line);padding-left:15px;margin-bottom:24px;
}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.hintline{font-family:var(--mono);font-size:11px;color:#5C6A7E;text-align:center;margin-top:14px}

/* ---------- 結果 ---------- */
#result{padding-top:40px}
.score{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;letter-spacing:-.02em}
.score span{font-size:22px;color:var(--muted)}
.score-note{color:var(--muted);font-size:14px;margin:12px 0 34px;line-height:1.8}
.bd{border-top:1px solid var(--line);padding:15px 0;display:flex;align-items:center;gap:14px}
.bd .bd-name{flex:1;font-size:14px;font-weight:600}
.bd .bd-bar{flex:0 0 90px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bd .bd-bar i{display:block;height:100%;background:var(--correct)}
.bd .bd-num{flex:0 0 46px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.result-actions{display:flex;flex-direction:column;gap:9px;margin-top:34px}
.hide{display:none!important}
</style>
</head>
<body>

<!-- ============ スタート ============ -->
<section id="start" class="wrap">
  <div class="eyebrow">PGL Ver.4.0 / 自習用</div>
  <h1 class="title">プロセス連携<em>ドリル</em></h1>
  <p class="lede">覚えるべき固定事実は15個。矢印11本と、共通基盤の主担当3つ、そして「戦略へは直接行かない」。<br>それを順方向・逆方向・成果物名・事例判断の4つの角度から回します。</p>

  <div id="resumeSlot"></div>
  <div id="recSlot"></div>

  <div class="field">
    <label class="field-label">出題範囲</label>
    <div class="chips" id="groupChips"></div>
  </div>

  <div class="field">
    <label class="field-label">出題する問題</label>
    <div class="toggle-row" id="pickRow">
      <label class="chip on" data-pick="all"><span class="box"></span><span class="name">すべて</span></label>
      <label class="chip" data-pick="weak"><span class="box"></span><span class="name">苦手だけ<br><span style="font-weight:400;font-size:11px;color:var(--muted)" id="weakN">0問</span></span></label>
      <label class="chip" data-pick="new"><span class="box"></span><span class="name">未着手だけ<br><span style="font-weight:400;font-size:11px;color:var(--muted)" id="newN">0問</span></span></label>
    </div>
  </div>

  <div class="field">
    <label class="field-label">1回の分量</label>
    <div class="toggle-row" id="lenRow">
      <label class="chip on" data-len="10"><span class="box"></span><span class="name">10問</span></label>
      <label class="chip" data-len="20"><span class="box"></span><span class="name">20問</span></label>
      <label class="chip" data-len="0"><span class="box"></span><span class="name">全部</span></label>
    </div>
  </div>

  <button class="btn btn-primary" id="startBtn" style="width:100%">はじめる</button>
  <p class="hintline">キーボードの 1〜4 で解答、Enter で次へ</p>
  <div style="text-align:center;margin-top:10px"><button class="linkbtn" id="resetBtn">学習記録をすべて消す</button></div>
</section>

<!-- ============ 出題 ============ -->
<section id="quiz" class="wrap hide">
  <div id="rail"></div>
  <div class="meta">
    <div class="counter"><b id="qNow">1</b> / <span id="qTotal">55</span></div>
    <div class="eyebrow" id="qGroup"></div>
  </div>
  <p class="stem" id="stem"></p>
  <div class="opts" id="opts"></div>
  <div class="reveal hide" id="reveal">
    <div class="verdict" id="verdict"></div>
    <div id="routeSlot"></div>
    <p class="explain" id="explain"></p>
    <div class="actions">
      <button class="btn btn-primary" id="nextBtn">次へ</button>
    </div>
  </div>
</section>

<!-- ============ 結果 ============ -->
<section id="result" class="wrap hide">
  <div class="eyebrow">結果</div>
  <div class="score" id="score">0<span> / 0</span></div>
  <p class="score-note" id="scoreNote"></p>
  <div id="breakdown"></div>
  <div class="result-actions">
    <button class="btn btn-primary hide" id="retryBtn">間違えた問題だけもう一度</button>
    <button class="btn" id="againBtn">同じ範囲をもう一度</button>
    <button class="btn btn-ghost" id="homeBtn">範囲を選び直す</button>
  </div>
</section>

<script>
/* ================= 短縮ノード名（経路図用） ================= */
const N = {
  P1:"変革・成長",
  P2:"デジタル経営戦略",
  P3:"デジタル経営実行計画",
  P4:"IT開発・導入",
  P5:"価値提供・運用",
  P6:"提供価値検証"
};

/* ================= 問題データ =================
   f: 固定事実番号(1-15)  g: 範囲  q: 問題文  c: 選択肢  a: 正解index
   e: 解説  r: 経路 [from, label, to]  role: 主担当バッジ
   ※問題文・選択肢に記号表記(P◯/C◯/CB-◯)は使わない
============================================== */
const DATA = [
/* ---- 事実1：変革・成長 → デジタル経営戦略 ---- */
{f:1,g:"A",q:"変革・成長プロセスで作成される変革構想書は、どこへの入力となるか。",
 c:["デジタル経営戦略プロセス","デジタル経営実行計画プロセス","提供価値検証プロセス","IT開発・導入プロセス"],a:0,
 e:"変革認識アクティビティのタスク「変革への意思決定」で作成した変革構想書を、デジタル経営戦略プロセスのインプットにする。",
 r:[N.P1,"変革構想書",N.P2]},
{f:1,g:"A",q:"デジタル経営戦略プロセスが、変革・成長プロセスから受け取るものの組み合わせとして適切なものはどれか。",
 c:["変革構想書と、目標とするデジタル経営成熟度","中期経営計画書と、経営課題リスト","実行計画の評価結果と、KPI達成状況","変革構想書と、提供価値検証結果レポート"],a:0,
 e:"変革認識アクティビティから変革構想書、デジタル経営成熟度レベルの向上アクティビティから目標とする成熟度。この2つが揃って戦略策定が始まる。",
 r:[N.P1,"変革構想書＋目標成熟度",N.P2]},
{f:1,g:"A",q:"「目標とするデジタル経営成熟度」を成果物とするのはどれか。",
 c:["デジタル経営成熟度レベルの向上アクティビティ","変革認識アクティビティ","デジタル経営戦略プロセス","サイクルマネジメントアクティビティ"],a:0,
 e:"変革・成長プロセスは変革認識と、デジタル経営成熟度レベルの向上の2つのアクティビティで構成される。現状の成熟度把握と目標レベル設定は後者が担う。"},
{f:1,g:"A",q:"変革・成長プロセスに関する記述として、不適切なものはどれか。",
 c:["変革構想書はデジタル経営実行計画プロセスへ直接渡され、実行計画の入力になる","変革認識アクティビティは、デジタル経営戦略プロセスの結果を評価することから始まる","デジタル経営成熟度レベルの向上アクティビティでは、現状評価と目標レベルの設定を行う","変革の可能性の発見には、オープンイノベーションやアイディアソン等も有効である"],a:0,
 e:"変革構想書の渡し先はデジタル経営戦略プロセス。実行計画プロセスへは、戦略として具体化されてから中期経営計画の形で届く。1つ飛ばす経路はない。",
 r:[N.P1,"変革構想書",N.P2]},

/* ---- 事実2：デジタル経営戦略 → デジタル経営実行計画 ---- */
{f:2,g:"A",q:"デジタル経営戦略プロセスが策定した中期経営計画は、どこで具体化され実行に移されるか。",
 c:["デジタル経営実行計画プロセス","IT開発・導入プロセス","変革・成長プロセス","提供価値検証プロセス"],a:0,
 e:"戦略は組織・機能別にブレイクダウンされ、価値実現サイクルの入口であるデジタル経営実行計画プロセスで実行計画に落とされる。",
 r:[N.P2,"中期経営計画",N.P3]},
{f:2,g:"A",q:"デジタル経営実行計画プロセスの主な入力はどれか。",
 c:["デジタル経営戦略プロセスからの中期経営計画","変革・成長プロセスからの変革構想書","IT開発・導入プロセスからの調達要件定義書","価値提供・運用プロセスからのモニタリング結果"],a:0,
 e:"デジタル経営戦略プロセスから展開された経営計画を受けて、業務プロセス設計とIT導入等の実行計画を策定する。",
 r:[N.P2,"中期経営計画",N.P3]},
{f:2,g:"A",q:"デジタル経営戦略が固まった。価値実現サイクルで最初に行うことはどれか。",
 c:["業務プロセスの設計とIT導入方針の決定を含む実行計画の策定","調達要件定義書の作成とサービス開発・提供者の選定","KPI達成状況に基づく検証と改善提案","ITサービスの利活用開始判断"],a:0,
 e:"価値実現サイクルの入口はデジタル経営実行計画プロセス。調達はIT開発・導入プロセス、検証は提供価値検証プロセスの仕事で、順序が飛んでいる。",
 r:[N.P2,"中期経営計画",N.P3]},
{f:2,g:"A",q:"「デジタル経営戦略企画書」を成果物とするプロセスはどれか。",
 c:["デジタル経営戦略プロセス","変革・成長プロセス","デジタル経営実行計画プロセス","提供価値検証プロセス"],a:0,
 e:"デジタル経営戦略プロセスの策定段階の成果物。経営ビジョン、ビジネスモデル、CSF、データ・IT利活用方針、戦略目標等を含む。"},

/* ---- 事実3：デジタル経営戦略 → 変革・成長 ---- */
{f:3,g:"A",q:"デジタル経営戦略達成度評価報告書は、どこへの入力となるか。",
 c:["変革・成長プロセス","デジタル経営実行計画プロセス","提供価値検証プロセス","価値提供・運用プロセス"],a:0,
 e:"デジタル経営成長サイクルは環状に回る。戦略の達成度評価が、次の変革を認識する起点になる。",
 r:[N.P2,"達成度評価",N.P1]},
{f:3,g:"A",q:"変革認識アクティビティの「現状分析と戦略評価」がインプットとするのはどれか。",
 c:["デジタル経営戦略達成度評価","提供価値検証結果レポート","価値提供結果の報告書","実行計画の評価結果"],a:0,
 e:"変革・成長プロセスは、デジタル経営戦略プロセスにおける達成度評価をインプットにする。目標値と実測値を対比し、未達の原因を特定した結果である。",
 r:[N.P2,"達成度評価",N.P1]},
{f:3,g:"A",q:"変革・成長プロセスが達成度評価のうち特にインプットとするのは、どの部分か。",

const GROUPS = [
  {id:"A",name:"成長サイクルの往復",sub:"変革・成長 ⇄ デジタル経営戦略 → 実行計画"},
  {id:"B",name:"実行計画からの展開",sub:"開発へ・検証へ・戦略へ戻す"},
  {id:"C",name:"開発から検証へ",sub:"稼働システム・気づき情報・提供結果"},
  {id:"D",name:"検証からの戻し",sub:"2分岐と、戦略へ直接行かない原則"},
  {id:"E",name:"共通基盤と主担当",sub:"5アクティビティと責任者"}
];

/* ================= 安定ID（問題を後から足しても記録が壊れない） ================= */
(()=>{const c={};DATA.forEach(d=>{c[d.f]=(c[d.f]||0)+1;d.id="f"+d.f+"-"+c[d.f];});})();
const byId = id => DATA.find(d=>d.id===id);

/* ================= 保存 ================= */
const KEY = "pgl-route-drill/v1";
let store = {stats:{}, session:null, history:[]};
let canSave = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) store = Object.assign(store, JSON.parse(raw));
    localStorage.setItem(KEY+"/probe","1"); localStorage.removeItem(KEY+"/probe");
  }catch(e){ canSave = false; }
}
function save(){ if(!canSave) return; try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ canSave=false; } }

/* 苦手＝一度でも間違えた、かつ そのあと2回連続で正解できていない */
const stat = d => store.stats[d.id];
const isWeak = d => { const s=stat(d); return !!s && s.ng>0 && s.streak<2; };
const isNew  = d => !stat(d);

/* ================= 状態 ================= */
let deck=[], idx=0, answered=false, results=[], picked=[];
let selGroups = new Set(GROUPS.map(g=>g.id));
let pickMode = "all", lenMode = 10;

const $ = s=>document.querySelector(s);
const shuffle = a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}return b};

/* ================= スタート画面 ================= */
function pool(){
  let l = DATA.filter(d=>selGroups.has(d.g));
  if(pickMode==="weak") l = l.filter(isWeak);
  if(pickMode==="new")  l = l.filter(isNew);
  return l;
}

function renderGroups(){
  $("#groupChips").innerHTML = GROUPS.map(g=>{
    const n = DATA.filter(d=>d.g===g.id).length;
    return `<label class="chip${selGroups.has(g.id)?" on":""}" data-g="${g.id}">
      <span class="box"></span>
      <span class="name">${g.name}<br><span style="font-weight:400;font-size:12px;color:var(--muted)">${g.sub}</span></span>
      <span class="count">${n}問</span>
    </label>`;
  }).join("");
  $("#groupChips").querySelectorAll(".chip").forEach(el=>{
    el.addEventListener("click",e=>{
      e.preventDefault();
      const g = el.dataset.g;
      if(selGroups.has(g)){ if(selGroups.size===1) return; selGroups.delete(g); el.classList.remove("on"); }
      else { selGroups.add(g); el.classList.add("on"); }
      refreshCounts();
    });
  });
}
function bindRow(sel, attr, cb){
  document.querySelectorAll(sel+" .chip").forEach(el=>{
    el.addEventListener("click",e=>{
      e.preventDefault();
      if(el.classList.contains("off")) return;
      document.querySelectorAll(sel+" .chip").forEach(x=>x.classList.remove("on"));
      el.classList.add("on"); cb(el.dataset[attr]);
    });
  });
}
bindRow("#pickRow","pick",v=>{ pickMode=v; refreshCounts(); });
bindRow("#lenRow","len",v=>{ lenMode=+v; });

function refreshCounts(){
  const base = DATA.filter(d=>selGroups.has(d.g));
  const w = base.filter(isWeak).length, n = base.filter(isNew).length;
  $("#weakN").textContent = w+"問";
  $("#newN").textContent = n+"問";
  document.querySelector('#pickRow .chip[data-pick="weak"]').classList.toggle("off", w===0);
  document.querySelector('#pickRow .chip[data-pick="new"]').classList.toggle("off", n===0);
  if((pickMode==="weak"&&w===0)||(pickMode==="new"&&n===0)){
    pickMode="all";
    document.querySelectorAll("#pickRow .chip").forEach(x=>x.classList.remove("on"));
    document.querySelector('#pickRow .chip[data-pick="all"]').classList.add("on");
  }
  $("#startBtn").textContent = pool().length ? "はじめる" : "対象の問題がありません";
  $("#startBtn").disabled = !pool().length;
}

function renderHome(){
  /* 中断していたセッション */
  const s = store.session;
  if(s && s.ids && s.idx < s.ids.length){
    $("#resumeSlot").innerHTML = `<div class="resume">
      <div class="rlabel">中断中</div>
      <p class="rtext">前回の続きが残っています。<b>${s.idx}</b> / ${s.ids.length} 問まで解答済み。</p>
      <button class="btn btn-primary" id="resumeBtn" style="width:100%">続きから再開する</button>
    </div>`;
    $("#resumeBtn").addEventListener("click",resume);
  } else $("#resumeSlot").innerHTML = "";

  /* 累計記録 */
  const ids = Object.keys(store.stats);
  if(ids.length){
    const tot = ids.reduce((a,k)=>a+store.stats[k].ok+store.stats[k].ng,0);
    const ok  = ids.reduce((a,k)=>a+store.stats[k].ok,0);
    const weak = DATA.filter(isWeak).length;
    const rows = GROUPS.map(g=>{
      const gs = DATA.filter(d=>d.g===g.id&&stat(d));
      if(!gs.length) return `<div class="rec-row"><span class="rn">${g.name}</span><span class="rb"></span><span class="rv">—</span></div>`;
      const o = gs.reduce((a,d)=>a+stat(d).ok,0), t = gs.reduce((a,d)=>a+stat(d).ok+stat(d).ng,0);
      const p = Math.round(o/t*100);
      return `<div class="rec-row"><span class="rn">${g.name}</span><span class="rb"><i style="width:${p}%"></i></span><span class="rv">${p}%</span></div>`;
    }).join("");
    $("#recSlot").innerHTML = `<div class="rec">
      <div class="rec-top">
        <div class="rec-cell"><div class="n">${Math.round(ok/tot*100)}%</div><div class="l">通算正答率（${tot}回）</div></div>
        <div class="rec-cell"><div class="n${weak?" warn":""}">${weak}</div><div class="l">苦手として残っている問題</div></div>
        <div class="rec-cell"><div class="n">${DATA.filter(isNew).length}</div><div class="l">まだ解いていない問題</div></div>
      </div>
      ${rows}
    </div>`;
  } else {
    $("#recSlot").innerHTML = canSave ? "" :
      `<div class="rec"><div class="rec-row"><span class="rn">この環境では学習記録を保存できません。公開URL（GitHub Pages）から開いてください。</span></div></div>`;
  }
  refreshCounts();
}

function begin(list){
  deck = list; idx=0; results=[]; picked=[];
  store.session = {ids:list.map(d=>d.id), idx:0, results:[]};
  save();
  showQuiz();
}
function resume(){
  const s = store.session;
  deck = s.ids.map(byId).filter(Boolean);
  idx = Math.min(s.idx, deck.length-1);
  results = s.results.slice();
  picked = [];
  showQuiz();
}
function showQuiz(){
  $("#start").classList.add("hide"); $("#result").classList.add("hide"); $("#quiz").classList.remove("hide");
  $("#qTotal").textContent = deck.length;
  buildRail(); render();
  window.scrollTo(0,0);
}

$("#startBtn").addEventListener("click",()=>{
  let list = shuffle(pool());
  if(lenMode>0) list = list.slice(0,lenMode);
  begin(list);
});
$("#resetBtn").addEventListener("click",()=>{
  if(!confirm("これまでの学習記録をすべて消します。よろしいですか。")) return;
  store = {stats:{}, session:null, history:[]};
  save(); renderHome();
});

/* ================= 進捗レール ================= */
function buildRail(){
  $("#rail").innerHTML = deck.map(()=>`<i class="tick"></i>`).join("");
}
function paintRail(){
  const ticks = $("#rail").children;
  for(let i=0;i<ticks.length;i++){
    ticks[i].className = "tick" + (results[i]===true?" ok":results[i]===false?" ng":(i===idx?" now":""));
  }
}

/* ================= 出題 ================= */
function render(){
  const q = deck[idx];
  answered=false;
  $("#qNow").textContent = idx+1;
  $("#qGroup").textContent = GROUPS.find(g=>g.id===q.g).name;
  $("#stem").textContent = q.q;
  $("#reveal").classList.add("hide");
  $("#routeSlot").innerHTML = "";

  const order = shuffle(q.c.map((t,i)=>({t,i})));
  picked[idx] = order;
  $("#opts").innerHTML = order.map((o,n)=>
    `<button class="opt" data-i="${o.i}" data-n="${n}"><span class="key">${n+1}</span><span>${o.t}</span></button>`
  ).join("");
  $("#opts").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
  paintRail();
}

function choose(chosen){
  if(answered) return;
  answered = true;
  const q = deck[idx];
  const ok = chosen === q.a;
  results[idx] = ok;

  const s = store.stats[q.id] || (store.stats[q.id] = {ok:0,ng:0,streak:0,last:0});
  if(ok){ s.ok++; s.streak++; } else { s.ng++; s.streak = 0; }
  s.last = Date.now();
  if(store.session){ store.session.idx = idx+1; store.session.results = results.slice(); }
  save();

  $("#opts").querySelectorAll(".opt").forEach(b=>{
    const i = +b.dataset.i;
    b.disabled = true;
    if(i===q.a) b.classList.add("correct");
    else if(i===chosen) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  $("#verdict").className = "verdict " + (ok?"ok":"ng");
  $("#verdict").innerHTML = `<span class="mark">${ok?"○":"×"}</span><span>${ok?"正解":"不正解"}</span>`;

  let badge = "";
  if(q.r){
    badge = `<div class="route">
      <div class="route-label">経路</div>
      <div class="route-line">
        <span class="node">${q.r[0]}</span>
        <span class="arrow"><span class="shaft"></span><span class="head"></span></span>
        <span class="node dest">${q.r[2]}</span>
      </div>
      <div class="route-note">${q.r[1]}</div>
    </div>`;
  } else if(q.role){
    badge = `<div class="role-badge">${q.role}</div>`;
  }
  $("#routeSlot").innerHTML = badge;
  $("#explain").textContent = q.e;
  $("#reveal").classList.remove("hide");
  paintRail();
  $("#nextBtn").textContent = idx===deck.length-1 ? "結果を見る" : "次へ";
  $("#nextBtn").focus({preventScroll:true});
  $("#reveal").scrollIntoView({behavior:"smooth",block:"nearest"});
}

$("#nextBtn").addEventListener("click",()=>{
  if(idx===deck.length-1){ finish(); return; }
  idx++; render(); window.scrollTo({top:0,behavior:"smooth"});
});

document.addEventListener("keydown",e=>{
  if($("#quiz").classList.contains("hide")) return;
  if(!answered && ["1","2","3","4"].includes(e.key)){
    const b = $("#opts").querySelector(`.opt[data-n="${+e.key-1}"]`);
    if(b) b.click();
  } else if(answered && (e.key==="Enter"||e.key===" ")){
    e.preventDefault(); $("#nextBtn").click();
  }
});

/* ================= 結果 ================= */
function finish(){
  $("#quiz").classList.add("hide"); $("#result").classList.remove("hide");
  window.scrollTo(0,0);
  store.history.push({t:Date.now(), ok:results.filter(Boolean).length, n:deck.length});
  if(store.history.length>60) store.history = store.history.slice(-60);
  store.session = null;
  save();
  const n = results.filter(Boolean).length, t = deck.length;
  const pct = Math.round(n/t*100);
  $("#score").innerHTML = `${n}<span> / ${t}　${pct}%</span>`;

  const note = pct===100 ? "全問正解。15個の固定事実は定着しています。角度を変えても崩れないか、シャッフルで数日空けて再確認を。"
    : pct>=80 ? "取りこぼしは特定の事実に偏っているはずです。下の内訳で弱い範囲だけを回してください。"
    : pct>=50 ? "まだ経路が像として結ばれていない状態です。白紙に矢印を描く練習を挟むと、伸び方が変わります。"
    : "まず範囲を1つに絞ってください。全体を薄く回すより、1範囲を確実にするほうが早く積み上がります。";
  $("#scoreNote").textContent = note;

  const rows = GROUPS.map(g=>{
    const ids = deck.map((d,i)=>d.g===g.id?i:-1).filter(i=>i>=0);
    if(!ids.length) return "";
    const c = ids.filter(i=>results[i]).length;
    return `<div class="bd">
      <span class="bd-name">${g.name}</span>
      <span class="bd-bar"><i style="width:${Math.round(c/ids.length*100)}%"></i></span>
      <span class="bd-num">${c}/${ids.length}</span>
    </div>`;
  }).join("");
  $("#breakdown").innerHTML = rows;

  const missed = deck.filter((_,i)=>!results[i]);
  $("#retryBtn").classList.toggle("hide", missed.length===0);
  $("#retryBtn").onclick = ()=>begin(shuffle(missed));
}
$("#againBtn").addEventListener("click",()=>{
  let list = shuffle(pool());
  if(lenMode>0) list = list.slice(0,lenMode);
  begin(list);
});
$("#homeBtn").addEventListener("click",()=>{
  $("#result").classList.add("hide"); $("#start").classList.remove("hide");
  renderHome(); window.scrollTo(0,0);
});

load();
renderGroups();
renderHome();
</script>
</body>
</html>
