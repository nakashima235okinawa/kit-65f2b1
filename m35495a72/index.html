<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ITC想定模試 100問 — PGL Ver.4.0 対応</title>
<style>
:root{
  --bg:#E9EBEE; --card:#FCFCFB; --ink:#17202B; --sub:#5C6672;
  --ai:#1F3A63; --shu:#B4362F; --midori:#2C6A4F; --rule:#C9CDD3; --gold:#8a6d1f;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:15px}
header{background:var(--ai);color:#fff;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-size:18px;margin:0;letter-spacing:.08em}
header .sub{font-size:11px;opacity:.75}
header .hspace{flex:1}
#timer{font-variant-numeric:tabular-nums;font-size:16px;letter-spacing:.05em;display:none}
#timer.warn{color:#ffd9d4}
main{max-width:860px;margin:18px auto 40px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(23,32,43,.05)}
h2{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--ai);letter-spacing:.05em}
.muted{color:var(--sub);font-size:13px}
button{font-family:var(--sans);cursor:pointer;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:9px 16px;font-size:14px}
button.primary{background:var(--ai);border-color:var(--ai);color:#fff}
button.danger{background:var(--shu);border-color:var(--shu);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px;cursor:pointer;transition:.12s}
.mode:hover{border-color:var(--ai);box-shadow:0 2px 8px rgba(31,58,99,.12)}
.mode b{font-family:var(--serif);font-size:16px;color:var(--ai);display:block;margin-bottom:6px}
.mode .muted{font-size:12px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.stat b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
/* 問題表示 */
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--sub)}
.tagchip{border:1px solid var(--rule);border-radius:999px;padding:1px 10px;background:#fff}
.flagbtn{margin-left:auto;font-size:12px;padding:4px 12px}
.flagbtn.on{background:#fff6e0;border-color:var(--gold);color:var(--gold)}
.stem{white-space:pre-wrap;font-size:15px;margin:4px 0 14px}
.qno{font-family:var(--serif);color:var(--ai);font-weight:700;margin-right:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;background:#fff;padding:10px 12px;cursor:pointer;text-align:left;font-size:14px;line-height:1.7}
.choice .pos{font-family:var(--serif);color:var(--ai);font-weight:700;min-width:1.4em}
.choice .tx{white-space:pre-wrap}
.choice:hover{border-color:var(--ai)}
.choice.sel{border-color:var(--ai);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--ai)}
.choice.ok{border-color:var(--midori);background:#eaf3ee;box-shadow:inset 0 0 0 1px var(--midori)}
.choice.ng{border-color:var(--shu);background:#faecea;box-shadow:inset 0 0 0 1px var(--shu)}
.choice.dim{opacity:.6}
.exp{margin-top:14px;border-left:4px solid var(--ai);background:#f2f4f8;border-radius:0 6px 6px 0;padding:12px 14px;font-size:13.5px}
.exp .vh{font-family:var(--serif);color:var(--ai);margin-bottom:6px}
.exp .chain{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);font-size:12.5px;color:var(--sub)}
.exp .chain .tagchip{margin:2px 4px 2px 0;display:inline-block}
.navrow{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.navrow .spacer{flex:1}
/* 番号グリッド */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--rule);border-radius:5px;background:#fff;text-align:center;padding:6px 0;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.answered{background:#eef2f8;border-color:var(--ai)}
.cell.flagged{box-shadow:inset 0 -3px 0 var(--gold)}
.cell.cur{outline:2px solid var(--ai)}
.cell.ok{background:#eaf3ee;border-color:var(--midori)}
.cell.ng{background:#faecea;border-color:var(--shu)}
/* バー */
.bar{height:10px;background:#e3e6ea;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai)}
.bar i.low{background:var(--shu)} .bar i.mid{background:var(--gold)}
.noderow{display:grid;grid-template-columns:11em 1fr 4.5em;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.noderow .nm{cursor:pointer;color:var(--ai)}
.noderow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips .c{border:1px solid var(--rule);border-radius:999px;background:#fff;padding:4px 13px;font-size:13px;cursor:pointer}
.chips .c.on{background:var(--ai);border-color:var(--ai);color:#fff}
.score-hero{text-align:center;padding:8px 0 2px}
.score-hero .big{font-family:var(--serif);font-size:44px;color:var(--ai);font-variant-numeric:tabular-nums}
.score-hero .of{color:var(--sub);font-size:15px}
footer{max-width:860px;margin:30px auto;padding:0 14px 30px;color:var(--sub);font-size:11.5px;line-height:1.9;border-top:1px solid var(--rule)}
.hide{display:none}
dialog{border:1px solid var(--rule);border-radius:8px;max-width:420px;padding:20px;font-family:var(--sans)}
dialog::backdrop{background:rgba(23,32,43,.4)}
@media(max-width:560px){.noderow{grid-template-columns:8em 1fr 4em}}
</style>
</head>
<body>
<header>
  <h1>ITC想定模試</h1><span class="sub">PGL Ver.4.0 対応・100問</span>
  <div class="hspace"></div>
  <div id="timer">120:00</div>
  <button id="homebtn" class="ghost" style="color:#fff;border-color:rgba(255,255,255,.4);font-size:12px;padding:5px 12px">ホーム</button>
</header>
<div id="swarn" style="display:none"></div>
<main id="app"></main>
<footer>
  本アプリは、ITコーディネータ協会（ITCA）とは無関係の非公式学習教材です。PGL Ver.4.0本文の転載はありません。

  成績データはこの端末のブラウザ内（localStorage）にのみ保存され、外部送信は行いません。
</footer>

<script>
const QS=[{"id":"q-b001","node":"COMMON-1","level":"基本","type":"A","pgl_page":3,"stem":"ITコーディネータ協会が定義する「デジタル経営」の説明として、より適切なものはどれか。","choices":{"ア":"データやデジタル技術を利活用してビジネスモデルそのものを変革し、新しい顧客価値を創造していくこと。","イ":"大量の情報（ビッグデータ）の利活用により、創造的で活力ある発展が可能となる社会を実現していくこと。","ウ":"情報とITをヒト・モノ・カネに続く第4の経営資源に位置づけ、その利活用能力の向上で企業の競争優位を確保していくこと。","エ":"経営環境の変化を洞察し、戦略に基づくデータとITの利活用による経営の変革で、企業の健全で持続的な成長を導く経営手法。"},"answer":"エ","dp":{"ア":4,"イ":5,"ウ":5},"explain":"イがITCAの定義（PGL p.3）。アはDXの説明、ウはデジタル社会形成基本法によるデジタル社会の定義、エはITC制度創設期（2000年代初頭）の位置づけであり、いずれも本文中の別概念。","verified":true},{"id":"q-b002","node":"COMMON-4","level":"基本","type":"B","pgl_page":14,"stem":"デジタル経営プロセスのうち、アクティビティを内包しないプロセスの組合せはどれか。","choices":{"ア":"変革・成長プロセス、IT開発・導入プロセス、価値提供・運用プロセス","イ":"デジタル経営戦略プロセス、IT開発・導入プロセス、提供価値検証プロセス","ウ":"デジタル経営戦略プロセス、デジタル経営実行計画プロセス、提供価値検証プロセス","エ":"変革・成長プロセス、デジタル経営実行計画プロセス、提供価値検証プロセス"},"answer":"ウ","dp":{"ア":5,"イ":2,"エ":2},"explain":"P2・P3・P6はアクティビティを内包せず、プロセス自体として記載される（p.14）。P1はP1-1/P1-2、P4はP4-1/P4-2、P5はP5-1/P5-2を内包する。アは内包する側の組合せ。","verified":true},{"id":"q-b003","node":"COMMON-4","level":"基本","type":"A","pgl_page":14,"stem":"デジタル経営成長サイクルと価値実現サイクルの実行関係として、より適切なものはどれか。","choices":{"ア":"デジタル経営成長サイクルのタスク実行中は価値実現サイクルのタスクは進捗しない、直列の関係で実行する。","イ":"両サイクルは並行で実行する。","ウ":"価値実現サイクルを完遂してから、その結果をもってデジタル経営成長サイクルを開始する。","エ":"2つのサイクルは統合し、単一のサイクルとして実行する。"},"answer":"イ","dp":{"ア":2,"ウ":2,"エ":4},"explain":"企業活動はゴーイングコンサーンが基本で、価値の実現と提供は常に行われていなければならず、経営環境も常に変化するため、両サイクルは並行実行とされる（p.14）。アは本文が明示的に否定する記述。","verified":true},{"id":"q-b004","node":"COMMON-4","level":"基本","type":"A","pgl_page":24,"stem":"「あらゆる局面で、個別議論に陥らず、全体視点で考える習慣をつける」ことを求める基本原則はどれか。","choices":{"ア":"全体視点で捉える（全体最適の原則）","イ":"戦略と実行を合わせる（戦略実行整合の原則）","ウ":"データとITを常に念頭に置く（デジタルシフトの原則）","エ":"説明責任を果たす（リーダーシップの原則）"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"基本原則5（p.24）。個別と全体の行き来で最適な方向を見定め、道の踏み外し（時代遅れ、社会価値とのずれ、思い込み等）に気付く。","verified":true},{"id":"q-b005","node":"COMMON-4","level":"基本","type":"A","pgl_page":25,"stem":"基本原則7「利用者との関係をより深める（利用者動機付けの原則）」の説明として、より適切なものはどれか。","choices":{"ア":"利用者の協力レベルは理解と共感の深さで決まり、利用者からのフィードバックがシステムの納期と完成度を左右する。","イ":"外部との対話に躊躇しないオープンマインドをもち、他社や地域との共創を自在に進められる体制と風土をつくり上げる。","ウ":"従業員一人ひとりの心に寄り添い、心理的安全性の高い職場環境作りを心がける。","エ":"事業の成果やリスクを可視化し、経験や勘ではなくデータを重視した判断をする体制に変える。"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"アが原則7の内容（p.25）。イは原則6（オープンな共創）、ウは原則9（学習と成長）、エは原則10（ファクトベース）の記述であり、記述自体は正しいが問われている原則のものではない。","verified":true},{"id":"q-b006","node":"P1-1","level":"基本","type":"B","pgl_page":32,"stem":"変革認識アクティビティのタスクを実施順に並べたものはどれか。\na. 現状分析と戦略評価\nb. 外部環境の変化を認識\nc. 変革の可能性を発見\nd. 変革への意思決定","choices":{"ア":"a → b → c → d","イ":"b → a → c → d","ウ":"a → c → b → d","エ":"b → c → a → d"},"answer":"ア","dp":{"イ":2,"ウ":2,"エ":2},"explain":"P1-1のタスクフローは図2.1.1（p.32）。タスク1「現状分析と戦略評価」から始まり、タスク4「変革への意思決定」で変革構想書と変革の表明を成果物とする（成果物一覧はp.124）。","verified":true},{"id":"q-b007","node":"P1-1","level":"基本","type":"A","pgl_page":34,"stem":"変革認識アクティビティのタスク4「変革への意思決定」の成果物はどれか。","choices":{"ア":"変革構想書、変革の表明","イ":"経営課題リスト","ウ":"現状のデジタル経営成熟度","エ":"デジタル経営戦略企画書"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"変革構想書と変革の表明はタスク4「変革への意思決定」の成果物（p.34。成果物一覧はp.124）。変革構想書はP2のインプットとなる。アはP2タスク2、ウはP1-2タスク1、エはP2タスク6の成果物。","verified":true},{"id":"q-b008","node":"P1-2","level":"基本","type":"A","pgl_page":37,"stem":"デジタル経営成熟度評価において、「部分的ではあるが、基本的な枠組みが形成され、再現性と理解度が向上」した状態はどのレベルか。","choices":{"ア":"レベル1　初期段階（探索）","イ":"レベル2　発展段階（形成）","ウ":"レベル3　定義段階（統合）","エ":"レベル4　管理段階（データ駆動）"},"answer":"イ","dp":{"ア":4,"ウ":4,"エ":4},"explain":"表2.1.3（p.37）。レベル1は断片的・属人的・場当たり的、レベル3は組織全体で統合が進み日常業務に不可欠、レベル4はKPI等でデータを活用した意思決定と継続的改善。","verified":true},{"id":"q-b009","node":"P2","level":"基本","type":"A","pgl_page":49,"stem":"デジタル経営戦略プロセスにおいて、「デジタル経営戦略企画書」を成果物とするタスクはどれか。","choices":{"ア":"タスク6　デジタル経営戦略策定","イ":"タスク3　あるべき姿の構築","ウ":"タスク7　デジタル経営戦略の展開","エ":"タスク8　デジタル経営戦略達成度評価"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"デジタル経営戦略策定の本文はp.48-49（成果物一覧はp.124）。タスク3は経営ビジョン（案）・ビジネスモデル（案）、タスク7は中期経営計画書、タスク8は達成度評価報告書。企画書（タスク6）→中計（タスク7）の順序も頻出の取り違え。","verified":true},{"id":"q-b010","node":"P2","level":"基本","type":"A","pgl_page":42,"stem":"新規性が高い製品・サービスで、想定顧客自身も価値を明確にできていない場合の情報収集の進め方として、より適切なものはどれか。","choices":{"ア":"想定顧客へのアンケート調査の規模を拡大し、統計的に有意な定量データを揃える。","イ":"業界レポートや競合他社の公開情報、専門家へのヒアリング等の分析を徹底し、市場の全体像を網羅的に把握する。","ウ":"要求・期待と提供すべき価値について仮説を立て、価値実現サイクルで実際に提供して検証する。","エ":"必要な情報が十分に揃うまで、デジタル経営戦略の策定自体を保留する。"},"answer":"ウ","dp":{"ア":5,"イ":5,"エ":2},"explain":"新規性が高い場合、既存の情報源だけでは不十分なことが多く、仮説を立ててC2で製品・サービスの提供を行い検証することで情報収集する（p.42）。ア・イは通常時の情報源であり本問の状況では不十分と本文が述べる。","verified":true},{"id":"q-b011","node":"P3","level":"基本","type":"B","pgl_page":69,"stem":"デジタル経営実行計画プロセスのタスク7「IT資源調達計画」に含まれる項目の組合せはどれか。\na. 調達の目的・範囲と調達要件\nb. 外部の協力先の体制\nc. 総合テストのテスト項目\nd. IT投資予算とスケジュール","choices":{"ア":"a、b、c","イ":"a、b、d","ウ":"a、c、d","エ":"b、c、d"},"answer":"イ","dp":{"ア":5,"ウ":5,"エ":5},"explain":"IT資源調達計画の本文はp.69（項目の一覧はp.125）。調達の目的・範囲、調達要件、外部の協力先の体制、IT投資予算、スケジュールを含む。cのテスト項目の決定はP4-1における開発マネジメント・検証方法の確立で行う（p.74）。なお選定の評価は開発リーダーや運用リーダーが中心となる（p.69）。","verified":true},{"id":"q-b012","node":"P4-1","level":"基本","type":"B","pgl_page":73,"stem":"IT開発アクティビティのタスクを実施順に並べたものはどれか。\na. 要件の確認と開発・調達の準備\nb. 調達実施\nc. 開発による要件の実現\nd. テスト","choices":{"ア":"b → a → c → d","イ":"a → c → b → d","ウ":"a → b → c → d","エ":"a → b → d → c"},"answer":"ウ","dp":{"ア":2,"イ":2,"エ":2},"explain":"図3.2.1（p.73）のタスク順。要件と調達の準備が先、調達実施、開発、テストの順。","verified":true},{"id":"q-b013","node":"P4-1","level":"基本","type":"A","pgl_page":73,"stem":"IT開発アクティビティにおける運用リーダーの関わり方として、より適切なものはどれか。","choices":{"ア":"開発マネジメントの体制を構築するとともに、スケジュールを踏まえてテストや検証の方法及びテスト項目を決定する。","イ":"調達先との間で責任範囲の明確化や納期、契約条件等の各種確認を主導する。","ウ":"運用・メンテナンスの実務経験を基に、運用上の課題や要件への影響を把握し、開発リーダーとの連携・協力・支援を行う。","エ":"業務要件の優先順位を決めて、開発の反復ごとの開発対象を決定する。"},"answer":"ウ","dp":{"ア":1,"イ":1,"エ":1},"explain":"p.73。ア・ウ・エはいずれも開発リーダーの役割（p.73-74）であり、主担当者のすり替え。P4-1の主担当は開発リーダー、運用リーダーは連携・協力・支援の立場。","verified":true},{"id":"q-b014","node":"P5-1","level":"基本","type":"A","pgl_page":81,"stem":"IT利活用による価値の提供アクティビティの各タスク（価値提供業務の開始・遂行、価値提供状況の情報取得・管理、価値提供結果の可視化）を実施するのは誰か。","choices":{"ア":"運用リーダー","イ":"開発リーダー","ウ":"サービス開発・提供者","エ":"デジタル経営推進者"},"answer":"エ","dp":{"ア":1,"イ":1,"ウ":1},"explain":"P5-1（IT利活用による価値の提供）はビジネス推進の活動であり、各タスクの実施主体はデジタル経営推進者（p.81-82）。一方、P5-2（ITサービス運用）は運用リーダーが主になる。P5の中で担い手が分かれる点が取り違えどころ。","verified":true},{"id":"q-b015","node":"P5-2","level":"基本","type":"A","pgl_page":85,"stem":"SLM（サービスレベルマネジメント）の説明として、より適切なものはどれか。","choices":{"ア":"IT資源やサービスの状態を常時監視し、リソース変化の予兆を読み取って改善情報とする。","イ":"変化し続ける価値への適応のため、ITシステム及びサービスの変更を計画的に行う。","ウ":"価値提供の目標が達成できるようにサービスレベルの調整を行い、顧客やステークホルダーとの合意形成を行う。","エ":"導入したシステムの運用・管理・パフォーマンス・セキュリティが、戦略や規制要件を満たしているかを評価する。"},"answer":"ウ","dp":{"ア":5,"イ":5,"エ":5},"explain":"SLMの定義はp.85。アはタスク2（モニタリング）、ウはタスク3（維持管理）、エはタスク4（システム監査）の記述で、いずれも同じP5-2内の別タスク。","verified":true},{"id":"q-b016","node":"P6","level":"基本","type":"B","pgl_page":90,"stem":"提供価値検証プロセスがフィードバックを行う宛先の組合せはどれか。\na. 価値実現サイクルの各プロセス\nb. デジタル経営実行計画プロセス\nc. デジタル経営戦略プロセス\nd. サイクルマネジメント","choices":{"ア":"a、c","イ":"b、d","ウ":"c、d","エ":"a、b"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"P6の検証とフィードバックの本文はp.90、タスク4（C2各プロセスへの改善提案）とタスク5（P3へのフィードバックレポート）はp.92-93（成果物一覧はp.126）。宛先が2系統ある点が問われどころ。P2への評価報告はC2からの別経路であり、P6のタスクとしての宛先ではない。","verified":true},{"id":"q-b017","node":"CB-2","level":"基本","type":"A","pgl_page":106,"stem":"コミュニケーションの4象限（図4.2.1）において、「エンゲージメント」に対応する頻度と密度の組合せはどれか。","choices":{"ア":"高頻度・高密度","イ":"低頻度・低密度","ウ":"高頻度・低密度","エ":"低頻度・高密度"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":4},"explain":"図4.2.1（p.106）は頻度と密度の2軸でコミュニケーションを整理し、「伝達」が低頻度・低密度、「エンゲージメント」がその対極。※図の4象限の名称と配置は紙面で要確認。","verified":true},{"id":"q-b018","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略プロセスのタスク1のITトレンド・デジタル環境情報収集において、内部情報の参考とするものはどれか。","choices":{"ア":"変革認識アクティビティでの情報収集と分析の結果","イ":"デジタル経営成熟度レベルの向上アクティビティでの成熟度評価についての情報","ウ":"提供価値検証プロセスで実施したITサービス利活用の検証結果","エ":"モニタリング＆コントロールが継続的に捕捉・蓄積してきたパフォーマンスデータ"},"answer":"イ","dp":{"ア":5,"ウ":3,"エ":3},"explain":"内部情報はP1-2の成熟度評価の情報を、外部情報はP1-1の情報収集と分析の結果を参考にする（p.44）。アは記述自体は正しいが外部情報側の参考元。","verified":true},{"id":"q-b019","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略プロセスのタスク2「経営環境情報の分析と経営課題の抽出」において、分析から抽出した課題に加えて経営課題とするものはどれか。","choices":{"ア":"提供価値検証プロセスが作成した各プロセスへの改善提案書","イ":"IT開発アクティビティの総合テストで検出された不具合の一覧","ウ":"セキュリティで継続的に収集・把握したインシデントと脆弱性の一覧","エ":"デジタル経営成熟度レベルの向上アクティビティで策定した成長計画"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"P1-2で策定した成長計画についても経営課題に加える（p.44）。分析の視点には強み弱み・機会脅威、事業ポートフォリオ、競争環境等がある。イ〜エはそれぞれ別の経路で扱われる情報。","verified":true},{"id":"q-b020","node":"P2","level":"基本","type":"A","pgl_page":46,"stem":"デジタル経営戦略プロセスのタスク3「あるべき姿の構築」の説明として、より適切なものはどれか。","choices":{"ア":"企業を取り巻く社会の価値観の変化に合わせて、判断のよりどころである経営理念そのものを再定義する。","イ":"経営ビジョン（案）とビジネスモデル（案）を構築し、経営理念との整合性を確認する。","ウ":"展開した方針・施策・目標・概要スケジュール等を取りまとめ、中期経営計画書を策定する。","エ":"検証評価に用いる評価指標と目標値、判断のための基準を設計する。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":5},"explain":"分析結果と経営課題をもとに「あるべき姿」としての経営ビジョン（案）・ビジネスモデル（案）を構築し、経営理念との整合性を確認する（p.45-46。整合性確認はp.46）。理念は判断のよりどころであり再定義の対象ではない。ウはタスク7、エはP3タスク6。","verified":true},{"id":"q-b021","node":"P2","level":"基本","type":"A","pgl_page":45,"stem":"経営課題の抽出やデジタル経営戦略の策定における意思決定の留意点として、より適切なものはどれか。","choices":{"ア":"意思決定の迅速さを最優先し、経験豊富な経営者の直勘に基づいて即断する。","イ":"判断から主観を完全に排除し、収集した事実情報・データのみから機械的に決定する。","ウ":"経営者の直勘だけに頼らず、客観的な判断材料と本質を見極めた主観的判断のバランスをとる。","エ":"意思決定の納得性を高めるため、関係者全員の意見が完全に一致するまで決定そのものを保留する。"},"answer":"ウ","dp":{"ア":4,"イ":4,"エ":2},"explain":"直勘だけに頼った変革認識と戦略策定は危険が伴うが、客観的判断材料と、事の本質を見極めた主観的判断のバランスが意思決定の納得性を高める（p.45留意点）。イとウはどちらか一方に振り切った粒度の誤り。","verified":true},{"id":"q-b022","node":"P2","level":"基本","type":"B","pgl_page":47,"stem":"データ・IT利活用方針の定義のうち、ITマネジメント方針の検討に組み込むデジタル経営共通基盤の組合せはどれか。","choices":{"ア":"コミュニケーションとセキュリティ","イ":"サイクルマネジメントとモニタリング＆コントロール","ウ":"モニタリング＆コントロールとコミュニケーション","エ":"サイクルマネジメントと組織学習"},"answer":"イ","dp":{"ア":3,"ウ":3,"エ":3},"explain":"ITマネジメント方針（推進体制、ITガバナンス、投資・コスト管理）にはCB-1とCB-3を組み込む（p.47）。一方、IT全体方針にはセキュリティ（CB-4）を組み込む（p.46）。どちらの方針にどのCBかの対応が問われどころ。","verified":true},{"id":"q-b023","node":"P2","level":"基本","type":"B","pgl_page":47,"stem":"経営リスク評価・対応において、純粋リスクに該当するものの組合せはどれか。\na. 大地震\nb. 情報漏洩\nc. 新規事業への投資による損失\nd. パンデミック","choices":{"ア":"a、b、c","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、d"},"answer":"エ","dp":{"ア":4,"イ":4,"ウ":4},"explain":"純粋リスクは大地震、津波、火災、テロ、パンデミック、事故、不祥事、情報漏洩、システムトラブル等の事象から引き起こされるもの。経営判断による利益や損失から発生するもの（c）は投機的リスク（p.47）。","verified":true},{"id":"q-b024","node":"P2","level":"基本","type":"A","pgl_page":48,"stem":"デジタル経営戦略目標の決定に関する記述として、より適切なものはどれか。","choices":{"ア":"KGIは、KPIをもとに検討する。","イ":"目標は全社と各事業で独立に設定し、相互の連動は求めない。","ウ":"KPIは最終達成時点のみを対象とし、実施途中段階では設定しない。","エ":"全社レベルのKPIには、事業レベルのKGIが含まれる。"},"answer":"エ","dp":{"ア":2,"イ":2,"ウ":2},"explain":"目標は企業全体と各事業で連動させることが必要であり、全社レベルのKPIには事業レベルのKGIが含まれる。KPIはCSFをもとに検討し、達成時期に加えて実施途中段階（1年後、2年後等）の達成状況を把握するためのKPIも設定する（p.48）。","verified":true},{"id":"q-b025","node":"P2","level":"基本","type":"A","pgl_page":51,"stem":"デジタル経営戦略達成度評価がインプットとする情報の経路として、より適切なものはどれか。","choices":{"ア":"IT開発アクティビティで実施した総合テストと利活用開始判断の結果を、提供価値検証プロセスの検証を経ずに直接受領したもの","イ":"組織学習で形式知化されたナレッジの蓄積件数と参照状況の集計","ウ":"価値提供・運用プロセスで測定された評価指標を、提供価値検証プロセスの検証を経てデジタル経営実行計画プロセスで評価した結果","エ":"変革認識アクティビティで実施した外部環境変化の分析結果の写し"},"answer":"ウ","dp":{"ア":3,"イ":3,"エ":3},"explain":"P5で測定→P6で検証→P3で評価、という経路を経た結果をインプットに、目標値と実測値を対比して達成度を評価する。評価結果はP1に引き継がれ、次なる変革構想のインプットとなる（p.51）。C2の測定・検証・評価の連鎖が問われどころ。","verified":true},{"id":"q-b026","node":"P3","level":"基本","type":"B","pgl_page":62,"stem":"デジタル経営実行計画プロセスのタスクを実施順に並べたものはどれか。\na. データとITの調査\nb. 現状業務・システムの調査・分析\nc. 戦略実現案の検討\nd. 評価指標の設計","choices":{"ア":"a → b → c → d","イ":"b → c → a → d","ウ":"b → a → c → d","エ":"b → a → d → c"},"answer":"ウ","dp":{"ア":2,"イ":2,"エ":2},"explain":"図3.1.1（p.62）。タスク2「現状業務・システムの調査・分析」→タスク3「データとITの調査」→タスク4「戦略実現案の検討」→（タスク5を経て）タスク6「評価指標の設計」の順。現状を知ってからITを調べ、施策を検討する流れ。","verified":true},{"id":"q-b027","node":"P3","level":"基本","type":"A","pgl_page":63,"stem":"デジタル経営実行計画プロセスのタスク1「目標の理解と詳細化」で行うこととして、より適切なものはどれか。","choices":{"ア":"経営計画の理解を深め、必要に応じて目標を分解して段階的に設定し、進め方を見極める。","イ":"業務やデータのフロー、システム構成等を可視化し、解決すべき業務・システムの課題を抽出する。","ウ":"施策アイディアを複数創出し、戦略適合性や実現性、経済性等の観点から評価・選定して優先順位を決める。","エ":"開発に必要な調達要件を決め、要件に対応した提案を依頼する書類（RFP）の発行を依頼する。"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"経営計画は抽象度が高い場合があり、目標に分解して段階的に設定するのも1つの方法。この段階で進め方（調査・分析に時間をかけるか、試行しながら検証するか）を見極める。成果物はリサーチ計画（p.63）。イはタスク2、ウはタスク4、エはタスク7の内容。","verified":true},{"id":"q-b028","node":"P3","level":"基本","type":"A","pgl_page":64,"stem":"実行計画の作成にあたり、ユーザーが社外の顧客である場合の調査の進め方として、より適切なものはどれか。","choices":{"ア":"社外の顧客から十分な調査協力が得られる時期が来るまで、実行計画の作成自体を保留する。","イ":"社外顧客への調査は困難なため省略し、業務に詳しい社内ユーザーの意見で代替する。","ウ":"チームで仮説を立てた上で、アンケートやインタビュー等により仮説の検証を行う。","エ":"事前の調査は行わず、想定される全機能を開発してから顧客の反応を確認する。"},"answer":"ウ","dp":{"ア":2,"イ":4,"エ":2},"explain":"社外の顧客に詳細な調査やヒアリングの時間を割いてもらうことは難しいため、仮説を立てて検証する進め方をとる。議論をしやすくするため具体的な顧客像（ペルソナ）を定義する（p.63-64）。","verified":true},{"id":"q-b029","node":"P3","level":"基本","type":"A","pgl_page":65,"stem":"PoC（概念実証）を実施する際の留意点として、より適切なものはどれか。","choices":{"ア":"自社に合う技術を見逃さないよう、最新技術の体験を目的として対象を限定せずに幅広く試用してみる。","イ":"PoCの検証は技術面の適合性に限定し、運用面の課題の確認は本番導入後に行う。","ウ":"先入観を避けるため、適用可否の判断基準は検証結果が出そろってから設定する。","エ":"単なる試用とならないよう、事前に目的と検証ポイント、判断基準を定義しておく。"},"answer":"エ","dp":{"ア":4,"イ":4,"ウ":2},"explain":"PoCでは何を検証すべきかを明確にし、事前に目的と検証ポイント、判断基準を定義しておく（p.65留意点）。検証で運用面の課題が見つかることもあり、技術面だけでなく総合的に評価して適用可否を判断する。","verified":true},{"id":"q-b030","node":"P3","level":"基本","type":"A","pgl_page":65,"stem":"実行計画の作成における、評価に必要なデータの扱いとして、より適切なものはどれか。","choices":{"ア":"評価に必要なデータをあらかじめ定義し、取得できるよう準備しておく。","イ":"システムの稼働後に自然に蓄積されていくデータの中から、評価に使えるものを事後に選び出す。","ウ":"データの定義と取得は、価値提供・運用プロセス開始後に運用リーダーが行う。","エ":"データの取得方法は、提供価値検証プロセスの検証を実施する時点で検討する。"},"answer":"ア","dp":{"イ":2,"ウ":1,"エ":2},"explain":"データは解決策が目標を達成できているかを測るために必須であり、評価に必要なデータをあらかじめ定義し、取得から有効活用の方法を定義した上で、適用できるITを調査する（p.65）。後工程まかせにすると測れない——q-a002（CB-3）の事例はまさにこの欠落。","verified":true},{"id":"q-b031","node":"P3","level":"基本","type":"A","pgl_page":66,"stem":"戦略実現案の検討において、机上の議論や検討だけでは施策の評価・選定ができない場合の対応として、より適切なものはどれか。","choices":{"ア":"施策の評価・選定が可能になるまで、関係者による検討会議を継続して合意を待つ。","イ":"プロトタイプや必要最低限の機能を定義してIT開発・導入プロセスにつなげ、実証する計画とする。","ウ":"候補となる複数の施策をすべて同時に並行して本格実行に移し、一定期間経過後の結果を比較して絞り込む。","エ":"客観性を確保するため、施策の評価・選定は外部コンサルタントの判断に全面的に委ねる。"},"answer":"イ","dp":{"ア":2,"ウ":4,"エ":5},"explain":"机上で評価できない場合は、プロトタイプや必要最低限の機能を定義してP4につなげ、C2を通して実証する計画とする（p.66）。なお採用されなかった施策も記録に残すことが留意点として挙げられている。","verified":true},{"id":"q-b032","node":"P3","level":"基本","type":"A","pgl_page":70,"stem":"経費精算や勤怠管理等、共通の一般業務向けクラウドサービスの評価・選定の進め方として、より適切なものはどれか。","choices":{"ア":"サービスや製品が標準で備えている機能の豊富さや新しさを、カタログで比較して評価する。","イ":"提案依頼書（RFP）を発行し、各社から提出された提案書の記載内容のみで評価する。","ウ":"同業他社での採用実績と市場シェアの高さを最優先の基準として選定する。","エ":"事前に評価基準（要件）を決めた上で、パイロットでの試行・導入により要件充足を検証する。"},"answer":"エ","dp":{"ア":4,"イ":5,"ウ":4},"explain":"低コストまたは無償の利用期間があるクラウドサービスは、実際に使って検証して評価・選定でき、共通の一般業務では試行・導入による評価の確実性が高い。ただし機能で評価するのではなく、事前に評価基準を決めて要件充足を検証する（p.70）。RFPによる提案の評価はもう1つの方法であり、大規模開発や複数ソリューション組合せの場合に有効。","verified":true},{"id":"q-b033","node":"P3","level":"基本","type":"A","pgl_page":71,"stem":"実行計画評価において、デジタル経営戦略プロセスへフィードバックする内容として、より適切なものはどれか。","choices":{"ア":"開発工程で検出された個別プログラムの不具合と、その修正履歴の一覧","イ":"戦略を見直さないと価値実現が難しい、顧客価値や競争上のポジショニング等の課題","ウ":"ITサービスレベル（SLA）について測定指標ごとの達成状況をまとめた月次の運用報告","エ":"全社の従業員を対象としたデジタル研修の受講状況の集計結果"},"answer":"イ","dp":{"ア":4,"ウ":3,"エ":5},"explain":"タスク9はP6の検証結果を受けて実行計画を見直すとともに、戦略実行の結果として、P2で見直さないと価値実現が難しい課題を報告する（p.71）。これでP6→P3→P2→P1というフィードバックの連鎖がつながる。イは開発内、ウはP5-2の管理情報。","verified":true},{"id":"q-b034","node":"CB-1","level":"基本","type":"A","pgl_page":100,"stem":"サイクルマネジメントタスク1「プロセス定義」に関する記述として、適切なものはどれか。","choices":{"ア":"デジタル経営実行計画プロセス〜提供価値検証プロセスの各プロセスを定義し、プロセスの目的、スケジュール、インプットとアウトプット、主たる活動、責任者を明確にする。","イ":"プロセス定義の対象は、事前に練られた計画を実行に移していくものに限られ、PoC等の仮説検証を繰り返す活動は対象に含めない。","ウ":"各プロセスの責任者はサイクルマネジメントの責任者が一括して兼ね、個々のプロセスには責任者を置かないよう定義する。","エ":"プロセス定義はタスク2の文書化が完了した後に着手し、文書の記載内容に合わせて後から確定させる。"},"answer":"ア","dp":{"イ":4,"ウ":1,"エ":2},"explain":"タスク1では、P3〜P6での各プロセスを定義し、プロセスの目的、スケジュール、インプットとアウトプット、主たる活動、責任者を明確にする（p.100）。対象は計画実行型もPoC等の仮説検証型も含み様々で、必要なプロセスと反復回数も異なる。例としてP4の責任者は実行の主体である開発リーダーであり、責任者は各プロセスに置かれる。","verified":true},{"id":"q-b035","node":"CB-1","level":"基本","type":"A","pgl_page":101,"stem":"サイクルマネジメントタスク3「プロセス実行」における役割分担として、適切なものはどれか。","choices":{"ア":"実行の主体はサイクルマネジメントの責任者であり、各プロセスの責任者は定義書の作成と実行結果の記録の保管のみを受け持つ。","イ":"実行の主体は各プロセスの責任者であり、サイクルマネジメントの責任者は実行状況を把握し、問題発生時には適切な支援を行い、実行の記録を蓄積する。","ウ":"プロセスの実行中に問題が発生した場合、サイクルマネジメントの責任者は当該プロセスをいったん停止させ、実行計画プロセスへ差し戻して計画の側から修正する。","エ":"プロセス定義した内容が実行されたかの記録は、問題が発生したプロセスについてのみ蓄積すれば足りる。"},"answer":"イ","dp":{"ア":1,"ウ":4,"エ":4},"explain":"タスク3では、タスク2で作成された文書に従ってプロセスが実行される。実行の主体は各プロセスの責任者であり、サイクルマネジメントの責任者は実行状況を把握し、問題発生時は適切な支援を行う。また、定義した内容が実行されたかの記録を蓄積する（p.101）。支援であって停止・差し戻しの権限行使ではなく、記録は問題の有無にかかわらず蓄積する。","verified":true},{"id":"q-b036","node":"CB-1","level":"基本","type":"A","pgl_page":102,"stem":"サイクルマネジメントタスク4「プロセス改善」に関する記述として、適切なものはどれか。","choices":{"ア":"改善の分析対象は出力情報としての活動成果に絞り、入力情報やプロセス内の活動は各プロセスの責任者の裁量に委ねて全体では扱わない。","イ":"プロセスの組み合わせは定義時に確定したものを維持することが原則であり、改善策にプロセスの変更や組み合わせの見直しを含めてはならない。","ウ":"入力情報、プロセス内の活動、活動成果等の全体の流れを分析して改善策を立案し、制約条件を管理してパフォーマンスを改善するとともに、長期的な変化を維持するための施策も組み込む。","エ":"改善策の立案は提供価値検証プロセスの検証結果の確定を待って行い、それまでは現行プロセスの実行に専念する。"},"answer":"ウ","dp":{"ア":4,"イ":4,"エ":2},"explain":"タスク4では、入力情報、プロセス内の活動、出力情報としての活動成果等の全体の流れを分析して改善策（必要に応じプロセスの柔軟な変更による適切な組み合わせの決定も含む）を立案し、制約条件を管理してパフォーマンスを改善する。組織が長期的な変化を維持できるようにするための施策も組み込む（p.102）。分析は全体の流れが対象で、プロセスの柔軟な変更も改善策に含まれる。","verified":true},{"id":"q-b037","node":"CB-1","level":"基本","type":"B","pgl_page":101,"stem":"サイクルマネジメントの実行により、「サイクルマネジメント」と「プロジェクトマネジメント」の間で行われることになるマネジメントの組合せとして、適切なものはどれか。\na. ポートフォリオマネジメント\nb. プログラムマネジメント\nc. ナレッジマネジメント\nd. インシデントマネジメント","choices":{"ア":"a、c","イ":"b、d","ウ":"c、d","エ":"a、b"},"answer":"エ","dp":{"ア":5,"イ":5,"ウ":5},"explain":"CB-1の実行により、多くの組織的イニシアティブを継続的に評価する「ポートフォリオマネジメント」と、ポートフォリオを見据えプロジェクトの全体管理により価値実現を行う「プログラムマネジメント」に相当するマネジメントが行われる（p.101）。ナレッジマネジメントは組織学習（CB-5）、インシデント対応はセキュリティ（CB-4）等で扱われる別文脈の要素である。","verified":true},{"id":"q-b038","node":"CB-2","level":"基本","type":"A","pgl_page":104,"stem":"コミュニケーションタスク1における、コミュニケーションとステークホルダー・エンゲージメントの関係として、適切なものはどれか。","choices":{"ア":"コミュニケーションは情報の伝達を目的とし、ステークホルダー・エンゲージメントは関係構築や対話促進を目的とするもので、両者の目的や役割並びに相互関係を明確にした上で方式を設定する。","イ":"コミュニケーションは関係構築や対話促進を目的とし、ステークホルダー・エンゲージメントは情報の伝達を目的とするものであり、方式の設定にあたっては後者の伝達の効率を優先して設計する。","ウ":"両者は実質的に同義であり、区別せずに一体の活動として扱うことで、方式設定の手間を省き効率的に共通の目標を達成できる。","エ":"ステークホルダー・エンゲージメントは社外の利害関係者のみを対象とする活動であり、社内メンバーとのやり取りはコミュニケーションとして扱う。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":4},"explain":"コミュニケーションは情報の伝達を目的とするもので、情報の受け手や伝達方法を明確に定義する。一方、ステークホルダー・エンゲージメントは関係構築や対話促進を目的とする。それぞれの目的や役割並びに相互関係を明確にした上で効果的なコミュニケーション方式を設定する（p.104）。両者の目的の取り違えや同一視、対象を社外に限る区別は本文にない。","verified":true},{"id":"q-b039","node":"CB-2","level":"基本","type":"A","pgl_page":103,"stem":"コミュニケーションにおける、部門を超えたコラボレーションの促進に関する記述として、適切なものはどれか。","choices":{"ア":"部門間の調整は各部門長同士の個別交渉に委ねることが基本であり、経営者は交渉が決裂した場合の仲裁に役割を限定する。","イ":"経営者が部門間のコラボレーションを推進する姿勢を示すコミットメントにより、組織全体に意識づけを行うことが重要である。","ウ":"まずチャットやビデオ会議等のコミュニケーションツールを全社導入することが先決であり、意識づけはツールの定着後に行う。","エ":"部門を超えたコラボレーションの推進はデジタル経営支援者が主導し、経営者は結果の報告を受ける立場に徹する。"},"answer":"イ","dp":{"ア":1,"ウ":2,"エ":1},"explain":"部門間の壁を超えて円滑なコミュニケーションを図ることでデジタル経営の効率性と有効性を向上させることができ、そのためには経営者のコミットメントが重要である。経営者が部門間のコラボレーションを推進する姿勢を示すことで、組織全体に意識づけを行うことができる（p.103）。部門長任せ・支援者主導・ツール先行は、経営者のコミットメントを核とする本文の趣旨と異なる。","verified":true},{"id":"q-b040","node":"CB-2","level":"基本","type":"A","pgl_page":105,"stem":"コミュニケーションタスク3で作成するコミュニケーションプロトコルに関する記述として、適切なものはどれか。","choices":{"ア":"ネットワーク上でシステム同士が情報をやり取りするための技術的な通信規約であり、その策定と管理はIT基盤の担当部門が行うため、ステークホルダー間の取り決めには含めない。","イ":"機密情報や詳細情報を共有の対象から一律に除外し、一般情報と公開情報のみを流通させるための取り決めである。","ウ":"ステークホルダー間で共有される情報カテゴリーとコミュニケーション方式を定義したもので、更新頻度、必要な詳細レベル、問題のエスカレーション方法等も含まれる。","エ":"会議体で用いる議事録や報告書の様式を統一するための文書標準であり、定期的なミーティングの開催要領を定める。"},"answer":"ウ","dp":{"ア":4,"イ":4,"エ":4},"explain":"情報には内部情報と外部情報、機密情報と公開情報、一般情報と詳細情報等、様々なカテゴリーが存在する。ステークホルダー間で共有される情報カテゴリーとコミュニケーション方式を定義したコミュニケーションプロトコルを作成し、更新頻度、必要な詳細レベル、問題のエスカレーション方法等も含める（p.105）。技術的な通信規約や様式統一の文書ではなく、機密情報等を一律に除外する取り決めでもない。","verified":true},{"id":"q-b041","node":"CB-2","level":"基本","type":"B","pgl_page":106,"stem":"コミュニケーションでは、ステークホルダーの役割と責任を明確化する。次のa〜dのうち、この明確化の「目的」に該当するものの組合せとして、適切なものはどれか。\na. コミュニケーションの円滑化\nb. 意思決定の効率化\nc. トラブルの防止\nd. コンプライアンスの強化","choices":{"ア":"a、b、c","イ":"a、b、d","ウ":"a、c、d","エ":"b、c、d"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":4},"explain":"役割と責任を明確化する目的は、a.コミュニケーションの円滑化、b.意思決定の効率化、c.トラブルの防止の3つである（p.106）。d.コンプライアンスの強化は、業務効率の向上・信頼関係の構築とともに、明確化による「効果」として現れるものであり（p.107）、目的とは区別して整理されている。","verified":true},{"id":"q-b042","node":"CB-3","level":"基本","type":"A","pgl_page":110,"stem":"モニタリング＆コントロールにおける継続的なモニタリング＆コントロールと定期的なモニタリング＆コントロールに関する記述として、適切なものはどれか。","choices":{"ア":"定期的なモニタリング＆コントロールを確実に実施していれば、日常のプロセスの中で行う継続的なモニタリング＆コントロールは省略できる。","イ":"継続的なものは経営者が実施主体となり、定期的なものは業務を実際に行っている部署の担当者が実施主体となるよう役割を分ける。","ウ":"継続的なモニタリング＆コントロールが十分に機能している組織では、定期的なモニタリング＆コントロールを実施する必要はない。","エ":"継続的なものは日常のプロセスの中で担当者や管理者自らが行い、定期的なものは環境変化等それだけではカバーしきれない部分を補完するもので、両者を組み合わせて仕組みを構築する。"},"answer":"エ","dp":{"ア":4,"イ":1,"ウ":4},"explain":"継続的なモニタリング＆コントロールは日常のプロセスの中で実施され、担当者自身が行うレベルとマネジメントが行うレベルがある。ビジネス環境の変化やシステムの複雑性、セキュリティ対策等の変化までは継続的なものだけで全てカバーすることは困難で、これを補完するのが定期的なモニタリング＆コントロールである。両者を組み合わせて効果的かつ効率的な仕組みを構築することが重要とされる（p.110-111）。","verified":true},{"id":"q-b043","node":"CB-3","level":"基本","type":"A","pgl_page":111,"stem":"モニタリング＆コントロールにおける「独立モニタリング」に関する記述として、適切なものはどれか。","choices":{"ア":"継続的なモニタリング＆コントロールの一形態であり、業務担当者が上長から独立した立場で、日常業務の中でリスクの自己点検を行うものを指すとされる。","イ":"第三者機関による監査や法令・規制の遵守、内部統制の改善等、特定の目的や対象を集中的に評価する必要がある場合に有効なモニタリングである。","ウ":"継続的・定期的の2種類のモニタリング＆コントロールを代替するもので、独立モニタリングを導入すれば両者は不要になる。","エ":"価値実現サイクルの全プロセスを常時網羅的に監視する仕組みであり、特定の対象への集中は避けるべきとされる。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":2},"explain":"継続的・定期的の2種類とは別に、第三者機関による監査や法令・規制の遵守、内部統制の改善等、特定の目的や対象を評価する必要がある場合に有効な「独立モニタリング」がある。独立モニタリングでは、継続的・定期的なモニタリングではカバーできない特定の目的や対象を集中的に評価することができる（p.111）。両者の代替ではなく補完であり、常時網羅監視や担当者の自己点検とは異なる。","verified":true},{"id":"q-b044","node":"CB-3","level":"基本","type":"A","pgl_page":111,"stem":"モニタリング＆コントロールタスク3「パフォーマンスデータの分析・評価」に関する記述として、適切なものはどれか。","choices":{"ア":"業務処理の証拠の確認は本来システム監査で行う作業であるため、モニタリング＆コントロールの差異分析では証拠の特定までは行わず、目標と実績の数値の比較に集中する。","イ":"パフォーマンスデータの蓄積と差異分析は、実績が目標を下回った場合にのみ行い、目標を達成している間は分析を省略して効率化する。","ウ":"目標と実績の差異分析には、業務処理が意図された通りに実施されたことを確かめる証拠の特定が重要で、証拠の特定を誤ると差異分析の結果は意味がなくなる可能性が高い。","エ":"データの分析・評価は担当者の経験に基づく定性的な判断を基本とし、パレート図や管理図等の統計的な手法の使用は避ける。"},"answer":"ウ","dp":{"ア":5,"イ":4,"エ":2},"explain":"差異分析を行うためには、業務処理があらかじめ意図された通りに実施されたことを確かめるための証拠を特定することが重要であり、証拠の特定を誤ると差異分析の結果は意味がなくなる可能性が高い。そのため評価方針・目標、評価精度、評価対象、評価技法・ツール等を明確にした評価計画を作成する（p.111）。分析は継続的・定期的に必要で、パレート図や管理図等を用いて分析・評価・レポーティングする（p.112）。","verified":true},{"id":"q-b045","node":"CB-3","level":"基本","type":"B","pgl_page":112,"stem":"モニタリング＆コントロールタスク4において、是正措置が必要な領域が特定された場合に講じる措置の例の組合せとして、適切なものはどれか。\na. プロセスの改善\nb. リソース配分の変更\nc. 従業員への追加トレーニングの実施\nd. 目標値（KGI）の即時引き下げ","choices":{"ア":"a、b、d","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、c"},"answer":"エ","dp":{"ア":4,"イ":4,"ウ":4},"explain":"是正措置には、プロセスの改善、リソース配分の変更、従業員への追加トレーニングの実施等が含まれる場合がある（p.112）。d.のような目標値の即時引き下げは是正措置の例として挙げられておらず、問題への対処ではなく基準の側を動かす対応であるため適切でない。","verified":true},{"id":"q-b046","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"セキュリティにおける、セキュリティ確保の責任のあり方に関する記述として、適切なものはどれか。","choices":{"ア":"特定の役割や部門の責任だけでなく企業全体で取り組むべき課題であり、従業員全体がセキュリティに関する意識を持ち、積極的に対策に取り組むことが求められる。","イ":"セキュリティの確保は専門部門と運用リーダーが専任で担うべき領域であり、他の従業員は通常業務への専念が望ましい。","ウ":"経営者はセキュリティ方針の提示までを担い、対策の実務には関与せず、優先度の判断や日々の運用はすべて現場の開発リーダー・運用リーダーに委ねることとされる。","エ":"高度化する脅威に対応するため、セキュリティの確保は外部の専門機関へ全面的に委託することが原則とされる。"},"answer":"ア","dp":{"イ":1,"ウ":4,"エ":1},"explain":"セキュリティの確保は特定の役割や部門の責任だけでなく、企業全体で取り組むべき重要な課題である。経営者やデジタル経営推進者、開発リーダー、運用リーダーだけが責任を持つのではなく、従業員全体がセキュリティに関する意識を持ち、積極的にセキュリティ対策に取り組むことが求められる（p.113）。専門部門の専任や外部への全面委託、経営者の実務不関与は本文の趣旨に反する。","verified":true},{"id":"q-b047","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"セキュリティの各タスクの実施のしかたに関する記述として、適切なものはどれか。","choices":{"ア":"タスクの取り組み順序は固定されており、タスク1の脅威・脆弱性の収集・把握から順番どおりに完了させなければ次へ進めない。","イ":"必ずしもタスク1から順に実施する必要はなく、組織の状況に応じて適切なタスクを選択して実施するが、全てのタスクを網羅的に、かつ、継続的に反復して実施することが重要である。","ウ":"組織が直面している状況に関係の深いタスクだけを選んで実施すればよく、関係が薄いタスクは実施の対象から外してよい。","エ":"全タスクを一巡して実施し体制が整った後は、セキュリティインシデントが発生した場合に限り再度実施すればよい。"},"answer":"イ","dp":{"ア":2,"ウ":4,"エ":4},"explain":"セキュリティの各タスクの取り組みの順序は、組織が直面している状況や従前の取り組みの状況等により変動する。必ずしもタスクを1から順に実施する必要はなく、状況に応じて適切なタスクを選択し実施する。ただし、全てのタスクを網羅的に、かつ、継続的に反復して実施することが重要である（p.113）。順序の固定、一部タスクの恒常的な省略、一巡での完了はいずれも本文と異なる。","verified":true},{"id":"q-b048","node":"CB-4","level":"基本","type":"A","pgl_page":116,"stem":"セキュリティタスク4におけるセキュリティ対策の実装に関する記述として、適切なものはどれか。","choices":{"ア":"人の手による運用対処は状況に応じた柔軟な判断ができるため、技術的な仕組みによる制御よりも優先して採用することが望ましい。","イ":"技術的対策を十分に実装すれば、組織的・人的対策や物理的対策は講じる必要がなくなり、対策の範囲を技術面に集約できる。","ウ":"技術的なセキュリティ対策は技術的な仕組みによって制御・管理できることが望ましく、やむを得ず人の手により運用する場合は、作業ミスの発生や稼働の逼迫を招く可能性に留意して判断する。","エ":"セキュリティ対策はすべて自動化された仕組みが整うまで実装を開始せず、部分的な対策の先行導入は避けることとされる。"},"answer":"ウ","dp":{"ア":2,"イ":4,"エ":4},"explain":"目標レベルの達成に必要なセキュリティ対策には組織的・人的対策、技術的対策、物理的対策等がある。技術的な対策は技術的な仕組みによって制御・管理できることが望ましいが、やむを得ず人の手により管理する場合もあり、その際は作業ミスの発生や稼働の逼迫を招く可能性に留意して判断する（p.116）。人手優先や技術面への集約、全自動化までの実装見送りは本文の趣旨と異なる。","verified":true},{"id":"q-b049","node":"CB-4","level":"基本","type":"B","pgl_page":114,"stem":"セキュリティタスク1「脅威・脆弱性の収集・把握」に含まれる活動の組合せとして、適切なものはどれか。\na. 同業他社や世の中のセキュリティ関連の事故・ニュース等の情報収集\nb. サービス開発・提供者やサプライヤー等からの脆弱性情報の収集\nc. システム更改をしていない場合の定期的な脆弱性の調査\nd. 発見された脅威に対するセキュリティ対策の実装","choices":{"ア":"a、b、d","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、c"},"answer":"エ","dp":{"ア":2,"イ":2,"ウ":2},"explain":"タスク1では、同業他社や世の中で起きているセキュリティ関連の事故やニュース等の情報を収集し、サービス開発・提供者やサプライヤー等とコミュニケーションをとって脆弱性情報を収集する。また、システムの更改をしていない場合でも、システムの特性や重要度に応じて定期的に脆弱性を調査することが望ましい（p.113-114）。d.の対策の実装はタスク4「セキュリティ対策の実装・体制作り」の活動である。","verified":true},{"id":"q-b050","node":"CB-5","level":"基本","type":"A","pgl_page":118,"stem":"組織学習に関する記述として、適切なものはどれか。","choices":{"ア":"各個人の学習を組織の全員で共有・応用し、価値創造を図る仕組みであり、企業の文化・風土を変えるものとして、現状を踏まえた中長期の取り組みと捉える必要がある。","イ":"短期集中の研修プログラムを全社員に受講させることで完結する取り組みであり、実施後は次の成熟度評価まで活動を休止する。","ウ":"個人のスキルアップを目的とする活動であり、組織としての価値創造とは切り離した上で、人事評価の枠組みの中の個人ごとの目標管理として、部門単位で運用するものとされる。","エ":"人材開発部門が単独で担う専門業務であり、経営者や事業部門は研修予算の承認を通じて間接的に関与する。"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":1},"explain":"組織学習（CB-5）とは、各個人の学習を組織の全員で共有・応用し、価値創造を図る仕組みである。企業の文化・風土を変えるものであり、企業の現状を踏まえた中長期の取り組みとして捉える必要があるが、成熟に時間がかかるがゆえに今すぐにでも取り組みを始める必要がある（p.118）。短期研修での完結や個人スキルアップへの限定、人材開発部門の単独業務という位置づけは本文と異なる。","verified":true},{"id":"q-b051","node":"CB-5","level":"基本","type":"A","pgl_page":118,"stem":"組織学習の取り組みに対する見直しの基準に関する記述として、適切なものはどれか。","choices":{"ア":"組織学習の取り組みに対する見直しは、提供価値検証プロセスの検証結果の確定を待って、その内容をもとに行われる。","イ":"組織学習の取り組みに対する見直しは、デジタル経営成熟度レベルの向上アクティビティで設定される成熟度目標をもとに行われる。","ウ":"組織学習の取り組みに対する見直しは、モニタリング＆コントロールで測定される測定・蓄積されるパフォーマンス指標のみを基準として行われる。","エ":"組織学習の取り組みに対する見直しは、人事評価の年次サイクルに合わせて年1回、人材開発部門の判断で行われる。"},"answer":"イ","dp":{"ア":3,"ウ":5,"エ":1},"explain":"組織学習の取り組みに対する見直しは、デジタル経営成熟度レベルの向上アクティビティ（P1-2）で設定される成熟度目標をもとに行われる（p.118）。組織学習が定着していけばデジタル経営のマインドやガバナンスが鍛えられ、結果としてデジタル環境やデジタル利活用のレベルが向上するとされ、成熟度と結びついた活動である。P6の検証結果やCB-3の指標のみ、人事の年次サイクルを基準とする記述はない。","verified":true},{"id":"q-b052","node":"CB-5","level":"基本","type":"B","pgl_page":118,"stem":"組織学習タスク1「組織学習の環境整備」における活動と、それを主導する役割の組合せとして、適切なものはどれか。","choices":{"ア":"従業員の動機付け—人材開発部門／組織学習推進チームの形成—経営者・人事部門","イ":"働き方改革の推進—開発リーダー／組織学習のプログラムの企画・実行—経営者","ウ":"従業員の動機付け—経営者／組織学習推進チームの形成—事業部門・人材開発部門","エ":"従業員の動機付け—組織学習推進チーム／働き方改革の推進—事業部門"},"answer":"ウ","dp":{"ア":1,"イ":1,"エ":1},"explain":"環境整備の活動と役割は、①従業員の動機付け＝経営者、②働き方改革の推進＝経営者・人事部門、③組織学習推進チームの形成＝事業部門・人材開発部門、④組織学習のプログラムの企画・実行＝事業部門・人材開発部門とされる（p.118-119）。動機付けはパーパス・ミッション・ビジョン・バリューの共有と組織学習への意思表示によるもので、経営者の役割である。","verified":true},{"id":"q-b053","node":"CB-5","level":"基本","type":"A","pgl_page":121,"stem":"組織学習タスク2の「仕組みの構築と標準化」に関する記述として、適切なものはどれか。","choices":{"ア":"個人の暗黙知を、形式知への変換を経ずにそのまま業務ルールとして文書化することにより、標準化のリードタイムを短縮する。","イ":"組織に共有された全ての形式知を例外なく標準化の対象とし、仕組み化できるかどうかの選別は行わずに一括して展開する。","ウ":"業務の標準化は現場の裁量や判断の柔軟性を狭めるおそれがあるため業務オペレーションには適用せず、データの利活用方法の標準化に範囲を限定して進めることとする。","エ":"形式知のうち仕組み化し標準化することができる部分を特定して業務オペレーションの標準化を推進し、ITシステムを利活用しながらデータの利活用方法等も標準化させる。"},"answer":"エ","dp":{"ア":2,"イ":4,"ウ":4},"explain":"仕組みの構築と標準化では、形式知のうち仕組み化し標準化することができる部分を特定し、業務オペレーションの標準化を推進する。ITシステムを利活用しながら業務の標準化を進め、データ利活用の仕組みも構築してデータの利活用方法等も標準化させる（p.121）。暗黙知のままの直接ルール化や全形式知の無選別な一括標準化、データ面への限定はいずれも本文と異なる。","verified":true},{"id":"q-b054","node":"P1-1","level":"基本","type":"A","pgl_page":33,"stem":"変革認識アクティビティの「現状分析と戦略評価」は、デジタル経営戦略プロセスにおけるデジタル経営戦略達成度評価をインプットにする。このうち変革・成長プロセスがインプットとする部分として、適切なものはどれか。","choices":{"ア":"目標値と実測値を対比した達成度の評価のうち、個々のITシステムの稼働実績や障害件数に関係する部分。","イ":"デジタル経営戦略達成度評価の全体であり、変革・成長プロセスの観点による部分の選別は行わずに全てをインプットとする。","ウ":"目標値と実測値を対比した達成度の評価のうち、外部環境の変化や、内部環境におけるデジタル経営成熟度に関係する部分。","エ":"競合他社の財務諸表等、自社のデジタル経営戦略達成度評価とは独立した外部の公開データに関係する部分。"},"answer":"ウ","dp":{"ア":3,"イ":4,"エ":3},"explain":"変革・成長プロセス（P1）は、デジタル経営戦略プロセス（P2）のデジタル経営戦略達成度評価をインプットとするが、そのうちインプットとするのは「外部環境の変化や内部環境におけるデジタル経営成熟度に関係する部分」である（p.33）。評価全体を無選別に受け取るのではなく、変革の認識に必要な部分を取り込む。","verified":true},{"id":"q-b055","node":"P1-1","level":"基本","type":"B","pgl_page":33,"stem":"変革認識アクティビティの「外部環境の変化を認識」で行うこととして、適切なものの組合せはどれか。\na. 予測することが難しい将来の変化について、兆候を捉えて変化が起きた場合に考えられるシナリオとして検討する\nb. 業界へ影響を与える変化は、現在の業界内の分析のみによって把握する\nc. 各省庁からデジタル経営に関わる様々な情報を収集する\nd. 海外企業のビジネスモデルの事例や新たなテクノロジー、社会動向の変化等の具体的な情報を収集する","choices":{"ア":"a、c、d","イ":"a、b、c","ウ":"a、b、d","エ":"b、c、d"},"answer":"ア","dp":{"イ":2,"ウ":2,"エ":2},"explain":"外部環境の変化の認識では、海外企業のビジネスモデル事例や新たなテクノロジー等の具体的な情報を収集し（d）、予測が難しい変化は兆候を捉えてシナリオとして検討する（a）。各省庁からの情報収集も行う（c）。一方、業界へ影響を与える変化は、異業種や新興企業の新規参入、代替品等、現在の業界内の分析だけでは得られない情報の収集が重要とされており、bは誤り（p.33）。","verified":true},{"id":"q-b056","node":"P1-1","level":"基本","type":"B","pgl_page":33,"stem":"変革認識アクティビティの「変革の可能性を発見」では、ビジネスモデルの要素を分解して観点ごとに検討することが有効とされる。「観点」と「手順」の組合せとして適切なものを選んだものはどれか。\na. 新たな顧客の可能性 — セグメントの見直し等により検討する\nb. 新たなニーズと提供価値の可能性 — ユーザーインタビュー等から顧客の新たなニーズを発見して検討する\nc. 新たな価値の提供方法の可能性 — 活動やコスト構造を見直すことで従来よりも低価格での価値提供を模索する\nd. 内部活動やリソース見直しの可能性 — デジタルの活用等も踏まえた新たな製品・サービスの提供方法を検討する","choices":{"ア":"a、c","イ":"a、b","ウ":"b、d","エ":"c、d"},"answer":"イ","dp":{"ア":2,"ウ":2,"エ":2},"explain":"変革の可能性発見の手順の例（表2.1.1、p.33）では、「新たな顧客の可能性」はセグメントの見直し等（a）、「新たなニーズと提供価値の可能性」はユーザーインタビュー等（b）で検討する。cとdは手順が入れ替わっており、低価格での価値提供の模索は「内部活動やリソース見直しの可能性」、新たな提供方法の検討は「新たな価値の提供方法の可能性」の手順である。","verified":true},{"id":"q-b057","node":"P1-2","level":"基本","type":"B","pgl_page":36,"stem":"デジタル経営成熟度の4つの評価視点のうち、価値実現サイクルの活動に関係する視点の組合せとして、適切なものはどれか。\na. デジタル経営マインド\nb. デジタル経営ガバナンス\nc. デジタル環境\nd. デジタル利活用","choices":{"ア":"a、b","イ":"a、c","ウ":"b、d","エ":"c、d"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"4つの評価視点のうち、「デジタル経営マインド」と「デジタル経営ガバナンス」はデジタル経営全体に関わる視点であり、「デジタル環境」と「デジタル利活用」が価値実現サイクル（C2）の活動に関係する視点である（p.36）。","verified":true},{"id":"q-b058","node":"P1-2","level":"基本","type":"A","pgl_page":36,"stem":"デジタル経営成熟度の各評価視点における評価項目の成熟度レベルを判断する情報の取得元として、適切なものはどれか。","choices":{"ア":"外部の調査会社が公表する業界平均のベンチマークデータから取得する。","イ":"デジタル経営共通基盤の各アクティビティから取得する。","ウ":"デジタル経営戦略プロセスの経営環境情報の収集タスクから取得する。","エ":"提供価値検証プロセスにおけるKPIの測定結果のみから取得する。"},"answer":"イ","dp":{"ア":3,"ウ":2,"エ":4},"explain":"各評価視点における評価項目の成熟度レベルを判断する情報は、デジタル経営共通基盤（CB）の各アクティビティから取得する（p.36）。サイクルマネジメント、コミュニケーション、モニタリング＆コントロール、セキュリティ、組織学習の各活動の状態が、成熟度判断の情報源となる。","verified":true},{"id":"q-b059","node":"P1-2","level":"基本","type":"A","pgl_page":37,"stem":"デジタル経営成熟度評価のレベル例において、レベル4（管理段階・データ駆動）の主な特徴として、適切なものはどれか。","choices":{"ア":"デジタル経営の取り組みについて組織全体で統合が進み、その活動が組織の日常業務に不可欠なものとして定着している。","イ":"革新が組織文化の一部となり、業界全体のイノベーションを牽引している。","ウ":"デジタルシフトを試みるものの、断片的、属人的で場当たり的な性質にとどまっている。","エ":"定量的に管理されたKPI等の指標を用いて、データを活用した意思決定と継続的な改善を促進している。"},"answer":"エ","dp":{"ア":2,"イ":2,"ウ":2},"explain":"レベル4（管理段階・データ駆動）は、定量的に管理されたKPI等の指標を用いてデータを活用した意思決定と継続的な改善を促進する段階である（表2.1.3、p.37）。「組織全体で統合が進み日常業務に不可欠」はレベル3（定義段階）、「革新が組織文化の一部」はレベル5（最適化段階）、「断片的、属人的で場当たり的」はレベル1（初期段階）の特徴である。","verified":true},{"id":"q-b060","node":"P1-2","level":"基本","type":"A","pgl_page":38,"stem":"デジタル経営成熟度レベルの目標設定に関する記述として、適切なものはどれか。","choices":{"ア":"ある特定の視点や項目のみが突出して高い成熟度を達成していても全体のパフォーマンスは向上しないため、バランスよく全体の項目の成熟度を成長させていく。","イ":"現時点の成熟度がレベル0の項目については、目標達成までの期間を短縮するため、中間の段階を経ずに一気にレベル3まで引き上げる目標を設定する。","ウ":"評価の一貫性を維持するため、評価項目は企業の規模や事業の特性によらず標準の項目のまま完全に固定して用い、自社に合わせたカスタマイズを行ってはならない。","エ":"成長度合いの評価は定量的な目標に対してのみ客観的に行い、現場や顧客の声等に基づく定性的な評価は行わない。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":3},"explain":"成熟度は特定の項目のみが突出して高くても全体のパフォーマンスは向上しないため、バランスよく全体を成長させることが重要である（p.38）。レベルアップは1段階ずつ行う必要があり、評価項目は企業の規模により多少のカスタマイズがあり得る（p.36）。評価は定性的・定量的な目標それぞれに対して客観的に行う（p.38）。","verified":true},{"id":"q-b061","node":"P4-1","level":"基本","type":"A","pgl_page":73,"stem":"IT開発アクティビティの「要件の確認と開発・調達の準備」に関する記述として、適切なものはどれか。","choices":{"ア":"開発要件はデジタル経営実行計画プロセスで確定済みであるため、合意の下での変更があっても開発体制やスケジュールの見直しは行わない。","イ":"価値実現サイクルを回転させて段階的に開発を実施する場合、要件の優先順位を決めて反復内での開発対象を決める。","ウ":"IT資源の調達は単一のサービスとして一括で実現することが原則であり、サービスや機能を調達できる単位に整理してはならない。","エ":"運用上の課題や要件に対する影響の把握は、システムの引き継ぎを受けた後に運用リーダーが単独で行う。"},"answer":"イ","dp":{"ア":4,"ウ":4,"エ":1},"explain":"段階的に開発を実施する場合は要件の優先順位を決めて反復内での開発対象を決める（p.73）。合意の下で変更された開発要件により体制・スケジュール・タスク等を変更・見直しすることもあり、IT資源の調達はサービスや機能を調達できる単位に整理する。運用リーダーは開発段階から運用上の課題や影響を把握し、開発リーダーとの連携・協力・支援を行う。","verified":true},{"id":"q-b062","node":"P4-1","level":"基本","type":"A","pgl_page":75,"stem":"IT開発アクティビティの調達実施において、提案依頼書（RFP）による調達を行う場合の記述として、適切なものはどれか。","choices":{"ア":"RFPの発行は調達の実務にあたるため、経営者やあらかじめ定められたステアリングコミッティの承認を得ることなく、開発の担当者限りの判断で速やかに行う。","イ":"提案依頼対象者への説明内容や提供情報、質問に対する補足・追加事項は、選定の効率を高めるため、有力な候補者に対してのみ優先的に開示する。","ウ":"RFPには企業の営業秘密が含まれる場合もあるため、RFPの発行に先立ち、外部のサービス開発・提供者と秘密保持契約書（NDA）を取り交わすこともある。","エ":"選定外となった外部のサービス開発・提供者に対しては、非採択の理由を通知せずに選定手続を終了する。"},"answer":"ウ","dp":{"ア":1,"イ":3,"エ":5},"explain":"RFPには営業秘密が含まれる場合もあるため、発行に先立ちNDAを取り交わすこともある（p.75）。RFPは経営者あるいはあらかじめ定められたステアリングコミッティの承認を得た上で発行し、説明内容や提供情報は提案依頼対象者全員に平等に開示する。選定外となった提供者には非採択の理由を通知する。","verified":true},{"id":"q-b063","node":"P4-1","level":"基本","type":"B","pgl_page":76,"stem":"IT開発アクティビティの「調達実施」における成果物の例の組合せとして、適切なものはどれか。\na. RFP\nb. 外部のサービス開発・提供者リスト\nc. 変革構想書\nd. 秘密保持契約書（NDA）","choices":{"ア":"a、b、c","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、d"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"調達実施の成果物の例には、RFP、外部のサービス開発・提供者リスト、秘密保持契約書（NDA）、提案書、選定結果報告書、契約書、SLA、調達したIT資源等がある（p.76）。cの変革構想書は変革認識アクティビティ（P1-1）の成果物であり、調達実施の成果物ではない。","verified":true},{"id":"q-b064","node":"P4-1","level":"基本","type":"A","pgl_page":77,"stem":"IT開発アクティビティの「開発による要件の実現」に関する記述として、適切なものはどれか。","choices":{"ア":"開発により要件の実現を行う中で、不足している機能や顧客満足につながる新たな価値に気が付いた場合は、提供価値検証プロセスへその気付きを共有する。","イ":"業務アプリケーションやシステムは要件どおりに正しく動作することのみが重要であり、使いやすさや顧客のニーズ・期待への合致は開発の段階では考慮しない。","ウ":"テストの自動化やテスト駆動開発の採用は、サイクルの反復を遅らせる要因となるため検討の対象から外す。","エ":"プログラムコードの履歴管理は、開発が完了した後にまとめて文書として記録すれば足りる。"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":2},"explain":"開発中に不足機能や新たな価値に気付いた場合は、提供価値検証プロセス（P6）へ気付きを共有する（p.77）。システムは単に動作するだけでなく顧客のニーズや期待に合致し使いやすいことが重要であり、テストの自動化やテスト駆動開発、リポジトリ管理システムによるコード履歴管理はサイクル反復の高速化につながる取り組みである。","verified":true},{"id":"q-b065","node":"P4-1","level":"基本","type":"A","pgl_page":77,"stem":"IT開発アクティビティにおけるテストに関する記述として、適切なものはどれか。","choices":{"ア":"テストは開発内容を熟知した開発リーダーのみで完結させることが望ましく、テストの種別や目的によらず、運用リーダー等のステークホルダーはアサインしない。","イ":"テストを十分に厳重に実施しさえすれば、テストの種類や範囲の設定によらず、システムに脆弱性や不具合が残る可能性はなくなる。","ウ":"テストに合格すること自体を目的とするのではなく、価値提供のための要件が正しく実装されていることを検証することが本質的な目的である。","エ":"テスト計画は、実施した内容を記録するためにテストの実施後に作成する。"},"answer":"ウ","dp":{"ア":1,"イ":4,"エ":2},"explain":"テストの本質的な目的は、合格すること自体ではなく、価値提供のための要件が正しく実装されていることの検証である（p.77）。テストは種別や目的に応じて運用リーダー等の必要なステークホルダーをアサインして実施し、種類や範囲の設定を誤ると厳重に行っても脆弱性や不具合が残る可能性があるため、あらかじめテスト計画を立てて適切なテストアプローチを検討する（p.78）。","verified":true},{"id":"q-b066","node":"P4-2","level":"基本","type":"B","pgl_page":79,"stem":"IT導入アクティビティの「IT資源配備・展開準備」で行うこととして、適切なものの組合せはどれか。\na. 開発・調達したIT資源を、レビューや承認を経た上で検証環境やステージング環境等に配備・展開する\nb. IT資源の利用に際しての利用規約やセキュリティポリシー等を準備する\nc. 本番環境への移行準備を行い、移行方式や緊急時の代替策、復旧方針・手順も検討する\nd. 提供価値の検証を行い、計画通りに価値提供が行えたのかどうかを確認する","choices":{"ア":"a、b、d","イ":"a、b、c","ウ":"a、c、d","エ":"b、c、d"},"answer":"イ","dp":{"ア":3,"ウ":3,"エ":3},"explain":"IT資源配備・展開準備では、デジタル経営推進者等によるレビューや承認を経てIT資源を検証環境やステージング環境等に配備・展開し（a）、利用規約やセキュリティポリシー等を準備し（b）、本番環境への移行準備として移行方式・手順や緊急時の代替策、復旧方針・手順も検討する（c）（p.79）。dの提供価値の検証は提供価値検証プロセス（P6）のタスクであり、本アクティビティでは行わない。","verified":true},{"id":"q-b067","node":"P4-2","level":"基本","type":"A","pgl_page":79,"stem":"IT導入アクティビティにおける新しい環境へのシステムの展開に関する記述として、適切なものはどれか。","choices":{"ア":"展開時の検証は各機能が正しく動作することの確認に限定し、セキュリティやパフォーマンス、可用性の検証は運用を開始してから順次実施する。","イ":"本番環境への移行時のバックアップ方法の検討は、移行時にトラブルが実際に発生してから着手する。","ウ":"移行手順や復旧手順の検討は外部のサービス開発・提供者に一任し、導入企業側では内容を把握しない。","エ":"各機能が正しく動作することの確認だけでなく、セキュリティ、パフォーマンス、可用性等の側面においても検証を行い、リスクを最小限に抑える。"},"answer":"エ","dp":{"ア":3,"イ":2,"ウ":1},"explain":"新しい環境にシステムを展開する際には、機能の動作確認だけでなくセキュリティ、パフォーマンス、可用性等の側面でも検証を行い、リスクを最小限に抑える（p.79）。移行手順とバックアップ方法は展開の準備段階で検討し、トラブル発生に備えて代替策や復旧手順、緊急時の対応策を事前に準備しておく。","verified":true},{"id":"q-b068","node":"P4-2","level":"基本","type":"A","pgl_page":80,"stem":"IT導入アクティビティの「ITシステム導入・利活用開始」に関する記述として、適切なものはどれか。","choices":{"ア":"開発リーダーは、判断結果について経営者やデジタル経営推進者に報告してITサービス利活用開始の承認を受け、承認後、価値提供・運用プロセスへ引き継ぐ。","イ":"IT導入実行計画書は、タスクへのブレイクダウンや担当部門・役割と責任の明確化は行わず、導入完了の期日のみを定めて簡潔に策定する。","ウ":"運用リーダーは、ITの運用等に関する問題の検証が目的であっても、IT導入計画には参加しない。","エ":"ITサービス利活用開始の承認は導入の状況を最もよく把握している開発リーダー自身が行い、経営者やデジタル経営推進者への報告は導入がすべて完了した後にまとめて行う。"},"answer":"ア","dp":{"イ":4,"ウ":1,"エ":1},"explain":"開発リーダーはIT導入の状況や利活用の準備状況から判断結果を経営者やデジタル経営推進者に報告し、ITサービス利活用開始の承認を受ける。承認後、価値提供・運用プロセス（P5）へ引き継ぐ（p.80）。IT導入実行計画書はタスクにブレイクダウンして担当部門・役割と責任・期日等を明確化して策定し、運用リーダーはIT導入計画に積極的に参加する（p.79）。","verified":true},{"id":"q-b069","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"IT利活用による価値の提供アクティビティの「価値提供業務の開始」に関する記述として、適切なものはどれか。","choices":{"ア":"業務の遂行準備は営業・マーケティング業務に限定し、サプライチェーン業務やアフターサポート業務は準備の対象に含めない。","イ":"要員に対する教育は業務開始後に実務を通じて行うこととし、業務開始前には実施しない。","ウ":"顧客視点での価値の想定においては、カスタマージャーニーやカスタマーエクスペリエンス等の考え方を用いることができる。","エ":"業務手順は、価値提供の水準や品質とは切り離し、作業の順序のみを定めて作成する。"},"answer":"ウ","dp":{"ア":3,"イ":2,"エ":5},"explain":"顧客視点での価値の想定には、購入・利用に至るまでの思考や感情・体験を旅の道のりのように捉えるカスタマージャーニーや、カスタマーエクスペリエンスの考え方を用いることができる（p.82）。遂行準備はサプライチェーン業務やアフターサポート業務等も含めて行い、業務開始前までに要員教育を実施する。業務手順は価値提供が想定した水準以上の品質で提供できるように作成する。","verified":true},{"id":"q-b070","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"IT利活用による価値の提供アクティビティにおいて、外部委託先に業務を委託する場合の記述として、適切なものはどれか。","choices":{"ア":"業務の実態を最もよく知るのは委託先であるため、その専門性を尊重する観点から、サービスレベルの設定と維持・管理の方法は委託先の裁量に全面的に委ねる。","イ":"デジタル経営推進者は、業務が顧客にもたらす価値の意味や水準、品質等を明確にして要件化し、SLAの契約を取り交わすことで、サービスレベルが担保されるようにする。","ウ":"サービスレベルの把握は委託先の管理業務に含まれるため、業務を外部委託する場合には、発注側でサービスレベルを把握するのに必要な各種指標を定める必要はない。","エ":"委託の契約では価格と納期のみを明確に定めることとし、業務が顧客にもたらす価値の意味や水準、品質等は、契約の内容には含めずに委託先との日常の調整に委ねる。"},"answer":"イ","dp":{"ア":1,"ウ":3,"エ":5},"explain":"外部委託先に業務を委託する場合、デジタル経営推進者は業務が顧客にもたらす価値の意味や水準、品質等を明確にして要件化し、SLAの契約を取り交わしてサービスレベルが担保されるようにしなければならない（p.82）。また、サービスレベルを適切に把握するのに必要な各種指標を定め、サービスレベルマネジメントの仕組みを確立する。","verified":true},{"id":"q-b071","node":"P5-1","level":"基本","type":"A","pgl_page":83,"stem":"IT利活用による価値の提供アクティビティの「価値提供状況の情報取得・管理」に関する記述として、適切なものはどれか。","choices":{"ア":"収集する情報は業務の担当者がその都度自由に選定するものとし、あらかじめ定められた評価指標には基づかない。","イ":"情報の収集は担当者の手作業によることが望ましく、自動的な収集やデジタルデータとしての蓄積・管理は避ける。","ウ":"不足している情報や未収集のデータが判明して緊急に対処する必要がある場合でも、報告は定例の可視化のタイミングまで行わない。","エ":"デジタル経営実行計画プロセスで作成した「評価指標と目標値」に基づき、評価に必要な情報の収集を行う。"},"answer":"エ","dp":{"ア":2,"イ":5,"ウ":2},"explain":"価値提供状況の情報取得・管理では、デジタル経営実行計画プロセス（P3）で作成した「評価指標と目標値」に基づいて評価に必要な情報を収集する（p.83）。集計やレポーティングの効率化のため、可能な限り自動的に収集しデジタルデータとして蓄積・管理できることが望ましく、緊急に対処する必要がある場合には提供価値検証プロセス（P6）に報告を行う。","verified":true},{"id":"q-b072","node":"P5-1","level":"基本","type":"B","pgl_page":84,"stem":"IT利活用による価値の提供アクティビティの「価値提供結果の可視化」における望ましい取り組みの組合せとして、適切なものはどれか。\na. 恣意的でなく、客観的な分析とデータを基にした報告を行う\nb. 報告の作成は、同じ視点を持つ担当者のみで行う\nc. 情報がデジタルデータとして取得されている場合には、レポーティング機能等を用いる\nd. 収集した情報の分析から得られる示唆や次のフェーズでのアクションプラン等、今後の改善への展望を報告に含める","choices":{"ア":"a、c、d","イ":"a、b、c","ウ":"a、b、d","エ":"b、c、d"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":4},"explain":"価値提供結果の可視化では、客観的な分析とデータに基づく報告により信頼性を高め（a）、デジタルデータにはレポーティング機能等を用い（c）、今後の改善への展望を報告に含めることが望ましい（d）（p.84）。報告は異なる視点や専門知識を持つ人々の意見を取り入れることでバランスが取れるため、bは適切でない。","verified":true},{"id":"q-b073","node":"P5-2","level":"基本","type":"A","pgl_page":86,"stem":"ITサービス提供の実態が外部のサービス開発・提供者にアウトソーシングされている場合の、サービスレベルマネジメント（SLM）に関する記述として、適切なものはどれか。","choices":{"ア":"ITサービス提供の実態がアウトソーシングされている場合には、SLM推進の責任もITサービスの提供実務を担う外部のサービス開発・提供者側に移転する。","イ":"ITサービス提供の実態が社外にある場合は、委託契約により品質が担保されるため、導入企業においてSLMの仕組みを構築する必要はない。","ウ":"ITサービスの実態が社内外のいずれにあってもSLMの仕組みの構築は必須であり、アウトソーシングされている場合でも、SLM推進の責任は導入企業にある。","エ":"SLM要領は外部のサービス開発・提供者側で作成するものであり、導入企業のITサービス提供部門では作成しない。"},"answer":"ウ","dp":{"ア":1,"イ":4,"エ":1},"explain":"ITサービスの実態が社内外のいずれにあってもSLMの仕組みの構築は必須であり、アウトソーシングされている場合でもSLM推進の責任は導入企業にある（p.86）。確実にSLMを実現するために、必要に応じてSLM要領をITサービス提供部門において作成する。","verified":true},{"id":"q-b074","node":"P5-2","level":"基本","type":"A","pgl_page":86,"stem":"ITサービス運用アクティビティの「IT資源、サービスのモニタリング」に関する記述として、適切なものはどれか。","choices":{"ア":"モニタリングは障害の発生を検知してから開始することとし、平常時のIT資源やサービスの状態は監視の対象としない。","イ":"合意されたサービスレベル測定指標に沿って、モニタリング対象のデータの更新頻度や収集方法を明確化し、データが適切なタイミングで入手できるようにする。","ウ":"モニタリングデータは、収集と集計の効率を優先して取得したままの状態でそのまま用いることとし、正確性を保つための校正やフィルタリング、偽情報の影響の排除は行わない。","エ":"モニタリングの結果は運用部門の内部での記録に留めることとし、改善のための情報として次のタスクにはインプットしない。"},"answer":"イ","dp":{"ア":2,"ウ":5,"エ":2},"explain":"モニタリングでは、合意されたサービスレベル測定指標に沿って対象データの更新頻度や収集方法を明確化し、データが適切なタイミングで入手できるようにする。また、モニタリングデータは適切に校正やフィルタリングを行って正確性を保ち、偽情報の影響を排除する（p.86）。IT資源やサービスの状態から読み取った変化は、改善のための情報として次のタスク（ITシステム、サービスの維持管理）にインプットする。","verified":true},{"id":"q-b075","node":"P5-2","level":"基本","type":"A","pgl_page":87,"stem":"ITサービス運用アクティビティにおけるインシデント管理に関する記述として、適切なものはどれか。","choices":{"ア":"インシデントに備えた対策や体制、手順、教育の整備は、インシデントが実際に発生してから着手する。","イ":"有事の際は、定められた手順よりも現場の担当者のその場の判断を優先して対応する。","ウ":"暫定処置によりサービスが復旧した場合には、原因究明と再発防止対策は省略することができる。","エ":"発生したインシデントへの暫定処置が完了した後、原因究明と再発防止対策を実施する。"},"answer":"エ","dp":{"ア":2,"イ":1,"ウ":4},"explain":"インシデント管理では、サービス停止時の運用や保証、リスクに備えた対策と体制、手順、教育を事前に行い、有事の際は定められた手順通りに対応して被害を最小限に抑える。暫定処置の完了後には、原因究明と再発防止対策を実施する（p.87）。復旧をもって対応を終えるのではなく、再発防止までがインシデント管理である。","verified":true},{"id":"q-b076","node":"P5-2","level":"基本","type":"B","pgl_page":88,"stem":"システム監査の基本的な実施手順を、実施順に並べたものはどれか。\na. 予備調査\nb. 本調査\nc. システム監査計画の作成\nd. 報告\ne. フォローアップ","choices":{"ア":"c → a → b → d → e","イ":"a → c → b → d → e","ウ":"c → b → a → d → e","エ":"a → b → c → d → e"},"answer":"ア","dp":{"イ":2,"ウ":2,"エ":2},"explain":"システム監査は、①システム監査計画の作成、②予備調査、③本調査、④報告、⑤フォローアップの順に実施する（p.88）。まず監査の範囲・目標・スケジュール等を定めた監査計画を作成し、初期的な情報収集である予備調査を経て、特定されたリスクに対する詳細な本調査を行う。評価結果はシステム監査報告書として経営陣へ報告し、推奨対策の実施状況を定期的にフォローアップする。","verified":true},{"id":"q-b077","node":"P5-2","level":"基本","type":"A","pgl_page":89,"stem":"システム監査の実行に関する記述として、適切なものはどれか。","choices":{"ア":"システム監査のオーナーシップは、経営者ではなく、監査の実施を依頼される自組織の監査部門や外部の専門企業が持つ。","イ":"監査計画は初回に作成したものを毎回同じ内容のまま用いることとし、監査の範囲や目標、初回か2回目以降かの違いによって変更することはしない。","ウ":"内部の活動としてのモニタリングと監査の大きな違いは独立性の確保にあり、監査人はステークホルダーから独立性を確保して監査を実施する。","エ":"価値提供・運用プロセスでは、サイクルの回転ごとに毎回必ずシステム監査を実施しなければならない。"},"answer":"ウ","dp":{"ア":1,"イ":4,"エ":4},"explain":"モニタリングと監査の大きな違いは独立性の確保にあり、監査人はステークホルダーから独立して第三者の立場で客観的に監査を行うことで、内部からは見えなかった課題が発見できる（p.89）。オーナーシップは経営者が持つことが重要であり、監査計画は範囲や目標により毎回目的を明確にして作成する（p.88）。システム監査は毎回必ず行うものではなく、目的に応じて適切なタイミングで実施する（p.84）。","verified":true},{"id":"q-b078","node":"P6","level":"基本","type":"A","pgl_page":90,"stem":"提供価値検証プロセスの「ITサービス利活用の検証」に関する記述として、適切なものはどれか。","choices":{"ア":"ITサービスの利活用状況の検証は、客観性を確保するため、システムの稼働率等の技術的な測定値のみによって行い、利用者の主観的な意見は判断材料としない。","イ":"利用者数や利用頻度、ユーザーエンゲージメント等の様々な観点から検証を行うとともに、アンケートやユーザーインタビュー等を通じて要望や不満等の顧客の声の収集を行う。","ウ":"顧客の声の収集は、アンケートやインタビュー等を能動的に行うのではなく、利用者から不満や要望の申し出があった場合に限って受動的に行う。","エ":"利活用状況の検証はITサービスの利活用の開始直後に一度だけ実施すれば足り、その後の定期的な検証は運用の負荷となるため行わない。"},"answer":"イ","dp":{"ア":3,"ウ":2,"エ":4},"explain":"ITサービス利活用の検証では、利用者数や利用頻度、ユーザーエンゲージメント、ITサービスが提供価値に及ぼす効果等、様々な観点から検証を行い、アンケートやユーザーインタビュー等を通じて顧客の声を収集する（p.90）。定期的な検証により、持続的な価値提供と顧客満足度の向上のための情報や気付きを収集できる。収集したフィードバックは分析して改善策や優先順位付けに活用し、改善の進捗は利用者と共有する（p.91）。","verified":true},{"id":"q-b079","node":"P6","level":"基本","type":"A","pgl_page":92,"stem":"提供価値検証プロセスにおける改善活動に関する記述として、適切なものはどれか。","choices":{"ア":"改善活動への参加は提供価値の検証を担う担当者に限定することとし、組織内のその他の関係者には改善に対する意識や参加意欲を求めない。","イ":"問題の特定や改善の効果の検証は、データの収集や分析によることなく、業務に精通した担当者の経験と直感に基づいて迅速に行う。","ウ":"洗い出された改善点には優先度を付けず、全ての改善に同時に着手して早期の完了を図る。","エ":"改善活動は優先度を決めて実現可能な方法で行い、一度に全ての改善をやり切るのが難しい場合は、段階的に実施することも重要である。"},"answer":"エ","dp":{"ア":3,"イ":5,"ウ":2},"explain":"改善活動は優先度を決め実現可能な方法で行い、一度に全てをやり切るのが難しい場合は段階的に実施する（p.92）。改善を成功させるには全ての関係者が意識と参加意欲を持つ継続的な改善文化の確立が必要であり、問題の特定や効果の検証にはデータ駆動のアプローチを取ることが必要である。","verified":true},{"id":"q-b080","node":"P6","level":"基本","type":"A","pgl_page":93,"stem":"提供価値検証プロセスからデジタル経営実行計画プロセスへのフィードバックに関する記述として、適切なものはどれか。","choices":{"ア":"フィードバックする内容は、価値実現サイクルにおける各プロセス・アクティビティ・タスクのレベルでは改善が困難な、計画自体の見直しが必要となるような課題である。","イ":"フィードバックする内容は、日常的な運用手順の軽微な修正等、価値実現サイクルの各プロセス・アクティビティ・タスクのレベルで対処が可能な課題に限られる。","ウ":"評価基準であるKPI自体の見直しは、計画時に確定した前提条件にあたるため、フィードバックの対象には含まれない。","エ":"新たなビジネスチャンスや新たに提供可能な付加価値の発見は、フィードバックには含めず組織内での共有に留める。"},"answer":"ア","dp":{"イ":3,"ウ":3,"エ":5},"explain":"デジタル経営実行計画プロセス（P3）へフィードバックする内容は、各プロセス・アクティビティ・タスクレベルでは改善が困難な課題であり、大きな社会的変化や技術革新、規制による市場の変化、新たなビジネスチャンスや付加価値の発見等も含まれる（p.93）。評価基準（KPI）自体の見直しもフィードバックに含まれ、サイクルの回転に伴い評価基準も洗練されていく。","verified":true},{"id":"q-a001","node":"P1-1","level":"応用","type":"C","pgl_page":32,"stem":"老舗小売業A社の経営者は競合他社のEC参入に危機感を抱き、「直ちにECサイト構築の提案依頼書（RFP）を作成せよ」とデジタル経営推進者に指示した。A社では、デジタル経営に関する現状分析や外部環境変化の体系的な認識はまだ行われていない。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"経営者のスピード感を尊重し、まず小規模なECを価値実現サイクルで軽量に試行して手応えを掴み、その結果を変革の構想に反映するよう助言する。","イ":"現状分析と戦略評価、外部環境変化の認識を行って変革の可能性を検討し、変革の方向性を変革構想書にまとめた上で、それをデジタル経営戦略プロセスのインプットとして戦略・実行計画へ進むよう助言する。","ウ":"経営者の指示を尊重してRFP作成に着手し、現状分析や外部環境の認識はそれと並行して進め、両者がそろった段階で突き合わせて調達要件を後から補正していけば、着手の遅れも避けられてよいと助言する。","エ":"変革の実現像を早く共有するため、経営者の「思い」や危機意識を言語化した変革構想書を先にまとめ、現状分析や外部環境の認識はその後で補うよう助言する。"},"answer":"イ","dp":{"ア":4,"ウ":2,"エ":5},"explain":"P1-1は 現状分析と戦略評価→外部環境の変化を認識→変革の可能性を発見→変革への意思決定 の順で進み、その成果物である変革構想書がP2のインプットとなる（p.32-35）。事例は体系的な認識が未着手の段階であり、C2の軽量試行や構想書の先行作成は認識・分析の前段を飛ばしている。RFP（調達＝P3〜P4）の並行着手も、構想・戦略・計画を経ていない時点では要件を固められない。","verified":true},{"id":"q-a002","node":"CB-3","level":"応用","type":"C","pgl_page":109,"stem":"A社は「顧客対応時間の30％短縮」を目標に掲げて新システムを導入した。稼働半年後の経営会議で効果を問われたが、目標は掲げられていたものの、それを測定可能な指標に変換して測定する仕組みが用意されていなかったことが判明した。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"利用部門への満足度アンケートを実施し、現場の体感評価を数値化して効果測定の結果として経営会議に報告し、当面の説明責任をきちんと果たすよう助言する。","イ":"効果を客観的に示すため、外部の監査法人にシステム監査を依頼し、導入効果の証明を第三者の評価に委ねるよう助言する。","ウ":"モニタリング＆コントロールとして、計画のKGI・KPIを測定可能なパフォーマンス指標に変換し、継続的に測定できる仕組みを整えるよう助言する。","エ":"効果測定は次期システムの要件定義に着手してから、その中で改めて設計すればよいと整理するよう助言する。"},"answer":"ウ","dp":{"ア":4,"イ":5,"エ":2},"explain":"モニタリング＆コントロール（CB-3）タスク1は、計画で定義したKGI・KPIを測定可能なパフォーマンス指標に変換することから始まる（p.109）。検証可能な指標があって初めてP6が正しくサイクルを回せる。本来はP3タスク6「評価指標の設計」で先に設計すべきもので、その欠落を事後に補う場面。アンケートの体感やシステム監査は測定可能指標の代替にならない。","verified":true},{"id":"q-a003","node":"CB-5","level":"応用","type":"C","pgl_page":120,"stem":"中堅製造業A社では、熟練技術者の判断ノウハウが属人化しており、定年退職による喪失が懸念されている。ナレッジマネジメントシステムに文書の登録を進めたが、登録文書はほとんど参照されず、若手の判断力も向上していない。組織学習の観点から、デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"部門ごとに文書登録の件数目標を設定し、ナレッジの登録を業務として義務化して形式知の量を増やすよう助言する。","イ":"形式知化した知識を研修や実務での適用を通じて個人に取り込ませ（内面化）、新たな暗黙知として再び組織に還元する循環をつくるよう助言する。","ウ":"ナレッジマネジメントシステムの検索性とタグ付けを強化し、登録文書が自然に参照される状態になるまで運用を続けて、現場への自然な定着を待つよう助言する。","エ":"熟練技術者の再雇用・契約延長で現行体制を維持し、当面はノウハウの喪失を先送りするよう助言する。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":4},"explain":"組織の知は、個人の暗黙知を共有（形式知化）し、連結・応用し、新たな個人の知として再度取り込む（内面化）プロセスの反復で育つ（p.119-121）。A社は形式知化（登録）で止まっており、内面化までの循環が回っていない。登録件数の増加や検索性の強化、属人化の維持は循環をつくる打ち手にならない。","verified":true},{"id":"q-a004","node":"P2","level":"応用","type":"C","pgl_page":47,"stem":"A社は新たなITシステムの調達・導入を含むデジタル経営戦略を検討している。経営リスクの議論において、担当役員が「品質・費用・納期（QCD）を管理してシステムを完成させれば、リスク対応としては十分だ」と主張した。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"プロジェクトマネジメントを強化して進捗・品質・コストの統制を徹底し、計画どおりにシステムを完成させれば経営リスクは実務上回避できると助言する。","イ":"純粋リスクに備えて地震・火災・システムトラブル等への保険加入と事業継続策を講じれば、経営リスク対応としては十分と助言する。","ウ":"リスクの評価は、導入後に提供価値検証プロセスの検証活動の中で行えば十分であると助言する。","エ":"QCDを満たしても戦略の誤りや環境変化で利用されない事態があり得るため、戦略の成就を目的とした戦略的観点でのリスク評価が必要と助言する。"},"answer":"エ","dp":{"ア":4,"イ":5,"ウ":2},"explain":"QCDを満たしたITシステムが導入されても、当初の戦略が誤っていたり導入時点で古びた戦略・システムになって利用されない事態が生じ得るため、あくまで戦略の成就を目的とした戦略的観点でのリスク評価が必要（p.47）。経営リスクには純粋リスクと投機的リスクがあり、保険は純粋リスクの一部への対処にすぎない。PM統制はQCDの管理でありリスク評価ではない。","verified":true},{"id":"q-a005","node":"P2","level":"応用","type":"C","pgl_page":50,"stem":"A社では、デジタル経営戦略のKPIとして設定した顧客接点のデジタル化率が順調に向上している。しかし取締役会で「その改善が収益にどう結びついているのか」を問われ、経営企画部門は説明できなかった。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"戦略に直結した財務指標を設定し、KGI／KPIと財務指標の関係性を設定・管理して、収益の源泉となる活動を把握できる仕組みを構築するよう助言する。","イ":"KPIが計画どおり順調に向上しており活動が前進している以上、収益との関係を改めて指標として整理し説明する必要はなく、現行の指標管理を続ければよいと助言する。","ウ":"説明のしやすさを優先し、財務指標と関係づけやすい別のKPIへ戦略目標を差し替えるよう助言する。","エ":"収益との関係の分析は、決算時の会計監査人による監査に委ねるのが客観的であると助言する。"},"answer":"ア","dp":{"イ":5,"ウ":4,"エ":1},"explain":"持続的成長には収益の確保が必要であり、戦略に直結した財務指標を設定し、KGI／KPIと財務指標の関係性を設定・管理して収益の源泉となる活動を把握できる仕組みを構築する。これは外部ステークホルダーへの説明やIR活動にもつながる（p.50留意点）。KPI達成それ自体や指標の差し替え、会計監査への委任は関係性の設計・管理の代替にならない。","verified":true},{"id":"q-a006","node":"P3","level":"応用","type":"C","pgl_page":65,"stem":"製造業A社は、画像認識技術による品質検査の自動化を検討している。候補ベンダーのデモンストレーションで高い認識精度が示され、担当者は「デモで実力は確認できたので導入を決定したい」と提案した。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"デモで十分に高い認識精度が確認できた以上、追加のPoCは費用と期間を要するだけで得るものは少ないため、契約手続きに入りそのまま導入を進めるよう助言する。","イ":"認識精度の検証は、本番導入後に提供価値検証プロセスの検証活動として行えば足りると助言する。","ウ":"自社の製品・画像データで学習・検証し、品質・スピードの向上と運用面の課題まで含めてPoCの結果を総合的に評価してから適用可否を判断するよう助言する。","エ":"まずPoCの検証項目や判断基準は定めず、ベンダー環境で一通り試用してみてから考えるよう助言する。"},"answer":"ウ","dp":{"ア":5,"イ":2,"エ":4},"explain":"適用したことのないITソリューションは自社の課題を解決できるか不明瞭であり、自社のデータで検証（PoC）して実現性・適合性を評価する。画像認識による品質検査の自動化はまさに本文の例で、検証により運用面の課題が見つかることもあるため総合的に評価する（p.65）。PoCは事前に目的・検証ポイント・判断基準を定義すべきで、それを欠く試用は有効でない。ベンダーのデモは自社データでの実力を保証しない。","verified":true},{"id":"q-a007","node":"P3","level":"応用","type":"C","pgl_page":63,"stem":"A社は、社外の顧客向けに新しいITサービスを提供する実行計画を作成している。担当チームは「顧客への詳細なヒアリングが完了するまで計画の具体化は進められない」として作業を停止しているが、顧客からの協力は今後も限定的な見込みである。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"計画の精度を確保するため、顧客への詳細なヒアリングによって十分な情報が得られる時期まで、計画作成をこのまま停止して待つよう助言する。","イ":"仮説をベースに調査や計画づくりを進め、アンケートやインタビューで検証した上で、計画や開発機能を見直す進め方に切り替えるよう助言する。","ウ":"ヒアリングは省略し、業務に詳しい社内メンバーの知見で要件を確定してから進めるよう助言する。","エ":"暫定でよいので想定される全機能を先に開発し、顧客の反応を見てから計画を作成するよう助言する。"},"answer":"イ","dp":{"ア":5,"ウ":4,"エ":2},"explain":"社外ユーザーに詳細な調査の時間を割いてもらうことは難しく、本来欲しい情報を集めることは難しい。仮説をベースに調査や計画づくりを進め、検証した上で計画や開発機能を見直す進め方が望ましい（p.63）。顧客像（ペルソナ）を定義し仮説検証で進める点が鍵で、停止の継続は停滞を招き、想像での要件確定は検証を欠き、計画前の全機能開発は順序を誤る。","verified":true},{"id":"q-a008","node":"COMMON-3","level":"応用","type":"C","pgl_page":11,"stem":"A社は社内にデジタル経営の専門人材がおらず、外部からデジタル経営支援者を招いた。この支援者の関わり方として、より適切なものはどれか。","choices":{"ア":"社内に適任者が育つまでの間は、デジタル経営推進者の実務を支援者が全面的に代行し、重要な意思決定についても支援者が引き受けるよう助言する。","イ":"助言に徹し、社内体制づくりや人材育成には関与せず、求められた技術的判断のみを提供する。","ウ":"まず外部の開発リーダー・運用リーダーも同時に招き入れ、当面は主要な役割を外部人材で固める。","エ":"助言や支援を行いながら、最終的には社内人材がデジタル経営推進者等の役割を担えるように育成していく関わり方をとる。"},"answer":"エ","dp":{"ア":1,"イ":4,"ウ":5},"explain":"デジタル経営支援者は、デジタル経営推進者等の役割をただ代行するのではなく、助言や支援を行い、最終的には社内人材が役割を担えるように育成していくことが望ましい（p.11）。代行や意思決定の引き受けは役割を外れ、育成に関与しない助言限定や外部人材で固める選択も、社内人材の育成という支援者の本質から外れる。","verified":true},{"id":"q-a009","node":"COMMON-4","level":"応用","type":"C","pgl_page":28,"stem":"A社はデジタル経営戦略を策定し、価値実現サイクルに展開して実行を開始した。経営企画の担当者は「戦略は実行フェーズに移ったので、次の戦略の見直しは今回の実行が一通り完了してから着手すべきだ」と述べた。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"デジタル経営成長サイクルは価値実現サイクルへ展開した後も並行して経営環境等の情報収集を継続し、必要に応じて展開した戦略の見直しを行うよう助言する。","イ":"実行中は現場を混乱させないため、戦略に関する情報収集や見直しは一旦止め、今回の実行が一通り完了した段階で、改めて全体をまとめて再開するよう助言する。","ウ":"情報収集は継続しつつも、見直しは価値実現サイクルからのフィードバックが出そろう提供価値検証プロセスの検証完了まで待つよう助言する。","エ":"戦略の見直しはデジタル経営戦略プロセスの次回サイクルの起点で行うものなので、今期は実行に専念するよう助言する。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":5},"explain":"デジタル経営成長サイクル（C1）は環状であり、策定した戦略を価値実現サイクル（C2）に展開した後も、並行して経営環境等の情報収集を継続的に行い、必要に応じて展開した戦略の見直しを行う（p.28）。実行フェーズだからと情報収集や見直しを止めるのは、環境変化に俊敏に対応するというC1の並行実行の趣旨に反する。","verified":true},{"id":"q-a010","node":"COMMON-4","level":"応用","type":"C","pgl_page":17,"stem":"A社の経営者は自社のデジタル経営成熟度を高めたいと考え、「まずはITサービスの整備状況（デジタル環境）を評価し、そこを重点的に底上げすればよい」と方針を示した。デジタル経営成熟度の評価に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"デジタル環境の指標が最も客観的に測れるため、当面は環境の成熟度のみを評価指標として管理するよう助言する。","イ":"成熟度評価はデジタル経営成熟度レベルの向上アクティビティで行うものなので、まず戦略を固め、評価は戦略策定後に着手するよう助言する。","ウ":"成熟度はマインド・ガバナンス・デジタル環境・デジタル利活用の4視点で評価し、環境だけでなくマインドやガバナンスも含めて現状を把握するよう助言する。","エ":"4視点のうちマインドは主観的で測りにくいため評価対象から外し、残る3視点で評価するよう助言する。"},"answer":"ウ","dp":{"ア":4,"イ":2,"エ":5},"explain":"デジタル経営成熟度は、デジタル経営マインド・デジタル経営ガバナンス・デジタル環境・デジタル利活用の4つの視点で評価する（p.17）。環境だけやマインドを外すのは4視点の一部に偏る。成熟度評価はP1-2で行い戦略策定のインプットとするため、戦略の後に回すのは順序が逆。","verified":true},{"id":"q-a011","node":"P1-2","level":"応用","type":"C","pgl_page":35,"stem":"A社は成熟度の向上に取り組むことにした。担当者は「4つの評価視点すべてで最高段階のレベル5を、今年度中に一斉に達成する」という目標を掲げた。デジタル経営成熟度レベルの向上に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"変革のスピードを重視し、全視点を一律にレベル5とする高い目標を掲げて全社一斉に取り組むよう助言する。","イ":"現状の成熟度を評価した上で、成熟度は中長期的な取り組みであることを踏まえ、短期と中長期の取り組みを組み合わせた段階的な向上目標を設定するよう助言する。","ウ":"成熟度の向上が取り得る戦略の幅を狭めることのないよう、当面は現状維持を目標に据え、戦略の方向性が固まってから改めて段階的に引き上げていくよう助言する。","エ":"向上目標の設定は各現場に一任し、全社での成熟度目標は設けずに各部門の自主性に委ねるよう助言する。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":1},"explain":"P1-2では現状の成熟度を評価し、成熟度レベルにより次の成長への対策が異なることを踏まえて向上目標を設定する。向上は中長期的な取り組みになるため、短期的な取り組みと中長期的な取り組みを組み合わせる（p.35）。全視点一律レベル5の一斉達成は段階性を欠き、現状維持は「成熟度の向上が取り得る戦略の選択肢を増やす」趣旨に反する。","verified":true},{"id":"q-a012","node":"P4-1","level":"応用","type":"C","pgl_page":77,"stem":"A社はIT開発でシステムを開発中である。開発メンバーから「計画にはないが、あると便利そうな機能を思いついたので追加したい」との提案があった。開発リーダーへのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"利用者の利便性が確実に上がるのは明らかなので、開発の勢いを止めないよう開発中に柔軟に取り込んで作り込んでしまうよう助言する。","イ":"計画外の機能なので一律に却下し、以降の機能提案は次期開発まで一切受け付けないよう助言する。","ウ":"まず追加機能も含めて実装し、テスト段階で不要と分かれば取り除く前提で進めるよう助言する。","エ":"最小限の範囲で動くプロダクトを意識し、追加は必要性・優先度・開発計画全体への影響を吟味した上で判断するよう助言する。"},"answer":"エ","dp":{"ア":5,"イ":4,"ウ":2},"explain":"「元々の計画にはないが便利そうだから」といった理由で安易に機能追加・変更を行うと、操作の煩雑化や不具合、他要件への影響等で本来の価値提供を妨げるリスクがある。新機能の追加・変更は、必要性や優先度・開発計画全体への影響を吟味した上で行う（p.77）。無条件の取り込みも一律却下も吟味を欠き、実装先行で後から取り除くのは最小限で動くプロダクトの考えに反する。","verified":true},{"id":"q-a013","node":"P4-2","level":"応用","type":"C","pgl_page":80,"stem":"A社はIT導入で、開発したシステムの総合テストに合格した。開発リーダーは「テストに合格したので直ちに利活用を開始したい」と考えているが、運用リーダーからは利用者の教育・訓練がまだ不十分との指摘がある。IT利活用開始の判断に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"総合テスト結果に加え、教育・訓練や移行準備の状況等から導入プロセス全体を評価し、運用リーダー等の評価も含めて総合的に判断するよう助言する。","イ":"総合テストに合格した以上、システムは完成しているので直ちに利活用を開始するよう助言する。","ウ":"利活用開始の可否は運用リーダーに一任し、開発リーダーは価値提供・運用プロセスへの引き継ぎ後の関与に切り替えるよう助言する。","エ":"教育・訓練は利活用開始後に並行して実施すればよいので、先に開始してから訓練を進めるよう助言する。"},"answer":"ア","dp":{"イ":4,"ウ":1,"エ":2},"explain":"IT利活用開始は、総合テストの結果や教育・訓練の状況等からIT導入プロセス全体を評価し、運用リーダー等の必要なステークホルダーの評価も含めて総合的に判断する。開発リーダーは判断結果を経営者・推進者に報告して承認を受け、承認後にP5へ引き継ぐ（p.80）。テスト合格のみでの開始や訓練を後回しにした先行開始は総合判断を欠く。","verified":true},{"id":"q-a014","node":"P5-1","level":"応用","type":"C","pgl_page":82,"stem":"A社は開発したITサービスの利活用を開始し、価値提供業務に移った。担当者は「ITシステムが安定稼働していれば顧客への価値提供は実現できる」と考え、業務手順や要員教育の準備を後回しにしようとしている。デジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"システムの安定稼働こそ価値提供の前提なので、当面はシステム運用の安定化に注力し、業務手順や要員教育は運用が落ち着いてきた段階で、無理なく順次整えていくよう助言する。","イ":"業務手順や教育は現場の裁量に委ね、推進者はサービスレベル指標の管理に専念するよう助言する。","ウ":"顧客視点での価値を想定して業務の流れと手順を構築し、要員計画・教育まで整えて初めて計画どおりの価値提供が実現できるため、これらを業務開始前に準備するよう助言する。","エ":"要員教育は実務の中で習熟させれば足りるため、事前の教育は省略して業務を開始するよう助言する。"},"answer":"ウ","dp":{"ア":2,"イ":1,"エ":4},"explain":"価値提供業務の開始（P5-1タスク1）では、推進者は顧客視点の価値を想定して業務の流れを構築し、業務手順を作成し、要員計画・配置と要員教育まで行うことで、計画どおりの価値提供が実現できることを確実にする（p.82）。システムの安定稼働だけでは価値提供にならず、手順・教育の後回しや現場任せは業務開始前の準備を欠く。","verified":true},{"id":"q-a015","node":"P5-2","level":"応用","type":"C","pgl_page":88,"stem":"A社は運用中のITシステムについて、取引先や規制当局から、特定の基準・規制に準拠していることを客観的に示すよう求められた。ITサービス運用のシステム監査に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"自組織の監査部門による内部監査で、システムの効率性や安全性の評価とあわせて基準・規制への準拠状況も確認すれば、対外的な説明にも足りると助言する。","イ":"基準・規制への準拠を第三者の立場で評価してもらう必要があるため、組織外の第三者による外部監査を実施するよう助言する。","ウ":"監査は行わず、日常のモニタリング＆コントロールの記録をもって準拠の証跡とすれば足りると助言する。","エ":"準拠の確認は運用リーダーの自己点検で対応し、外部への説明時にその結果を提示すれば足りると助言する。"},"answer":"イ","dp":{"ア":5,"ウ":4,"エ":1},"explain":"システム監査には内部監査と外部監査があり、実施主体と目的が異なる（p.88）。特定の基準・規制等への準拠を客観的に示す必要がある場合は、組織外の第三者が行う外部監査が適する。内部監査は自組織の監査部門等がシステムの効率性・安全性を評価し、改善につなげることを目的とするもので、独立した第三者による準拠の証明にはならない。運用リーダーの自己点検やモニタリング＆コントロールの記録も同様に、第三者評価の代替にはならない。","verified":true},{"id":"q-a016","node":"P6","level":"応用","type":"C","pgl_page":93,"stem":"A社は新ITサービス稼働後、提供価値検証プロセスで利活用を検証している。設定したKPI（利用率・遵守状況）はいずれも目標を達成していた。一方で検証の過程で、技術革新により今のサービス形態自体が近い将来立ち行かなくなる兆候が見えてきた。デジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"改善点としてIT開発・導入プロセスへフィードバックし、システムの機能改修で対応するよう助言する。","イ":"価値提供・運用プロセスへフィードバックし、運用手順の見直しと利用者教育で対応するよう助言する。","ウ":"KPIはいずれも目標を達成しているため、現時点では追加対応は不要と整理し、次回の定期検証まで様子を見るよう助言する。","エ":"この気付きは計画自体の見直しを要するため、デジタル経営実行計画プロセスへフィードバックし、次の価値実現サイクルで計画の見直しにつなげるよう助言する。"},"answer":"エ","dp":{"ア":3,"イ":4,"ウ":5},"explain":"P6タスク4はタスク・アクティビティレベルで改善可能な点をP4・P5へ、タスク5はそれらのレベルでは改善が困難な課題をP3へフィードバックする。技術革新で従来サービスが立ち行かなくなる兆候はP3行きの例（p.93）。機能改修や運用改善では構造的課題に粒度が合わず、提供価値の検証はKPI以外の幅広い観点でも行うべきで、KPI達成での様子見は検証範囲を狭める（p.92）。","verified":true},{"id":"q-a017","node":"P6","level":"応用","type":"C","pgl_page":90,"stem":"A社は提供価値検証プロセスでITサービスの利活用を検証している。担当者は「サービスレベルの遵守状況（稼働率・応答時間）が基準を満たしていれば、利活用の検証としては十分だ」と考えている。デジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"サービスレベルの遵守状況に加え、利用者数・利用頻度・エンゲージメントや、アンケート・インタビューによる顧客の要望・不満等も収集し、様々な観点から利活用を検証するよう助言する。","イ":"サービスレベルが基準を満たしている以上、利活用の検証はこれで完了とし、以降は定期のSLM報告に一本化して、運用状況やサービスレベルの推移の定例共有に切り替えていくよう助言する。","ウ":"顧客の声の収集は業務工程の検証（タスク2）で扱うため、利活用の検証（タスク1）ではサービスレベル指標に限定するよう助言する。","エ":"稼働が安定している間は追加の検証は行わず、障害や苦情が発生した時点で検証を実施するよう助言する。"},"answer":"ア","dp":{"イ":4,"ウ":5,"エ":2},"explain":"P6タスク1では、利用者数や利用頻度、ユーザーエンゲージメント、サービスレベルの遵守状況、ITサービスが提供価値に及ぼす効果等、様々な観点から検証を行い、アンケートやユーザーインタビュー等で要望や不満等の顧客の声も収集する（p.90）。定期的な検証で持続的な価値提供と顧客満足の向上につなげるものであり、サービスレベル遵守のみや事後対応では検証の観点・タイミングが不足する。","verified":true},{"id":"q-a018","node":"CB-1","level":"応用","type":"C","pgl_page":100,"stem":"A社では、個々の開発・導入プロジェクトはそれぞれ期限内に完了している。しかしプロセス間の引き継ぎで手戻りや待ちが多く、価値実現サイクル全体としては非効率が生じている。サイクルマネジメントの観点からのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"各プロジェクトが期限内に成果を出せている以上、当面は個々のプロジェクト管理の徹底を続けていけば、いずれ全体の非効率も自然に改善すると助言する。","イ":"手戻りを減らすため各プロジェクトの期限管理をさらに厳格化し、遅延の発生を抑えることに注力するよう助言する。","ウ":"プロセス間のボトルネックや非効率な要素を特定し、プロセスの定義・文書化・実行・改善を通じてサイクルの全体最適化を図るよう助言する。","エ":"プロセス間の調整は各プロセスの責任者間の個別調整に委ね、共通基盤としての関与は最小限にとどめるよう助言する。"},"answer":"ウ","dp":{"ア":4,"イ":5,"エ":1},"explain":"サイクルマネジメント（CB-1）は、プロセス間のボトルネックや非効率な要素を特定し、サイクルの全体最適化を行う包括的・構造的なアプローチである。決められた期間内に特定の結果を達成することに重点を置くプロジェクトマネジメントとは異なる（p.100）。個々のプロジェクトの期限管理を徹底してもプロセス間の全体最適にはならず、個別調整任せも共通基盤としての役割を欠く。","verified":true},{"id":"q-a019","node":"CB-2","level":"応用","type":"C","pgl_page":108,"stem":"A社のデジタル経営プロジェクトで、あるステークホルダー間に意見の相違が生じ、関係がぎくしゃくし始めた。コミュニケーションの観点から、プロセスの実行主体者へのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"問題が拡大する前に関係のメンテナンスを速やかに行い、期待の明確化や追加支援等の対処をし、必要に応じてコミュニケーション計画を修正するよう助言する。","イ":"意見の相違は当事者間のやり取りで自然に解消されることも多いため、まずはしばらく静観し、状況が悪化しないか推移を見守り、必要になった時点で対応するよう助言する。","ウ":"相違点の是非を実行主体者が判断して一方の意見を採用し、議論を早期に打ち切るよう助言する。","エ":"関係悪化はコミュニケーションの問題なので、対応は経営者に委ね、実行主体者は実務に専念するよう助言する。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":1},"explain":"メンバー間で意見の相違が発生した場合は、問題が拡大するのを防ぐため、関係のメンテナンスを速やかに実施する。関係のメンテナンスでは、期待を明確にする、追加支援を提供する等の対処を行い、必要に応じてコミュニケーション計画を修正する（p.108）。静観は拡大を招き、独断での打ち切りは合意形成に反し、経営者への丸投げは実行主体者の役割を外れる。","verified":true},{"id":"q-a020","node":"CB-4","level":"応用","type":"C","pgl_page":115,"stem":"情報漏洩を強く懸念するA社の経営者は、「あらゆる業務データに最高レベルのセキュリティ対策を一律に適用せよ」と指示した。セキュリティの観点からのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"情報漏洩の影響は甚大なので、コストや業務効率にかかわらず全データに最高レベルの対策を一律適用するよう助言する。","イ":"対策の優先順位付けはせず、まず全社に共通の最高水準ルールを課し、支障が出た部署から個別に緩和していくよう助言する。","ウ":"セキュリティは専門性が高いため、対策レベルの判断は外部のセキュリティ専門家に一任するよう助言する。","エ":"守るべきものと価値提供の両軸を踏まえ、脅威・脆弱性の影響を評価して優先度の高いものから対策し、状況によってはリスクの受容も含めて適切なレベルを設定するよう助言する。"},"answer":"エ","dp":{"ア":5,"イ":2,"ウ":1},"explain":"セキュリティレベルを高めることは重要である一方、必要以上に厳格な対策は事業や業務を逼迫させ価値提供機会を逸することにつながりかねず、状況によっては情報セキュリティリスクを受容する考え方を取るべき場合もある。脅威・脆弱性の影響を評価し、優先度の高いものから対処して限られたリソースを最適活用し、守るべきものと価値提供の両軸で適切なレベルを考慮する（p.114-115）。一律最高レベルは過剰対策の弊害を招き、レベル判断の外部一任は経営者・推進者・各リーダーが担う判断を外れる。","verified":true}];
