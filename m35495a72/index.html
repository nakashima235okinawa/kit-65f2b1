<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ITC試験対策 その1（模擬試験） — PGL Ver.4.0 対応</title>
<style>
:root{
  --bg:#E9EBEE; --card:#FCFCFB; --ink:#17202B; --sub:#5C6672;
  --ai:#1F3A63; --shu:#B4362F; --midori:#2C6A4F; --rule:#C9CDD3; --gold:#8a6d1f;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:15px}
header{background:var(--ai);color:#fff;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-size:18px;margin:0;letter-spacing:.08em}
header .sub{font-size:11px;opacity:.75}
header .hspace{flex:1}
#timer{font-variant-numeric:tabular-nums;font-size:16px;letter-spacing:.05em;display:none}
#timer.warn{color:#ffd9d4}
main{max-width:860px;margin:18px auto 40px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(23,32,43,.05)}
h2{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--ai);letter-spacing:.05em}
.muted{color:var(--sub);font-size:13px}
button{font-family:var(--sans);cursor:pointer;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:9px 16px;font-size:14px}
button.primary{background:var(--ai);border-color:var(--ai);color:#fff}
button.danger{background:var(--shu);border-color:var(--shu);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px;cursor:pointer;transition:.12s}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:var(--ai);box-shadow:0 2px 8px rgba(31,58,99,.12)}}
.mode b{font-family:var(--serif);font-size:16px;color:var(--ai);display:block;margin-bottom:6px}
.mode .muted{font-size:12px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.stat b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
/* 問題表示 */
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--sub)}
.tagchip{border:1px solid var(--rule);border-radius:999px;padding:1px 10px;background:#fff}
.flagbtn{margin-left:auto;font-size:12px;padding:4px 12px}
.flagbtn.on{background:#fff6e0;border-color:var(--gold);color:var(--gold)}
.stem{white-space:pre-wrap;font-size:15px;margin:4px 0 14px}
.qno{font-family:var(--serif);color:var(--ai);font-weight:700;margin-right:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;background:#fff;padding:10px 12px;cursor:pointer;text-align:left;font-size:14px;line-height:1.7}
.choice .pos{font-family:var(--serif);color:var(--ai);font-weight:700;min-width:1.4em}
.choice .tx{white-space:pre-wrap}
@media (hover:hover) and (pointer:fine){.choice:hover{border-color:var(--ai)}}
.choice.sel{border-color:var(--ai);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--ai)}
.choice.ok{border-color:var(--midori);background:#eaf3ee;box-shadow:inset 0 0 0 1px var(--midori)}
.choice.ng{border-color:var(--shu);background:#faecea;box-shadow:inset 0 0 0 1px var(--shu)}
.choice.dim{opacity:.6}
.exp{margin-top:14px;border-left:4px solid var(--ai);background:#f2f4f8;border-radius:0 6px 6px 0;padding:12px 14px;font-size:13.5px}
.exp .vh{font-family:var(--serif);color:var(--ai);margin-bottom:6px}
.exp .chain{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);font-size:12.5px;color:var(--sub)}
.exp .chain .tagchip{margin:2px 4px 2px 0;display:inline-block}
.navrow{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.navrow .spacer{flex:1}
/* 番号グリッド */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--rule);border-radius:5px;background:#fff;text-align:center;padding:6px 0;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.answered{background:#eef2f8;border-color:var(--ai)}
.cell.flagged{box-shadow:inset 0 -3px 0 var(--gold)}
.cell.cur{outline:2px solid var(--ai)}
.cell.ok{background:#eaf3ee;border-color:var(--midori)}
.cell.ng{background:#faecea;border-color:var(--shu)}
/* バー */
.bar{height:10px;background:#e3e6ea;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai)}
.bar i.low{background:var(--shu)} .bar i.mid{background:var(--gold)}
.noderow{display:grid;grid-template-columns:11em 1fr 4.5em;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.noderow .nm{cursor:pointer;color:var(--ai)}
.noderow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips .c{border:1px solid var(--rule);border-radius:999px;background:#fff;padding:4px 13px;font-size:13px;cursor:pointer}
.chips .c.on{background:var(--ai);border-color:var(--ai);color:#fff}
.score-hero{text-align:center;padding:8px 0 2px}
.score-hero .big{font-family:var(--serif);font-size:44px;color:var(--ai);font-variant-numeric:tabular-nums}
.score-hero .of{color:var(--sub);font-size:15px}
footer{max-width:860px;margin:30px auto;padding:0 14px 30px;color:var(--sub);font-size:11.5px;line-height:1.9;border-top:1px solid var(--rule)}
.hide{display:none}
dialog{border:1px solid var(--rule);border-radius:8px;max-width:420px;padding:20px;font-family:var(--sans)}
dialog::backdrop{background:rgba(23,32,43,.4)}
@media(max-width:560px){.noderow{grid-template-columns:8em 1fr 4em}}
</style>
</head>
<body>
<header>
  <h1>ITC試験対策 その1（模擬試験）</h1><span class="sub">PGL Ver.4.0 対応・100問</span>

  <div id="timer">120:00</div>
  <button id="homebtn" class="ghost" style="color:#fff;border-color:rgba(255,255,255,.4);font-size:12px;padding:5px 12px">ホーム</button>

<script>
const QS=[{"id":"q-b001","node":"COMMON-1","level":"基本","type":"A","pgl_page":3,"stem":"ITコーディネータ協会が定義する「デジタル経営」の説明として、より適切なものはどれか。","choices":{"ア":"データやデジタル技術を利活用してビジネスモデルそのものを変革し、新しい顧客価値を創造していくこと。","イ":"大量の情報（ビッグデータ）の利活用により、創造的で活力ある発展が可能となる社会を実現していくこと。","ウ":"情報とITをヒト・モノ・カネに続く第4の経営資源に位置づけ、その利活用能力の向上で企業の競争優位を確保していくこと。","エ":"経営環境の変化を洞察し、戦略に基づくデータとITの利活用による経営の変革で、企業の健全で持続的な成長を導く経営手法。"},"answer":"エ","dp":{"ア":4,"イ":5,"ウ":5},"explain":"エがITCAの定義（参考：PGL Ver.4.0 第1部 第1章 P.3）。アはDXの説明、イはデジタル社会形成基本法によるデジタル社会の定義、ウはITC制度創設期（2000年代初頭）の位置づけであり、いずれも本文中の別概念。","verified":true},{"id":"q-b002","node":"COMMON-4","level":"基本","type":"B","pgl_page":14,"stem":"デジタル経営プロセスのうち、アクティビティを内包しないプロセスの組合せはどれか。","choices":{"ア":"変革・成長プロセス、IT開発・導入プロセス、価値提供・運用プロセス","イ":"デジタル経営戦略プロセス、IT開発・導入プロセス、提供価値検証プロセス","ウ":"デジタル経営戦略プロセス、デジタル経営実行計画プロセス、提供価値検証プロセス","エ":"変革・成長プロセス、デジタル経営実行計画プロセス、提供価値検証プロセス"},"answer":"ウ","dp":{"ア":5,"イ":2,"エ":2},"explain":"P2・P3・P6はアクティビティを内包せず、プロセス自体として記載される（参考：PGL Ver.4.0 第1部 第4章 P.14）。P1はP1-1/P1-2、P4はP4-1/P4-2、P5はP5-1/P5-2を内包する。アは内包する側の組合せ。","verified":true},{"id":"q-b003","node":"COMMON-4","level":"基本","type":"A","pgl_page":14,"stem":"デジタル経営成長サイクルと価値実現サイクルの実行関係として、より適切なものはどれか。","choices":{"ア":"デジタル経営成長サイクルのタスク実行中は価値実現サイクルのタスクは進捗しない、直列の関係で実行する。","イ":"両サイクルは並行の関係で実行し、互いのタスクを同時に進めていく。","ウ":"価値実現サイクルを完遂してから、その結果をもってデジタル経営成長サイクルを開始する順序で実行する。","エ":"2つのサイクルは統合し、単一のサイクルとしてまとめて実行する。"},"answer":"イ","dp":{"ア":2,"ウ":2,"エ":4},"explain":"企業活動はゴーイングコンサーンが基本で、価値の実現と提供は常に行われていなければならず、経営環境も常に変化するため、両サイクルは並行実行とされる（参考：PGL Ver.4.0 第1部 第4章 P.14）。アは本文が明示的に否定する記述。","verified":true},{"id":"q-b004","node":"COMMON-4","level":"基本","type":"A","pgl_page":24,"stem":"どの場面でも個々の議論に埋もれず、全体を見渡して考える習慣を持つことを求めている基本原則はどれか。","choices":{"ア":"全体視点で捉える（全体最適の原則）","イ":"戦略と実行を合わせる（戦略実行整合の原則）","ウ":"データとITを常に念頭に置く（デジタルシフトの原則）","エ":"説明責任を果たす（リーダーシップの原則）"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"専門にこだわるあまり全体との食い違いが見えなくなることが多く、全体を俯瞰することで時代遅れや思い込みといった道の踏み外しに気付けるとされる。（参考：PGL Ver.4.0 第1部 第4章 P.24）","verified":true},{"id":"q-b005","node":"COMMON-4","level":"基本","type":"A","pgl_page":25,"stem":"基本原則7「利用者との関係をより深める（利用者動機付けの原則）」の説明として、より適切なものはどれか。","choices":{"ア":"利用者の協力レベルは理解と共感の深さで決まり、利用者からのフィードバックがシステムの納期と完成度を左右する。","イ":"外部との対話に躊躇しないオープンマインドをもち、他社や地域との共創を自在に進められる体制と風土をつくり上げる。","ウ":"従業員一人ひとりの心に寄り添い、心理的安全性の高い職場環境作りを心がける。","エ":"事業の成果やリスクを可視化し、経験や勘ではなくデータを重視した判断をする体制に変える。"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"アが原則7の内容（参考：PGL Ver.4.0 第1部 第4章 P.25）。イは原則6（オープンな共創）、ウは原則9（学習と成長）、エは原則10（ファクトベース）の記述であり、記述自体は正しいが問われている原則のものではない。","verified":true},{"id":"q-b006","node":"P1-1","level":"基本","type":"B","pgl_page":32,"stem":"変革認識アクティビティのタスクを実施順に並べたものはどれか。\na. 現状分析と戦略評価\nb. 外部環境の変化を認識\nc. 変革の可能性を発見\nd. 変革への意思決定","choices":{"ア":"a → b → c → d","イ":"b → a → c → d","ウ":"a → c → b → d","エ":"b → c → a → d"},"answer":"ア","dp":{"イ":2,"ウ":2,"エ":2},"explain":"P1-1のタスクフローは図2.1.1（参考：PGL Ver.4.0 第2部 第1章 P.32）。タスク1「現状分析と戦略評価」から始まり、タスク4「変革への意思決定」で変革構想書と変革の表明を成果物とする（成果物一覧はp.124）。","verified":true},{"id":"q-b007","node":"P1-1","level":"基本","type":"A","pgl_page":34,"stem":"変革認識アクティビティのタスク4「変革への意思決定」の成果物はどれか。","choices":{"ア":"変革構想書、変革の表明","イ":"経営課題リスト","ウ":"現状のデジタル経営成熟度","エ":"デジタル経営戦略企画書"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"変革構想書と変革の表明はタスク4「変革への意思決定」の成果物（p.34。成果物一覧はp.124）。変革構想書はP2のインプットとなる。イはP2タスク2、ウはP1-2タスク1、エはP2タスク6の成果物。","verified":true},{"id":"q-b008","node":"P1-2","level":"基本","type":"A","pgl_page":37,"stem":"デジタル経営成熟度の評価において、一部にとどまるものの基本の型ができ、繰り返せるようになって理解も進んだ状態は、どのレベルにあたるか。","choices":{"ア":"レベル1　初期段階（探索）","イ":"レベル2　発展段階（形成）","ウ":"レベル3　定義段階（統合）","エ":"レベル4　管理段階（データ駆動）"},"answer":"イ","dp":{"ア":4,"ウ":4,"エ":4},"explain":"レベル1は断片的・属人的で場当たり的な段階、レベル3は組織全体に行き渡り日常業務に欠かせない段階、レベル4は数値で管理する指標を使う段階にあたる。（参考：PGL Ver.4.0 第2部 第1章 P.37）","verified":true},{"id":"q-b009","node":"P2","level":"基本","type":"A","pgl_page":49,"stem":"デジタル経営戦略プロセスにおいて、「デジタル経営戦略企画書」を成果物とするタスクはどれか。","choices":{"ア":"タスク6　デジタル経営戦略策定","イ":"タスク3　あるべき姿の構築","ウ":"タスク7　デジタル経営戦略の展開","エ":"タスク8　デジタル経営戦略達成度評価"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"デジタル経営戦略策定の本文はp.48-49（成果物一覧はp.124）。タスク3は経営ビジョン（案）・ビジネスモデル（案）、タスク7は中期経営計画書、タスク8は達成度評価報告書。企画書（タスク6）→中計（タスク7）の順序も頻出の取り違え。","verified":true},{"id":"q-b010","node":"P2","level":"基本","type":"A","pgl_page":42,"stem":"新しさの度合いが高い製品やサービスで、想定する顧客自身も価値をはっきり言い表せない場合、情報はどう集めるのがよいか。","choices":{"ア":"想定する顧客へのアンケートの規模を広げ、統計として意味のある数値を揃える。","イ":"業界の報告書や競合の公開情報、専門家への聞き取りを徹底し、市場の全体像をくまなく押さえる。","ウ":"求めや期待、差し出すべき価値について仮説を立て、価値実現サイクルで実際に届けてみて確かめる。","エ":"必要な材料が十分に揃うまで、戦略を組み立てること自体を保留する。"},"answer":"ウ","dp":{"ア":5,"イ":5,"エ":2},"explain":"新しい価値を生む場面では、既存の情報源だけでは足りないことが多い。仮説を立て、実際に製品やサービスを提供してその価値を確かめる形で情報を集めることが検討される。（参考：PGL Ver.4.0 第2部 第2章 P.42）","verified":true},{"id":"q-b011","node":"P3","level":"基本","type":"B","pgl_page":69,"stem":"デジタル経営実行計画プロセスのタスク7「IT資源調達計画」に含まれる項目の組合せはどれか。\na. 調達の目的・範囲と調達要件\nb. 外部の協力先の体制\nc. 総合テストのテスト項目\nd. IT投資予算とスケジュール","choices":{"ア":"a、b、c","イ":"a、b、d","ウ":"a、c、d","エ":"b、c、d"},"answer":"イ","dp":{"ア":5,"ウ":5,"エ":5},"explain":"IT資源調達計画の本文はp.69（項目の一覧はp.125）。調達の目的・範囲、調達要件、外部の協力先の体制、IT投資予算、スケジュールを含む。cのテスト項目の決定はP4-1における開発マネジメント・検証方法の確立で行う（参考：PGL Ver.4.0 第3部 第2章 P.74）。なお選定の評価は開発リーダーや運用リーダーが中心となる（参考：PGL Ver.4.0 第3部 第1章 P.69）。","verified":true},{"id":"q-b012","node":"P4-1","level":"基本","type":"B","pgl_page":73,"stem":"IT開発アクティビティのタスクを実施順に並べたものはどれか。\na. 要件の確認と開発・調達の準備\nb. 調達実施\nc. 開発による要件の実現\nd. テスト","choices":{"ア":"b → a → c → d","イ":"a → c → b → d","ウ":"a → b → c → d","エ":"a → b → d → c"},"answer":"ウ","dp":{"ア":2,"イ":2,"エ":2},"explain":"図3.2.1（参考：PGL Ver.4.0 第3部 第2章 P.73）のタスク順。要件と調達の準備が先、調達実施、開発、テストの順。","verified":true},{"id":"q-b013","node":"P4-1","level":"基本","type":"A","pgl_page":73,"stem":"IT開発の場面で、運用の責任者はどう関わるのがよいか。","choices":{"ア":"開発を束ねる体制を組み立て、日程を踏まえて確認の方法や項目を決める。","イ":"調達先との間で責任の範囲や納期、契約の条件を確かめる作業を主導し、調達の実務を進める。","ウ":"運用や保守で積んだ実務の経験をもとに、運用面の課題や要件への影響をつかみ、開発の責任者と手を組んで支える。","エ":"業務の要件に優先順位を付け、繰り返しごとに何を作るかを決めて、開発の進め方を組み立てる。"},"answer":"ウ","dp":{"ア":1,"イ":1,"エ":1},"explain":"ア・イ・エはいずれも開発リーダーが担う作業にあたる。運用の責任者は開発の段階から関わり、連携し協力して支える立場である。（参考：PGL Ver.4.0 第3部 第2章 P.73）","verified":true},{"id":"q-b014","node":"P5-1","level":"基本","type":"A","pgl_page":81,"stem":"IT利活用による価値の提供アクティビティの各タスク（価値提供業務の開始・遂行、価値提供状況の情報取得・管理、価値提供結果の可視化）を実施するのは誰か。","choices":{"ア":"運用リーダー","イ":"開発リーダー","ウ":"サービス開発・提供者","エ":"デジタル経営推進者"},"answer":"エ","dp":{"ア":1,"イ":1,"ウ":1},"explain":"P5-1（IT利活用による価値の提供）はビジネス推進の活動であり、各タスクの実施主体はデジタル経営推進者（p.81-82）。一方、P5-2（ITサービス運用）は運用リーダーが主になる。P5の中で担い手が分かれる点が取り違えどころ。","verified":true},{"id":"q-b015","node":"P5-2","level":"基本","type":"A","pgl_page":85,"stem":"サービスレベルマネジメントとは何を指すか。","choices":{"ア":"資源やサービスの状態を絶えず見張り、移り変わりの兆しを読み取って改善のための材料とすること。","イ":"移り変わる価値に合わせていくため、システムやサービスの手直しを計画立てて行うこと。","ウ":"価値を届ける目標に届くよう水準を調整し、顧客や関係者との間で納得を得ること。","エ":"導入した仕組みの運用や管理、処理能力、安全性が、戦略や規制の求めに応えているかを見定めること。"},"answer":"ウ","dp":{"ア":5,"イ":5,"エ":5},"explain":"運用の成熟の度合いや費用、品質を踏まえたうえで、サービスの提供先である顧客や関係者との合意を形づくる。（参考：PGL Ver.4.0 第3部 第3章 P.85）","verified":true},{"id":"q-b016","node":"P6","level":"基本","type":"B","pgl_page":90,"stem":"提供価値検証プロセスがフィードバックを行う宛先の組合せはどれか。\na. 価値実現サイクルの各プロセス\nb. デジタル経営実行計画プロセス\nc. デジタル経営戦略プロセス\nd. サイクルマネジメント","choices":{"ア":"a、c","イ":"b、d","ウ":"c、d","エ":"a、b"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"P6の検証とフィードバックの本文はp.90、タスク4（C2各プロセスへの改善提案）とタスク5（P3へのフィードバックレポート）はp.92-93（成果物一覧はp.126）。宛先が2系統ある点が問われどころ。P2への評価報告はC2からの別経路であり、P6のタスクとしての宛先ではない。","verified":true},{"id":"q-b017","node":"CB-2","level":"基本","type":"A","pgl_page":106,"stem":"コミュニケーションの4象限（図4.2.1）において、「エンゲージメント」に対応する頻度と密度の組合せはどれか。","choices":{"ア":"高頻度・高密度","イ":"低頻度・低密度","ウ":"高頻度・低密度","エ":"低頻度・高密度"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":4},"explain":"図4.2.1（参考：PGL Ver.4.0 第4部 第2章 P.106）は頻度と密度の2軸でコミュニケーションを整理し、「伝達」が低頻度・低密度、「エンゲージメント」がその対極。※図の4象限の名称と配置は紙面で要確認。","verified":true},{"id":"q-b018","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略プロセスのタスク1のITトレンド・デジタル環境情報収集において、内部情報の参考とするものはどれか。","choices":{"ア":"変革認識アクティビティでの情報収集と分析の結果","イ":"デジタル経営成熟度レベルの向上アクティビティでの成熟度評価についての情報","ウ":"提供価値検証プロセスで実施したITサービス利活用の検証結果","エ":"モニタリング＆コントロールが継続的に捕捉・蓄積してきたパフォーマンスデータ"},"answer":"イ","dp":{"ア":5,"ウ":3,"エ":3},"explain":"内部情報はP1-2の成熟度評価の情報を、外部情報はP1-1の情報収集と分析の結果を参考にする（参考：PGL Ver.4.0 第2部 第2章 P.44）。アは記述自体は正しいが外部情報側の参考元。","verified":true},{"id":"q-b019","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略プロセスのタスク2「経営環境情報の分析と経営課題の抽出」において、分析から抽出した課題に加えて経営課題とするものはどれか。","choices":{"ア":"提供価値検証プロセスが作成した各プロセスへの改善提案書","イ":"IT開発アクティビティの総合テストで検出された不具合の一覧","ウ":"セキュリティで継続的に収集・把握したインシデントと脆弱性の一覧","エ":"デジタル経営成熟度レベルの向上アクティビティで策定した成長計画"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"P1-2で策定した成長計画についても経営課題に加える（参考：PGL Ver.4.0 第2部 第2章 P.44）。分析の視点には強み弱み・機会脅威、事業ポートフォリオ、競争環境等がある。イ〜エはそれぞれ別の経路で扱われる情報。","verified":true},{"id":"q-b020","node":"P2","level":"基本","type":"A","pgl_page":46,"stem":"デジタル経営戦略プロセスのタスク3「あるべき姿の構築」の説明として、より適切なものはどれか。","choices":{"ア":"企業を取り巻く社会の価値観の変化に合わせて、判断のよりどころである経営理念そのものを再定義する。","イ":"経営ビジョン（案）とビジネスモデル（案）を構築し、経営理念との整合性を確認する。","ウ":"展開した方針・施策・目標・概要スケジュール等を取りまとめ、中期経営計画書を策定する。","エ":"検証評価に用いる評価指標と目標値、判断のための基準を設計する。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":5},"explain":"分析結果と経営課題をもとに「あるべき姿」としての経営ビジョン（案）・ビジネスモデル（案）を構築し、経営理念との整合性を確認する（p.45-46。整合性確認はp.46）。理念は判断のよりどころであり再定義の対象ではない。ウはタスク7、エはP3タスク6。","verified":true},{"id":"q-b021","node":"P2","level":"基本","type":"A","pgl_page":45,"stem":"経営課題の抽出やデジタル経営戦略の策定における意思決定の留意点として、より適切なものはどれか。","choices":{"ア":"意思決定の迅速さを最優先し、経験豊富な経営者の直勘に基づいて即断する。","イ":"判断から主観を完全に排除し、収集した事実情報・データのみから機械的に決定する。","ウ":"経営者の直勘だけに頼らず、客観的な判断材料と本質を見極めた主観的判断のバランスをとる。","エ":"意思決定の納得性を高めるため、関係者全員の意見が完全に一致するまで決定そのものを保留する。"},"answer":"ウ","dp":{"ア":4,"イ":4,"エ":2},"explain":"直勘だけに頼った変革認識と戦略策定は危険が伴うが、客観的判断材料と、事の本質を見極めた主観的判断のバランスが意思決定の納得性を高める（p.45留意点）。イとウはどちらか一方に振り切った粒度の誤り。","verified":true},{"id":"q-b022","node":"P2","level":"基本","type":"B","pgl_page":47,"stem":"データ・IT利活用方針の定義のうち、ITマネジメント方針の検討に組み込むデジタル経営共通基盤の組合せはどれか。","choices":{"ア":"コミュニケーションとセキュリティ","イ":"サイクルマネジメントとモニタリング＆コントロール","ウ":"モニタリング＆コントロールとコミュニケーション","エ":"サイクルマネジメントと組織学習"},"answer":"イ","dp":{"ア":3,"ウ":3,"エ":3},"explain":"ITマネジメント方針（推進体制、ITガバナンス、投資・コスト管理）にはCB-1とCB-3を組み込む（参考：PGL Ver.4.0 第2部 第2章 P.47）。一方、IT全体方針にはセキュリティ（CB-4）を組み込む（参考：PGL Ver.4.0 第2部 第2章 P.46）。どちらの方針にどのCBかの対応が問われどころ。","verified":true},{"id":"q-b023","node":"P2","level":"基本","type":"B","pgl_page":47,"stem":"経営リスク評価・対応において、純粋リスクに該当するものの組合せはどれか。\na. 大地震\nb. 情報漏洩\nc. 新規事業への投資による損失\nd. パンデミック","choices":{"ア":"a、b、c","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、d"},"answer":"エ","dp":{"ア":4,"イ":4,"ウ":4},"explain":"純粋リスクは大地震、津波、火災、テロ、パンデミック、事故、不祥事、情報漏洩、システムトラブル等の事象から引き起こされるもの。経営判断による利益や損失から発生するもの（c）は投機的リスク（参考：PGL Ver.4.0 第2部 第2章 P.47）。","verified":true},{"id":"q-b024","node":"P2","level":"基本","type":"A","pgl_page":48,"stem":"デジタル経営戦略目標の決定に関する記述として、より適切なものはどれか。","choices":{"ア":"KGIは、KPIをもとに検討する。","イ":"目標は全社と各事業で独立に設定し、相互の連動は求めない。","ウ":"KPIは最終達成時点のみを対象とし、実施途中段階では設定しない。","エ":"全社レベルのKPIには、事業レベルのKGIが含まれる。"},"answer":"エ","dp":{"ア":2,"イ":2,"ウ":2},"explain":"目標は企業全体と各事業で連動させることが必要であり、全社レベルのKPIには事業レベルのKGIが含まれる。KPIはCSFをもとに検討し、達成時期に加えて実施途中段階（1年後、2年後等）の達成状況を把握するためのKPIも設定する（参考：PGL Ver.4.0 第2部 第2章 P.48）。","verified":true},{"id":"q-b025","node":"P2","level":"基本","type":"A","pgl_page":51,"stem":"デジタル経営戦略達成度評価がインプットとする情報の経路として、より適切なものはどれか。","choices":{"ア":"IT開発アクティビティで実施した総合テストと利活用開始判断の結果を、提供価値検証プロセスの検証を経ずに直接受領したもの","イ":"組織学習によって形式知化されたナレッジについて、その蓄積件数と参照の状況を期間ごとに集計したもの","ウ":"価値提供・運用プロセスで測定された評価指標を、提供価値検証プロセスの検証を経てデジタル経営実行計画プロセスで評価した結果","エ":"変革認識アクティビティにおいて実施した外部環境の変化の分析結果を、そのまま写し取ったもの"},"answer":"ウ","dp":{"ア":3,"イ":3,"エ":3},"explain":"P5で測定→P6で検証→P3で評価、という経路を経た結果をインプットに、目標値と実測値を対比して達成度を評価する。評価結果はP1に引き継がれ、次なる変革構想のインプットとなる（参考：PGL Ver.4.0 第2部 第2章 P.51）。C2の測定・検証・評価の連鎖が問われどころ。","verified":true},{"id":"q-b026","node":"P3","level":"基本","type":"B","pgl_page":62,"stem":"デジタル経営実行計画プロセスのタスクを実施順に並べたものはどれか。\na. データとITの調査\nb. 現状業務・システムの調査・分析\nc. 戦略実現案の検討\nd. 評価指標の設計","choices":{"ア":"a → b → c → d","イ":"b → c → a → d","ウ":"b → a → c → d","エ":"b → a → d → c"},"answer":"ウ","dp":{"ア":2,"イ":2,"エ":2},"explain":"図3.1.1（参考：PGL Ver.4.0 第3部 第1章 P.62）。タスク2「現状業務・システムの調査・分析」→タスク3「データとITの調査」→タスク4「戦略実現案の検討」→（タスク5を経て）タスク6「評価指標の設計」の順。現状を知ってからITを調べ、施策を検討する流れ。","verified":true},{"id":"q-b027","node":"P3","level":"基本","type":"A","pgl_page":63,"stem":"デジタル経営実行計画プロセスのタスク1「目標の理解と詳細化」で行うこととして、より適切なものはどれか。","choices":{"ア":"経営計画の理解を深め、必要に応じて目標を分解して段階的に設定し、進め方を見極める。","イ":"業務やデータのフロー、システム構成等を可視化し、解決すべき業務・システムの課題を抽出する。","ウ":"施策アイディアを複数創出し、戦略適合性や実現性、経済性等の観点から評価・選定して優先順位を決める。","エ":"開発に必要な調達要件を決め、要件に対応した提案を依頼する書類（RFP）の発行を依頼する。"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":5},"explain":"経営計画は抽象度が高い場合があり、目標に分解して段階的に設定するのも1つの方法。この段階で進め方（調査・分析に時間をかけるか、試行しながら検証するか）を見極める。成果物はリサーチ計画（参考：PGL Ver.4.0 第3部 第1章 P.63）。イはタスク2、ウはタスク4、エはタスク7の内容。","verified":true},{"id":"q-b028","node":"P3","level":"基本","type":"A","pgl_page":64,"stem":"実行計画を作るにあたり、利用者が社外の顧客である場合の調べ方として、より適切なものはどれか。","choices":{"ア":"社外の顧客から十分な協力が得られる時期が来るまで、実行計画づくり自体を保留する。","イ":"社外への調査は難しいので省き、業務に詳しい社内の利用者の意見で代える。","ウ":"チームで仮説を立てたうえで、アンケートや聞き取りによってその仮説を確かめる。","エ":"事前の調査は行わず、想定される機能をひととおり作ってから顧客の反応を見る。"},"answer":"ウ","dp":{"ア":2,"イ":4,"エ":2},"explain":"社外の顧客からは聞き取りや調査への協力が限られるため、仮説を立てたうえで確かめる進め方をとる。議論しやすくするため、具体的な顧客像を定めて共通の認識を持ってから調査を進める。（参考：PGL Ver.4.0 第3部 第1章 P.64）","verified":true},{"id":"q-b029","node":"P3","level":"基本","type":"A","pgl_page":65,"stem":"概念実証を行う際に気をつけるべき点として、より適切なものはどれか。","choices":{"ア":"自社に合う技術を見落とさないよう、新しい技術に触れること自体を狙いとして、対象を絞らず幅広く試す。","イ":"確かめるのは技術面の相性に絞り、運用面の課題は本番に入れてから確認する。","ウ":"先入観を避けるため、適用するかどうかの物差しは結果が出そろってから定める。","エ":"ただ試すだけに終わらないよう、狙いと確かめる勘所、判断の物差しを前もって決めておく。"},"answer":"エ","dp":{"ア":4,"イ":4,"ウ":2},"explain":"確かめることで運用面の課題が見つかることもあり、技術面だけでなく結果を総合的に評価して適用の可否を判断する。（参考：PGL Ver.4.0 第3部 第1章 P.65）","verified":true},{"id":"q-b030","node":"P3","level":"基本","type":"A","pgl_page":65,"stem":"実行計画の作成における、評価に必要なデータの扱いとして、より適切なものはどれか。","choices":{"ア":"評価に必要なデータをあらかじめ定義し、取得できるよう準備しておく。","イ":"システムの稼働後に自然に蓄積されていくデータの中から、評価に使えるものを事後に選び出す。","ウ":"データの定義と取得は、価値提供・運用プロセス開始後に運用リーダーが行う。","エ":"データの取得方法は、提供価値検証プロセスの検証を実施する時点で検討する。"},"answer":"ア","dp":{"イ":2,"ウ":1,"エ":2},"explain":"データは解決策が目標を達成できているかを測るために必須であり、評価に必要なデータをあらかじめ定義し、取得から有効活用の方法を定義した上で、適用できるITを調査する（参考：PGL Ver.4.0 第3部 第1章 P.65）。後工程まかせにすると測れない——q-a002（CB-3）の事例はまさにこの欠落。","verified":true},{"id":"q-b031","node":"P3","level":"基本","type":"A","pgl_page":66,"stem":"戦略の実現案を検討する際、机上の議論だけでは施策を選び切れない場合の進め方として、より適切なものはどれか。","choices":{"ア":"選び切れるようになるまで、関係者による会議を重ねて合意を待つ。","イ":"試作や最小限の機能を定めてIT開発・導入へつなぎ、実際に確かめる計画とする。","ウ":"候補となる施策をすべて同時に本格的に動かし、一定の期間を経た結果を比べて絞り込む。","エ":"客観性を保つため、施策の評価と選定を外部のコンサルタントの判断にすべて委ねる。"},"answer":"イ","dp":{"ア":2,"ウ":4,"エ":5},"explain":"机上で評価しきれない場合は、実際に作って価値実現サイクルを通し、実証したうえで判断する計画とする。（参考：PGL Ver.4.0 第3部 第1章 P.66）","verified":true},{"id":"q-b032","node":"P3","level":"基本","type":"A","pgl_page":70,"stem":"経費精算や勤怠管理等、共通の一般業務向けクラウドサービスの評価・選定の進め方として、より適切なものはどれか。","choices":{"ア":"サービスや製品が標準で備えている機能の豊富さや新しさを、カタログで比較して評価する。","イ":"提案依頼書（RFP）を発行し、各社から提出された提案書の記載内容のみで評価する。","ウ":"同業他社での採用実績と市場シェアの高さを最優先の基準として選定する。","エ":"事前に評価基準（要件）を決めた上で、パイロットでの試行・導入により要件充足を検証する。"},"answer":"エ","dp":{"ア":4,"イ":5,"ウ":4},"explain":"低コストまたは無償の利用期間があるクラウドサービスは、実際に使って検証して評価・選定でき、共通の一般業務では試行・導入による評価の確実性が高い。ただし機能で評価するのではなく、事前に評価基準を決めて要件充足を検証する（参考：PGL Ver.4.0 第3部 第1章 P.70）。RFPによる提案の評価はもう1つの方法であり、大規模開発や複数ソリューション組合せの場合に有効。","verified":true},{"id":"q-b033","node":"P3","level":"基本","type":"A","pgl_page":71,"stem":"実行計画評価において、デジタル経営戦略プロセスへフィードバックする内容として、より適切なものはどれか。","choices":{"ア":"開発工程で検出された個別プログラムの不具合と、その修正履歴の一覧","イ":"戦略を見直さないと価値実現が難しい、顧客価値や競争上のポジショニング等の課題","ウ":"ITサービスレベル（SLA）について測定指標ごとの達成状況をまとめた月次の運用報告","エ":"全社の従業員を対象としたデジタル研修の受講状況の集計結果"},"answer":"イ","dp":{"ア":4,"ウ":3,"エ":5},"explain":"タスク9はP6の検証結果を受けて実行計画を見直すとともに、戦略実行の結果として、P2で見直さないと価値実現が難しい課題を報告する（参考：PGL Ver.4.0 第3部 第1章 P.71）。これでP6→P3→P2→P1というフィードバックの連鎖がつながる。アは開発内、ウはP5-2の管理情報。","verified":true},{"id":"q-b034","node":"CB-1","level":"基本","type":"A","pgl_page":100,"stem":"サイクルマネジメントにおけるプロセス定義の進め方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"価値実現サイクルを構成する各プロセスについて、何のために行うか、日程、受け取るものと渡すもの、主な活動、責任を負う人をはっきりさせる。","イ":"定義の対象は、あらかじめ練った計画をそのまま実行へ移すものだけに限られ、仮説を確かめながら繰り返す活動は含めない。","ウ":"各プロセスの責任者はサイクルマネジメントの責任者がまとめて兼ねることとし、個々のプロセスには責任者を置かない形で定義する。","エ":"定義は文書として書き起こす作業がすべて終わってから着手し、書かれた内容に合わせて後から固めていく。"},"answer":"ア","dp":{"イ":4,"ウ":1,"エ":2},"explain":"各プロセスについて目的・日程・入出力・主な活動・責任者を明らかにする。対象は計画を実行するものも、仮説検証を繰り返すものも含み、必要なプロセスや繰り返しの回数も異なる。責任者は各プロセスに置かれる。（参考：PGL Ver.4.0 第4部 第1章 P.100）","verified":true},{"id":"q-b035","node":"CB-1","level":"基本","type":"A","pgl_page":101,"stem":"サイクルマネジメントタスク3「プロセス実行」における役割分担として、適切なものはどれか。","choices":{"ア":"実行の主体はサイクルマネジメントの責任者であり、各プロセスの責任者は定義書の作成と実行結果の記録の保管のみを受け持つ。","イ":"実行の主体は各プロセスの責任者であり、サイクルマネジメントの責任者は実行状況を把握し、問題発生時には適切な支援を行い、実行の記録を蓄積する。","ウ":"プロセスの実行中に問題が発生した場合、サイクルマネジメントの責任者は当該プロセスをいったん停止させ、実行計画プロセスへ差し戻して計画の側から修正する。","エ":"プロセス定義した内容が実行されたかどうかの記録は、問題が発生したプロセスについてのみ蓄積すれば足りるものとされる。"},"answer":"イ","dp":{"ア":1,"ウ":4,"エ":4},"explain":"タスク3では、タスク2で作成された文書に従ってプロセスが実行される。実行の主体は各プロセスの責任者であり、サイクルマネジメントの責任者は実行状況を把握し、問題発生時は適切な支援を行う。また、定義した内容が実行されたかの記録を蓄積する（参考：PGL Ver.4.0 第4部 第1章 P.101）。支援であって停止・差し戻しの権限行使ではなく、記録は問題の有無にかかわらず蓄積する。","verified":true},{"id":"q-b036","node":"CB-1","level":"基本","type":"A","pgl_page":102,"stem":"サイクルマネジメントタスク4「プロセス改善」に関する記述として、適切なものはどれか。","choices":{"ア":"改善の分析対象は出力情報としての活動成果のみに絞ることとし、入力情報やプロセス内の活動については各プロセスの責任者の裁量に委ねて全体では扱わない。","イ":"プロセスの組み合わせは定義した時点で確定したものをそのまま維持することが原則であり、改善策にプロセスの変更や組み合わせの見直しを含めてはならないものとされる。","ウ":"入力情報、プロセス内の活動、活動成果等の全体の流れを分析して改善策を立案し、制約条件を管理してパフォーマンスを改善するとともに、長期的な変化を維持するための施策も組み込む。","エ":"改善策の立案は提供価値検証プロセスにおける検証結果の確定を待ってから行うこととし、それまでのあいだは現行プロセスの実行に専念するものとされる。"},"answer":"ウ","dp":{"ア":4,"イ":4,"エ":2},"explain":"タスク4では、入力情報、プロセス内の活動、出力情報としての活動成果等の全体の流れを分析して改善策（必要に応じプロセスの柔軟な変更による適切な組み合わせの決定も含む）を立案し、制約条件を管理してパフォーマンスを改善する。組織が長期的な変化を維持できるようにするための施策も組み込む（参考：PGL Ver.4.0 第4部 第1章 P.102）。分析は全体の流れが対象で、プロセスの柔軟な変更も改善策に含まれる。","verified":true},{"id":"q-b037","node":"CB-1","level":"基本","type":"B","pgl_page":101,"stem":"サイクルマネジメントの実行により、「サイクルマネジメント」と「プロジェクトマネジメント」の間で行われることになるマネジメントの組合せとして、適切なものはどれか。\na. ポートフォリオマネジメント\nb. プログラムマネジメント\nc. ナレッジマネジメント\nd. インシデントマネジメント","choices":{"ア":"a、c","イ":"b、d","ウ":"c、d","エ":"a、b"},"answer":"エ","dp":{"ア":5,"イ":5,"ウ":5},"explain":"CB-1の実行により、多くの組織的イニシアティブを継続的に評価する「ポートフォリオマネジメント」と、ポートフォリオを見据えプロジェクトの全体管理により価値実現を行う「プログラムマネジメント」に相当するマネジメントが行われる（参考：PGL Ver.4.0 第4部 第1章 P.101）。ナレッジマネジメントは組織学習（CB-5）、インシデント対応はセキュリティ（CB-4）等で扱われる別文脈の要素である。","verified":true},{"id":"q-b038","node":"CB-2","level":"基本","type":"A","pgl_page":104,"stem":"コミュニケーションタスク1における、コミュニケーションとステークホルダー・エンゲージメントの関係として、適切なものはどれか。","choices":{"ア":"コミュニケーションは情報の伝達を目的とし、ステークホルダー・エンゲージメントは関係構築や対話促進を目的とするもので、両者の目的や役割並びに相互関係を明確にした上で方式を設定する。","イ":"コミュニケーションは関係構築や対話促進を目的とし、ステークホルダー・エンゲージメントは情報の伝達を目的とするものであり、方式の設定にあたっては後者の伝達の効率を優先して設計する。","ウ":"両者は実質的に同義であるため、あえて区別せずに一体の活動として扱うことにより、方式設定の手間を省いて効率的に共通の目標を達成することができる。","エ":"ステークホルダー・エンゲージメントは社外の利害関係者のみを対象とする活動であり、社内のメンバーとのやり取りについてはコミュニケーションとして区別して扱う。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":4},"explain":"コミュニケーションは情報の伝達を目的とするもので、情報の受け手や伝達方法を明確に定義する。一方、ステークホルダー・エンゲージメントは関係構築や対話促進を目的とする。それぞれの目的や役割並びに相互関係を明確にした上で効果的なコミュニケーション方式を設定する（参考：PGL Ver.4.0 第4部 第2章 P.104）。両者の目的の取り違えや同一視、対象を社外に限る区別は本文にない。","verified":true},{"id":"q-b039","node":"CB-2","level":"基本","type":"A","pgl_page":103,"stem":"部門をまたいだ協力を進めることについて、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"部門間の調整は各部門長の個別の話し合いに委ねるのが基本で、経営者の役目は話がまとまらなかった場合の仲裁に限られる。","イ":"経営者が部門をまたぐ協力を後押しする姿勢を自ら示すことで、組織の隅々まで意識づけができる。","ウ":"まずはやり取りの道具を全社に導入することが先決であり、意識づけは道具が根づいてから行う。","エ":"部門をまたぐ協力の推進は外部の支援者が主導し、経営者は結果の報告を受ける立場に徹する。"},"answer":"イ","dp":{"ア":1,"ウ":2,"エ":1},"explain":"部門の壁を越えて円滑にやり取りできれば、デジタル経営の効率と効果が高まる。そのためには経営者が自ら姿勢を示すことが重要とされる。（参考：PGL Ver.4.0 第4部 第2章 P.103）","verified":true},{"id":"q-b040","node":"CB-2","level":"基本","type":"A","pgl_page":105,"stem":"コミュニケーションプロトコルとは何を指すか。","choices":{"ア":"ネットワーク上でシステム同士が情報をやり取りするための技術的な決まりであり、その策定と管理は基盤の担当部門が行うため、関係者間の取り決めには含まれない。","イ":"機密にあたる情報や細かい情報はあらかじめ共有の対象から一律に外し、当たり障りのない情報と公開できる情報だけを流すために定める取り決めである。","ウ":"関係者の間で分かち合う情報の区分とやり取りの方式を定めたもので、どれくらいの間隔で更新するか、どこまで細かく示すか、問題を上へ上げる筋道も含まれる。","エ":"会議で使う議事録や報告書の書式を揃えるための文書の標準にあたり、あわせて定例の会合をどう開くかを定めるものである。"},"answer":"ウ","dp":{"ア":4,"イ":4,"エ":4},"explain":"情報には社内と社外、機密と公開、概略と詳細といった様々な区分がある。それらの区分ごとに、誰とどう分かち合うかを定めておく。（参考：PGL Ver.4.0 第4部 第2章 P.105）","verified":true},{"id":"q-b041","node":"CB-2","level":"基本","type":"B","pgl_page":106,"stem":"コミュニケーションでは、ステークホルダーの役割と責任を明確化する。次のa〜dのうち、この明確化の「目的」に該当するものの組合せとして、適切なものはどれか。\na. コミュニケーションの円滑化\nb. 意思決定の効率化\nc. トラブルの防止\nd. コンプライアンスの強化","choices":{"ア":"a、b、c","イ":"a、b、d","ウ":"a、c、d","エ":"b、c、d"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":4},"explain":"役割と責任を明確化する目的は、a.コミュニケーションの円滑化、b.意思決定の効率化、c.トラブルの防止の3つである（参考：PGL Ver.4.0 第4部 第2章 P.106）。d.コンプライアンスの強化は、業務効率の向上・信頼関係の構築とともに、明確化による「効果」として現れるものであり（参考：PGL Ver.4.0 第4部 第2章 P.107）、目的とは区別して整理されている。","verified":true},{"id":"q-b042","node":"CB-3","level":"基本","type":"A","pgl_page":110,"stem":"モニタリング＆コントロールにおける継続的なモニタリング＆コントロールと定期的なモニタリング＆コントロールに関する記述として、適切なものはどれか。","choices":{"ア":"定期的なモニタリング＆コントロールを確実に実施できていれば、日常のプロセスの中で行う継続的なモニタリング＆コントロールについては省略することができる。","イ":"継続的なものは経営者が実施の主体となり、定期的なものは業務を実際に行っている部署の担当者が実施の主体となるよう、両者の役割を明確に分ける。","ウ":"継続的なモニタリング＆コントロールが十分に機能している組織においては、定期的なモニタリング＆コントロールを別途実施する必要はないものとされる。","エ":"継続的なものは日常のプロセスの中で担当者や管理者自らが行い、定期的なものは環境変化等それだけではカバーしきれない部分を補完するもので、両者を組み合わせて仕組みを構築する。"},"answer":"エ","dp":{"ア":4,"イ":1,"ウ":4},"explain":"継続的なモニタリング＆コントロールは日常のプロセスの中で実施され、担当者自身が行うレベルとマネジメントが行うレベルがある。ビジネス環境の変化やシステムの複雑性、セキュリティ対策等の変化までは継続的なものだけで全てカバーすることは困難で、これを補完するのが定期的なモニタリング＆コントロールである。両者を組み合わせて効果的かつ効率的な仕組みを構築することが重要とされる（p.110-111）。","verified":true},{"id":"q-b043","node":"CB-3","level":"基本","type":"A","pgl_page":111,"stem":"モニタリング＆コントロールにおける「独立モニタリング」に関する記述として、適切なものはどれか。","choices":{"ア":"継続的なモニタリング＆コントロールの一形態であり、業務担当者が上長から独立した立場で、日常業務の中でリスクの自己点検を行うものを指すとされる。","イ":"第三者機関による監査や法令・規制の遵守、内部統制の改善等、特定の目的や対象を集中的に評価する必要がある場合に有効なモニタリングである。","ウ":"継続的・定期的の2種類のモニタリング＆コントロールを代替するもので、独立モニタリングを導入すれば両者は不要になる。","エ":"価値実現サイクルの全プロセスを常時網羅的に監視する仕組みであり、特定の対象への集中は避けるべきとされる。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":2},"explain":"継続的・定期的の2種類とは別に、第三者機関による監査や法令・規制の遵守、内部統制の改善等、特定の目的や対象を評価する必要がある場合に有効な「独立モニタリング」がある。独立モニタリングでは、継続的・定期的なモニタリングではカバーできない特定の目的や対象を集中的に評価することができる（参考：PGL Ver.4.0 第4部 第3章 P.111）。両者の代替ではなく補完であり、常時網羅監視や担当者の自己点検とは異なる。","verified":true},{"id":"q-b044","node":"CB-3","level":"基本","type":"A","pgl_page":111,"stem":"モニタリング＆コントロールにおける実績データの分析・評価について、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"業務処理の裏付けを確かめるのは本来システム監査の作業であるため、差の分析では裏付けの見定めまでは行わず、目標と実績の数値の比較に専念する。","イ":"データの蓄積と差の分析は、実績が目標に届かなかった場合にだけ行うこととし、目標を達成している間は分析を省いて手間を減らす。","ウ":"目標と実績の差を分析するには、業務処理が意図どおりに行われたことを確かめる裏付けを見定めることが肝心で、これを誤ると分析そのものが意味を失いかねない。","エ":"分析と評価は業務に通じた担当者の経験に基づく感覚での判断を基本とすることとし、統計的な図表を用いた分析については避ける。"},"answer":"ウ","dp":{"ア":5,"イ":4,"エ":2},"explain":"裏付けの特定を含め、評価の方針や精度、対象、技法を明らかにした評価計画を作る必要がある。また蓄積したデータは統計的な手法を用いて分析・評価する。（参考：PGL Ver.4.0 第4部 第3章 P.111）","verified":true},{"id":"q-b045","node":"CB-3","level":"基本","type":"B","pgl_page":112,"stem":"モニタリング＆コントロールタスク4において、是正措置が必要な領域が特定された場合に講じる措置の例の組合せとして、適切なものはどれか。\na. プロセスの改善\nb. リソース配分の変更\nc. 従業員への追加トレーニングの実施\nd. 目標値（KGI）の即時引き下げ","choices":{"ア":"a、b、d","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、c"},"answer":"エ","dp":{"ア":4,"イ":4,"ウ":4},"explain":"是正措置には、プロセスの改善、リソース配分の変更、従業員への追加トレーニングの実施等が含まれる場合がある（参考：PGL Ver.4.0 第4部 第3章 P.112）。d.のような目標値の即時引き下げは是正措置の例として挙げられておらず、問題への対処ではなく基準の側を動かす対応であるため適切でない。","verified":true},{"id":"q-b046","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"セキュリティを確保する責任のあり方について、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"特定の役割や部門だけが負うものではなく企業ぐるみで臨むべき課題であり、従業員一人ひとりが意識を持ち、自ら進んで手を打つ姿勢が要る。","イ":"確保にあたるのは専門の部門と運用の責任者が専任で担うべき領域であり、他の従業員は通常の業務に専念する方が望ましいとされる。","ウ":"経営者は方針を示すところまでを担い、対策の実務には関わらず、優先度の判断も日々の運用もすべて現場の責任者に委ねることとされる。","エ":"脅威が高度になっていく中で的確に応えるため、確保は外部の専門機関へ全面的に委ねることが原則とされる。"},"answer":"ア","dp":{"イ":1,"ウ":4,"エ":1},"explain":"経営者や推進者、開発と運用の責任者だけが責任を負うのではなく、企業全体で取り組むべき重要な課題とされる。（参考：PGL Ver.4.0 第4部 第4章 P.113）","verified":true},{"id":"q-b047","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"セキュリティに関する一連のタスクの進め方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"取り組む順序はあらかじめ固く決まっており、最初のタスクから順に片づけていかなければ次のタスクへは進めない。","イ":"順番どおりに行う必要は必ずしもなく、置かれた状況に応じて選んで実施するが、すべてを漏れなく、絶えず繰り返して行うことが肝心である。","ウ":"組織に関わりの深いタスクだけを選んで行えばよいものとされ、関わりの薄いものは実施の対象から外してよい。","エ":"ひととおり行って体制が整った後は、実際に事故が起きた場合に限って、あらためて実施すればよい。"},"answer":"イ","dp":{"ア":2,"ウ":4,"エ":4},"explain":"取り組みの順序は、組織が置かれた状況やこれまでの取り組み具合によって変わる。ただし、すべてのタスクを網羅し、継続して繰り返すことが重要とされる。（参考：PGL Ver.4.0 第4部 第4章 P.113）","verified":true},{"id":"q-b048","node":"CB-4","level":"基本","type":"A","pgl_page":116,"stem":"セキュリティ対策を実際に組み込む際の考え方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"人の手による対処は場面に応じて融通が利くため、仕組みによる制御よりも優先して採ることが望ましい進め方とされる。","イ":"技術面の対策さえ十分に組み込めば、組織や人に関する対策、物理的な対策をあらためて講じる必要はなくなり、対策を技術面だけに絞れる。","ウ":"技術面の対策は仕組みによって制御できる形が望ましく、どうしても人の手で運用するときは、作業の誤りや負荷の高まりを招きうることに気を配って判断する。","エ":"対策はすべて自動で動く仕組みが整うまでは組み込みを始めないこととし、部分的なものを先に導入することは避けるとされる。"},"answer":"ウ","dp":{"ア":2,"イ":4,"エ":4},"explain":"目標とする水準に届かせるには、組織や人に関する対策、技術面の対策、物理的な対策をあわせて講じる必要がある。（参考：PGL Ver.4.0 第4部 第4章 P.116）","verified":true},{"id":"q-b049","node":"CB-4","level":"基本","type":"B","pgl_page":114,"stem":"セキュリティタスク1「脅威・脆弱性の収集・把握」に含まれる活動の組合せとして、適切なものはどれか。\na. 同業他社や世の中のセキュリティ関連の事故・ニュース等の情報収集\nb. サービス開発・提供者やサプライヤー等からの脆弱性情報の収集\nc. システム更改をしていない場合の定期的な脆弱性の調査\nd. 発見された脅威に対するセキュリティ対策の実装","choices":{"ア":"a、b、d","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、c"},"answer":"エ","dp":{"ア":2,"イ":2,"ウ":2},"explain":"タスク1では、同業他社や世の中で起きているセキュリティ関連の事故やニュース等の情報を収集し、サービス開発・提供者やサプライヤー等とコミュニケーションをとって脆弱性情報を収集する。また、システムの更改をしていない場合でも、システムの特性や重要度に応じて定期的に脆弱性を調査することが望ましい（p.113-114）。d.の対策の実装はタスク4「セキュリティ対策の実装・体制作り」の活動である。","verified":true},{"id":"q-b050","node":"CB-5","level":"基本","type":"A","pgl_page":118,"stem":"組織学習について、ガイドラインの考え方に沿う説明はどれか。","choices":{"ア":"一人ひとりの学びを組織の全員で分かち合って応用し、価値を生み出す仕組みであり、企業の文化や気風を変えるものとして中長期の営みと位置づける必要がある。","イ":"短期に集中した研修を全社員に受けさせることで完結する取り組みであり、終えた後は次の成熟度評価の時期まで活動を休めるものとされる。","ウ":"個人の技能を上げることを目的とする活動であり、組織としての価値づくりとは切り離して、人事評価の中の個人目標として部門ごとに運用する。","エ":"人材開発の部門が単独で担う専門の業務であり、経営者や事業部門については研修予算を承認する形で間接的に関わるにとどまるものとされる。"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":1},"explain":"組織学習は成熟に時間がかかる中長期の取り組みであり、だからこそ今すぐ始める必要があるとされる。また全社にわたる広範な活動であるため、経営者の主導と多くの部門の連携を要する。（参考：PGL Ver.4.0 第4部 第5章 P.118）","verified":true},{"id":"q-b051","node":"CB-5","level":"基本","type":"A","pgl_page":118,"stem":"組織学習の取り組みを見直す際、何を拠りどころとするか。ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"提供価値検証プロセスでの検証結果が固まるのを待ち、その中身をもとに見直す。","イ":"デジタル経営成熟度レベルの向上アクティビティで定められた成熟度の目標をもとに見直す。","ウ":"モニタリング＆コントロールで測って蓄えられる実績の指標だけを基準として見直す。","エ":"人事評価の年次の流れに合わせ、年に一度、人材開発部門の判断で見直す。"},"answer":"イ","dp":{"ア":3,"ウ":5,"エ":1},"explain":"見直しは成熟度の目標をもとに行われる。組織学習が根づけばデジタル経営のマインドやガバナンスが鍛えられ、結果として環境や利活用の水準も上がるとされ、成熟度と結びついた活動である。（参考：PGL Ver.4.0 第4部 第5章 P.118）","verified":true},{"id":"q-b052","node":"CB-5","level":"基本","type":"B","pgl_page":118,"stem":"組織学習タスク1「組織学習の環境整備」における活動と、それを主導する役割の組合せとして、適切なものはどれか。","choices":{"ア":"従業員の動機付け—人材開発部門／組織学習推進チームの形成—経営者・人事部門","イ":"働き方改革の推進—開発リーダー／組織学習のプログラムの企画・実行—経営者","ウ":"従業員の動機付け—経営者／組織学習推進チームの形成—事業部門・人材開発部門","エ":"従業員の動機付け—組織学習推進チーム／働き方改革の推進—事業部門"},"answer":"ウ","dp":{"ア":1,"イ":1,"エ":1},"explain":"環境整備の活動と役割は、①従業員の動機付け＝経営者、②働き方改革の推進＝経営者・人事部門、③組織学習推進チームの形成＝事業部門・人材開発部門、④組織学習のプログラムの企画・実行＝事業部門・人材開発部門とされる（p.118-119）。動機付けはパーパス・ミッション・ビジョン・バリューの共有と組織学習への意思表示によるもので、経営者の役割である。","verified":true},{"id":"q-b053","node":"CB-5","level":"基本","type":"A","pgl_page":121,"stem":"組織学習タスク2の「仕組みの構築と標準化」に関する記述として、適切なものはどれか。","choices":{"ア":"個人の暗黙知を、形式知への変換の工程を経ることなくそのまま業務ルールとして文書化することにより、標準化のリードタイムを短縮する。","イ":"組織に共有された全ての形式知を例外なく標準化の対象とすることとし、仕組み化できるかどうかの選別は行わずに一括して展開していく。","ウ":"業務の標準化は現場の裁量や判断の柔軟性を狭めるおそれがあるため業務オペレーションには適用せず、データの利活用方法の標準化に範囲を限定して進めることとする。","エ":"形式知のうち仕組み化し標準化することができる部分を特定して業務オペレーションの標準化を推進し、ITシステムを利活用しながらデータの利活用方法等も標準化させる。"},"answer":"エ","dp":{"ア":2,"イ":4,"ウ":4},"explain":"仕組みの構築と標準化では、形式知のうち仕組み化し標準化することができる部分を特定し、業務オペレーションの標準化を推進する。ITシステムを利活用しながら業務の標準化を進め、データ利活用の仕組みも構築してデータの利活用方法等も標準化させる（参考：PGL Ver.4.0 第4部 第5章 P.121）。暗黙知のままの直接ルール化や全形式知の無選別な一括標準化、データ面への限定はいずれも本文と異なる。","verified":true},{"id":"q-b054","node":"P1-1","level":"基本","type":"A","pgl_page":33,"stem":"変革認識アクティビティの「現状分析と戦略評価」は、デジタル経営戦略プロセスにおけるデジタル経営戦略達成度評価をインプットにする。このうち変革・成長プロセスがインプットとする部分として、適切なものはどれか。","choices":{"ア":"目標値と実測値を対比した達成度の評価のうち、個々のITシステムの稼働実績や障害件数に関係する部分。","イ":"デジタル経営戦略達成度評価の全体であり、変革・成長プロセスの観点による部分の選別は行わずに全てをインプットとする。","ウ":"目標値と実測値を対比した達成度の評価のうち、外部環境の変化や、内部環境におけるデジタル経営成熟度に関係する部分。","エ":"競合他社の財務諸表等、自社のデジタル経営戦略達成度評価とは独立した外部の公開データに関係する部分。"},"answer":"ウ","dp":{"ア":3,"イ":4,"エ":3},"explain":"変革・成長プロセス（P1）は、デジタル経営戦略プロセス（P2）のデジタル経営戦略達成度評価をインプットとするが、そのうちインプットとするのは「外部環境の変化や内部環境におけるデジタル経営成熟度に関係する部分」である（参考：PGL Ver.4.0 第2部 第1章 P.33）。評価全体を無選別に受け取るのではなく、変革の認識に必要な部分を取り込む。","verified":true},{"id":"q-b055","node":"P1-1","level":"基本","type":"B","pgl_page":33,"stem":"変革認識における「外部環境の変化を認識」で行うこととして、適切なものの組合せはどれか。\na 読みにくい将来の変化について、兆しを手がかりに、起きた場合に想定される筋書きとして温めておく\nb 業界に及ぶ変化は、今の業界の中を見渡すことだけで捉える\nc 官庁が出すデジタル経営に関わる各種の情報を集める\nd 海外の企業の事業の仕組みの例や、新しい技術、社会の動きといった具体的な情報を集める","choices":{"ア":"a、c、d","イ":"a、b、c","ウ":"a、b、d","エ":"b、c、d"},"answer":"ア","dp":{"イ":2,"ウ":2,"エ":2},"explain":"業界に及ぶ変化については、思いも寄らない異業種や新興企業の参入、既存の商品に取って代わるものなど、業界の内側を見るだけでは得られない情報を集めることが肝心とされ、bは誤り。（参考：PGL Ver.4.0 第2部 第1章 P.33）","verified":true},{"id":"q-b056","node":"P1-1","level":"基本","type":"B","pgl_page":33,"stem":"変革認識アクティビティの「変革の可能性を発見」では、ビジネスモデルの要素を分解して観点ごとに検討することが有効とされる。「観点」と「手順」の組合せとして適切なものを選んだものはどれか。\na. 新たな顧客の可能性 — セグメントの見直し等により検討する\nb. 新たなニーズと提供価値の可能性 — ユーザーインタビュー等から顧客の新たなニーズを発見して検討する\nc. 新たな価値の提供方法の可能性 — 活動やコスト構造を見直すことで従来よりも低価格での価値提供を模索する\nd. 内部活動やリソース見直しの可能性 — デジタルの活用等も踏まえた新たな製品・サービスの提供方法を検討する","choices":{"ア":"a、c","イ":"a、b","ウ":"b、d","エ":"c、d"},"answer":"イ","dp":{"ア":2,"ウ":2,"エ":2},"explain":"変革の可能性発見の手順の例（表2.1.1、p.33）では、「新たな顧客の可能性」はセグメントの見直し等（a）、「新たなニーズと提供価値の可能性」はユーザーインタビュー等（b）で検討する。cとdは手順が入れ替わっており、低価格での価値提供の模索は「内部活動やリソース見直しの可能性」、新たな提供方法の検討は「新たな価値の提供方法の可能性」の手順である。","verified":true},{"id":"q-b057","node":"P1-2","level":"基本","type":"B","pgl_page":36,"stem":"デジタル経営成熟度の4つの評価視点のうち、価値実現サイクルの活動に関係する視点の組合せとして、適切なものはどれか。\na. デジタル経営マインド\nb. デジタル経営ガバナンス\nc. デジタル環境\nd. デジタル利活用","choices":{"ア":"a、b","イ":"a、c","ウ":"b、d","エ":"c、d"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"4つの評価視点のうち、「デジタル経営マインド」と「デジタル経営ガバナンス」はデジタル経営全体に関わる視点であり、「デジタル環境」と「デジタル利活用」が価値実現サイクル（C2）の活動に関係する視点である（参考：PGL Ver.4.0 第2部 第1章 P.36）。","verified":true},{"id":"q-b058","node":"P1-2","level":"基本","type":"A","pgl_page":36,"stem":"デジタル経営成熟度の各評価視点について、評価項目の水準を判断する材料はどこから得るか。","choices":{"ア":"外部の調査会社が公表する、業界の平均値を示す比較データから","イ":"デジタル経営共通基盤に置かれた各アクティビティから","ウ":"デジタル経営戦略プロセスで経営環境の情報を集める作業から","エ":"提供価値検証プロセスで測られる指標の結果だけから"},"answer":"イ","dp":{"ア":3,"ウ":2,"エ":4},"explain":"4つの評価視点それぞれの評価項目について、水準を判断する情報は共通基盤の各アクティビティから取得する。（参考：PGL Ver.4.0 第2部 第1章 P.36）","verified":true},{"id":"q-b059","node":"P1-2","level":"基本","type":"A","pgl_page":37,"stem":"デジタル経営成熟度評価のレベル例において、レベル4（管理段階・データ駆動）の主な特徴として、適切なものはどれか。","choices":{"ア":"デジタル経営の取り組みについて組織全体で統合が進み、その活動が日常業務に不可欠なものとして定着している。","イ":"革新が組織文化の一部として根づいており、業界全体のイノベーションを牽引する段階にある。","ウ":"デジタルシフトを試みてはいるものの、断片的かつ属人的で、場当たり的な性質にとどまっている。","エ":"定量的に管理されたKPI等の指標を用いて、データを活用した意思決定と継続的な改善を促進している。"},"answer":"エ","dp":{"ア":2,"イ":2,"ウ":2},"explain":"レベル4（管理段階・データ駆動）は、定量的に管理されたKPI等の指標を用いてデータを活用した意思決定と継続的な改善を促進する段階である（表2.1.3、p.37）。「組織全体で統合が進み日常業務に不可欠」はレベル3（定義段階）、「革新が組織文化の一部」はレベル5（最適化段階）、「断片的、属人的で場当たり的」はレベル1（初期段階）の特徴である。","verified":true},{"id":"q-b060","node":"P1-2","level":"基本","type":"A","pgl_page":38,"stem":"デジタル経営成熟度の目標を定める際の考え方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"ある視点や項目だけが飛び抜けて高くても組織全体の力は上がらないため、全体を偏りなく伸ばしていく。","イ":"今が最も低い段階にある項目は、達成までの期間を縮めるため、途中の段を踏まずに一気に引き上げる目標を置く。","ウ":"評価の筋を通すため、評価する項目は企業の規模や事業の特性によらず定型のまま固定し、自社に合わせて手を加えてはならない。","エ":"伸び具合の評価は数値で示せる目標に対してだけ客観的に行い、現場や顧客の声に基づく評価は行わないこととされる。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":3},"explain":"下位の段階から一足飛びに引き上げるのではなく、一段ずつ上げていく必要がある。評価項目は企業の規模により多少手を加える場合もあり、伸び具合の評価では現場や顧客の声も活かして事実に基づく情報を集める。（参考：PGL Ver.4.0 第2部 第1章 P.36、P.38）","verified":true},{"id":"q-b061","node":"P4-1","level":"基本","type":"A","pgl_page":73,"stem":"IT開発における「要件の確認と開発・調達の準備」について、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"開発の要件は前の工程で固まっているため、合意のうえで変わった場合でも体制や日程を見直すことはしない。","イ":"サイクルを回して段階を追って開発する場合は、要件に優先順位を付けて、その回で何を作るかを決める。","ウ":"資源の調達は一つのサービスとしてまとめて実現するのが原則であり、調達できる単位に切り分けてはならない。","エ":"運用面の課題や要件への影響をつかむのは、引き継ぎを受けた後に運用の責任者が単独で行う。"},"answer":"イ","dp":{"ア":4,"ウ":4,"エ":1},"explain":"合意のうえで要件が変われば、体制や日程、作業を見直すこともある。資源の調達は多くの場合、様々なサービスや機能を組み合わせて実現するため、調達できる単位に整理して要件を明らかにする。（参考：PGL Ver.4.0 第3部 第2章 P.73）","verified":true},{"id":"q-b062","node":"P4-1","level":"基本","type":"A","pgl_page":75,"stem":"IT開発における調達で、提案依頼書を用いる場合の進め方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"発行は調達の実務にあたるため、経営者や定められた合議体の承認を経ず、開発の担当者の判断だけで速やかに行う。","イ":"依頼先への説明の中身や渡す情報、質問への補足は、選定を効率よく進めるため、有力な候補にだけ先に開示する。","ウ":"依頼書には自社の営業上の秘密が含まれることもあるため、発行に先立って外部の開発・提供者と秘密を守る取り決めを交わすこともある。","エ":"選ばれなかった外部の開発・提供者へは、選ばなかった理由をとくに伝えないまま手続きを終える。"},"answer":"ウ","dp":{"ア":1,"イ":3,"エ":5},"explain":"依頼書の発行にあたっては、事前に承認を得ること、依頼先へ公平に情報を開示すること、選定結果を理由とともに通知することが求められる。（参考：PGL Ver.4.0 第3部 第2章 P.75）","verified":true},{"id":"q-b063","node":"P4-1","level":"基本","type":"B","pgl_page":76,"stem":"IT開発アクティビティの「調達実施」における成果物の例の組合せとして、適切なものはどれか。\na. RFP\nb. 外部のサービス開発・提供者リスト\nc. 変革構想書\nd. 秘密保持契約書（NDA）","choices":{"ア":"a、b、c","イ":"a、c、d","ウ":"b、c、d","エ":"a、b、d"},"answer":"エ","dp":{"ア":3,"イ":3,"ウ":3},"explain":"調達実施の成果物の例には、RFP、外部のサービス開発・提供者リスト、秘密保持契約書（NDA）、提案書、選定結果報告書、契約書、SLA、調達したIT資源等がある（参考：PGL Ver.4.0 第3部 第2章 P.76）。cの変革構想書は変革認識アクティビティ（P1-1）の成果物であり、調達実施の成果物ではない。","verified":true},{"id":"q-b064","node":"P4-1","level":"基本","type":"A","pgl_page":77,"stem":"IT開発アクティビティの「開発による要件の実現」に関する記述として、適切なものはどれか。","choices":{"ア":"開発により要件の実現を行う中で、不足している機能や顧客満足につながる新たな価値に気が付いた場合は、提供価値検証プロセスへその気付きを共有する。","イ":"業務アプリケーションやシステムは要件どおりに正しく動作することのみが重要であり、使いやすさや顧客のニーズ・期待への合致は開発の段階では考慮しない。","ウ":"テストの自動化やテスト駆動開発の採用については、サイクルの反復をかえって遅らせる要因となるため、検討の対象から外すこととされる。","エ":"プログラムコードの履歴管理については、開発がすべて完了した後の段階でまとめて文書として記録すれば足りるものとされる。"},"answer":"ア","dp":{"イ":5,"ウ":5,"エ":2},"explain":"開発中に不足機能や新たな価値に気付いた場合は、提供価値検証プロセス（P6）へ気付きを共有する（参考：PGL Ver.4.0 第3部 第2章 P.77）。システムは単に動作するだけでなく顧客のニーズや期待に合致し使いやすいことが重要であり、テストの自動化やテスト駆動開発、リポジトリ管理システムによるコード履歴管理はサイクル反復の高速化につながる取り組みである。","verified":true},{"id":"q-b065","node":"P4-1","level":"基本","type":"A","pgl_page":77,"stem":"IT開発アクティビティにおけるテストに関する記述として、適切なものはどれか。","choices":{"ア":"テストは開発内容を熟知した開発リーダーのみで完結させることが望ましく、テストの種別や目的によらず、運用リーダー等のステークホルダーはアサインしない。","イ":"テストを十分に厳重に実施しさえすれば、テストの種類や範囲の設定によらず、システムに脆弱性や不具合が残る可能性はなくなるとされる。","ウ":"テストに合格すること自体を目的とするのではなく、価値提供のための要件が正しく実装されていることを検証することが本質的な目的である。","エ":"テスト計画は、実施した内容を後から記録として残すために、テストの実施が完了した後の段階で作成するものとされる。"},"answer":"ウ","dp":{"ア":1,"イ":4,"エ":2},"explain":"テストの本質的な目的は、合格すること自体ではなく、価値提供のための要件が正しく実装されていることの検証である（参考：PGL Ver.4.0 第3部 第2章 P.77）。テストは種別や目的に応じて運用リーダー等の必要なステークホルダーをアサインして実施し、種類や範囲の設定を誤ると厳重に行っても脆弱性や不具合が残る可能性があるため、あらかじめテスト計画を立てて適切なテストアプローチを検討する（参考：PGL Ver.4.0 第3部 第2章 P.78）。","verified":true},{"id":"q-b066","node":"P4-2","level":"基本","type":"B","pgl_page":79,"stem":"IT導入アクティビティの「IT資源配備・展開準備」で行うこととして、適切なものの組合せはどれか。\na. 開発・調達したIT資源を、レビューや承認を経た上で検証環境やステージング環境等に配備・展開する\nb. IT資源の利用に際しての利用規約やセキュリティポリシー等を準備する\nc. 本番環境への移行準備を行い、移行方式や緊急時の代替策、復旧方針・手順も検討する\nd. 提供価値の検証を行い、計画通りに価値提供が行えたのかどうかを確認する","choices":{"ア":"a、b、d","イ":"a、b、c","ウ":"a、c、d","エ":"b、c、d"},"answer":"イ","dp":{"ア":3,"ウ":3,"エ":3},"explain":"IT資源配備・展開準備では、デジタル経営推進者等によるレビューや承認を経てIT資源を検証環境やステージング環境等に配備・展開し（a）、利用規約やセキュリティポリシー等を準備し（b）、本番環境への移行準備として移行方式・手順や緊急時の代替策、復旧方針・手順も検討する（c）（参考：PGL Ver.4.0 第3部 第2章 P.79）。dの提供価値の検証は提供価値検証プロセス（P6）のタスクであり、本アクティビティでは行わない。","verified":true},{"id":"q-b067","node":"P4-2","level":"基本","type":"A","pgl_page":79,"stem":"IT導入において、新しい環境へ仕組みを展開する際の確認の仕方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"確認は各機能が正しく動くことに絞り、安全性や処理能力、使い続けられるかの確認は運用を始めてから順に行う。","イ":"本番へ移す際の控えの取り方をどうするかは、移行の場でトラブルが起きてから考えることとされる。","ウ":"移す手順や元に戻す手順の検討は外部の開発先に任せ、導入する企業の側では中身を把握しないこととされる。","エ":"各機能が正しく動くことの確認にとどめず、安全性や処理能力、使い続けられるかといった面も確かめ、危うさを小さく抑える。"},"answer":"エ","dp":{"ア":3,"イ":2,"ウ":1},"explain":"機能の動作確認だけでなく、安全性・処理能力・可用性の面でも検証してリスクを抑える。移す手順と控えの取り方は準備の段階で検討し、トラブルに備えて代替の手立てや復旧の手順を前もって整えておく。（参考：PGL Ver.4.0 第3部 第2章 P.79）","verified":true},{"id":"q-b068","node":"P4-2","level":"基本","type":"A","pgl_page":80,"stem":"ITシステムの導入と利活用の開始について、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"開発の責任者は判断の結果を経営者や推進者へ報告して開始の承認を受け、承認を得たうえで価値提供・運用へ引き継ぐ。","イ":"導入の実行計画は、作業への分解や担当部門・役割と責任をはっきりさせることはせず、完了の期日だけを定めて簡潔にまとめる。","ウ":"運用の責任者は、運用面の問題を確かめることが目的であっても、導入の計画そのものには加わらないとされる。","エ":"開始の承認は導入の状況を最もよく知る開発の責任者が自ら行い、経営者や推進者への報告は導入がすべて終わってからまとめて行う。"},"answer":"ア","dp":{"イ":4,"ウ":1,"エ":1},"explain":"開発の責任者は計画を作業に分解し、担当部門や役割・責任、期日をはっきりさせた実行計画を作る。運用の責任者も計画に積極的に加わり、開発の責任者を支える。（参考：PGL Ver.4.0 第3部 第2章 P.79、P.80）","verified":true},{"id":"q-b069","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"IT利活用による価値の提供アクティビティの「価値提供業務の開始」に関する記述として、適切なものはどれか。","choices":{"ア":"業務の遂行準備は営業・マーケティング業務に限定し、サプライチェーン業務やアフターサポート業務は準備の対象に含めない。","イ":"要員に対する教育は業務開始後に実務を通じて行うこととし、業務開始前には実施しない。","ウ":"顧客視点での価値の想定においては、カスタマージャーニーやカスタマーエクスペリエンス等の考え方を用いることができる。","エ":"業務手順は、価値提供の水準や品質とは切り離し、作業の順序のみを定めて作成する。"},"answer":"ウ","dp":{"ア":3,"イ":2,"エ":5},"explain":"顧客視点での価値の想定には、購入・利用に至るまでの思考や感情・体験を旅の道のりのように捉えるカスタマージャーニーや、カスタマーエクスペリエンスの考え方を用いることができる（参考：PGL Ver.4.0 第3部 第3章 P.82）。遂行準備はサプライチェーン業務やアフターサポート業務等も含めて行い、業務開始前までに要員教育を実施する。業務手順は価値提供が想定した水準以上の品質で提供できるように作成する。","verified":true},{"id":"q-b070","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"価値提供の業務を外部へ委託する場合の進め方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"業務の実情を最もよく知るのは委託先であるから、その力量を尊重し、水準の決め方も保ち方もすべて委託先の裁量に任せる。","イ":"任せる業務が顧客へどんな価値をどの程度の水準と品質で届けるのかを明らかにして要件にまとめ、取り決めを交わすことで水準を保てるようにする。","ウ":"水準の把握は委託先が受け持つ管理業務にあたるため、外部へ委託する場合、発注する側で水準を測る指標を用意する必要はない。","エ":"委託の契約では代金と納期だけをはっきりさせ、顧客へ届ける価値の中身や水準は契約に書かず、日々のやり取りの中で調整していく。"},"answer":"イ","dp":{"ア":1,"ウ":3,"エ":5},"explain":"外部へ委託する際は、その業務が顧客にもたらす価値の意味合いや水準、品質を明確にして要件化し、取り決めを交わすことで水準を担保する。あわせて、水準を把握するのに必要な指標を定め、管理の仕組みを整える。（参考：PGL Ver.4.0 第3部 第3章 P.82）","verified":true},{"id":"q-b071","node":"P5-1","level":"基本","type":"A","pgl_page":83,"stem":"価値提供の状況について情報を取得し管理することについて、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"集める情報は業務の担当者がそのつど自由に選ぶこととし、あらかじめ定めた評価の物差しには基づかない。","イ":"情報を集めるのは担当者の手作業によることが望ましく、自動で集めたりデータとして蓄えて管理したりすることは避ける。","ウ":"足りない情報や集めきれていないデータが分かって急ぎ手を打つ必要がある場合でも、報告は定例の時機まで行わない。","エ":"前の工程で定めた評価の物差しと目標の値に沿う形で、見極めに要る情報を集めていく。"},"answer":"エ","dp":{"ア":2,"イ":5,"ウ":2},"explain":"評価に必要な情報は、あらかじめ定めた指標と目標値に沿って集める。（参考：PGL Ver.4.0 第3部 第3章 P.83）","verified":true},{"id":"q-b072","node":"P5-1","level":"基本","type":"B","pgl_page":84,"stem":"価値提供の結果を見える形にまとめる際、望ましい取り組みの組合せはどれか。\na 主観に寄らず、客観的な分析と数値をもとに報告する\nb 報告づくりは、同じ視点を持つ担当者だけで行う\nc 情報がデータとして取れている場合は、集計や作表の機能を活かす\nd 分析から読み取れる示唆や、次の段階で打つ手を報告に盛り込む","choices":{"ア":"a、c、d","イ":"a、b、c","ウ":"a、b、d","エ":"b、c、d"},"answer":"ア","dp":{"イ":4,"ウ":4,"エ":4},"explain":"異なる視点や専門を持つ人の意見を取り入れることで、より釣り合いのとれた報告になるとされ、bは望ましくない。今回の結果に基づく今後の改善の展望を含めることも望ましいとされる。（参考：PGL Ver.4.0 第3部 第3章 P.84）","verified":true},{"id":"q-b073","node":"P5-2","level":"基本","type":"A","pgl_page":86,"stem":"ITサービスの提供実務を外部の開発・提供者へ委ねている場合の、サービスレベルマネジメントについて、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"提供の実務を外へ委ねている場合には、水準を保つ責任についても、実務を担う外部の開発・提供者の側へ移るものとされる。","イ":"提供の実務が社外にある場合、委託の契約によって品質は担保されるため、導入する企業の側で仕組みを整える必要はないとされる。","ウ":"実務が社内・社外のいずれにあっても仕組みを整えることは欠かせず、外へ委ねている場合も、水準を保つ責任は導入する企業の側にある。","エ":"進め方を定めた手順書は外部の開発・提供者が作るものであり、導入する企業のサービス提供部門では作らないこととされる。"},"answer":"ウ","dp":{"ア":1,"イ":4,"エ":1},"explain":"提供の実態が社内外のいずれにあっても仕組みの構築は必須であり、外部へ委ねている場合でも推進の責任は導入企業にあるとされる。（参考：PGL Ver.4.0 第3部 第3章 P.86）","verified":true},{"id":"q-b074","node":"P5-2","level":"基本","type":"A","pgl_page":86,"stem":"ITサービス運用における「IT資源、サービスのモニタリング」の進め方として、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"見張りは不具合を検知してから始めることとし、平常時における資源やサービスの状態については対象に含めない。","イ":"取り決めた水準の測定指標に沿って、見張る対象のデータをどれくらいの間隔でどう集めるかをはっきりさせ、必要な時機に手に入るようにする。","ウ":"集める効率を優先し、取得したままの状態でそのまま用いることとして、正しさを保つための補正や選別、誤った情報を除く手当ては行わない。","エ":"見張った結果は運用の部署の内部に記録として留めることとし、良くするための材料として次の作業へ渡すことはしない。"},"answer":"イ","dp":{"ア":2,"ウ":5,"エ":2},"explain":"合意した測定指標に沿って対象データの更新頻度や収集方法を明確にし、適切な時機に入手できるようにする。集めたデータは補正や選別によって正確さを保ち、誤った情報の影響を除く。読み取った変化は、次の維持管理の作業へ渡される。（参考：PGL Ver.4.0 第3部 第3章 P.86）","verified":true},{"id":"q-b075","node":"P5-2","level":"基本","type":"A","pgl_page":87,"stem":"ITサービス運用アクティビティにおけるインシデント管理に関する記述として、適切なものはどれか。","choices":{"ア":"インシデントに備えた対策や体制、手順、教育の整備は、インシデントが実際に発生してから着手する。","イ":"有事の際は、定められた手順よりも現場の担当者のその場の判断を優先して対応する。","ウ":"暫定処置によりサービスが復旧した場合には、原因究明と再発防止対策は省略することができる。","エ":"発生したインシデントへの暫定処置が完了した後、原因究明と再発防止対策を実施する。"},"answer":"エ","dp":{"ア":2,"イ":1,"ウ":4},"explain":"インシデント管理では、サービス停止時の運用や保証、リスクに備えた対策と体制、手順、教育を事前に行い、有事の際は定められた手順通りに対応して被害を最小限に抑える。暫定処置の完了後には、原因究明と再発防止対策を実施する（参考：PGL Ver.4.0 第3部 第3章 P.87）。復旧をもって対応を終えるのではなく、再発防止までがインシデント管理である。","verified":true},{"id":"q-b076","node":"P5-2","level":"基本","type":"B","pgl_page":88,"stem":"システム監査の基本的な実施手順を、実施順に並べたものはどれか。\na. 予備調査\nb. 本調査\nc. システム監査計画の作成\nd. 報告\ne. フォローアップ","choices":{"ア":"c → a → b → d → e","イ":"a → c → b → d → e","ウ":"c → b → a → d → e","エ":"a → b → c → d → e"},"answer":"ア","dp":{"イ":2,"ウ":2,"エ":2},"explain":"システム監査は、①システム監査計画の作成、②予備調査、③本調査、④報告、⑤フォローアップの順に実施する（参考：PGL Ver.4.0 第3部 第3章 P.88）。まず監査の範囲・目標・スケジュール等を定めた監査計画を作成し、初期的な情報収集である予備調査を経て、特定されたリスクに対する詳細な本調査を行う。評価結果はシステム監査報告書として経営陣へ報告し、推奨対策の実施状況を定期的にフォローアップする。","verified":true},{"id":"q-b077","node":"P5-2","level":"基本","type":"A","pgl_page":89,"stem":"システム監査の実行について、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"監査の持ち主としての責任は経営者ではなく、実施を託される社内の監査部門や社外の専門企業の側が負う。","イ":"監査の計画は初回に作ったものをそのまま毎回用い、範囲や狙い、何回目かの違いによって変えることはしない。","ウ":"日常の中での見張りと監査との大きな違いは独立性にあり、監査を行う人は関係者から離れた立場を保って臨む。","エ":"価値提供・運用の場面では、サイクルを回すたびに欠かさず監査を行う決まりになっているとされる。"},"answer":"ウ","dp":{"ア":1,"イ":4,"エ":4},"explain":"経営者が監査の持ち主としての責任を負うことで、監査が企業の戦略や組織の方向と噛み合う。監査の計画は毎回、狙いを明らかにして作る必要があり、監査そのものも毎回必ず行うものとは限らない。（参考：PGL Ver.4.0 第3部 第3章 P.84、P.88、P.89）","verified":true},{"id":"q-b078","node":"P6","level":"基本","type":"A","pgl_page":90,"stem":"提供価値検証プロセスの「ITサービス利活用の検証」に関する記述として、適切なものはどれか。","choices":{"ア":"ITサービスの利活用状況の検証は、客観性を確保するため、システムの稼働率等の技術的な測定値のみによって行い、利用者の主観的な意見は判断材料としない。","イ":"利用者数や利用頻度、ユーザーエンゲージメント等の様々な観点から検証を行うとともに、アンケートやユーザーインタビュー等を通じて要望や不満等の顧客の声の収集を行う。","ウ":"顧客の声の収集は、アンケートやインタビュー等を能動的に行うのではなく、利用者から不満や要望の申し出があった場合に限って受動的に行う。","エ":"利活用状況の検証はITサービスの利活用の開始直後に一度だけ実施すれば足り、その後の定期的な検証は運用の負荷となるため行わない。"},"answer":"イ","dp":{"ア":3,"ウ":2,"エ":4},"explain":"ITサービス利活用の検証では、利用者数や利用頻度、ユーザーエンゲージメント、ITサービスが提供価値に及ぼす効果等、様々な観点から検証を行い、アンケートやユーザーインタビュー等を通じて顧客の声を収集する（参考：PGL Ver.4.0 第3部 第4章 P.90）。定期的な検証により、持続的な価値提供と顧客満足度の向上のための情報や気付きを収集できる。収集したフィードバックは分析して改善策や優先順位付けに活用し、改善の進捗は利用者と共有する（参考：PGL Ver.4.0 第3部 第4章 P.91）。","verified":true},{"id":"q-b079","node":"P6","level":"基本","type":"A","pgl_page":92,"stem":"提供価値検証における改善活動について、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"改善への参加は検証を担う担当者に限り、組織内の他の関係者には改善への意識や参加の意欲を求めない。","イ":"問題の見極めや効果の確認は、データを集めて分析することによらず、業務に通じた担当者の経験と勘に頼って手早く行う。","ウ":"洗い出した改善点に優先度は付けず、すべてに同時に取りかかって早く終えることを図る。","エ":"改善は優先度を決めて実現できるやり方で進め、一度にすべてをやり切るのが難しければ、段を追って実施することも大切である。"},"answer":"エ","dp":{"ア":3,"イ":5,"ウ":2},"explain":"改善を実らせるには組織の中に改善の文化を根づかせることが必要で、全ての関係者が意識と参加意欲を持つことが重要とされる。また改善の際はデータに基づく判断が求められる。（参考：PGL Ver.4.0 第3部 第4章 P.92）","verified":true},{"id":"q-b080","node":"P6","level":"基本","type":"A","pgl_page":93,"stem":"提供価値検証からデジタル経営実行計画へ返す内容について、ガイドラインの考え方に沿うものはどれか。","choices":{"ア":"返すのは、価値実現サイクルの各プロセスや作業の単位では手の打ちようがなく、計画そのものの見直しを要するような課題である。","イ":"返すのは、日々の運用手順のちょっとした手直しなど、各プロセスや作業の単位で片づけられる課題に限られる。","ウ":"評価の物差しそのものの見直しは、計画の時点で固めた前提にあたるため、返す対象には含めない。","エ":"新しい商機や、新たに差し出せる価値の発見については、返さずに組織内での共有にとどめることとされる。"},"answer":"ア","dp":{"イ":3,"ウ":3,"エ":5},"explain":"大きな社会の変化で顧客の価値観が変わる見込みがある、技術革新で従来のサービスが立ち行かなくなる、規制や法律で市場が大きく変わるといった場合が例とされる。評価の物差し自体の見直しも返す対象に含まれる。（参考：PGL Ver.4.0 第3部 第4章 P.93）","verified":true},{"id":"q-a001","node":"P1-1","level":"応用","type":"C","pgl_page":32,"stem":"老舗小売業A社の経営者は競合他社のEC参入に危機感を抱き、「直ちにECサイト構築の提案依頼書（RFP）を作成せよ」とデジタル経営推進者に指示した。A社では、デジタル経営に関する現状分析や外部環境変化の体系的な認識はまだ行われていない。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"経営者のスピード感を尊重することとし、まず小規模なECを価値実現サイクルで軽量に試行して手応えを掴んだうえで、その結果を変革の構想へ反映していくよう助言する。","イ":"現状分析と戦略評価、外部環境変化の認識を行って変革の可能性を検討し、変革の方向性を変革構想書にまとめた上で、それをデジタル経営戦略プロセスのインプットとして戦略・実行計画へ進むよう助言する。","ウ":"経営者の指示を尊重してRFP作成に着手し、現状分析や外部環境の認識はそれと並行して進め、両者がそろった段階で突き合わせて調達要件を後から補正していけば、着手の遅れも避けられてよいと助言する。","エ":"変革の実現像をできるだけ早い段階で共有するため、経営者の「思い」や危機意識を言語化した変革構想書を先にまとめ、現状分析や外部環境の認識はその後で補うよう助言する。"},"answer":"イ","dp":{"ア":4,"ウ":2,"エ":5},"explain":"P1-1は 現状分析と戦略評価→外部環境の変化を認識→変革の可能性を発見→変革への意思決定 の順で進み、その成果物である変革構想書がP2のインプットとなる（p.32-35）。事例は体系的な認識が未着手の段階であり、C2の軽量試行や構想書の先行作成は認識・分析の前段を飛ばしている。RFP（調達＝P3〜P4）の並行着手も、構想・戦略・計画を経ていない時点では要件を固められない。","verified":true},{"id":"q-a002","node":"CB-3","level":"応用","type":"C","pgl_page":109,"stem":"A社は「顧客対応時間の30％短縮」を目標に掲げて新システムを導入した。稼働半年後の経営会議で効果を問われたが、目標は掲げられていたものの、それを測定可能な指標に変換して測定する仕組みが用意されていなかったことが判明した。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"利用部門への満足度アンケートを実施し、現場の体感評価を数値化して効果測定の結果として経営会議に報告し、当面の説明責任をきちんと果たすよう助言する。","イ":"効果を客観的に示すため、外部の監査法人にシステム監査を依頼することとし、導入効果の証明を第三者による評価に委ねるよう助言する。","ウ":"モニタリング＆コントロールとして、計画のKGI・KPIを測定可能なパフォーマンス指標に変換し、継続的に測定できる仕組みを整えるよう助言する。","エ":"効果測定については、次期システムの要件定義に着手してから、その検討の中で改めて設計すればよいものとして整理するよう助言する。"},"answer":"ウ","dp":{"ア":4,"イ":5,"エ":2},"explain":"モニタリング＆コントロール（CB-3）タスク1は、計画で定義したKGI・KPIを測定可能なパフォーマンス指標に変換することから始まる（参考：PGL Ver.4.0 第4部 第3章 P.109）。検証可能な指標があって初めてP6が正しくサイクルを回せる。本来はP3タスク6「評価指標の設計」で先に設計すべきもので、その欠落を事後に補う場面。アンケートの体感やシステム監査は測定可能指標の代替にならない。","verified":true},{"id":"q-a003","node":"CB-5","level":"応用","type":"C","pgl_page":120,"stem":"中堅製造業A社では、熟練技術者の判断ノウハウが属人化しており、定年退職による喪失が懸念されている。ナレッジマネジメントシステムに文書の登録を進めたが、登録文書はほとんど参照されず、若手の判断力も向上していない。組織学習の観点から、デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"部門ごとに文書登録の件数目標を設定し、ナレッジの登録を業務として義務化することで、蓄積される形式知の量を増やすよう助言する。","イ":"形式知化した知識を研修や実務での適用を通じて個人に取り込ませ（内面化）、新たな暗黙知として再び組織に還元する循環をつくるよう助言する。","ウ":"ナレッジマネジメントシステムの検索性とタグ付けを強化し、登録文書が自然に参照される状態になるまで運用を続けて、現場への自然な定着を待つよう助言する。","エ":"熟練技術者の再雇用や契約延長によって現行の体制を維持することとし、当面のあいだはノウハウの喪失を先送りするよう助言する。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":4},"explain":"組織の知は、個人の暗黙知を共有（形式知化）し、連結・応用し、新たな個人の知として再度取り込む（内面化）プロセスの反復で育つ（p.119-121）。A社は形式知化（登録）で止まっており、内面化までの循環が回っていない。登録件数の増加や検索性の強化、属人化の維持は循環をつくる打ち手にならない。","verified":true},{"id":"q-a004","node":"P2","level":"応用","type":"C","pgl_page":47,"stem":"A社は新たなITシステムの調達・導入を含むデジタル経営戦略を検討している。経営リスクの議論において、担当役員が「品質・費用・納期（QCD）を管理してシステムを完成させれば、リスク対応としては十分だ」と主張した。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"プロジェクトマネジメントを強化して進捗・品質・コストの統制を徹底し、計画どおりにシステムを完成させれば経営リスクは実務上回避できると助言する。","イ":"純粋リスクに備えて地震・火災・システムトラブル等への保険加入と事業継続策を講じておけば、経営リスクへの対応としては十分であると助言する。","ウ":"リスクの評価については、システムの導入後に提供価値検証プロセスの検証活動の中で行えば十分であると助言する。","エ":"QCDを満たしても戦略の誤りや環境変化で利用されない事態があり得るため、戦略の成就を目的とした戦略的観点でのリスク評価が必要と助言する。"},"answer":"エ","dp":{"ア":4,"イ":5,"ウ":2},"explain":"QCDを満たしたITシステムが導入されても、当初の戦略が誤っていたり導入時点で古びた戦略・システムになって利用されない事態が生じ得るため、あくまで戦略の成就を目的とした戦略的観点でのリスク評価が必要（参考：PGL Ver.4.0 第2部 第2章 P.47）。経営リスクには純粋リスクと投機的リスクがあり、保険は純粋リスクの一部への対処にすぎない。PM統制はQCDの管理でありリスク評価ではない。","verified":true},{"id":"q-a005","node":"P2","level":"応用","type":"C","pgl_page":50,"stem":"A社では、デジタル経営戦略のKPIとして設定した顧客接点のデジタル化率が順調に向上している。しかし取締役会で「その改善が収益にどう結びついているのか」を問われ、経営企画部門は説明できなかった。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"戦略に直結した財務指標を設定し、KGI／KPIと財務指標の関係性を設定・管理して、収益の源泉となる活動を把握できる仕組みを構築するよう助言する。","イ":"KPIが計画どおり順調に向上しており活動が前進している以上、収益との関係を改めて指標として整理し説明する必要はなく、現行の指標管理を続ければよいと助言する。","ウ":"説明のしやすさをなにより優先することとし、財務指標と関係づけやすい別のKPIへ、掲げた戦略目標そのものを差し替えるよう助言する。","エ":"収益との関係についての分析は、決算の時期に会計監査人が実施する監査に委ねることが、最も客観的な進め方であると助言する。"},"answer":"ア","dp":{"イ":5,"ウ":4,"エ":1},"explain":"持続的成長には収益の確保が必要であり、戦略に直結した財務指標を設定し、KGI／KPIと財務指標の関係性を設定・管理して収益の源泉となる活動を把握できる仕組みを構築する。これは外部ステークホルダーへの説明やIR活動にもつながる（p.50留意点）。KPI達成それ自体や指標の差し替え、会計監査への委任は関係性の設計・管理の代替にならない。","verified":true},{"id":"q-a006","node":"P3","level":"応用","type":"C","pgl_page":65,"stem":"製造業A社は、画像認識技術による品質検査の自動化を検討している。候補ベンダーのデモンストレーションで高い認識精度が示され、担当者は「デモで実力は確認できたので導入を決定したい」と提案した。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"デモで十分に高い認識精度が確認できた以上、追加のPoCは費用と期間を要するだけで得るものは少ないため、契約手続きに入りそのまま導入を進めるよう助言する。","イ":"認識精度についての検証は、本番導入をすべて終えた後に、提供価値検証プロセスの検証活動として行えば足りるものと助言する。","ウ":"自社の製品・画像データで学習・検証し、品質・スピードの向上と運用面の課題まで含めてPoCの結果を総合的に評価してから適用可否を判断するよう助言する。","エ":"まずはPoCの検証項目や判断基準については特に定めないこととし、ベンダーの環境で一通り試用してみてから改めて考えるよう助言する。"},"answer":"ウ","dp":{"ア":5,"イ":2,"エ":4},"explain":"適用したことのないITソリューションは自社の課題を解決できるか不明瞭であり、自社のデータで検証（PoC）して実現性・適合性を評価する。画像認識による品質検査の自動化はまさに本文の例で、検証により運用面の課題が見つかることもあるため総合的に評価する（参考：PGL Ver.4.0 第3部 第1章 P.65）。PoCは事前に目的・検証ポイント・判断基準を定義すべきで、それを欠く試用は有効でない。ベンダーのデモは自社データでの実力を保証しない。","verified":true},{"id":"q-a007","node":"P3","level":"応用","type":"C","pgl_page":63,"stem":"A社は、社外の顧客向けに新しいITサービスを提供する実行計画を作成している。担当チームは「顧客への詳細なヒアリングが完了するまで計画の具体化は進められない」として作業を停止しているが、顧客からの協力は今後も限定的な見込みである。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"計画の精度を確保するため、顧客への詳細なヒアリングによって十分な情報が得られる時期まで、計画作成をこのまま停止して待つよう助言する。","イ":"仮説をベースに調査や計画づくりを進め、アンケートやインタビューで検証した上で、計画や開発機能を見直す進め方に切り替えるよう助言する。","ウ":"ヒアリングは省略することとし、業務に詳しい社内メンバーの知見によって要件を確定してから進めるよう助言する。","エ":"暫定でよいので想定される全機能を先に開発し、顧客の反応を見てから改めて計画を作成するよう助言する。"},"answer":"イ","dp":{"ア":5,"ウ":4,"エ":2},"explain":"社外ユーザーに詳細な調査の時間を割いてもらうことは難しく、本来欲しい情報を集めることは難しい。仮説をベースに調査や計画づくりを進め、検証した上で計画や開発機能を見直す進め方が望ましい（参考：PGL Ver.4.0 第3部 第1章 P.63）。顧客像（ペルソナ）を定義し仮説検証で進める点が鍵で、停止の継続は停滞を招き、想像での要件確定は検証を欠き、計画前の全機能開発は順序を誤る。","verified":true},{"id":"q-a008","node":"COMMON-3","level":"応用","type":"C","pgl_page":11,"stem":"A社は社内にデジタル経営の専門人材がおらず、外部からデジタル経営支援者を招いた。この支援者の関わり方として、より適切なものはどれか。","choices":{"ア":"社内に適任者が育つまでの間は、デジタル経営推進者の実務を支援者が全面的に代行し、重要な意思決定についても支援者が引き受けるよう助言する。","イ":"助言に徹することとし、社内体制づくりや人材育成には関与せず、求められた技術的判断のみを提供するようにする。","ウ":"まず外部の開発リーダー・運用リーダーも同時に招き入れることとし、当面は主要な役割を外部人材で固めるようにする。","エ":"助言や支援を行いながら、最終的には社内人材がデジタル経営推進者等の役割を担えるように育成していく関わり方をとる。"},"answer":"エ","dp":{"ア":1,"イ":4,"ウ":5},"explain":"デジタル経営支援者は、デジタル経営推進者等の役割をただ代行するのではなく、助言や支援を行い、最終的には社内人材が役割を担えるように育成していくことが望ましい（参考：PGL Ver.4.0 第1部 第3章 P.11）。代行や意思決定の引き受けは役割を外れ、育成に関与しない助言限定や外部人材で固める選択も、社内人材の育成という支援者の本質から外れる。","verified":true},{"id":"q-a009","node":"COMMON-4","level":"応用","type":"C","pgl_page":28,"stem":"A社はデジタル経営戦略を策定し、価値実現サイクルに展開して実行を開始した。経営企画の担当者は「戦略は実行フェーズに移ったので、次の戦略の見直しは今回の実行が一通り完了してから着手すべきだ」と述べた。デジタル経営支援者であるあなたの助言として、より適切なものはどれか。","choices":{"ア":"デジタル経営成長サイクルは価値実現サイクルへ展開した後も並行して経営環境等の情報収集を継続し、必要に応じて展開した戦略の見直しを行うよう助言する。","イ":"実行中は現場を混乱させないため、戦略に関する情報収集や見直しは一旦止め、今回の実行が一通り完了した段階で、改めて全体をまとめて再開するよう助言する。","ウ":"情報収集は継続しつつも、見直しは価値実現サイクルからのフィードバックが出そろう提供価値検証プロセスの検証完了まで待つよう助言する。","エ":"戦略の見直しはデジタル経営戦略プロセスの次回サイクルの起点で行うものなので、今期は実行に専念するよう助言する。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":5},"explain":"デジタル経営成長サイクル（C1）は環状であり、策定した戦略を価値実現サイクル（C2）に展開した後も、並行して経営環境等の情報収集を継続的に行い、必要に応じて展開した戦略の見直しを行う（参考：PGL Ver.4.0 第2部 P.28）。実行フェーズだからと情報収集や見直しを止めるのは、環境変化に俊敏に対応するというC1の並行実行の趣旨に反する。","verified":true},{"id":"q-a010","node":"COMMON-4","level":"応用","type":"C","pgl_page":17,"stem":"A社の経営者は自社のデジタル経営成熟度を高めたいと考え、「まずはITサービスの整備状況（デジタル環境）を評価し、そこを重点的に底上げすればよい」と方針を示した。デジタル経営成熟度の評価に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"デジタル環境の指標が最も客観的に測ることができるため、当面は環境の成熟度のみを評価指標として管理するよう助言する。","イ":"成熟度の評価はデジタル経営成熟度レベルの向上アクティビティで行うものであるため、まず戦略を固めることとし、評価は戦略の策定後に着手するよう助言する。","ウ":"成熟度はマインド・ガバナンス・デジタル環境・デジタル利活用の4視点で評価し、環境だけでなくマインドやガバナンスも含めて現状を把握するよう助言する。","エ":"4視点のうちマインドについては主観的で測りにくいため評価の対象から外すこととし、残る3視点で評価するよう助言する。"},"answer":"ウ","dp":{"ア":4,"イ":2,"エ":5},"explain":"デジタル経営成熟度は、デジタル経営マインド・デジタル経営ガバナンス・デジタル環境・デジタル利活用の4つの視点で評価する（参考：PGL Ver.4.0 第1部 第4章 P.17）。環境だけやマインドを外すのは4視点の一部に偏る。成熟度評価はP1-2で行い戦略策定のインプットとするため、戦略の後に回すのは順序が逆。","verified":true},{"id":"q-a011","node":"P1-2","level":"応用","type":"C","pgl_page":35,"stem":"A社は成熟度の向上に取り組むことにした。担当者は「4つの評価視点すべてで最高段階のレベル5を、今年度中に一斉に達成する」という目標を掲げた。デジタル経営成熟度レベルの向上に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"変革のスピードをなにより重視することとし、全視点を一律にレベル5とする高い目標を掲げたうえで、全社一斉に取り組むよう助言する。","イ":"現状の成熟度を評価した上で、成熟度は中長期的な取り組みであることを踏まえ、短期と中長期の取り組みを組み合わせた段階的な向上目標を設定するよう助言する。","ウ":"成熟度の向上が取り得る戦略の幅を狭めることのないよう、当面は現状維持を目標に据え、戦略の方向性が固まってから改めて段階的に引き上げていくよう助言する。","エ":"向上目標の設定については各現場にそれぞれ一任することとし、全社としての成熟度目標は設けずに各部門の自主性に委ねるよう助言する。"},"answer":"イ","dp":{"ア":4,"ウ":5,"エ":1},"explain":"P1-2では現状の成熟度を評価し、成熟度レベルにより次の成長への対策が異なることを踏まえて向上目標を設定する。向上は中長期的な取り組みになるため、短期的な取り組みと中長期的な取り組みを組み合わせる（参考：PGL Ver.4.0 第2部 第1章 P.35）。全視点一律レベル5の一斉達成は段階性を欠き、現状維持は「成熟度の向上が取り得る戦略の選択肢を増やす」趣旨に反する。","verified":true},{"id":"q-a012","node":"P4-1","level":"応用","type":"C","pgl_page":77,"stem":"A社はIT開発でシステムを開発中である。開発メンバーから「計画にはないが、あると便利そうな機能を思いついたので追加したい」との提案があった。開発リーダーへのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"利用者の利便性が確実に上がるのは明らかなので、開発の勢いを止めないよう開発中に柔軟に取り込んで作り込んでしまうよう助言する。","イ":"計画外の機能なので一律に却下し、以降の機能提案は次期開発まで一切受け付けないよう助言する。","ウ":"まず追加機能も含めて実装し、テスト段階で不要と分かれば取り除く前提で進めるよう助言する。","エ":"最小限の範囲で動くプロダクトを意識し、追加は必要性・優先度・開発計画全体への影響を吟味した上で判断するよう助言する。"},"answer":"エ","dp":{"ア":5,"イ":4,"ウ":2},"explain":"「元々の計画にはないが便利そうだから」といった理由で安易に機能追加・変更を行うと、操作の煩雑化や不具合、他要件への影響等で本来の価値提供を妨げるリスクがある。新機能の追加・変更は、必要性や優先度・開発計画全体への影響を吟味した上で行う（参考：PGL Ver.4.0 第3部 第2章 P.77）。無条件の取り込みも一律却下も吟味を欠き、実装先行で後から取り除くのは最小限で動くプロダクトの考えに反する。","verified":true},{"id":"q-a013","node":"P4-2","level":"応用","type":"C","pgl_page":80,"stem":"A社はIT導入で、開発したシステムの総合テストに合格した。開発リーダーは「テストに合格したので直ちに利活用を開始したい」と考えているが、運用リーダーからは利用者の教育・訓練がまだ不十分との指摘がある。IT利活用開始の判断に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"総合テスト結果に加え、教育・訓練や移行準備の状況等から導入プロセス全体を評価し、運用リーダー等の評価も含めて総合的に判断するよう助言する。","イ":"総合的なテストに合格している以上、システムとしてはすでに完成しているため、ただちに利活用を開始するよう助言する。","ウ":"利活用を開始する可否の判断は運用リーダーに一任することとし、開発リーダーは価値提供・運用プロセスへの引き継ぎ後の関与に切り替えるよう助言する。","エ":"教育・訓練については利活用の開始後に並行して実施すればよいので、先に利用を開始してから訓練を進めるよう助言する。"},"answer":"ア","dp":{"イ":4,"ウ":1,"エ":2},"explain":"IT利活用開始は、総合テストの結果や教育・訓練の状況等からIT導入プロセス全体を評価し、運用リーダー等の必要なステークホルダーの評価も含めて総合的に判断する。開発リーダーは判断結果を経営者・推進者に報告して承認を受け、承認後にP5へ引き継ぐ（参考：PGL Ver.4.0 第3部 第2章 P.80）。テスト合格のみでの開始や訓練を後回しにした先行開始は総合判断を欠く。","verified":true},{"id":"q-a014","node":"P5-1","level":"応用","type":"C","pgl_page":82,"stem":"A社は開発したITサービスの利活用を開始し、価値提供業務に移った。担当者は「ITシステムが安定稼働していれば顧客への価値提供は実現できる」と考え、業務手順や要員教育の準備を後回しにしようとしている。デジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"システムの安定稼働こそ価値提供の前提なので、当面はシステム運用の安定化に注力し、業務手順や要員教育は運用が落ち着いてきた段階で、無理なく順次整えていくよう助言する。","イ":"業務手順や要員の教育についてはそれぞれの現場の裁量に委ねることとし、推進者はサービスレベル指標の管理のほうに専念するよう助言する。","ウ":"顧客視点での価値を想定して業務の流れと手順を構築し、要員計画・教育まで整えて初めて計画どおりの価値提供が実現できるため、これらを業務開始前に準備するよう助言する。","エ":"要員の教育は日々の実務を通じて習熟させれば足りるものであるため、事前の教育については省略したうえで業務を開始するよう助言する。"},"answer":"ウ","dp":{"ア":2,"イ":1,"エ":4},"explain":"価値提供業務の開始（P5-1タスク1）では、推進者は顧客視点の価値を想定して業務の流れを構築し、業務手順を作成し、要員計画・配置と要員教育まで行うことで、計画どおりの価値提供が実現できることを確実にする（参考：PGL Ver.4.0 第3部 第3章 P.82）。システムの安定稼働だけでは価値提供にならず、手順・教育の後回しや現場任せは業務開始前の準備を欠く。","verified":true},{"id":"q-a015","node":"P5-2","level":"応用","type":"C","pgl_page":88,"stem":"A社は運用中のITシステムについて、取引先や規制当局から、特定の基準・規制に準拠していることを客観的に示すよう求められた。ITサービス運用のシステム監査に関するデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"自組織の監査部門による内部監査で、システムの効率性や安全性の評価とあわせて基準・規制への準拠状況も確認すれば、対外的な説明にも足りると助言する。","イ":"基準・規制への準拠を第三者の立場で評価してもらう必要があるため、組織外の第三者による外部監査を実施するよう助言する。","ウ":"監査は特に行わないこととし、日常のモニタリング＆コントロールの記録をもって準拠の証跡とすれば足りると助言する。","エ":"準拠の確認は運用リーダーによる自己点検で対応することとし、外部への説明時にはその結果を提示すれば足りると助言する。"},"answer":"イ","dp":{"ア":5,"ウ":4,"エ":1},"explain":"システム監査には内部監査と外部監査があり、実施主体と目的が異なる（参考：PGL Ver.4.0 第3部 第3章 P.88）。特定の基準・規制等への準拠を客観的に示す必要がある場合は、組織外の第三者が行う外部監査が適する。内部監査は自組織の監査部門等がシステムの効率性・安全性を評価し、改善につなげることを目的とするもので、独立した第三者による準拠の証明にはならない。運用リーダーの自己点検やモニタリング＆コントロールの記録も同様に、第三者評価の代替にはならない。","verified":true},{"id":"q-a016","node":"P6","level":"応用","type":"C","pgl_page":93,"stem":"A社は新ITサービス稼働後、提供価値検証プロセスで利活用を検証している。設定したKPI（利用率・遵守状況）はいずれも目標を達成していた。一方で検証の過程で、技術革新により今のサービス形態自体が近い将来立ち行かなくなる兆候が見えてきた。デジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"改善点としてIT開発・導入プロセスへフィードバックすることとし、システムの機能改修によって対応するよう助言する。","イ":"価値提供・運用プロセスへフィードバックすることとし、運用手順の見直しと利用者への教育によって対応するよう助言する。","ウ":"KPIについてはいずれも目標を達成できているため、現時点では追加の対応は不要であると整理し、次回の定期検証の時期まで様子を見るよう助言する。","エ":"この気付きは計画自体の見直しを要するため、デジタル経営実行計画プロセスへフィードバックし、次の価値実現サイクルで計画の見直しにつなげるよう助言する。"},"answer":"エ","dp":{"ア":3,"イ":4,"ウ":5},"explain":"P6タスク4はタスク・アクティビティレベルで改善可能な点をP4・P5へ、タスク5はそれらのレベルでは改善が困難な課題をP3へフィードバックする。技術革新で従来サービスが立ち行かなくなる兆候はP3行きの例（参考：PGL Ver.4.0 第3部 第4章 P.93）。機能改修や運用改善では構造的課題に粒度が合わず、提供価値の検証はKPI以外の幅広い観点でも行うべきで、KPI達成での様子見は検証範囲を狭める（参考：PGL Ver.4.0 第3部 第4章 P.92）。","verified":true},{"id":"q-a017","node":"P6","level":"応用","type":"C","pgl_page":90,"stem":"A社は提供価値検証プロセスでITサービスの利活用を検証している。担当者は「サービスレベルの遵守状況（稼働率・応答時間）が基準を満たしていれば、利活用の検証としては十分だ」と考えている。デジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"サービスレベルの遵守状況に加え、利用者数・利用頻度・エンゲージメントや、アンケート・インタビューによる顧客の要望・不満等も収集し、様々な観点から利活用を検証するよう助言する。","イ":"サービスレベルが基準を満たしている以上、利活用の検証はこれで完了とし、以降は定期のSLM報告に一本化して、運用状況やサービスレベルの推移の定例共有に切り替えていくよう助言する。","ウ":"顧客の声の収集は業務工程の検証（タスク2）のほうで扱うこととし、利活用の検証（タスク1）ではサービスレベルの指標に限定して確認するよう助言する。","エ":"稼働が安定しているあいだについては追加の検証を行わないこととし、障害や苦情が実際に発生した時点で、その都度必要な検証を実施するよう助言する。"},"answer":"ア","dp":{"イ":4,"ウ":5,"エ":2},"explain":"P6タスク1では、利用者数や利用頻度、ユーザーエンゲージメント、サービスレベルの遵守状況、ITサービスが提供価値に及ぼす効果等、様々な観点から検証を行い、アンケートやユーザーインタビュー等で要望や不満等の顧客の声も収集する（参考：PGL Ver.4.0 第3部 第4章 P.90）。定期的な検証で持続的な価値提供と顧客満足の向上につなげるものであり、サービスレベル遵守のみや事後対応では検証の観点・タイミングが不足する。","verified":true},{"id":"q-a018","node":"CB-1","level":"応用","type":"C","pgl_page":100,"stem":"A社では、個々の開発・導入プロジェクトはそれぞれ期限内に完了している。しかしプロセス間の引き継ぎで手戻りや待ちが多く、価値実現サイクル全体としては非効率が生じている。サイクルマネジメントの観点からのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"各プロジェクトが期限内に成果を出せている以上、当面は個々のプロジェクト管理の徹底を続けていけば、いずれ全体の非効率も自然に改善すると助言する。","イ":"手戻りを減らすため各プロジェクトの期限管理をさらに厳格化し、遅延の発生を抑えることに注力するよう助言する。","ウ":"プロセス間のボトルネックや非効率な要素を特定し、プロセスの定義・文書化・実行・改善を通じてサイクルの全体最適化を図るよう助言する。","エ":"プロセス間の調整は各プロセスの責任者間の個別調整に委ね、共通基盤としての関与は最小限にとどめるよう助言する。"},"answer":"ウ","dp":{"ア":4,"イ":5,"エ":1},"explain":"サイクルマネジメント（CB-1）は、プロセス間のボトルネックや非効率な要素を特定し、サイクルの全体最適化を行う包括的・構造的なアプローチである。決められた期間内に特定の結果を達成することに重点を置くプロジェクトマネジメントとは異なる（参考：PGL Ver.4.0 第4部 第1章 P.100）。個々のプロジェクトの期限管理を徹底してもプロセス間の全体最適にはならず、個別調整任せも共通基盤としての役割を欠く。","verified":true},{"id":"q-a019","node":"CB-2","level":"応用","type":"C","pgl_page":108,"stem":"A社のデジタル経営プロジェクトで、あるステークホルダー間に意見の相違が生じ、関係がぎくしゃくし始めた。コミュニケーションの観点から、プロセスの実行主体者へのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"問題が拡大する前に関係のメンテナンスを速やかに行い、期待の明確化や追加支援等の対処をし、必要に応じてコミュニケーション計画を修正するよう助言する。","イ":"意見の相違は当事者間のやり取りで自然に解消されることも多いため、まずはしばらく静観し、状況が悪化しないか推移を見守り、必要になった時点で対応するよう助言する。","ウ":"相違点の是非については実行主体者の側が判断して一方の意見を採用することとし、議論についてはできるだけ早期に打ち切るよう助言する。","エ":"関係の悪化はコミュニケーションの問題であるため、その対応は経営者に委ねることとし、実行主体者は目の前の実務に専念するよう助言する。"},"answer":"ア","dp":{"イ":2,"ウ":4,"エ":1},"explain":"メンバー間で意見の相違が発生した場合は、問題が拡大するのを防ぐため、関係のメンテナンスを速やかに実施する。関係のメンテナンスでは、期待を明確にする、追加支援を提供する等の対処を行い、必要に応じてコミュニケーション計画を修正する（参考：PGL Ver.4.0 第4部 第2章 P.108）。静観は拡大を招き、独断での打ち切りは合意形成に反し、経営者への丸投げは実行主体者の役割を外れる。","verified":true},{"id":"q-a020","node":"CB-4","level":"応用","type":"C","pgl_page":115,"stem":"情報漏洩を強く懸念するA社の経営者は、「あらゆる業務データに最高レベルのセキュリティ対策を一律に適用せよ」と指示した。セキュリティの観点からのデジタル経営支援者の助言として、より適切なものはどれか。","choices":{"ア":"情報漏洩が生じた場合の影響は甚大であるため、コストや業務効率にかかわらず全データに対して最高レベルの対策を一律に適用するよう助言する。","イ":"対策の優先順位付けはあえて行わないこととし、まず全社に共通の最高水準ルールを一律に課したうえで、支障が出た部署から個別に緩和していくよう助言する。","ウ":"セキュリティは専門性が高い領域であるため、対策のレベルについての判断については外部のセキュリティ専門家に全面的に一任するよう助言する。","エ":"守るべきものと価値提供の両軸を踏まえ、脅威・脆弱性の影響を評価して優先度の高いものから対策し、状況によってはリスクの受容も含めて適切なレベルを設定するよう助言する。"},"answer":"エ","dp":{"ア":5,"イ":2,"ウ":1},"explain":"セキュリティレベルを高めることは重要である一方、必要以上に厳格な対策は事業や業務を逼迫させ価値提供機会を逸することにつながりかねず、状況によっては情報セキュリティリスクを受容する考え方を取るべき場合もある。脅威・脆弱性の影響を評価し、優先度の高いものから対処して限られたリソースを最適活用し、守るべきものと価値提供の両軸で適切なレベルを考慮する（p.114-115）。一律最高レベルは過剰対策の弊害を招き、レベル判断の外部一任は経営者・推進者・各リーダーが担う判断を外れる。","verified":true}];
