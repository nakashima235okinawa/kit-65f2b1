<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ITC試験対策 模擬試験 第2回（個人学習用） — PGL Ver.4.0 対応</title>
<style>
:root{
  --bg:#E9EBEE; --card:#FCFCFB; --ink:#17202B; --sub:#5C6672;
  --ai:#1F3A63; --shu:#B4362F; --midori:#2C6A4F; --rule:#C9CDD3; --gold:#8a6d1f;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:15px}
header{background:var(--ai);color:#fff;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-size:18px;margin:0;letter-spacing:.08em}
header .sub{font-size:11px;opacity:.75}
header .hspace{flex:1}
#timer{font-variant-numeric:tabular-nums;font-size:16px;letter-spacing:.05em;display:none}
#timer.warn{color:#ffd9d4}
main{max-width:860px;margin:18px auto 40px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(23,32,43,.05)}
h2{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--ai);letter-spacing:.05em}
.muted{color:var(--sub);font-size:13px}
button{font-family:var(--sans);cursor:pointer;border-radius:6px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:9px 16px;font-size:14px}
button.primary{background:var(--ai);border-color:var(--ai);color:#fff}
button.danger{background:var(--shu);border-color:var(--shu);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px;cursor:pointer;transition:.12s}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:var(--ai);box-shadow:0 2px 8px rgba(31,58,99,.12)}}
.mode b{font-family:var(--serif);font-size:16px;color:var(--ai);display:block;margin-bottom:6px}
.mode .muted{font-size:12px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.stat b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
/* 問題表示 */
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--sub)}
.tagchip{border:1px solid var(--rule);border-radius:999px;padding:1px 10px;background:#fff}
.flagbtn{margin-left:auto;font-size:12px;padding:4px 12px}
.flagbtn.on{background:#fff6e0;border-color:var(--gold);color:var(--gold)}
.stem{white-space:pre-wrap;font-size:15px;margin:4px 0 14px}
.qno{font-family:var(--serif);color:var(--ai);font-weight:700;margin-right:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;background:#fff;padding:10px 12px;cursor:pointer;text-align:left;font-size:14px;line-height:1.7}
.choice .pos{font-family:var(--serif);color:var(--ai);font-weight:700;min-width:1.4em}
.choice .tx{white-space:pre-wrap}
@media (hover:hover) and (pointer:fine){.choice:hover{border-color:var(--ai)}}
.choice.sel{border-color:var(--ai);background:#eef2f8;box-shadow:inset 0 0 0 1px var(--ai)}
.choice.ok{border-color:var(--midori);background:#eaf3ee;box-shadow:inset 0 0 0 1px var(--midori)}
.choice.ng{border-color:var(--shu);background:#faecea;box-shadow:inset 0 0 0 1px var(--shu)}
.choice.dim{opacity:.6}
.exp{margin-top:14px;border-left:4px solid var(--ai);background:#f2f4f8;border-radius:0 6px 6px 0;padding:12px 14px;font-size:13.5px}
.exp .vh{font-family:var(--serif);color:var(--ai);margin-bottom:6px}
.exp .chain{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);font-size:12.5px;color:var(--sub)}
.exp .chain .tagchip{margin:2px 4px 2px 0;display:inline-block}
.navrow{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.navrow .spacer{flex:1}
/* 番号グリッド */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--rule);border-radius:5px;background:#fff;text-align:center;padding:6px 0;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.answered{background:#eef2f8;border-color:var(--ai)}
.cell.flagged{box-shadow:inset 0 -3px 0 var(--gold)}
.cell.cur{outline:2px solid var(--ai)}
.cell.ok{background:#eaf3ee;border-color:var(--midori)}
.cell.ng{background:#faecea;border-color:var(--shu)}
/* バー */
.bar{height:10px;background:#e3e6ea;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai)}
.bar i.low{background:var(--shu)} .bar i.mid{background:var(--gold)}
.noderow{display:grid;grid-template-columns:11em 1fr 4.5em;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.noderow .nm{cursor:pointer;color:var(--ai)}
.noderow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips .c{border:1px solid var(--rule);border-radius:999px;background:#fff;padding:4px 13px;font-size:13px;cursor:pointer}
.chips .c.on{background:var(--ai);border-color:var(--ai);color:#fff}
.score-hero{text-align:center;padding:8px 0 2px}
.score-hero .big{font-family:var(--serif);font-size:44px;color:var(--ai);font-variant-numeric:tabular-nums}
.score-hero .of{color:var(--sub);font-size:15px}
footer{max-width:860px;margin:30px auto;padding:0 14px 30px;color:var(--sub);font-size:11.5px;line-height:1.9;border-top:1px solid var(--rule)}
.hide{display:none}
dialog{border:1px solid var(--rule);border-radius:8px;max-width:420px;padding:20px;font-family:var(--sans)}
dialog::backdrop{background:rgba(23,32,43,.4)}
@media(max-width:560px){.noderow{grid-template-columns:8em 1fr 4em}}
</style>
</head>

  <h1>ITC試験対策 模擬試験 第2回</h1><span class="sub">PGL Ver.4.0 対応・100問（個人学習用）</span>
  <div class="hspace"></div>
  <div id="timer">120:00</div>
  <button id="homebtn" class="ghost" style="color:#fff;border-color:rgba(255,255,255,.4);font-size:12px;padding:5px 12px">ホーム</button>
</header>

<script>
const QS=[{"id":"q2-b001","node":"COMMON-1","level":"基本","type":"A","pgl_page":12,"stem":"ITCがデジタル経営支援者として企業に関わる際の基本姿勢として、最も適切なものはどれか。","choices":{"ア":"投資判断など本来は経営者が行うべき意思決定についても、経営者の負担を減らすためとして支援者が継続的に代行し続ける立場をとる。","イ":"特定のITベンダーとの関係を優先し、その提案内容をそのまま経営者に取り次ぐ仲介役に徹し、中立的な助言は行わない。","ウ":"現場の意思決定権を引き受け、プロジェクトの主導権を握り続ける。","エ":"経営者や推進者を側面から支援し、社内人材が自らデジタル経営を推進できるよう育成する立場に徹する。"},"answer":"エ","dp":{"ア":12,"イ":12,"ウ":12},"explain":"エが正しい。デジタル経営支援者は、推進者に必要な能力を組織が備えきれない場合に経営者が活用し、社内人材の自立を促す立場である（p.12）。アは意思決定の代行にあたる。イは中立性を欠く。ウは主導権の独占にあたる。","verified":false},{"id":"q2-b002","node":"COMMON-2","level":"基本","type":"A","pgl_page":11,"stem":"デジタル経営推進者に求められる知識・スキルの説明として、最も適切なものはどれか。","choices":{"ア":"特定のプログラミング言語やIT製品の詳細仕様を、開発者と同等の水準で自ら実装できる。","イ":"経営・戦略の基本知識と業務プロセスの理解に加え、データとITの知識をもち、利用者視点で変革を構想できる。","ウ":"自組織のデータとIT利活用の成熟度の把握には関与せず、その理解や判断は開発リーダーや運用リーダーにすべて委ねる。","エ":"関係者との対話的なコミュニケーションは最小限にとどめ、文書化した指示書のみで一方向に活動を統制することを推進者の基本姿勢とする。"},"answer":"イ","dp":{"ア":11,"ウ":11,"エ":11},"explain":"イが正しい。推進者には経営・戦略の知識、業務理解、データとITの知識、利用者視点での構想力などが求められる（p.11）。アは実装スキルそのものは推進者の要件ではない。ウは自組織の成熟度理解は推進者に求められる。エは対話的なコミュニケーション能力が求められる。","verified":false},{"id":"q2-b003","node":"COMMON-1","level":"基本","type":"A","pgl_page":10,"stem":"デジタル経営における経営者とデジタル経営推進者の役割分担の説明として、最も適切なものはどれか。","choices":{"ア":"戦略の方向づけだけでなく実行段階の実務判断についても、すべて経営者本人が直接担い続け、推進者には委ねない。","イ":"実行段階の実務は契約したITベンダーに全面的に委ね、社内にはデジタル経営を担当する推進者を置かない体制とする。","ウ":"戦略の方向づけは経営者が主導し、実行段階の実務は命を受けたデジタル経営推進者が担当する。","エ":"実行段階では経営者は関与せず、推進者が経営方針の決定まで単独で行う。"},"answer":"ウ","dp":{"ア":10,"イ":10,"エ":10},"explain":"ウが正しい。デジタル経営の実践は経営者だけではできず、経営者から命を受けた推進者が実務を担当する（p.10）。アは推進者の役割が欠落している。イは実務の外部丸投げにあたる。エは経営方針の決定は経営者の役割である。","verified":false},{"id":"q2-b004","node":"COMMON-3","level":"基本","type":"A","pgl_page":7,"stem":"デジタル経営の定義に関する説明として、最も適切なものはどれか。","choices":{"ア":"提供すべき価値やあるべき姿を描き、仮説検証を繰り返しながらデータとITを徹底的に利活用して実現する経営。","イ":"既存の業務を変えずに、最新のITツールを導入すること自体を目的とする経営である。","ウ":"経営者のこれまでの勘と経験を最優先の判断根拠とし、収集したデータの利活用はあくまで意思決定を補助する位置づけにとどめる経営である。","エ":"IT部門が主体となって導入する技術を選定し、事業部門は方針の決定や価値の実現には関与しない経営である。"},"answer":"ア","dp":{"イ":7,"ウ":7,"エ":7},"explain":"アが正しい。デジタル経営は、あるべき姿を描き、仮説検証を繰り返しながらデータとITを徹底的に利活用して価値を実現していくものである（p.7）。イはツール導入の目的化にすぎない。ウはデータ重視の考え方に反する。エは主体の捉え方が誤っている。","verified":false},{"id":"q2-b005","node":"COMMON-4","level":"基本","type":"A","pgl_page":23,"stem":"デジタル経営を成功に導く10の基本原則のうち「価値創造の原則」の説明として、最も適切なものはどれか。","choices":{"ア":"いったん定めた提供価値は環境が変化しても見直さず、当初の計画で決めた内容をそのまま提供し続けることを重視する。","イ":"提供している価値が顧客や社会に有効かを常に問い続け、絶えず価値の創造と向上を図る。","ウ":"提供価値の評価は売上や利益などの財務指標のみで行い、顧客がその価値をどう受け止めているかという視点は考慮しない。","エ":"価値の検証は事業終了後にまとめて一度だけ行う。"},"answer":"イ","dp":{"ア":23,"ウ":23,"エ":23},"explain":"イが正しい。価値創造の原則は、提供価値を問い続け、絶えず価値の創造・向上を図ることを求める（p.23）。アは問い続ける姿勢に反する。ウは顧客視点が欠けている。エは継続的な検証に反する。","verified":false},{"id":"q2-b006","node":"P1-1","level":"基本","type":"A","pgl_page":34,"stem":"「変革構想書」の位置づけに関する説明として、最も適切なものはどれか。","choices":{"ア":"中期経営計画によって定義された将来ビジョンを指し、財務指標のみによって構成される。","イ":"変革認識等で得られる成果物で、経営者の思いを反映し変革への意思決定の内容をまとめたもの。","ウ":"外部コンサルタントが収集した客観的なデータのみで構成される文書であり、経営者本人の事業への思いや主観は含まれない。","エ":"デジタル経営戦略プロセスで初めて作成される成果物であり、変革認識の段階では作成されない。"},"answer":"イ","dp":{"ア":34,"ウ":34,"エ":34},"explain":"イが正しい。変革構想書は変革認識等で得られる成果物で、経営者の思いを反映したグランドデザインであり、デジタル経営戦略プロセスのインプットになる（p.34）。アは財務指標のみという捉え方が誤り。ウは経営者の思いを反映する点に反する。エは作成される段階の理解が誤り。","verified":false},{"id":"q2-b007","node":"P1-2","level":"基本","type":"A","pgl_page":16,"stem":"デジタル経営成熟度を評価する4つの視点として、適切なものはどれか。","choices":{"ア":"売上高、利益率、株価、時価総額という4つの財務指標を用いて、企業の業績と成熟度のレベルを総合的に評価する。","イ":"顧客価値、事業価値、企業価値、社会価値の4つの価値で評価する。","ウ":"情報戦略、システム開発、運用保守、保守契約の4つの工程で評価する。","エ":"デジタル経営マインド、ガバナンス、デジタル環境、デジタル利活用の4つの視点で評価する。"},"answer":"エ","dp":{"ア":16,"イ":16,"ウ":16},"explain":"エが正しい。デジタル経営成熟度は、マインド・ガバナンス・環境・利活用の4つの視点で評価する（p.16）。アは財務指標に置き換えている。イは4つの価値の分類と混同している。ウは開発工程に置き換えている。","verified":false},{"id":"q2-b008","node":"P1-2","level":"基本","type":"A","pgl_page":16,"stem":"デジタル経営成熟度レベルの向上の進め方として、最も適切なものはどれか。","choices":{"ア":"同業他社が到達している成熟度レベルに合わせ、自社の現状のレベルを問わず一気に最高レベルへ引き上げることを当面の目標とする。","イ":"成熟度は一度評価すれば十分であり、その後の見直しは行わない。","ウ":"組織の身の丈に合った技術導入・利活用を前提に、現状を認識したうえで段階的に成長させる。","エ":"成熟度レベルは組織全体の状態ではなく、IT部門が保有する技術力の高さのみを基準として判断すればよいとする。"},"answer":"ウ","dp":{"ア":16,"イ":16,"エ":16},"explain":"ウが正しい。デジタル経営では身の丈に合った技術導入と利活用が必要で、現状を認識して段階的に成長させる（p.16）。アは無謀な目標設定にあたる。イは継続的な見直しに反する。エは評価対象の捉え方が誤り。","verified":false},{"id":"q2-b009","node":"P2","level":"基本","type":"A","pgl_page":49,"stem":"デジタル経営戦略プロセスの位置づけについて、最も適切なものはどれか。","choices":{"ア":"短期の売上目標の達成のみを目的に、単年度の施策を列挙するプロセスである。","イ":"経営環境の変化から変革の必要性を認識し、変革への意思決定をまとめた変革構想書を作成する段階のプロセスである。","ウ":"経営ビジョン（あるべき姿）に整合させ、中期的視野でデジタル経営戦略を策定するプロセス。","エ":"導入する個別システムの要件を定義し、開発の詳細な仕様や調達条件を具体的に決定するプロセスである。"},"answer":"ウ","dp":{"ア":49,"イ":49,"エ":49},"explain":"ウが正しい。デジタル経営戦略は経営理念に基づく経営ビジョン（あるべき姿）に整合させ、中期的視野で策定する（p.49）。アは短期・単年度に矮小化している。イは変革・成長プロセスと混同している。エはIT開発・導入プロセスと混同している。","verified":false},{"id":"q2-b010","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略プロセスにおける「あるべき姿」の構築手順として、最も適切なものはどれか。","choices":{"ア":"企業理念を確認して経営ビジョン（あるべき姿）を描き、それに整合する形で戦略を策定する。","イ":"現行業務の延長線上で達成可能な範囲だけを、あるべき姿として設定する。","ウ":"あるべき姿は経営理念やミッションとは切り離して考え、市場で話題となっている最新技術の動向のみに基づいて描くことを重視する。","エ":"あるべき姿を先に描くことはせず、実行可能な個別施策を積み上げた結果として全体の方向性を後から決めていく。"},"answer":"ア","dp":{"イ":44,"ウ":44,"エ":44},"explain":"アが正しい。あるべき姿は経営理念・ミッションを確認したうえで経営ビジョンとして描き、戦略を整合させる（p.44）。イは現状の延長に留めている。ウは経営理念との整合に反する。エはあるべき姿を欠いている。","verified":false},{"id":"q2-b011","node":"P3","level":"基本","type":"A","pgl_page":62,"stem":"デジタル経営実行計画プロセスの機能について、最も適切なものはどれか。","choices":{"ア":"経営環境の変化を捉え、変革の戦略そのものを策定するプロセスである。","イ":"戦略で描いたロードマップを具体化し、実行に向けた開発・導入計画へ落とし込むプロセス。","ウ":"開発・導入したITシステムを実際に運用し、利用者に対してサービスの提供を継続的に行うプロセスである。","エ":"提供した価値の達成状況を評価・検証し、その結果を次のデジタル経営戦略の見直しや変革につなげるプロセスである。"},"answer":"イ","dp":{"ア":62,"ウ":62,"エ":62},"explain":"イが正しい。デジタル経営実行計画プロセスは、戦略で描いたロードマップを具体化し実行計画に落とし込む（p.62）。アはデジタル経営戦略プロセスと混同している。ウは価値提供・運用プロセスと混同している。エは提供価値検証プロセスと混同している。","verified":false},{"id":"q2-b012","node":"P3","level":"基本","type":"A","pgl_page":69,"stem":"ITベンダーの選定に関する考え方として、最も適切なものはどれか。","choices":{"ア":"提案価格が最も低いベンダーを、他の条件を問わず選定する。","イ":"過去に取引実績があり関係が構築できているベンダーを、他社との比較検討を行わずにそのまま継続して選定する。","ウ":"価格だけでなく、要件適合性や品質、実現能力、実績等を総合的に評価して選定する。","エ":"先進的な最新技術を掲げているベンダーを、その技術が自社の要件に適合するかを確認しないまま優先して選定する。"},"answer":"ウ","dp":{"ア":69,"イ":69,"エ":69},"explain":"ウが正しい。ベンダー選定は価格のみでなく、要件適合性・品質・実現能力・実績等を総合的に評価する（p.69）。アは価格のみで判断している。イは比較検討を欠いている。エは要件適合の確認を欠いている。","verified":false},{"id":"q2-b013","node":"P4-1","level":"基本","type":"A","pgl_page":73,"stem":"IT開発アクティビティにおける「要件の確認と開発・調達の準備」に関する記述として、最も適切なものはどれか。","choices":{"ア":"現場から挙がったすべての要件を同時に確定させ、要件間の優先順位はつけずに一括して開発を進めることを基本とする。","イ":"開発リーダーが開発・導入計画に基づき要件を確認し、段階的開発では優先順位を決め対象を定める。","ウ":"要件の確認は運用リーダーが単独で行い、開発リーダーは関与しない。","エ":"開発途中で状況が変わっても要件は一切変更せず、当初計画で確定した内容のまま最後まで固定して進める。"},"answer":"イ","dp":{"ア":73,"ウ":73,"エ":73},"explain":"イが正しい。開発リーダーが開発・導入計画に基づき要件を確認し、段階的開発では優先順位を決めて反復内の対象を定める（p.73）。アは優先順位づけを否定している。ウは主体（開発リーダー）が誤り。エは合意の下での要件変更を否定している。","verified":false},{"id":"q2-b014","node":"P4-2","level":"基本","type":"A","pgl_page":78,"stem":"IT導入アクティビティにおけるシステムの導入・利活用開始に関する記述として、最も適切なものはどれか。","choices":{"ア":"開発したシステムを本番環境に配置するところまでを担い、利用者が使える状態にする引き渡しは次のプロセスで行うとする。","イ":"開発するシステムの要件定義を、この段階で初めて確定させる。","ウ":"提供した価値の検証結果に基づいて、稼働中のシステムの改修方針や次の投資の方向性を決定するアクティビティである。","エ":"配備したIT資源を業務で使える状態にし、利用者が実際に利活用を開始できるようにする活動。"},"answer":"エ","dp":{"ア":78,"イ":78,"ウ":78},"explain":"エが正しい。IT導入アクティビティでは、配備したIT資源を利用者が利活用開始できる状態にする（p.78）。アは利活用開始まで含む点を欠いている。イは要件確認の段階と混同している。ウは提供価値検証プロセスと混同している。","verified":false},{"id":"q2-b015","node":"P5-1","level":"基本","type":"A","pgl_page":81,"stem":"IT利活用による価値の提供アクティビティにおける「価値提供業務の開始」に関する記述として、最も適切なものはどれか。","choices":{"ア":"業務手順や要員教育は整備せず、システムの稼働開始と同時に業務を始める。","イ":"顧客視点での価値は考慮せず、既存の社内業務の効率化のみを目的として価値提供業務の流れを設計することを重視する。","ウ":"顧客視点で業務の流れを構築し、要員計画・配置と教育を行って、手順に従い業務を開始する。","エ":"価値提供業務の流れの設計は運用リーダーに全面的に一任し、デジタル経営推進者は準備や要員教育には関与しない。"},"answer":"ウ","dp":{"ア":81,"イ":81,"エ":81},"explain":"ウが正しい。推進者は顧客視点で業務の流れを構築し、要員計画・配置・教育を行い、手順に従って業務を開始する（p.81）。アは準備・教育を欠いている。イは顧客視点が欠けている。エは主体（推進者）の関与を否定している。","verified":false},{"id":"q2-b016","node":"P5-2","level":"基本","type":"A","pgl_page":84,"stem":"ITサービス運用アクティビティにおける「サービスレベルの維持運用」に関する記述として、最も適切なものはどれか。","choices":{"ア":"合意したサービスレベルを維持できるよう、提供状況を管理し必要に応じて運用を調整する。","イ":"サービスレベルは契約時に定めれば足り、運用中の管理は行わない。","ウ":"この運用の段階で、次に開発する新規システムの要件をまとめて確定させ、その後の開発・調達の詳細な準備を併せて進めていくものとする。","エ":"提供した価値の達成状況の検証を行い、その結果に基づいて次の変革やデジタル経営戦略の方向性を決定する。"},"answer":"ア","dp":{"イ":84,"ウ":84,"エ":84},"explain":"アが正しい。サービスレベルの維持運用では、合意したサービスレベルを維持できるよう提供状況を管理する（p.84）。イは運用中の管理を否定している。ウはIT開発・導入プロセスと混同している。エは提供価値検証プロセスと混同している。","verified":false},{"id":"q2-b017","node":"P6","level":"基本","type":"A","pgl_page":90,"stem":"提供価値検証プロセスの位置づけについて、最も適切なものはどれか。","choices":{"ア":"開発するITシステムの要件を確認し、開発・調達の準備を行うプロセスである。","イ":"経営環境の変化から変革の必要性を認識し、経営者の事業への思いを反映した変革構想書を作成し、次の戦略につなげるプロセスである。","ウ":"実行に向けた開発・導入計画を具体化するプロセスである。","エ":"提供した価値の達成状況を検証し、その結果を次の戦略見直しや変革につなげるプロセス。"},"answer":"エ","dp":{"ア":90,"イ":90,"ウ":90},"explain":"エが正しい。提供価値検証プロセスは提供価値の達成状況を検証し、結果を次の戦略見直し・変革につなげる（p.90）。アはIT開発・導入プロセスと混同している。イは変革・成長プロセスと混同している。ウはデジタル経営実行計画プロセスと混同している。","verified":false},{"id":"q2-b018","node":"CB-1","level":"基本","type":"A","pgl_page":100,"stem":"サイクルマネジメントの役割について、最も適切なものはどれか。","choices":{"ア":"プロセスの定義・文書化・設計・実行・改善を繰り返し、サイクル全体を最適化する共通基盤。","イ":"個々のプロジェクトの日程や進捗だけを管理する活動であり、プロセスそのものの定義や継続的な改善は対象としない。","ウ":"情報セキュリティリスクを低減することを主目的とする活動である。","エ":"各個人が得た学習の成果を組織全体で共有・応用し、価値創造を図ることを主目的とする共通基盤の活動である。"},"answer":"ア","dp":{"イ":100,"ウ":100,"エ":100},"explain":"アが正しい。サイクルマネジメントはプロセスの定義・文書化・設計・実行・改善を繰り返し、サイクル全体を最適化する（p.100）。イは対象を日程管理に矮小化している。ウはセキュリティと混同している。エは組織学習と混同している。","verified":false},{"id":"q2-b019","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"デジタル経営共通基盤としてのセキュリティに関する記述として、最も適切なものはどれか。","choices":{"ア":"情報セキュリティリスクを低減するため、ツールに加え社員教育や運用ルールの整備を組織的に行う。","イ":"最新のセキュリティツールを導入すれば、教育や運用ルールの整備は不要である。","ウ":"情報セキュリティ対策はシステムを管理するIT部門だけが担うべき課題であり、事業部門は運用ルールの整備や社員教育には関与しないとする。","エ":"平時には特段の備えをせず、サイバー攻撃や情報漏洩が実際に発生した後に、必要な対策をまとめて講じれば十分とする。"},"answer":"ア","dp":{"イ":113,"ウ":113,"エ":113},"explain":"アが正しい。セキュリティは情報セキュリティリスクを低減するもので、ツールに加え教育や運用ルールを含め組織的に対策する（p.113）。イはツールに偏り教育・運用を欠いている。ウは対象を限定しすぎている。エは事後対応に留まっている。","verified":false},{"id":"q2-b020","node":"CB-5","level":"基本","type":"A","pgl_page":118,"stem":"組織学習の位置づけについて、最も適切なものはどれか。","choices":{"ア":"個人が得た知識は個人の中にとどめ、組織での共有は行わない。","イ":"組織学習はIT部門の技術的なスキル向上のみを対象とする活動であり、全社的な知の共有や応用は範囲に含めない。","ウ":"学習によって得られた成果は形式知として文書化せず、担当者個人の記憶や経験のみに頼って組織内に蓄積していく。","エ":"個人の学習を組織で共有・応用して価値創造を図る仕組みで、暗黙知の形式知化と応用を繰り返す。"},"answer":"エ","dp":{"ア":118,"イ":118,"ウ":118},"explain":"エが正しい。組織学習は個人の学習を組織で共有・応用して価値創造を図る仕組みで、暗黙知の形式知化と応用を繰り返す（p.118）。アは組織での共有を否定している。イは対象を限定しすぎている。ウは形式知化を否定している。","verified":false},{"id":"q2-a001","node":"COMMON-1","level":"応用","type":"A","pgl_page":12,"stem":"中堅サービス業H社では、経営者が「ITのことはよく分からないので、システム選定から契約まですべて任せたい」と支援者に要望している。より適切な対応はどれか。","choices":{"ア":"経営者の要望どおり、システム選定から契約締結までの意思決定をすべて代行して進める。","イ":"判断に必要な情報や選択肢を整理して提示し、意思決定は経営者自身が行えるよう支援する。","ウ":"専門性が高い領域であるとして、システム選定はITベンダーに直接依頼するよう伝え、支援者としての以降の関与を控える。","エ":"経営者の不安を早く解消するため、当面はすべての判断を支援者が代行し、経営者へは事後報告のみを行う。"},"answer":"イ","dp":{"ア":12,"ウ":12,"エ":12},"explain":"イが最も適切。支援者は経営者自身が意思決定できるよう情報を整理して支援するのが基本姿勢である（p.12）。アは意思決定の代行にあたる。ウは支援者としての関与を放棄している。エは意思決定の代行と事後報告に留まっている。","verified":false},{"id":"q2-a002","node":"COMMON-4","level":"応用","type":"A","pgl_page":23,"stem":"中小製造業I社では、新施策の検討にあたり、経営層から「過去に成果を上げた成功事例をそのまま踏襲すべきだ」との意見が強く出ている。より適切な助言はどれか。","choices":{"ア":"過去に社内で成果を上げた成功事例を、外部環境の変化にかかわらずそのまま踏襲するよう助言する。","イ":"変化への対応は当面見送り、他社が新施策で成果を出してから追随するよう助言する。","ウ":"新施策の検討は現場に一任し、経営層は結果の報告だけを受ける体制にするよう助言する。","エ":"過去の成功に囚われず、外部環境の変化をチャンスと捉えて新たな発想で構想するよう促す。"},"answer":"エ","dp":{"ア":23,"イ":23,"ウ":23},"explain":"エが最も適切。イノベーションの原則は、過去の成功に囚われず変化をチャンスとして捉えて発想することを求める（p.23）。アは過去の成功への固執にあたる。イは変化対応の先送りにあたる。ウは経営層の主体的関与を欠いている。","verified":false},{"id":"q2-a003","node":"COMMON-3","level":"応用","type":"A","pgl_page":7,"stem":"J社では新しい経営理念を掲げたが、現場から「理念と日々の業務が結びつかない」という声が上がっている。より適切な助言はどれか。","choices":{"ア":"理念は経営層が掲げるものであり、現場の日々の業務とは切り離して運用するよう助言する。","イ":"掲げた理念そのものの見直しを最優先し、現場全体が納得するまで新しい理念の策定を繰り返すよう助言する。","ウ":"理念の浸透は時間の経過に任せ、現場への特段の働きかけは行わないよう助言する。","エ":"経営理念やあるべき姿を業務や施策と結びつけ、現場が共感できるよう対話で浸透を図る。"},"answer":"エ","dp":{"ア":7,"イ":7,"ウ":7},"explain":"エが最も適切。デジタル経営は経営理念に基づくあるべき姿を実現するもので、理念を業務と結びつけ共感につなげる工夫が必要である（p.7）。アは理念と業務を切り離している。イは手段を取り違えている。ウは浸透への働きかけを放棄している。","verified":false},{"id":"q2-a004","node":"COMMON-4","level":"応用","type":"A","pgl_page":23,"stem":"K社は自社の技術力を起点に新製品を企画したが、顧客への価値提案が曖昧なまま開発を進めようとしている。より適切な助言はどれか。","choices":{"ア":"技術的な優位性が高いため、顧客価値の整理は後回しにして開発を先行させるよう助言する。","イ":"価値提案は営業段階で固めればよいとして、開発は当初の技術仕様のまま進めるよう助言する。","ウ":"顧客にとっての価値を起点に据え、提供価値を明確にしてから開発を進めるよう助言する。","エ":"価値提案の曖昧さは市場投入後の顧客の反応を見てから調整すればよいと助言する。"},"answer":"ウ","dp":{"ア":23,"イ":23,"エ":23},"explain":"ウが最も適切。価値創造の原則は提供価値を問い続けることを求め、顧客視点で価値を明確にすることが起点となる（p.23）。アは顧客価値の整理を後回しにしている。イは価値提案の明確化を先送りしている。エは価値検証を後ろ倒しにしている。","verified":false},{"id":"q2-a005","node":"COMMON-4","level":"応用","type":"A","pgl_page":25,"stem":"L社では新システム導入後、利用者からの利用率が伸び悩んでいる。より適切な助言はどれか。","choices":{"ア":"利用率は利用者側の慣れの問題であり、時間が経てば自然に向上するとして特段の対応をしないよう助言する。","イ":"利用を促すため、システムの利用を一律に義務化し、未利用者には罰則を科すよう助言する。","ウ":"利用率が低いのは機能不足が原因と決めつけ、利用者の声を確認せず追加機能の開発を最優先するよう助言する。","エ":"利用者が価値を実感できる仕組みや働きかけを検討し、関係を深めて動機付けを高めるよう助言する。"},"answer":"エ","dp":{"ア":25,"イ":25,"ウ":25},"explain":"エが最も適切。利用者動機付けの原則は、利用者との関係をより深めて利用の動機付けを高めることを求める（p.25）。アは対応を放置している。イは動機付けでなく強制に頼っている。ウは原因を確認せず決めつけている。","verified":false},{"id":"q2-a006","node":"P1-1","level":"応用","type":"A","pgl_page":32,"stem":"M社の経営者は、業界内の競合が相次いでデジタル化を進めている状況を把握しているが、自社としての対応方針をまだ具体化できていない。より適切な助言はどれか。","choices":{"ア":"競合の動向をしばらく静観し、他社の成功事例が出そろってから対応方針を検討するよう助言する。","イ":"対応方針が定まらない段階でも、まず複数のベンダーに開発の見積もりを依頼するよう助言する。","ウ":"外部環境の変化を分析し、経営者自身の「思い」を整理して変革の意思決定を促すよう助言する。","エ":"業界内の動向は自社の状況とは無関係であるため、当面は対応方針を検討する必要はないと助言する。"},"answer":"ウ","dp":{"ア":32,"イ":32,"エ":32},"explain":"ウが最も適切。変革認識アクティビティでは、外部環境の変化を分析し経営者の思いを整理して変革の意思決定を促す（p.32）。アは静観して後手に回っている。イは検討の順序を誤っている。エは外部環境の変化を軽視している。","verified":false},{"id":"q2-a007","node":"P1-2","level":"応用","type":"A","pgl_page":36,"stem":"N社の社長は「同業他社が達成した成熟度レベルと同じ水準を、来期中に必ず達成したい」と主張している。より適切な助言はどれか。","choices":{"ア":"社長の意向どおり、自社の現状を評価せずに他社と同じ最高レベルを来期の目標とするよう助言する。","イ":"成熟度評価は他社との比較が目的であるため、自社としての目標設定は行わず、他社が示した数値をそのまま追うよう助言する。","ウ":"成熟度目標は一度設定すれば十分であるとして、以後の見直しは行わないよう助言する。","エ":"現状の成熟度レベルを評価し、身の丈に合った目標を設定して段階的に引き上げるよう助言する。"},"answer":"エ","dp":{"ア":36,"イ":36,"ウ":36},"explain":"エが最も適切。成熟度は身の丈に合ったレベルへ段階的に高めるもので、現状を評価したうえで目標を設定する（p.36）。アは無謀な目標設定にあたる。イは成熟度評価の目的を取り違えている。ウは継続的な見直しを欠いている。","verified":false},{"id":"q2-a008","node":"P2","level":"応用","type":"A","pgl_page":44,"stem":"O社では、デジタル経営戦略の検討にあたり、現状の業務プロセスを大きく変えずにシステムだけを導入しようとしている。より適切な助言はどれか。","choices":{"ア":"現行の業務プロセスは変えずに、まず市販で利用できる既製のパッケージシステムの導入を先行させるよう助言する。","イ":"業務改革は現場の反発が大きいため見送り、システムで対応できる範囲にとどめるよう助言する。","ウ":"業務とシステムの整合は運用開始後に調整すればよいとして、導入を急ぐよう助言する。","エ":"あるべき姿と戦略を起点に業務改革を検討し、それに合わせてITの導入を計画するよう助言する。"},"answer":"エ","dp":{"ア":44,"イ":44,"ウ":44},"explain":"エが最も適切。デジタル経営戦略はあるべき姿・経営ビジョンに整合させ、業務改革の方向性を示したうえでITを位置づける（p.44）。アは手段を先行させている。イは業務改革を回避している。ウは整合を後回しにしている。","verified":false},{"id":"q2-a009","node":"P2","level":"応用","type":"A","pgl_page":48,"stem":"P社では、複数のKPIを設定したが、どれも同程度に重要だと考え、優先順位をつけていない。より適切な助言はどれか。","choices":{"ア":"設定した指標はいずれも重要であるため、優先順位はつけずすべてを同等に管理するよう助言する。","イ":"指標の数が多いほど管理が手厚くなるとして、さらに指標を追加するよう助言する。","ウ":"戦略目標に不可欠な要因（CSF）を見極め、直結する指標に優先順位をつけて管理するよう助言する。","エ":"指標の優先順位づけは現場の各担当者がその都度判断すればよいとして、全社としての統一的な管理方針は特に定めないよう助言する。"},"answer":"ウ","dp":{"ア":48,"イ":48,"エ":48},"explain":"ウが最も適切。経営ビジョン・ビジネスモデル・CSFを決定し、CSFに直結する指標を重点的に管理する（p.48）。アは重点化を欠いている。イは指標を乱立させている。エは全社方針が不在である。","verified":false},{"id":"q2-a010","node":"P3","level":"応用","type":"A","pgl_page":64,"stem":"Q社では要件定義の段階で、現場の要望をすべて漏れなく反映しようとして要件が際限なく膨らんでいる。より適切な助言はどれか。","choices":{"ア":"戦略上の優先度で要件に優先順位をつけ、サイクルを回しながら実現範囲を絞るよう助言する。","イ":"現場の要望はすべて価値があるとして、漏れなく要件に反映してから開発に着手するよう助言する。","ウ":"要件の絞り込みは開発ベンダーに任せ、社内では優先順位を検討しないよう助言する。","エ":"要件は多いほど利用者満足が高まるとして、膨らんだまま一括で開発するよう助言する。"},"answer":"ア","dp":{"イ":64,"ウ":64,"エ":64},"explain":"アが最も適切。段階的に開発する場合は要件の優先順位を決め、反復内での開発対象を絞る（p.64）。イは要件を全部盛りにしている。ウは優先順位の判断を丸投げしている。エは優先順位づけを欠いている。","verified":false},{"id":"q2-a011","node":"P3","level":"応用","type":"A","pgl_page":70,"stem":"R社では、IT投資予算を前年度の実績のみを基準に機械的に決定しようとしている。より適切な助言はどれか。","choices":{"ア":"予算編成の手間を簡素にするため、前年度のIT投資の実績額をそのまま踏襲して機械的に決定するよう助言する。","イ":"投資対効果の観点から、戦略上の重要度や期待価値に基づき投資予算を検討するよう助言する。","ウ":"投資額は多いほど成果が出るとして、可能な限り予算を増額するよう助言する。","エ":"投資予算は財務部門に一任し、戦略上の重要度は考慮しないよう助言する。"},"answer":"イ","dp":{"ア":70,"ウ":70,"エ":70},"explain":"イが最も適切。IT投資は投資対効果の評価に基づき、戦略上の重要度や期待される価値を踏まえて判断する（p.70）。アは前例を踏襲しているだけである。ウは額の多寡で判断している。エは戦略上の重要度を軽視している。","verified":false},{"id":"q2-a012","node":"P4-1","level":"応用","type":"A","pgl_page":74,"stem":"T社の開発プロジェクトでは、要員が不足したまま開発マネジメント体制を確定させずに開発へ着手しようとしている。より適切な助言はどれか。","choices":{"ア":"納期を優先し、開発マネジメント体制が未確定のまま開発に着手するよう助言する。","イ":"開発体制や検証方法を確立し、計画どおり遂行できると確認してから着手するよう助言する。","ウ":"体制の確立は開発ベンダーに一任し、社内では関与しないまま着手するよう助言する。","エ":"要員の不足は開発の進行に影響しないと判断し、体制を確認せずに着手するよう助言する。"},"answer":"イ","dp":{"ア":74,"ウ":74,"エ":74},"explain":"イが最も適切。開発リーダーは開発マネジメント体制の構築・管理方法・検証方法を確立し、計画遂行が可能かを確認する（p.74）。アは準備不足のまま着手している。ウは体制構築を丸投げしている。エはリスクを軽視している。","verified":false},{"id":"q2-a013","node":"P4-2","level":"応用","type":"A","pgl_page":79,"stem":"U社では、新システムの導入にあたり、利用者への教育やマニュアル整備をほとんど行わないまま利活用を開始しようとしている。より適切な助言はどれか。","choices":{"ア":"要員教育やマニュアル整備を行い、利用者が使える状態にしてから利活用を開始するよう助言する。","イ":"導入スケジュールを優先し、利用者への教育やマニュアル整備を省いて利活用を開始するよう助言する。","ウ":"教育やマニュアルは利用者が各自で対応するものとして、整備を行わないよう助言する。","エ":"操作上の問題は運用開始後に個別対応すればよいとして、事前の教育を行わないよう助言する。"},"answer":"ア","dp":{"イ":79,"ウ":79,"エ":79},"explain":"アが最も適切。要員に対する教育を実施し、要員が手順に従ってIT資源やサービスを利活用して業務を開始する（p.79）。イは準備を省略している。ウは責任を利用者に転嫁している。エは事後対応に頼っている。","verified":false},{"id":"q2-a014","node":"P5-1","level":"応用","type":"A","pgl_page":82,"stem":"V社では、価値提供業務の遂行にあたり、顧客から寄せられたフィードバックを記録するのみで、その後の対応につなげていない。より適切な助言はどれか。","choices":{"ア":"フィードバックを分析して業務や価値提供の改善につなげ、関連プロセスへ反映するよう助言する。","イ":"顧客のフィードバックは記録として蓄積するにとどめ、業務の改善には用いないよう助言する。","ウ":"フィードバックの活用は提供価値検証プロセスの役割であるとして、運用側では扱わないよう助言する。","エ":"好意的なフィードバックのみを選んで参考にし、否定的な意見は集計から除くよう助言する。"},"answer":"ア","dp":{"イ":82,"ウ":82,"エ":82},"explain":"アが最も適切。顧客視点の価値を実現できるよう業務を構築・改善するもので、フィードバックを改善につなげる（p.82）。イは活用が不足している。ウは役割の切り分けを誤っている。エは意見を恣意的に選別している。","verified":false},{"id":"q2-a015","node":"P5-2","level":"応用","type":"A","pgl_page":87,"stem":"W社では、システム監査の結果、複数の指摘事項が見つかったが、担当部門が対応の優先順位を決められずにいる。より適切な助言はどれか。","choices":{"ア":"指摘事項はいずれも重要であるため、優先順位はつけず発見された順に対応するよう助言する。","イ":"指摘事項のリスクや影響度を評価して優先順位をつけ、是正計画を立てて対応するよう助言する。","ウ":"指摘への対応は監査を担当した部門に一任し、事業部門は関与しないよう助言する。","エ":"監査で見つかった指摘事項は次回の監査までに自然に解消される可能性があるとして、当面は対応を保留するよう助言する。"},"answer":"イ","dp":{"ア":87,"ウ":87,"エ":87},"explain":"イが最も適切。システム監査の指摘はリスクや影響度を評価して優先順位をつけ、是正の計画を立てて対応する（p.87）。アは重点化を欠いている。ウは当事者としての関与を欠いている。エは対応を保留している。","verified":false},{"id":"q2-a016","node":"P6","level":"応用","type":"A","pgl_page":91,"stem":"X社では、提供価値検証プロセスでKPIの達成状況を集計しているが、その結果を次の計画に活かせていない。より適切な助言はどれか。","choices":{"ア":"KPIの達成状況は集計して関係者へ報告するにとどめ、次のデジタル経営戦略や計画への反映は行わないよう助言する。","イ":"検証結果の活用は次年度の予算編成の時期にまとめて検討すればよいとして、当面は保留するよう助言する。","ウ":"検証で得た達成状況を評価し、次の戦略見直しや実行計画へフィードバックするよう助言する。","エ":"目標を未達の指標のみを対象とし、達成した指標については分析を行わないよう助言する。"},"answer":"ウ","dp":{"ア":91,"イ":91,"エ":91},"explain":"ウが最も適切。提供価値検証は達成状況を検証し、その結果を次の戦略見直しや変革につなげる（p.91）。アはフィードバックが機能していない。イは反映を先送りしている。エは分析の範囲を限定している。","verified":false},{"id":"q2-a017","node":"CB-2","level":"応用","type":"A","pgl_page":105,"stem":"Y社のプロジェクトでは、経営者への報告が滞り、現場の進捗状況が経営層に正しく伝わっていない。より適切な助言はどれか。","choices":{"ア":"報告は現場の判断に任せ、経営層が必要と感じたときに個別に確認する体制とするよう助言する。","イ":"円滑な意思疎通と協力のため、経営層と現場の間で情報を共有する仕組みを整えるよう助言する。","ウ":"経営層への報告は重要事項の決定後にまとめて行えばよいとして、報告の頻度を下げるよう助言する。","エ":"関係者間の情報共有はプロジェクトの完了後に総括としてまとめて行えば十分であるとして、途中では行わないよう助言する。"},"answer":"イ","dp":{"ア":105,"ウ":105,"エ":105},"explain":"イが最も適切。コミュニケーションは関係を構築してアジリティと信頼性を高め、円滑な意思疎通と協力を実現するものである（p.105）。アは受け身の情報伝達に留まっている。ウは報告を後ろ倒しにしている。エは途中の情報共有を欠いている。","verified":false},{"id":"q2-a018","node":"CB-3","level":"応用","type":"A","pgl_page":111,"stem":"Z社では、モニタリング指標を数多く設定しているが、誰がどの指標を確認するのかが明確になっていない。より適切な助言はどれか。","choices":{"ア":"監視すべき指標について、誰が確認し逸脱時にどう是正するかを明確に定めるよう助言する。","イ":"監視する指標は多いほど管理が手厚くなるとして、誰が確認するかの体制は定めないまま、さらに指標を追加するよう助言する。","ウ":"指標の確認は各担当者が気づいた範囲で行えばよいとして、役割は定めないよう助言する。","エ":"指標の監視は定期報告の作成が目的であるとして、是正措置までは検討しないよう助言する。"},"answer":"ア","dp":{"イ":111,"ウ":111,"エ":111},"explain":"アが最も適切。モニタリング＆コントロールはパフォーマンス指標を定期的に監視・分析し、結果評価と是正措置を行う（p.111）。イは体制を欠いたまま乱立させている。ウは役割が不明確なままである。エは是正措置を欠いている。","verified":false},{"id":"q2-a019","node":"CB-4","level":"応用","type":"A","pgl_page":114,"stem":"甲社では、セキュリティ対策として最新のツール導入のみに注力し、社員への教育や運用ルールの整備を行っていない。より適切な助言はどれか。","choices":{"ア":"情報セキュリティリスクを低減するため、ツールに加え社員教育や運用ルール整備を進めるよう助言する。","イ":"最新のセキュリティツールを導入すれば十分であるとして、教育や運用ルールの整備は行わないよう助言する。","ウ":"セキュリティ対策はIT部門だけの担当であるとして、事業部門の社員への教育や運用ルールの整備は対象外とするよう助言する。","エ":"運用ルールは形式的に定めるにとどめ、実際の周知や遵守状況の確認は行わないよう助言する。"},"answer":"ア","dp":{"イ":114,"ウ":114,"エ":114},"explain":"アが最も適切。セキュリティは情報セキュリティリスクを低減するもので、ツールに加え教育や運用ルールを組織的に整備する（p.114）。イはツールに偏重している。ウは対象を限定しすぎている。エは対策を形骸化させている。","verified":false},{"id":"q2-a020","node":"CB-5","level":"応用","type":"A","pgl_page":119,"stem":"乙社では、プロジェクトで得られた教訓が担当者個人の経験にとどまり、他のプロジェクトや組織に共有されていない。より適切な助言はどれか。","choices":{"ア":"教訓は担当者個人の経験として蓄積し、組織での共有は特に行わないよう助言する。","イ":"教訓の共有は担当者が交代する際の引き継ぎの時にのみ行えばよいとして、プロジェクト中の日常的な共有は行わないよう助言する。","ウ":"得た教訓を形式知として整理・共有し、他のプロジェクトや組織で応用できるよう助言する。","エ":"成功事例のみを共有の対象とし、失敗から得た教訓は共有しないよう助言する。"},"answer":"ウ","dp":{"ア":119,"イ":119,"エ":119},"explain":"ウが最も適切。組織学習は個人の学習（暗黙知）を組織で共有（形式知化）・応用して価値創造を図る（p.119）。アは組織での共有を欠いている。イは共有の機会を限定している。エは共有対象が偏っている。","verified":false},{"id":"q2-b021","node":"P1-1","level":"基本","type":"A","pgl_page":32,"stem":"変革認識アクティビティの進め方に関する説明として、最も適切なものはどれか。","choices":{"ア":"顧客や現場の声から気付きを得て可視化し、情報の収集・分析を経て変革の意思決定につなげる。","イ":"まず導入するITシステムの詳細な仕様を確定させ、その後に変革の必要性を検討する段取りで進める。","ウ":"変化への気付きは経営者やその側近のみが得るものと考えて、現場の担当者や運用リーダーから共有される情報は収集や分析の対象には一切含めないものとする。","エ":"変革の必要性は外部コンサルタントの分析結果のみで判断し、社内での気付きは考慮しない。"},"answer":"ア","dp":{"イ":32,"ウ":32,"エ":32},"explain":"アが正しい。変革認識では、顧客や現場の声からの気付きを可視化し、環境情報の収集・分析を経て変革の必要性を認識し意思決定につなげる（p.32）。イは進め方の順序を取り違えている。ウは現場や運用リーダーの気付きを軽視している。エは社内の気付きを排除している。","verified":false},{"id":"q2-b022","node":"P1-1","level":"基本","type":"A","pgl_page":33,"stem":"変革認識における経営環境情報の収集に関する説明として、最も適切なものはどれか。","choices":{"ア":"収集する情報は社内にこれまで蓄積された販売データや財務データのみに限定し、外部の市場調査や競合他社が公開している情報は対象としない。","イ":"事業ドメインやCSFに影響する重要情報を対象に、社内データや市場調査、競合情報等を活用する。","ウ":"情報収集は一度実施すれば十分であり、変革の検討中に情報を追加することはしない。","エ":"収集した情報は担当者個人が保管するにとどめ、経営環境の分析には用いない。"},"answer":"イ","dp":{"ア":33,"ウ":33,"エ":33},"explain":"イが正しい。経営環境情報の収集は、事業ドメインやCSFに影響する重要情報を対象に、社内データや市場調査・競合情報・業界レポート等を幅広く活用する（p.33）。アは情報源を社内に限定している。ウは情報収集を一度きりとしている。エは収集情報を分析に活かしていない。","verified":false},{"id":"q2-b023","node":"P1-1","level":"基本","type":"A","pgl_page":34,"stem":"変革への意思決定に関する説明として、最も適切なものはどれか。","choices":{"ア":"変革への意思決定は現場の合意が得られた後に行い、経営者は関与しないものとする。","イ":"変革への意思決定の内容は文書化せず、口頭での共有にとどめて次のプロセスへ引き継ぐ。","ウ":"変革への意思決定は、デジタル経営戦略の策定がすべて完了した後に初めて行う。","エ":"変革への意思決定を行い、その内容をまとめた変革構想書を次のプロセスのインプットとする。"},"answer":"エ","dp":{"ア":34,"イ":34,"ウ":34},"explain":"エが正しい。変革の必要性を認識したところで変革への意思決定を行い、その成果物である変革構想書をデジタル経営戦略プロセスのインプットにする（p.34）。アは意思決定の主体が誤っている。イは成果物の文書化を欠いている。ウは意思決定を行う段階の理解が誤っている。","verified":false},{"id":"q2-b024","node":"P1-2","level":"基本","type":"A","pgl_page":38,"stem":"デジタル経営成熟度のレベルの考え方に関する説明として、最も適切なものはどれか。","choices":{"ア":"必要性の認識、枠組みの形成、組織的統合、データ駆動の管理、革新の定着へと段階的に高度化する。","イ":"レベルは導入している技術の新しさのみで決まり、組織文化や日常業務への定着は評価に含めない。","ウ":"最上位のレベルに達しても、デジタル経営の取り組みは一部の部門にとどまるものとされる。","エ":"レベルは一度到達すれば低下することはないため、その後の評価や見直しは行わない。"},"answer":"ア","dp":{"イ":38,"ウ":38,"エ":38},"explain":"アが正しい。成熟度レベルは、無意識段階から必要性の認識・枠組みの形成・組織全体での統合・データ駆動の管理・革新の定着へと段階的に高度化する（p.38）。イは技術の新しさのみで捉えている。ウは上位レベルの捉え方が誤っている。エはレベルの継続評価を否定している。","verified":false},{"id":"q2-b025","node":"P1-2","level":"基本","type":"A","pgl_page":38,"stem":"デジタル経営成熟度の「管理段階（データ駆動）」に相当するレベルの特徴として、最も適切なものはどれか。","choices":{"ア":"デジタル経営の必要性をまだ認識しておらず、取り組みを始めていない段階である。","イ":"デジタル経営の必要性は認識したものの、取り組みが断片的で属人的、かつ場当たり的にとどまっている段階である。","ウ":"革新が組織文化の一部となり、業界全体のイノベーションを牽引している段階である。","エ":"定量的に管理されたKPI等の指標を用い、データを活用した意思決定と継続的改善を進める段階。"},"answer":"エ","dp":{"ア":38,"イ":38,"ウ":38},"explain":"エが正しい。管理段階（データ駆動）は、定量的に管理されたKPI等の指標を用い、データを活用した意思決定と継続的な改善を促進する段階である（p.38）。アは無意識段階の特徴である。イは初期段階の特徴である。ウは最適化段階の特徴である。","verified":false},{"id":"q2-b026","node":"P1-2","level":"基本","type":"A","pgl_page":38,"stem":"デジタル経営成熟度の評価における留意点として、最も適切なものはどれか。","choices":{"ア":"偏った情報は次期変革を誤らせるため、設定した定性的・定量的な目標に対し客観的に評価する。","イ":"評価は経営者の主観的な印象を最優先とし、あらかじめ設定した目標との対比は行わない。","ウ":"評価はあらかじめ設定した定量的な指標のみで機械的に行い、現場や顧客等のステークホルダーからの定性的な声は一切考慮しない。","エ":"評価結果は次期の変革の方向性とは切り離し、参考情報として保管するにとどめる。"},"answer":"ア","dp":{"イ":38,"ウ":38,"エ":38},"explain":"アが正しい。成長度合いの評価は、偏った情報を避け、あらかじめ設定した定性的・定量的な目標それぞれに対して客観的に行う必要がある（p.38）。イは主観を優先し目標との対比を欠いている。ウは定性的な評価の視点を欠いている。エは評価を次期変革に活かしていない。","verified":false},{"id":"q2-b027","node":"P1-1","level":"基本","type":"A","pgl_page":32,"stem":"デジタル経営支援者の役割に関する説明として、最も適切なものはどれか。","choices":{"ア":"社内に適任者が育っている場合でも、推進者の役割を継続して代行し続けることが望ましい。","イ":"助言や支援の範囲を超えて、経営者に代わり変革の意思決定そのものを担うことが求められる。","ウ":"役割を代行するのではなく助言や支援を行い、社内人材が役割を担えるよう育成していく。","エ":"ITシステムの内製化の必要性の見極めには関与せず、外部委託を前提とした支援のみを行う。"},"answer":"ウ","dp":{"ア":32,"イ":32,"エ":32},"explain":"ウが正しい。デジタル経営支援者は役割を代行するのではなく、助言や支援を行い、最終的に社内人材が役割を担えるよう育成することが望ましい（p.32）。アは代行の継続を望ましいとしている。イは支援の範囲を超えて意思決定を担っている。エは内製化の見極め支援を欠いている。","verified":false},{"id":"q2-b028","node":"P2","level":"基本","type":"A","pgl_page":41,"stem":"デジタル経営戦略プロセスの進め方の全体の流れとして、最も適切なものはどれか。","choices":{"ア":"戦略を実行する段階からまず始め、その実行によって得られた結果を踏まえ、必要な情報収集と分析を後から行う流れで進める。","イ":"情報収集は行わず、経営者の構想に基づいて直ちに戦略を策定し実行する流れで進める。","ウ":"情報収集・分析の段階、戦略を策定する段階、実行する段階、達成度を評価する段階へと進む。","エ":"戦略の達成度評価は行わず、策定と実行を繰り返すことのみで進める。"},"answer":"ウ","dp":{"ア":41,"イ":41,"エ":41},"explain":"ウが正しい。デジタル経営戦略プロセスは、情報収集・分析段階、策定段階、実行段階、評価段階の順で進める（p.41）。アは段階の順序を取り違えている。イは情報収集・分析の段階を欠いている。エは評価の段階を欠いている。","verified":false},{"id":"q2-b029","node":"P2","level":"基本","type":"A","pgl_page":41,"stem":"複数の事業を展開する企業におけるデジタル経営戦略の策定に関する説明として、最も適切なものはどれか。","choices":{"ア":"事業ごとの戦略をそれぞれ個別に策定すれば十分であるとし、全社としての統一的な戦略や事業間の資源配分の検討は特に行わない。","イ":"全社戦略は単年度ごとに策定するものであり、中期的な計画として位置づけることはしない。","ウ":"ミッション・ビジョンと経営目標、事業ポートフォリオ、資源配分を含む全社戦略の策定が必須。","エ":"全社戦略は一度策定すれば十分であり、達成状況の確認や方針の見直しは行わない。"},"answer":"ウ","dp":{"ア":41,"イ":41,"エ":41},"explain":"ウが正しい。複数事業を展開する企業では、ミッション・ビジョンと経営目標、事業ポートフォリオ、資源配分を含む全社戦略の策定が必須である（p.41）。アは全社戦略の策定を欠いている。イは中期計画としての位置づけを欠いている。エは定期的な見直しを欠いている。","verified":false},{"id":"q2-b030","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略プロセスにおける「あるべき姿の構築」で行うことの説明として、最も適切なものはどれか。","choices":{"ア":"導入するITシステムの詳細な機能要件を確定させ、開発・調達の準備をこの段階で完了させる。","イ":"既存事業で既に提供している顧客価値は所与のものとして扱い、新たな顧客を獲得する可能性や、提供している価値の見直しは検討しない。","ウ":"顧客と提供すべき価値を特定して顧客価値を定義し、最も重要な要素であるCSFの案を導出する。","エ":"顧客価値の定義は行わず、競合他社の戦略をそのまま自社のあるべき姿として採用する。"},"answer":"ウ","dp":{"ア":44,"イ":44,"エ":44},"explain":"ウが正しい。あるべき姿の構築では、顧客と提供すべき価値を特定して顧客価値を定義し、最も重要な要素であるCSFの案を導出する（p.44）。アは開発・導入プロセスの内容と混同している。イは既存の顧客価値の見直しを欠いている。エは顧客価値の定義を欠いている。","verified":false},{"id":"q2-b031","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略における「CSF」に関する説明として、最も適切なものはどれか。","choices":{"ア":"経営変革を実現する最も重要な要素で、経営課題や経営環境情報の分析結果をもとに導出する。","イ":"個々のシステムの技術的な性能を表す指標であり、開発・調達の段階で技術者が設定するものである。","ウ":"財務諸表に記載される会計上の指標の一つであり、抽出された経営課題の分析結果とは切り離して定義するものである。","エ":"設定した後は固定して見直さず、戦略の実行を通じて検証することはないものである。"},"answer":"ア","dp":{"イ":44,"ウ":44,"エ":44},"explain":"アが正しい。CSFは経営変革を実現するための最も重要な要素であり、経営課題リストや経営環境情報の分析結果をもとに導出する（p.44）。イは技術指標と取り違えている。ウは会計指標と取り違えている。エは検証を通じた見直しを否定している。","verified":false},{"id":"q2-b032","node":"P2","level":"基本","type":"A","pgl_page":47,"stem":"デジタル経営戦略プロセスにおける「データ・IT利活用方針の定義」の位置づけとして、最も適切なものはどれか。","choices":{"ア":"個別システムの調達先を確定し、契約金額や納期、納入範囲や検収の条件等の具体的な内容を決定するタスクである。","イ":"運用中のシステムのサービスレベルを維持・管理するタスクである。","ウ":"提供した価値の達成状況を検証し、次の変革につなげるタスクである。","エ":"あるべき姿の実現に向け、データとITをどう利活用するかの全社的な方針を定めるタスク。"},"answer":"エ","dp":{"ア":47,"イ":47,"ウ":47},"explain":"エが正しい。データ・IT利活用方針の定義は、あるべき姿の実現に向けてデータとITの利活用方針を全社的に定めるタスクである（p.47）。アは調達実施の内容と混同している。イは運用アクティビティと混同している。ウは提供価値検証プロセスと混同している。","verified":false},{"id":"q2-b033","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略で作成する「ロードマップ」に関する説明として、最も適切なものはどれか。","choices":{"ア":"戦略と経営目標の実現期限とともに作成し、ゴールと期限が各反復設計のインプットとなる。","イ":"個別システムの開発工程を日単位で管理する詳細スケジュールであり、戦略とは独立に作成する。","ウ":"作成後は固定するものであり、経営環境の変化に応じて見直すことはしない。","エ":"運用開始後の障害対応の手順を定めたものであり、戦略の実現とは関係しない。"},"answer":"ア","dp":{"イ":44,"ウ":44,"エ":44},"explain":"アが正しい。新たな戦略と経営目標が策定されると実現の期限とロードマップが作成され、そのゴールと期限が各サイクルの反復設計のインプットとなる（p.44）。イは詳細工程表と取り違えている。ウは変化に応じた見直しを否定している。エは障害対応手順と取り違えている。","verified":false},{"id":"q2-b034","node":"P2","level":"基本","type":"A","pgl_page":49,"stem":"デジタル経営戦略の実行に向けた組織体制の設定に関する説明として、最も適切なものはどれか。","choices":{"ア":"組織体制は戦略の実行を実際に開始した後に、現場の状況を見ながら順次決めていくものとする。","イ":"実行体制は既存の組織図をそのまま用い、戦略に応じた役割の明示は行わない。","ウ":"組織体制の設定は各現場の裁量に任せ、全社としての役割分担は定めない。","エ":"戦略を実行する組織が単独か複数かを明らかにし、組織ごとの役割を明示する。"},"answer":"エ","dp":{"ア":49,"イ":49,"ウ":49},"explain":"エが正しい。組織体制の設定では、戦略を実行する組織が単独か複数かを明らかにし、組織ごとの役割を明示する（p.49）。アは設定の時期が遅れている。イは役割の明示を欠いている。ウは全社的な役割分担を欠いている。","verified":false},{"id":"q2-b035","node":"P2","level":"基本","type":"A","pgl_page":44,"stem":"デジタル経営戦略における顧客価値の定義に関する説明として、最も適切なものはどれか。","choices":{"ア":"新規事業の顧客価値のみを検討の対象とし、既存事業で提供している価値の確認は行わない。","イ":"新たな顧客や提供価値を検討するとともに、既存事業の顧客価値も確認して見直しを検討する。","ウ":"顧客価値はデータとITの利活用とは切り離して定義し、実現手段は考慮しない。","エ":"顧客価値の定義で新たな課題が見つかっても、経営課題リストには加えないものとする。"},"answer":"イ","dp":{"ア":44,"ウ":44,"エ":44},"explain":"イが正しい。顧客価値の定義では、新たな顧客や価値を検討するとともに既存事業の顧客価値も確認し、見直しを検討する（p.44）。アは既存事業の価値確認を欠いている。ウはデータとITの利活用を考慮していない。エは抽出した課題を管理していない。","verified":false},{"id":"q2-b036","node":"P3","level":"基本","type":"A","pgl_page":62,"stem":"デジタル経営実行計画プロセスにおける実行計画の考え方として、最も適切なものはどれか。","choices":{"ア":"変化の状況がどのような場合でも、着手前にすべての詳細を網羅した重厚な計画を必ず完成させることが望ましい。","イ":"実行計画はデジタル経営戦略とは独立に作成し、戦略との整合は考慮しないものとする。","ウ":"実行計画は一度作成すれば固定するものであり、検証結果を踏まえた見直しは行わない。","エ":"変化に俊敏に対応し情報収集を迅速に行えるよう、軽量な計画で実行することが望ましい。"},"answer":"エ","dp":{"ア":62,"イ":62,"ウ":62},"explain":"エが正しい。デジタル経営実行計画プロセスでは、変化に俊敏に対応し情報収集を迅速に行えるよう、軽量な計画で実行することが望ましい場合がある（p.62）。アは常に重厚な計画を求める点が誤り。イは戦略との整合を欠いている。ウは計画の見直しを否定している。","verified":false},{"id":"q2-b037","node":"P3","level":"基本","type":"A","pgl_page":64,"stem":"デジタル経営実行計画プロセスで作成する「開発・導入計画」の位置づけとして、最も適切なものはどれか。","choices":{"ア":"運用を開始した後のシステムのサービスレベルを定めた計画であり、開発や調達の準備を進める段階では用いないものとする。","イ":"戦略のロードマップを具体化した計画で、IT開発・導入での開発・調達準備のインプットとなる。","ウ":"提供価値の検証結果をまとめた計画であり、次の戦略の見直しにのみ用いる。","エ":"経営理念やあるべき姿を定義した計画であり、具体的な開発の準備には用いない。"},"answer":"イ","dp":{"ア":64,"ウ":64,"エ":64},"explain":"イが正しい。開発・導入計画は戦略のロードマップを具体化した計画で、IT開発・導入プロセスでの開発・調達の準備のインプットとなる（p.64）。アは運用の計画と取り違えている。ウは検証結果の位置づけと取り違えている。エは戦略段階の成果物と取り違えている。","verified":false},{"id":"q2-b038","node":"P3","level":"基本","type":"A","pgl_page":64,"stem":"デジタル経営実行計画プロセスにおける実行計画の評価に関する説明として、最も適切なものはどれか。","choices":{"ア":"実行計画の評価は行わず、計画の策定と開発の実行のみを繰り返す。","イ":"提供価値の検証結果の評価はIT開発・導入プロセスで行うものとし、実行計画プロセスでは扱わないものとする。","ウ":"提供価値検証プロセスの検証結果を評価し、その結果を戦略プロセスへフィードバックする。","エ":"評価結果は実行計画プロセス内にとどめ、戦略プロセスへの反映は行わない。"},"answer":"ウ","dp":{"ア":64,"イ":64,"エ":64},"explain":"ウが正しい。実行計画プロセスでは、提供価値検証プロセスの検証結果を評価し、その結果をデジタル経営戦略プロセスへフィードバックする（p.64）。アは評価の段階を欠いている。イは評価を行うプロセスを取り違えている。エは戦略へのフィードバックを欠いている。","verified":false},{"id":"q2-b039","node":"P3","level":"基本","type":"A","pgl_page":70,"stem":"IT資源の調達においてRFP（提案依頼書）を用いる場合の進め方として、最も適切なものはどれか。","choices":{"ア":"RFPは担当者の判断で随時発行し、経営者やステアリングコミッティの承認は不要とする。","イ":"RFPを作成し、必要に応じてNDAを交わし、承認を得て外部の提供者に発行する。","ウ":"RFPには自社の営業秘密を含めても、秘密保持契約を取り交わす必要はないものとする。","エ":"提案依頼は特定の一社のみを対象とし、複数の提供者から提案を得ることはしない。"},"answer":"イ","dp":{"ア":70,"ウ":70,"エ":70},"explain":"イが正しい。RFPは調達要件をもとに作成し、必要に応じて秘密保持契約を取り交わし、経営者等の承認を得て外部提供者に発行する（p.70）。アは承認の手続きを欠いている。ウは秘密保持の考慮を欠いている。エは競争的な提案取得を欠いている。","verified":false},{"id":"q2-b040","node":"P3","level":"基本","type":"A","pgl_page":70,"stem":"デジタル経営実行計画プロセスにおけるIT投資の考え方として、最も適切なものはどれか。","choices":{"ア":"IT投資の額は前年度の実績をそのまま踏襲して機械的に決定し、投資対効果の評価は行わない。","イ":"投資対効果を評価し、戦略上の重要度や期待価値を踏まえて投資内容を検討する。","ウ":"IT投資は多いほど成果が高まるものとして、対効果を確認せずに可能な限り増額する。","エ":"IT投資は財務部門に一任し、戦略上の重要度や期待される価値は考慮しない。"},"answer":"イ","dp":{"ア":70,"ウ":70,"エ":70},"explain":"イが正しい。IT投資はIT投資対効果を評価し、戦略上の重要度や期待される価値を踏まえて内容を検討する（p.70）。アは前例踏襲で対効果評価を欠いている。ウは額の多寡で判断している。エは戦略上の重要度を軽視している。","verified":false},{"id":"q2-b041","node":"P4-1","level":"基本","type":"A","pgl_page":75,"stem":"IT開発アクティビティの「調達実施」に関する説明として、最も適切なものはどれか。","choices":{"ア":"調達先は最初に見積もりを提示した一社に決め、他の外部提供者からの提案は求めずに契約を進める。","イ":"調達は開発・導入計画とは切り離し、開発リーダーの判断で任意のタイミングにおいて随時実施する。","ウ":"調達先の選定は提示された価格の安さのみを基準とし、提案内容や実現能力の比較は行わずに契約する。","エ":"詳細実行計画に基づき調達先を選定・契約し、複数の外部提供者から提案を得て調達を実施する。"},"answer":"エ","dp":{"ア":75,"イ":75,"ウ":75},"explain":"エが正しい。調達実施では、詳細実行計画に基づき調達先を選定・契約し、種々の提案が得られるよう複数の提供者を選んで調達する（p.75）。アは競争的な提案の取得を欠いている。イは計画との整合を欠いている。ウは価格のみで判断している。","verified":false},{"id":"q2-b042","node":"P4-1","level":"基本","type":"A","pgl_page":75,"stem":"IT開発アクティビティの「開発による要件の実現」に関する説明として、最も適切なものはどれか。","choices":{"ア":"動作するだけでなく顧客ニーズに合う使いやすい機能を実現し、気付いた価値は検証プロセスへ共有する。","イ":"要件どおりにシステムが動作すれば十分であり、顧客のニーズへの合致や使いやすさは考慮しないものとする。","ウ":"開発中に新たな価値や不足している機能に気付いても、当初の要件から外れるため共有せずに開発を続ける。","エ":"開発は要件の実現のみを目的とし、顧客満足につながる価値の観点は運用を開始した後に検討するものとする。"},"answer":"ア","dp":{"イ":75,"ウ":75,"エ":75},"explain":"アが正しい。開発では動作するだけでなく顧客のニーズに合致し使いやすく価値ある機能を実現し、気付いた新たな価値は提供価値検証プロセスへ共有する（p.75）。イは顧客ニーズや使いやすさを軽視している。ウは気付きの共有を欠いている。エは価値の観点を後回しにしている。","verified":false},{"id":"q2-b043","node":"P4-1","level":"基本","type":"A","pgl_page":75,"stem":"反復を繰り返すデジタル経営におけるITシステムの開発の進め方として、最も適切なものはどれか。","choices":{"ア":"テストはすべて手作業で行い、機能を追加・変更するたびに全項目を人手で確認する体制を維持する。","イ":"反復に耐えるよう、テストの自動化やテスト駆動開発を検討し、安心して変更できる仕組みを作る。","ウ":"テストは初回リリースの時に一度実施すれば十分であり、以後の機能の変更時にはテストを省略する。","エ":"テストの自動化は導入や維持にコストがかかるため採用せず、反復のたびの品質は担当者の経験に委ねる。"},"answer":"イ","dp":{"ア":75,"ウ":75,"エ":75},"explain":"イが正しい。反復に耐えるシステムのため、テストの自動化やテスト駆動開発を検討し、安心して機能追加・変更できる仕組みを作り運用する（p.75）。アは自動化の考え方に反する。ウは反復時のテストを省いている。エは品質確保を属人的にしている。","verified":false},{"id":"q2-b044","node":"P4-1","level":"基本","type":"A","pgl_page":74,"stem":"IT開発アクティビティにおける開発マネジメントと検証に関する説明として、最も適切なものはどれか。","choices":{"ア":"テスト項目は開発が完了した後に洗い出せばよいとして、体制の構築の段階では決定しないものとする。","イ":"テストや検証は開発リーダーが単独で行い、運用リーダーは計画にも実施にも関与しない。","ウ":"開発マネジメント体制の構築とあわせ、テストや検証方法・テスト項目を決定し遂行を確認する。","エ":"検証の方法はあらかじめ定めず、開発したシステムが動作すればテストそのものは不要であるとする。"},"answer":"ウ","dp":{"ア":74,"イ":74,"エ":74},"explain":"ウが正しい。開発マネジメント体制の構築とともに、テストや検証の方法・テスト項目を決定し、計画どおり遂行できることを確認する（p.74）。アはテスト項目の決定時期が遅れている。イは運用リーダーの関与を欠いている。エは検証の必要性を否定している。","verified":false},{"id":"q2-b045","node":"P4-1","level":"基本","type":"A","pgl_page":74,"stem":"安定したITシステムの開発・導入・運用につなげるための開発体制のあり方として、最も適切なものはどれか。","choices":{"ア":"特定の熟練した担当者に開発の作業を集中させることが、かえって安定したシステムの開発や運用につながるものとする。","イ":"文書化はかえって開発の効率を下げるため行わず、担当者個人の記憶に基づいて開発を進めるものとする。","ウ":"属人性の排除は運用の段階で取り組む課題であり、開発の段階では特に考慮しないものとする。","エ":"チームでの取り組みや文書化で属人性を排除することが、安定した開発・導入・運用につながる。"},"answer":"エ","dp":{"ア":74,"イ":74,"ウ":74},"explain":"エが正しい。チームでの取り組みや文書化により属人性を排除することが、安定したシステムの開発・導入・運用につながる（p.74）。アは属人化を助長している。イは文書化を否定している。ウは取り組む段階の理解が誤っている。","verified":false},{"id":"q2-b046","node":"P4-1","level":"基本","type":"A","pgl_page":74,"stem":"提供価値検証プロセスから開発に関するフィードバックがあった場合の対応として、最も適切なものはどれか。","choices":{"ア":"発生した問題点や課題を元に改善施策を盛り込み、開発のスピードや品質、効率を向上させる。","イ":"提供価値検証プロセスのフィードバックは開発と無関係として、開発の進め方は変えない。","ウ":"フィードバックへの対応は次のシステムの新規開発の時にまとめて行い、現行の開発には反映しないものとする。","エ":"改善施策は開発リーダーの判断のみで決め、発生した問題点や課題との対応づけは特に行わないものとする。"},"answer":"ア","dp":{"イ":74,"ウ":74,"エ":74},"explain":"アが正しい。P6から開発に関するフィードバックがあった場合、問題点や課題を元に改善施策を盛り込み、開発の品質や効率を向上させる（p.74）。イはフィードバックを無視している。ウは反映の時期が遅れている。エは課題との対応づけを欠いている。","verified":false},{"id":"q2-b047","node":"P4-2","level":"基本","type":"A","pgl_page":77,"stem":"IT資源の調達における契約締結の進め方として、最も適切なものはどれか。","choices":{"ア":"契約は開発リーダーの裁量で締結するものとし、経営者やステアリングコミッティの承認は不要とする。","イ":"経営者等の承認を得て、金額・納期・納入範囲・検収・サービスレベル等を明確にした契約書で締結する。","ウ":"契約書には金額と納期のみを記載し、納入範囲や検収、サービスレベルの取り決めは省略するものとする。","エ":"契約の内容は当事者間の口頭での合意にとどめておき、後日に認識の相違が生じたときに改めて文書化すればよいとする。"},"answer":"イ","dp":{"ア":77,"ウ":77,"エ":77},"explain":"イが正しい。契約締結は経営者等の承認を得て、金額・納期・納入範囲・検収・サービスレベル等を明確にした契約書を用いて行う（p.77）。アは承認の手続きを欠いている。ウは契約書に定めるべき事項を欠いている。エは文書化を欠いている。","verified":false},{"id":"q2-b048","node":"P4-2","level":"基本","type":"A","pgl_page":77,"stem":"ITシステムの導入にあたっての利活用者への対応として、最も適切なものはどれか。","choices":{"ア":"利活用者のITリテラシーを考慮せず、市場で最も高機能なIT資源を選択して導入する。","イ":"教育・訓練は利活用を開始した後に必要が生じてから行えばよいとして、開始前には実施しないものとする。","ウ":"教育・訓練は利用者が各自で行うべきものとして、導入する側では特段の支援を行わないものとする。","エ":"利活用者のITリテラシーを考慮し、開始までに教育・訓練を行い、使いこなせるIT資源を選ぶ。"},"answer":"エ","dp":{"ア":77,"イ":77,"ウ":77},"explain":"エが正しい。利活用者のITリテラシーを考慮し、利活用開始までに教育・訓練を行い、使いこなせるレベルのIT資源を選択する（p.77）。アはリテラシーへの考慮を欠いている。イは教育の時期が遅れている。ウは教育の支援を放棄している。","verified":false},{"id":"q2-b049","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"IT利活用による価値の提供アクティビティにおける業務の準備に関する説明として、最も適切なものはどれか。","choices":{"ア":"顧客視点で業務の流れを構築し、カスタマージャーニー等を用いてITを利活用できるよう段取りする。","イ":"業務の流れは既存の社内手順を優先して構築するものとし、顧客視点での価値の想定は行わないものとする。","ウ":"業務の流れはあらかじめ構築せず、システムの機能に合わせて現場が都度その場で対応する形とする。","エ":"顧客視点での価値の想定は、運用を開始した後の顧客の反応を確認してから初めて行うものとする。"},"answer":"ア","dp":{"イ":82,"ウ":82,"エ":82},"explain":"アが正しい。顧客視点での価値を想定して業務の流れを構築し、カスタマージャーニー等を用いてITを適切に利活用できるよう段取りする（p.82）。イは顧客視点の想定を欠いている。ウは業務の流れの構築を欠いている。エは価値想定の時期が遅れている。","verified":false},{"id":"q2-b050","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"価値提供業務の遂行に向けた準備に関する説明として、最も適切なものはどれか。","choices":{"ア":"要員計画や要員配置は実際に業務を開始した後になってから、その時々の業務の負荷の状況を見ながら順次決めていくものとする。","イ":"業務開始前までに要員計画と配置を行い、必要なツールや外部サービス、手順の準備を確認する。","ウ":"業務に必要なツールや外部サービスの準備の状況は確認せず、不足が判明した時点で個別に対応する。","エ":"要員の配置は各現場の判断に任せるものとし、全体としての要員計画は特に立てないものとする。"},"answer":"イ","dp":{"ア":82,"ウ":82,"エ":82},"explain":"イが正しい。業務開始前までに要員計画と要員配置を行い、必要なツールや外部サービス、手順が準備されていることを確認する（p.82）。アは準備の時期が遅れている。ウは準備状況の確認を欠いている。エは全体の要員計画を欠いている。","verified":false},{"id":"q2-b051","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"価値提供業務の準備で対象とする業務の範囲に関する説明として、最も適切なものはどれか。","choices":{"ア":"準備の対象はシステムを直接操作する業務のみとし、その周辺にある業務は範囲に含めないものとする。","イ":"サプライチェーンやアフターサポートの体制は、業務を開始した後に必要が生じてから整えるものとする。","ウ":"サプライチェーン業務やアフターサポート業務も含めて、業務の遂行準備や体制作りを行う。","エ":"準備の対象は自社内で完結する業務に限るものとし、外部と連携する業務は範囲に含めないものとする。"},"answer":"ウ","dp":{"ア":82,"イ":82,"エ":82},"explain":"ウが正しい。価値提供業務の準備では、出荷等のサプライチェーン業務やアフターサポート業務も含めて遂行準備や体制作りを行う（p.82）。アは対象を狭く捉えている。イは体制整備の時期が遅れている。エは外部連携業務を除外している。","verified":false},{"id":"q2-b052","node":"P5-1","level":"基本","type":"A","pgl_page":82,"stem":"価値提供業務における顧客視点での価値の想定に関する説明として、最も適切なものはどれか。","choices":{"ア":"顧客が得る体験は考慮せず、提供する機能の多さのみを基準として価値を想定するものとする。","イ":"価値の想定は自社の技術的な強みを起点として行い、顧客の体験という観点は用いないものとする。","ウ":"顧客が製品やサービスを通じてどんな体験を得るかの観点も用いて、顧客視点で価値を想定する。","エ":"顧客の体験の観点はもっぱら営業の活動で用いるものであり、価値提供業務の設計の段階では考慮しないものとする。"},"answer":"ウ","dp":{"ア":82,"イ":82,"エ":82},"explain":"ウが正しい。顧客視点での価値の想定では、顧客が製品・サービスを通じて得る体験（カスタマーエクスペリエンス）の観点も用いる（p.82）。アは体験の観点を欠いている。イは起点の捉え方が誤っている。エは考慮する場面の理解が誤っている。","verified":false},{"id":"q2-b053","node":"P5-2","level":"基本","type":"A","pgl_page":85,"stem":"ITサービス運用におけるサービスレベルの改善に関する説明として、最も適切なものはどれか。","choices":{"ア":"サービスレベルは契約を締結した時に定義したものを固定し、運用の中で改善の必要性を検討することはしないものとする。","イ":"提供価値検証プロセスのフィードバックを受け、定義したサービスレベルの改善の必要性を検討する。","ウ":"サービスレベルの改善は運用リーダーの判断のみで行うものとし、提供価値検証プロセスの結果は参照しない。","エ":"サービスレベルの見直しは、利用者から明確な苦情が寄せられた場合に限って行うものとする。"},"answer":"イ","dp":{"ア":85,"ウ":85,"エ":85},"explain":"イが正しい。サービスレベルの維持運用では、提供価値検証プロセスからのフィードバックを受け、事前に定義したサービスレベルの改善の必要性を検討する（p.85）。アは改善の検討を否定している。ウは検証結果の参照を欠いている。エは見直しの契機を限定している。","verified":false},{"id":"q2-b054","node":"P5-2","level":"基本","type":"A","pgl_page":84,"stem":"ITサービス運用における「IT資源、サービスのモニタリング」に関する説明として、最も適切なものはどれか。","choices":{"ア":"IT資源やサービスの状況を継続的にモニタリングし、データを分析して運用の維持・改善につなげる。","イ":"IT資源やサービスの状況は障害が発生した時にのみ確認するものとし、平常時のモニタリングは行わない。","ウ":"モニタリングで収集したデータは記録として保管しておくにとどめるものとし、その後の運用の改善には用いないものとする。","エ":"モニタリングの対象はシステムの稼働の状況に限るものとし、サービスの提供の状況は対象に含めない。"},"answer":"ア","dp":{"イ":84,"ウ":84,"エ":84},"explain":"アが正しい。ITサービス運用では、IT資源やサービスの状況を継続的にモニタリングし、収集したデータを分析して運用の維持・改善につなげる（p.84）。イは継続的な監視を欠いている。ウはデータを改善に活かしていない。エは監視の対象を限定している。","verified":false},{"id":"q2-b055","node":"P5-2","level":"基本","type":"A","pgl_page":84,"stem":"ITサービス運用における「ITシステム、サービスの維持管理」に関する説明として、最も適切なものはどれか。","choices":{"ア":"ITシステムは導入時に整備すれば足りるものとし、運用開始後の維持管理は行わない。","イ":"維持管理の対象はハードウェアに限るものとし、提供するサービスの品質は対象に含めないものとする。","ウ":"導入したITシステムやサービスが安定して価値を提供し続けられるよう維持管理を行う。","エ":"維持管理は障害が繰り返し発生した場合に限って行うものとし、平常の時には実施しないものとする。"},"answer":"ウ","dp":{"ア":84,"イ":84,"エ":84},"explain":"ウが正しい。ITサービス運用では、導入したITシステムやサービスが安定して価値を提供し続けられるよう維持管理を行う（p.84）。アは維持管理を否定している。イは対象を限定している。エは実施の契機を限定している。","verified":false},{"id":"q2-b056","node":"P5-2","level":"基本","type":"A","pgl_page":85,"stem":"ITサービス運用における「システム監査の実行」に関する説明として、最も適切なものはどれか。","choices":{"ア":"システム監査は価値提供・運用のたびに、毎回必ず実施しなければならないものとする。","イ":"システム監査は一度も実施する必要がなく、運用は現場の判断のみに委ねればよいものとする。","ウ":"システム監査を実施する時期は外部の監査法人が決めるものであり、自社では検討しないものとする。","エ":"必要に応じて実施し、毎回必須ではないが、目的に応じた適切なタイミングで実施すべきである。"},"answer":"エ","dp":{"ア":85,"イ":85,"ウ":85},"explain":"エが正しい。システム監査は必要に応じて実施するもので、毎回必須ではないが、目的に応じて適切なタイミングで実施すべきである（p.85）。アは毎回必須とする点が誤り。イは実施の必要性を否定している。ウは実施時期の判断主体が誤っている。","verified":false},{"id":"q2-b057","node":"P5-2","level":"基本","type":"A","pgl_page":85,"stem":"サービスレベルマネジメント（SLM）の目的に関する説明として、最も適切なものはどれか。","choices":{"ア":"価値提供の目標が達成できるよう、サービスレベルを維持・管理し必要に応じて調整する。","イ":"サービスレベルは一度合意すれば、その後の達成の状況を管理する必要はないものとする。","ウ":"サービスレベルの管理は開発リーダーが行うものとし、運用リーダーは関与しないものとする。","エ":"サービスレベルの調整は次のシステムの開発の時にまとめて行い、運用の中では行わないものとする。"},"answer":"ア","dp":{"イ":85,"ウ":85,"エ":85},"explain":"アが正しい。サービスレベルマネジメントでは、価値提供の目標が達成できるようサービスレベルを維持・管理し、必要に応じて調整する（p.85）。イは達成状況の管理を否定している。ウは担当する役割が誤っている。エは調整の時期が遅れている。","verified":false},{"id":"q2-b058","node":"P6","level":"基本","type":"A","pgl_page":90,"stem":"提供価値検証プロセスにおける検証結果の取り扱いに関する説明として、最も適切なものはどれか。","choices":{"ア":"提供価値の検証の結果は提供価値検証プロセスの中にとどめるものとし、戦略や実行計画の見直しへは反映しないものとする。","イ":"検証の結果のフィードバックは、目標を大きく下回った場合に限って行うものとする。","ウ":"検証の結果はIT開発・導入プロセスへ直接反映するものとし、戦略プロセスへは伝えないものとする。","エ":"提供価値の達成状況を検証し、その結果を実行計画プロセスを経て戦略プロセスへフィードバックする。"},"answer":"エ","dp":{"ア":90,"イ":90,"ウ":90},"explain":"エが正しい。提供価値検証では、達成状況を検証し、その結果を実行計画プロセスを経てデジタル経営戦略プロセスへフィードバックする（p.90）。アはフィードバックを欠いている。イはフィードバックの契機を限定している。ウはフィードバック先が誤っている。","verified":false},{"id":"q2-b059","node":"P3","level":"基本","type":"A","pgl_page":64,"stem":"デジタル経営実行計画プロセスにおける詳細実行計画に関する説明として、最も適切なものはどれか。","choices":{"ア":"詳細な実行計画は作成せず、開発・導入計画のみに基づいて直ちに調達を実施するものとする。","イ":"開発・導入計画に基づいて、開発・調達を進めるための詳細な実行計画を作成する。","ウ":"詳細な実行計画は運用開始後に作成するものとし、開発の前には用意しない。","エ":"詳細な実行計画は戦略とは切り離して作成するものとし、開発・導入計画との整合は考慮しない。"},"answer":"イ","dp":{"ア":64,"ウ":64,"エ":64},"explain":"イが正しい。実行計画プロセスでは、開発・導入計画に基づいて開発・調達を進めるための詳細な実行計画を作成する（p.64）。アは詳細計画の作成を欠いている。ウは作成の時期が遅れている。エは計画との整合を欠いている。","verified":false},{"id":"q2-b060","node":"P3","level":"基本","type":"A","pgl_page":62,"stem":"デジタル経営実行計画プロセスにおける戦略の展開に関する説明として、最も適切なものはどれか。","choices":{"ア":"戦略の展開は行わず、戦略プロセスの成果物をそのまま開発・導入の作業に用いるものとする。","イ":"戦略の展開は価値実現サイクルの実行がすべて完了した後に、事後的に行うものとする。","ウ":"戦略プロセスで策定した戦略を受けて実行計画へ展開し、価値実現サイクルで実行できるようにする。","エ":"戦略の展開は各現場がそれぞれ独自の解釈で行うものとし、全体として統一された計画への落とし込みは特に行わないものとする。"},"answer":"ウ","dp":{"ア":62,"イ":62,"エ":62},"explain":"ウが正しい。実行計画プロセスでは、戦略プロセスで策定した戦略を受けて実行に向けた計画へ展開し、価値実現サイクルで実行できるようにする（p.62）。アは展開を欠いている。イは展開の時期が誤っている。エは全体計画への落とし込みを欠いている。","verified":false},{"id":"q2-b061","node":"CB-1","level":"基本","type":"A","pgl_page":100,"stem":"サイクルマネジメントにおけるプロセス定義で明確にすべき事項として、最も適切なものはどれか。","choices":{"ア":"各プロセスについて、目的、スケジュール、入出力、主たる活動、責任者を明確にする。","イ":"プロセスの定義では活動の名称のみを列挙し、目的や責任者、入出力は明確にしない。","ウ":"プロセスの定義は各担当者が必要と感じた範囲で個別に行い、全体として統一された定義は特に整えない。","エ":"プロセスの定義は最初に一度行えば十分であり、プロセスの改善に応じて見直すことはしないものとする。"},"answer":"ア","dp":{"イ":100,"ウ":100,"エ":100},"explain":"アが正しい。サイクルマネジメントのプロセス定義では、各プロセスの目的・スケジュール・入出力・主たる活動・責任者を明確にする（p.100）。イは定義すべき事項を欠いている。ウは統一的な定義を欠いている。エは定義の見直しを否定している。","verified":false},{"id":"q2-b062","node":"CB-1","level":"基本","type":"A","pgl_page":100,"stem":"サイクルマネジメントとプロジェクトマネジメントの違いに関する説明として、最も適切なものはどれか。","choices":{"ア":"サイクルマネジメントとプロジェクトマネジメントは実質的に同じ活動であり、両者をあえて区別する必要はないものとする。","イ":"サイクルマネジメントは決められた期間内に特定の成果物を完成させることに重点を置く活動である。","ウ":"サイクルマネジメントはプロセス全体を最適化し、プロジェクトマネジメントは期間内の特定の結果達成に重点を置く。","エ":"プロジェクトマネジメントはプロセス全体を継続的に最適化することを主たる目的とする活動である。"},"answer":"ウ","dp":{"ア":100,"イ":100,"エ":100},"explain":"ウが正しい。サイクルマネジメントはプロセスとフローを最適化し効率と効果を最大化するのに対し、プロジェクトマネジメントは決められた期間内の特定の結果の達成に重点を置く（p.100）。アは両者を混同している。イはサイクルマネジメントの重点の捉え方が誤り。エはプロジェクトマネジメントの目的の捉え方が誤り。","verified":false},{"id":"q2-b063","node":"CB-1","level":"基本","type":"A","pgl_page":100,"stem":"サイクルマネジメントの位置づけに関する説明として、最も適切なものはどれか。","choices":{"ア":"個々のプロジェクトの日程だけを管理することを目的とした、局所的で限定的な活動である。","イ":"情報セキュリティのリスクを低減することを主たる目的とした、専門的な活動である。","ウ":"各個人の学習を組織で共有することを主たる目的とした、全社的な活動である。","エ":"プロセスとフローを最適化し、効率と効果を最大化する包括的・構造的なアプローチ。"},"answer":"エ","dp":{"ア":100,"イ":100,"ウ":100},"explain":"エが正しい。サイクルマネジメントは、プロセスとフローを最適化してデジタル経営の効率と効果を最大化する包括的・構造的なアプローチである（p.100）。アは対象を日程管理に矮小化している。イはセキュリティと混同している。ウは組織学習と混同している。","verified":false},{"id":"q2-b064","node":"CB-2","level":"基本","type":"A","pgl_page":103,"stem":"デジタル経営共通基盤におけるコミュニケーションの目的として、最も適切なものはどれか。","choices":{"ア":"経営層への報告の頻度を抑えることで、現場の担当者の負担を軽減することを目的とする。","イ":"情報の共有を特定の部門の内部に限定することで、情報の管理を厳格に保つことを目的とする。","ウ":"チーム内外の関係を構築し、アジリティと信頼性を高めて円滑な意思疎通と協力を実現する。","エ":"定型的な報告書を数多く作成することで、活動の記録を漏れなく残すことを主たる目的とする。"},"answer":"ウ","dp":{"ア":103,"イ":103,"エ":103},"explain":"ウが正しい。コミュニケーションは、チーム内外の関係を構築し、アジリティと信頼性を高めて円滑な意思疎通と協力を実現することを目的とする（p.103）。アは報告削減を目的化している。イは情報を囲い込んでいる。エは記録作成を目的化している。","verified":false},{"id":"q2-b065","node":"CB-2","level":"基本","type":"A","pgl_page":103,"stem":"コミュニケーションで関係を構築する対象の範囲として、最も適切なものはどれか。","choices":{"ア":"コミュニケーションの対象はチームの内部に限るものとし、外部の関係者との関係の構築は行わない。","イ":"コミュニケーションは経営層と現場の間でのみ行うものとし、外部のステークホルダーは対象としない。","ウ":"チームの内部だけでなく、外部の関係者も含めて関係を構築し、協力を得られるようにする。","エ":"外部の関係者との関係構築はプロジェクトの完了後に行い、実行中には行わない。"},"answer":"ウ","dp":{"ア":103,"イ":103,"エ":103},"explain":"ウが正しい。コミュニケーションは、チームの内部だけでなく外部の関係者も含めて関係を構築し、協力を得られるようにする（p.103）。アは対象を内部に限定している。イは外部を対象外としている。エは構築の時期が遅れている。","verified":false},{"id":"q2-b066","node":"CB-2","level":"基本","type":"A","pgl_page":103,"stem":"コミュニケーションによってもたらされる効果に関する説明として、最も適切なものはどれか。","choices":{"ア":"円滑な意思疎通と協力を実現して関係者間の信頼性を高め、変化に俊敏に対応できるようにする。","イ":"意思疎通は必要最小限にとどめ、各担当者ができるだけ独立して作業を進められるようにする。","ウ":"関係者間の信頼性の確保よりも作業を進める速さを最も優先し、合意を形成するための手続きは省略できるようにする。","エ":"意思疎通は文書のやり取りのみで行うものとし、対話を通じた相互理解は特に重視しないようにする。"},"answer":"ア","dp":{"イ":103,"ウ":103,"エ":103},"explain":"アが正しい。コミュニケーションは円滑な意思疎通と協力を実現し、関係者間の信頼性を高めて経営環境の変化に俊敏に対応できるようにする（p.103）。イは意思疎通を最小化している。ウは信頼性より速さを優先している。エは対話による理解を軽視している。","verified":false},{"id":"q2-b067","node":"CB-2","level":"基本","type":"A","pgl_page":103,"stem":"デジタル経営におけるコミュニケーションの位置づけとして、最も適切なものはどれか。","choices":{"ア":"特定のプロジェクトが実施されている期間の中でのみ一時的に必要となる、その場限りで限定的な活動である。","イ":"IT部門の内部における連絡調整に限定された、部門内で完結する活動である。","ウ":"経営層の意思決定の内容を記録し保管することを目的とした、事務的な活動である。","エ":"戦略目標を達成するために関係者間の連携を支える、サイクル横断の共通基盤の活動。"},"answer":"エ","dp":{"ア":103,"イ":103,"ウ":103},"explain":"エが正しい。コミュニケーションは、戦略目標を達成するために関係者間の連携を支えるサイクル横断の共通基盤の活動である（p.103）。アは一時的な活動と捉えている。イは部門内活動に限定している。ウは事務作業と捉えている。","verified":false},{"id":"q2-b068","node":"CB-2","level":"基本","type":"A","pgl_page":103,"stem":"コミュニケーションを行う範囲やタイミングに関する説明として、最も適切なものはどれか。","choices":{"ア":"コミュニケーションは変革の意思決定の時にのみ集中的に行うものとし、実行の段階では行わない。","イ":"デジタル経営を円滑に継続して回すため、サイクルやプロセスを横断して継続的に行う。","ウ":"コミュニケーションは各プロセスの内部で完結させるものとし、プロセスをまたぐ連携は行わない。","エ":"コミュニケーションは問題が実際に発生した時にのみ行うものとし、平常の時には特に行わない。"},"answer":"イ","dp":{"ア":103,"ウ":103,"エ":103},"explain":"イが正しい。コミュニケーションは共通基盤として、デジタル経営を円滑に継続して回すためにサイクルやプロセスを横断して継続的に行う（p.103）。アは行う時期を限定している。ウはプロセス横断の連携を欠いている。エは平常時の実施を欠いている。","verified":false},{"id":"q2-b069","node":"CB-3","level":"基本","type":"A","pgl_page":109,"stem":"モニタリング＆コントロールにおけるパフォーマンス指標の確認に関する説明として、最も適切なものはどれか。","choices":{"ア":"パフォーマンス指標は現場の各担当者が任意に選ぶものとし、計画で定義した目標との対応づけは特に行わないものとする。","イ":"パフォーマンス指標は特に定めず、価値実現の状況は担当者の主観的な判断によって確認するものとする。","ウ":"パフォーマンス指標は財務に関する指標のみとし、価値実現の進捗を測る指標は用いないものとする。","エ":"計画で定義したKGIやKPIを測定可能な指標に変換し、価値実現の状況や進捗を測定できるようにする。"},"answer":"エ","dp":{"ア":109,"イ":109,"ウ":109},"explain":"エが正しい。モニタリング＆コントロールでは、計画で定義したKGIやKPIを測定可能な指標に変換し、価値実現の状況や進捗を測定できるようにする（p.109）。アは計画との対応づけを欠いている。イは指標を用いず主観に頼っている。ウは指標を財務に限定している。","verified":false},{"id":"q2-b070","node":"CB-3","level":"基本","type":"A","pgl_page":109,"stem":"モニタリング＆コントロールにおけるモニタリングと分析に関する説明として、最も適切なものはどれか。","choices":{"ア":"パフォーマンスデータは捕捉するにとどめるものとし、その後の分析や是正の措置までは行わないものとする。","イ":"パフォーマンスデータの捕捉と分析、結果の評価と是正措置を行い、パフォーマンスを高める。","ウ":"是正の措置は目標を大きく下回った場合にのみ行うものとし、通常の分析の結果には基づかないものとする。","エ":"データの分析はIT部門に一任するものとし、結果の評価や是正の判断は行わないものとする。"},"answer":"イ","dp":{"ア":109,"ウ":109,"エ":109},"explain":"イが正しい。モニタリングと分析では、パフォーマンスデータの捕捉と分析、結果の評価と是正措置を行い、価値実現のパフォーマンスを高める（p.109）。アは分析や是正を欠いている。ウは是正の契機を限定している。エは評価や判断を放棄している。","verified":false},{"id":"q2-b071","node":"CB-3","level":"基本","type":"A","pgl_page":109,"stem":"モニタリング＆コントロールの仕組みそのものに関する説明として、最も適切なものはどれか。","choices":{"ア":"モニタリングの仕組みは一度構築すれば、その後に機能を確認する必要はないものとする。","イ":"モニタリングの仕組みの点検はもっぱら外部の監査にすべて委ねるものとし、自らはその機能を確認しないものとする。","ウ":"モニタリングの仕組みの確認は、大きな障害が実際に発生した時にのみ行うものとする。","エ":"設定したモニタリング＆コントロールの仕組み自体が適切に機能しているかを確認する。"},"answer":"エ","dp":{"ア":109,"イ":109,"ウ":109},"explain":"エが正しい。モニタリング＆コントロールでは、その仕組み自体が適切に機能しているかをあわせて確認することが重要である（p.109）。アは機能確認を否定している。イは確認を外部に委ねている。ウは確認の契機を限定している。","verified":false},{"id":"q2-b072","node":"CB-3","level":"基本","type":"A","pgl_page":109,"stem":"モニタリング＆コントロールの位置づけに関する説明として、最も適切なものはどれか。","choices":{"ア":"指標を監視・分析し、是正措置を通じてパフォーマンスを高める共通基盤の活動。","イ":"情報セキュリティのリスクを低減することを主たる目的とする共通基盤の活動である。","ウ":"各個人の学習を組織で共有して価値創造を図ることを主たる目的とする活動である。","エ":"関係者間の意思疎通と協力を実現することを主たる目的とする活動である。"},"answer":"ア","dp":{"イ":109,"ウ":109,"エ":109},"explain":"アが正しい。モニタリング＆コントロールは、パフォーマンス指標を監視・分析し、是正措置を通じてパフォーマンスを高める共通基盤の活動である（p.109）。イはセキュリティと混同している。ウは組織学習と混同している。エはコミュニケーションと混同している。","verified":false},{"id":"q2-b073","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"デジタル経営共通基盤におけるセキュリティの位置づけとして、最も適切なものはどれか。","choices":{"ア":"情報セキュリティリスクを低減し、システムを安全に利活用できるようにする共通基盤の活動。","イ":"サイクルとプロセスを最適化することで、デジタル経営の効率と効果を最大化することを主たる目的とする活動である。","ウ":"関係者間の意思疎通と協力を実現することを主たる目的とする共通基盤の活動である。","エ":"各個人の学習を組織で共有することを主たる目的とする共通基盤の活動である。"},"answer":"ア","dp":{"イ":113,"ウ":113,"エ":113},"explain":"アが正しい。セキュリティは、情報セキュリティのリスクを低減し、システムを安全に利活用できるようにする共通基盤の活動である（p.113）。イはサイクルマネジメントと混同している。ウはコミュニケーションと混同している。エは組織学習と混同している。","verified":false},{"id":"q2-b074","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"セキュリティの取り組みの範囲に関する説明として、最も適切なものはどれか。","choices":{"ア":"情報セキュリティは技術的なツールの導入のみで確保できるものとし、教育や体制の整備は行わないものとする。","イ":"セキュリティの取り組みは情報漏洩が実際に発生した後に、まとめて整備すればよいものとする。","ウ":"ツールに加え教育研修やヘルプデスクの整備、事業継続性等の安定稼働の仕組みを整備し評価する。","エ":"セキュリティの取り組みは事業継続性とは切り離すものとし、システムの停止への対策は範囲に含めない。"},"answer":"ウ","dp":{"ア":113,"イ":113,"エ":113},"explain":"ウが正しい。セキュリティでは、ツールに加え教育研修やヘルプデスクの整備、事業継続性等の安定稼働の仕組みを整備し、その遂行能力を評価する（p.113）。アはツールのみに偏っている。イは事後対応に留まっている。エは事業継続性を除外している。","verified":false},{"id":"q2-b075","node":"CB-4","level":"基本","type":"A","pgl_page":113,"stem":"セキュリティと事業継続性（BCP）の関係に関する説明として、最も適切なものはどれか。","choices":{"ア":"事業継続性はセキュリティとは無関係であるとして、システムの安定した稼働の対策には含めない。","イ":"事業継続性の確保はシステムに障害が実際に発生してから検討すればよいものとする。","ウ":"情報セキュリティに加え事業継続性等、システムを安定的に稼働させる仕組みを整備する。","エ":"事業継続性への対策はIT部門に限定するものとし、事業部門は関与しないものとする。"},"answer":"ウ","dp":{"ア":113,"イ":113,"エ":113},"explain":"ウが正しい。セキュリティでは、情報セキュリティに加えて事業継続性等、システムを安定的に稼働させる仕組みを整備する（p.113）。アは事業継続性を除外している。イは対策の時期が遅れている。エは対象を限定している。","verified":false},{"id":"q2-b076","node":"CB-5","level":"基本","type":"A","pgl_page":119,"stem":"組織学習の環境整備における経営者の役割に関する説明として、最も適切なものはどれか。","choices":{"ア":"組織学習の環境の整備は現場の担当者に一任するものとし、経営者は特に関与しないものとする。","イ":"経営者が主導して従業員とパーパスやビジョン等を共有し、動機付けを高めて環境を整備する。","ウ":"従業員への動機付けは行わないものとし、学習の仕組みさえ整えれば自然に定着するものとする。","エ":"組織学習の環境整備は短期間で完了させるものとし、企業文化を変える中長期の取り組みとはしない。"},"answer":"イ","dp":{"ア":119,"ウ":119,"エ":119},"explain":"イが正しい。組織学習の環境整備では、経営者が主導して従業員とパーパスやビジョン等を共有し、動機付けを高めて環境を整備する（p.119）。アは経営者の関与を欠いている。ウは動機付けを欠いている。エは取り組みの期間の捉え方が誤り。","verified":false},{"id":"q2-b077","node":"CB-5","level":"基本","type":"A","pgl_page":119,"stem":"組織学習の性格に関する説明として、最も適切なものはどれか。","choices":{"ア":"組織学習は短期間で成果が出る取り組みであり、その時々の状況に応じた一時的な施策として実施すればよいものとする。","イ":"組織学習は個々の従業員のスキルを高める活動であり、企業の文化や風土とは関係しないものとする。","ウ":"組織学習は成熟に時間がかかるため、着手は成熟度が十分に高まってから行うべきものとする。","エ":"企業の文化・風土を変えるものであり、現状を踏まえた中長期の取り組みとして捉える必要がある。"},"answer":"エ","dp":{"ア":119,"イ":119,"ウ":119},"explain":"エが正しい。組織学習は企業の文化・風土を変えるものであり、現状を踏まえた中長期の取り組みとして捉える必要がある（p.119）。アは取り組みの性格の捉え方が誤り。イは文化・風土との関係を否定している。ウは着手の時期の捉え方が誤り。","verified":false},{"id":"q2-b078","node":"CB-5","level":"基本","type":"A","pgl_page":118,"stem":"組織学習における知の共有と発展の仕組みに関する説明として、最も適切なものはどれか。","choices":{"ア":"個人の知は暗黙知のまま各人が保持すればよいものとし、組織での形式知化は行わないものとする。","イ":"個人の暗黙知を組織で共有して形式知化し、発展・応用して新たな個人の知として取り込む。","ウ":"形式知化した知識は組織内で共有するにとどめ、発展や応用、個人への取り込みは行わない。","エ":"知の共有は成功の事例に限るものとし、失敗から得た知は形式知化の対象としないものとする。"},"answer":"イ","dp":{"ア":118,"ウ":118,"エ":118},"explain":"イが正しい。組織学習では、個人の暗黙知を組織で共有して形式知化し、発展・応用して再び新たな個人の知として取り込むことを繰り返す（p.118）。アは形式知化を欠いている。ウは発展・応用や取り込みを欠いている。エは共有の対象を限定している。","verified":false},{"id":"q2-b079","node":"P6","level":"基本","type":"A","pgl_page":90,"stem":"提供価値検証プロセスの進め方に関する説明として、最も適切なものはどれか。","choices":{"ア":"提供した価値の達成状況をパフォーマンス指標等で検証し、次の計画や戦略の見直しにつなげる。","イ":"提供した価値の達成状況は検証せず、次の計画は前回の計画をそのまま踏襲して作成するものとする。","ウ":"提供価値の検証は売上や利益などの財務指標のみで行い、価値実現の指標は用いない。","エ":"提供価値の検証は事業が終了した後に一度だけ行うものとし、実行の途中では行わないものとする。"},"answer":"ア","dp":{"イ":90,"ウ":90,"エ":90},"explain":"アが正しい。提供価値検証では、提供した価値の達成状況をパフォーマンス指標等を用いて検証し、次の計画や戦略の見直しにつなげる（p.90）。イは検証を欠いている。ウは指標を財務に限定している。エは検証の時期を限定している。","verified":false},{"id":"q2-b080","node":"P6","level":"基本","type":"A","pgl_page":90,"stem":"提供価値検証プロセスの構造上の特徴に関する説明として、最も適切なものはどれか。","choices":{"ア":"内部に複数のアクティビティを内包する、大規模で階層的なプロセスとして位置づけられる。","イ":"戦略プロセスや実行計画プロセスと同様、内部にアクティビティを内包しないプロセスである。","ウ":"IT開発・導入プロセスの一部を構成するアクティビティとして位置づけられる。","エ":"価値提供・運用プロセスに内包されるアクティビティとして位置づけられる。"},"answer":"イ","dp":{"ア":90,"ウ":90,"エ":90},"explain":"イが正しい。提供価値検証プロセスは、デジタル経営戦略プロセスや実行計画プロセスと同様、内部にアクティビティを内包しないプロセスである（p.90）。アは内包構造の捉え方が誤り。ウは他プロセスの一部と誤認している。エは内包関係を取り違えている。","verified":false}];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pct(o,a){return a? Math.round(o/a*100):0}
function barCls(p){return p>=80?"":p>=60?"mid":"low"}
const app=document.getElementById("app");
const STORAGE_OK=(function(){try{localStorage.setItem("__itc2_t","1");localStorage.removeItem("__itc2_t");return true}catch(e){return false}})();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
if(!STORAGE_OK){
  const w=document.getElementById("swarn");
  w.style.display="block";
  w.style.cssText="display:block;margin:12px 16px 0;padding:12px 14px;border:2px solid var(--shu);background:#fff3f2;color:var(--shu);border-radius:6px;font-size:13px;line-height:1.7";
  w.innerHTML="<b>⚠ このブラウザでは学習データを保存できません。</b><br>プライベートブラウズ（シークレットモード）を解除するか、通常のブラウザで開き直してください。このままでは、閉じると解答途中の模試も成績も消えます。";
}
let timerIv=null;
function stopTimer(){if(timerIv){clearInterval(timerIv);timerIv=null;}document.getElementById("timer").style.display="none"}

/* ---------------- ホーム ---------------- */
function home(){
  stopTimer();
  const answered=Object.keys(stats).length;
  const ok=Object.values(stats).filter(s=>s.last==="o").length;
  const hist=load(K_HIST,[]);
  const mock=load(K_MOCK,null);
  const last=hist.length?hist[hist.length-1]:null;
  const mockAns=mock?Object.keys(mock.answers||{}).length:0;
  const mockMin=mock?Math.max(0,Math.floor((mock.remain||0)/60)):0;
  app.innerHTML=`
  ${mock&&mock.done?`<div class="card" style="border:2px solid var(--midori)"><h2>採点済みの模試があります</h2>
    <p class="muted" style="margin-bottom:10px">解答と結果はこの端末に保存されています。消えるのは下の「クリア」を押したときだけです。</p>
    <div class="navrow"><button class="primary" id="r-res">結果と解説を見る</button><button class="danger" id="r-clear">クリアして最初からやり直す</button></div></div>`:""}
  ${mock&&!mock.done?`<div class="card" style="border:2px solid var(--gold)"><h2>途中の模試があります</h2>
    <p class="muted" style="margin-bottom:10px">解答済み <b>${mockAns}</b>/100問　${(()=>{const f=firstUnanswered(mock);return f>=0?`次は<b>問${f+1}</b>から　`:""})()}${mock.timeup?"<b>時間切れ</b>（解答は続けられます）":`残り時間 <b>約${mockMin}分</b>`}　（この端末に自動保存されています）</p>
    <div class="navrow"><button class="primary" id="r-go">続きから再開する</button><button class="danger" id="r-new">クリアして最初からやり直す</button></div></div>`:""}
  <div class="card"><h2>学習の現在地</h2>
    <div class="stat">
      <span>解答済み <b>${answered}</b><span class="muted">/100問</span></span>
      <span>直近正答 <b>${answered?pct(ok,answered):0}%</b></span>
      <span>模試受験 <b>${hist.length}</b>回${last?`<span class="muted">（直近 ${last.score}/${last.total}）</span>`:""}</span>
    </div></div>
  <div class="modes">
    <div class="mode" id="m-mock"><b>模試モード</b><span class="muted">100問・120分。本試験と同じ通し形式。見直しフラグ・中断保存つき。</span>
      ${mock?'<div style="margin-top:8px"><span class="tagchip" style="color:var(--gold);border-color:var(--gold)">中断中の模試あり — 続きから再開</span></div>':""}</div>
    <div class="mode" id="m-drill"><b>分野別ドリル</b><span class="muted">分野を選んで1問ずつ。答えるとすぐ解説とPGL参照が出ます。</span></div>
    <div class="mode" id="m-review"><b>間違い直し</b><span class="muted">直近で誤答した問題だけを再出題。正解するとリストから消えます。</span></div>
    <div class="mode" id="m-map"><b>弱点マップ</b><span class="muted">分野別の正答率。弱い分野の関連用語とPGLの読むべきページへ。</span></div>
  </div>`;
  if(mock&&mock.done){
    document.getElementById("r-res").onclick=()=>resumeMock();
    document.getElementById("r-clear").onclick=()=>{
      if(confirm("採点済みの模試をクリアして、最初からやり直せる状態にします。よろしいですか？")){
        localStorage.removeItem(K_MOCK); M=null; home();
      }
    };
  }
  if(mock&&!mock.done){
    document.getElementById("r-go").onclick=()=>resumeMock();
    document.getElementById("r-new").onclick=()=>{
      if(confirm("途中の模試をクリアして、最初から始めますか？（解答内容は失われます）")){
        localStorage.removeItem(K_MOCK); M=null; home();
      }
    };
  }
  document.getElementById("m-mock").onclick=()=>mock?resumeMock():confirmStart();
  document.getElementById("m-drill").onclick=()=>drillSelect();
  document.getElementById("m-review").onclick=()=>startReview();
  document.getElementById("m-map").onclick=()=>weakMap();
}
function confirmStart(){
  app.insertAdjacentHTML("beforeend",`<dialog id="dlg"><h2>模試を開始します</h2>
   <p class="muted">100問・制限時間120分。途中で「中断」すると残り時間ごと保存され、後で再開できます。採点すると解説が読めるようになります。</p>
   <div class="navrow"><button id="dl-go" class="primary">開始する</button><button id="dl-no">やめる</button></div></dialog>`);
  const d=document.getElementById("dlg"); d.showModal();
  document.getElementById("dl-no").onclick=()=>{d.close();d.remove()};
  document.getElementById("dl-go").onclick=()=>{d.close();d.remove();startMock()};
}

/* ---------------- 模試 ---------------- */
let M=null;
function recordMock(q,p){
  const hit=(p===q.answer)?"o":"x";
  const s=stats[q.id]=stats[q.id]||{o:0,x:0};
  const prev=M.rec[q.id];
  if(prev!==hit){
    if(prev==="o")s.o=Math.max(0,s.o-1);
    if(prev==="x")s.x=Math.max(0,s.x-1);
    if(hit==="o")s.o++;else s.x++;
    M.rec[q.id]=hit;
  }
  s.last=hit;
  save(K_STATS,stats);
}
function startMock(){
  M={idx:0,answers:{},flags:{},rec:{},remain:MOCK_SEC,done:false};
  save(K_MOCK,M); mockView();
}
function firstUnanswered(m){for(let i=0;i<QS.length;i++){if(!m.answers[QS[i].id])return i}return -1}
function resumeMock(){
  M=load(K_MOCK,null); if(!M){home();return}
  M.rec=M.rec||{};
  if(M.done){showSavedResult();return}
  const fu=firstUnanswered(M);
  if(fu>=0){M.idx=fu;save(K_MOCK,M)}  // 続きから＝最初の未解答問題へ
  mockView();
}
function showSavedResult(){
  let ok=0; const byNode={};
  QS.forEach(q=>{
    const hit=M.answers[q.id]===q.answer; if(hit)ok++;
    (byNode[q.node]=byNode[q.node]||[0,0])[1]++; if(hit)byNode[q.node][0]++;
  });
  resultView({answers:Object.assign({},M.answers),score:ok,total:QS.length,byNode,timeup:!!M.timeup,partial:false,gradedIds:new Set(QS.map(q=>q.id))});
}
function mockTick(){
  M.remain--;
  if(M.remain%10===0) save(K_MOCK,M);
  drawTimer();
  if(M.remain<=0){
    stopTimerOnly(); M.timeup=true; save(K_MOCK,M); drawTimer();
  }
}
function stopTimerOnly(){if(timerIv){clearInterval(timerIv);timerIv=null;}}
function drawTimer(){
  const t=document.getElementById("timer");
  t.style.display="block";
  const m=Math.max(0,M.remain), ss=String(m%60).padStart(2,"0");
  t.textContent=m<=0?"時間切れ":`${Math.floor(m/60)}:${ss}`;
  t.classList.toggle("warn",m<600);
}
function mockView(){
  stopTimer();
  if(M.remain>0) timerIv=setInterval(mockTick,1000);
  drawTimer();
  renderMockQ();
}
function renderMockQ(){
  const q=QS[M.idx], sel=M.answers[q.id];
  app.innerHTML=`
  <div class="card">
    <div class="qmeta"><span class="tagchip">問${M.idx+1} / 100</span><span class="tagchip">${q.level}</span>
      <button class="flagbtn ${M.flags[q.id]?"on":""}" id="flag">${M.flags[q.id]?"⚑ 見直す":"⚐ 見直しフラグ"}</button></div>
    <div class="stem"><span class="qno">問${M.idx+1}</span>${esc(q.stem)}</div>
    <div class="choices">${POS.map(p=>`
      <button class="choice ${sel===p?"sel":""}" data-p="${p}"><span class="pos">${p}</span><span class="tx">${esc(q.choices[p])}</span></button>`).join("")}
    </div>
    <div class="navrow">
      <button id="prev" ${M.idx===0?"disabled":""}>← 前へ</button>
      <button id="next" ${M.idx===99?"disabled":""}>次へ →</button>
      <div class="spacer"></div>
      <button id="pause">中断して保存（閉じても残ります）</button>
      <button id="grade" class="danger">採点する</button>
    </div>
    <div class="grid">${QS.map((x,i)=>`<div class="cell ${M.answers[x.id]?"answered":""} ${M.flags[x.id]?"flagged":""} ${i===M.idx?"cur":""}" data-i="${i}">${i+1}</div>`).join("")}</div>
    <p class="muted" style="margin-bottom:0">解答済み ${Object.keys(M.answers).length}/100　⚑=見直しフラグ</p>
  </div>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const pp=b.dataset.p;M.answers[q.id]=pp;recordMock(q,pp);save(K_MOCK,M);renderMockQ()});
  document.getElementById("flag").onclick=()=>{if(M.flags[q.id])delete M.flags[q.id];else M.flags[q.id]=1;save(K_MOCK,M);renderMockQ()};
  document.getElementById("prev").onclick=()=>{M.idx--;save(K_MOCK,M);renderMockQ()};
  document.getElementById("next").onclick=()=>{M.idx++;save(K_MOCK,M);renderMockQ()};
  document.getElementById("pause").onclick=()=>{save(K_MOCK,M);home()};
  document.getElementById("grade").onclick=()=>{
    const un=100-Object.keys(M.answers).length;
    if(un===0){gradeMock(false,false);return}
    app.insertAdjacentHTML("beforeend",`<dialog id="gdlg"><h2>採点方法を選んでください</h2>
     <p class="muted">未解答が ${un} 問あります。</p>
     <div class="navrow" style="flex-direction:column;align-items:stretch">
      <button class="primary" id="g-part">途中採点 — 解答済み ${100-un} 問を採点（続きは後で再開）</button>
      <button id="g-full">本番方式 — 未解答を不正解として100問で採点（模試を終了）</button>
      <button class="ghost" id="g-no">戻る</button></div>
     <p class="muted" style="margin-bottom:0">途中採点しても模試は終わりません。残りの問題は後日続きから解けます。</p></dialog>`);
    const d=document.getElementById("gdlg"); d.showModal();
    document.getElementById("g-no").onclick=()=>{d.close();d.remove()};
    document.getElementById("g-part").onclick=()=>{d.close();d.remove();gradeMock(false,true)};
    document.getElementById("g-full").onclick=()=>{d.close();d.remove();gradeMock(false,false)};
  };
  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{M.idx=+c.dataset.i;save(K_MOCK,M);renderMockQ()});
}
function gradeMock(timeup,partial){
  stopTimer();
  const target=partial? QS.filter(q=>M.answers[q.id]) : QS;
  let ok=0; const byNode={};
  target.forEach(q=>{
    const a=M.answers[q.id], hit=a===q.answer;
    if(hit)ok++;
    (byNode[q.node]=byNode[q.node]||[0,0])[1]++;
    if(hit)byNode[q.node][0]++;
  });
  // 未解答は模試スコア上のみ不正解扱い。問題別成績（弱点マップ・間違い直し）には記録しない。
  const res={answers:Object.assign({},M.answers),score:ok,total:target.length,byNode,timeup,partial,
             gradedIds:new Set(target.map(q=>q.id))};
  if(partial){
    save(K_MOCK,M); // セッション継続 — 続きは後で再開できる
  }else{
    if(!M.done){
      const hist=load(K_HIST,[]);
      hist.push({date:new Date().toISOString().slice(0,10),score:ok,total:target.length,byNode});
      save(K_HIST,hist);
    }
    M.done=true; if(timeup)M.timeup=true;
    save(K_MOCK,M); // 採点してもデータは消えない。消すのは「クリア」を押したときだけ。
  }
  resultView(res);
}
function resultView(res){
  const rows=Object.keys(res.byNode).sort((a,b)=>pct(...res.byNode[a])-pct(...res.byNode[b]));
  const missed=QS.filter(q=>res.gradedIds.has(q.id)&&res.answers[q.id]!==q.answer);
  const unansweredCt=missed.filter(q=>!res.answers[q.id]).length;
  const weakNodes=rows.filter(n=>pct(...res.byNode[n])<60);
  const p=pct(res.score,res.total);
  app.innerHTML=`
  <div class="card"><div class="score-hero"><div class="big">${res.score}<span class="of"> / ${res.total}</span></div>
    <div class="muted">${res.timeup?"時間切れで自動採点しました。":""}${res.partial?`途中採点（${res.total}問時点）— 模試は継続中。`:""}正答率 ${p}%</div></div></div>
  <div class="card"><h2>次の一手</h2>
    <div class="navrow" style="margin-top:4px">
      ${missed.length?`<button class="primary" id="redo-miss">${unansweredCt?`不正解・未解答の ${missed.length} 問を解き直す`:`間違えた ${missed.length} 問をやり直す`}</button>`:`<span class="tagchip">全問正解！</span>`}
      ${weakNodes.length?`<button id="redo-weak">苦手分野をまとめてドリル（${weakNodes.length}分野）</button>`:""}
    </div>
    ${weakNodes.length?`<p class="muted" style="margin-bottom:0">苦手分野 = 正答率60%未満: ${weakNodes.map(n=>NODES[n]||n).join("、")}</p>`:""}</div>
  <div class="card"><h2>分野別の結果</h2>
    ${rows.map(n=>{const [o,a]=res.byNode[n],p=pct(o,a);return `
    <div class="noderow"><span>${NODES[n]||n}</span><div class="bar"><i class="${barCls(p)}" style="width:${p}%"></i></div><span class="pct">${o}/${a}</span></div>`}).join("")}
    <p class="muted">弱い分野は「弱点マップ」から関連用語とPGLの該当ページへ。</p></div>
  <div class="card"><h2>解説を読む</h2>
    ${res.partial?'<p class="muted">色付き＝採点対象。グレー＝未解答（採点対象外。押せば解説は読めます）。</p>':""}
    <div class="grid">${QS.map((q,i)=>{
      if(!res.gradedIds.has(q.id))return `<div class="cell" style="opacity:.45" data-i="${i}">${i+1}</div>`;
      const hit=res.answers[q.id]===q.answer;return `<div class="cell ${hit?"ok":"ng"}" data-i="${i}">${i+1}</div>`}).join("")}</div>
    <div id="revq" style="margin-top:14px"></div></div>
  <div class="navrow">${res.partial?`<button class="primary" id="cont">模試の続きへ（問${(()=>{const m=load(K_MOCK,null);const f=m?firstUnanswered(m):-1;return f>=0?f+1:"—"})()}から・残り ${100-res.gradedIds.size} 問）</button>`:""}<button class="${res.partial?"":"primary"}" id="tohome">ホームへ</button><button id="tomap">弱点マップを見る</button></div>`;
  const cont=document.getElementById("cont");
  if(cont)cont.onclick=()=>resumeMock();
  document.getElementById("tohome").onclick=home;
  document.getElementById("tomap").onclick=weakMap;
  const rm=document.getElementById("redo-miss");
  if(rm)rm.onclick=()=>startDrill(missed,"模試の間違い直し");
  const rw=document.getElementById("redo-weak");
  if(rw)rw.onclick=()=>startDrill(QS.filter(q=>weakNodes.includes(q.node)),"苦手分野ドリル");
  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{
    const q=QS[+c.dataset.i];
    document.getElementById("revq").innerHTML=qReview(q,res.answers[q.id],+c.dataset.i+1);
    document.getElementById("revq").scrollIntoView({behavior:"smooth",block:"start"});
  });
}
function qReview(q,picked,no){
  return `<div class="qmeta"><span class="tagchip">問${no}</span><span class="tagchip">${NODES[q.node]||q.node}</span><span class="tagchip">PGL p.${q.pgl_page}</span></div>
  <div class="stem">${esc(q.stem)}</div>
  <div class="choices">${POS.map(p=>{
    const cls=p===q.answer?"ok":(p===picked?"ng":"dim");
    return `<div class="choice ${cls}"><span class="pos">${p}</span><span class="tx">${esc(q.choices[p])}</span></div>`}).join("")}</div>
  ${expBlock(q)}`;
}
function expBlock(q){
  const terms=(TERMMAP[q.node]||[]).slice(0,6);
  return `<div class="exp"><div class="vh">解説 — 正解 ${q.answer}</div>${esc(q.explain)}
    <div class="chain"><b>復習チェーン</b>：弱点ノード「${NODES[q.node]||q.node}」→ PGL <b>p.${q.pgl_page}</b> を読む
    ${terms.length?`　関連用語: ${terms.map(t=>`<span class="tagchip">${esc(t.t)}<span class="muted">（p.${t.p}）</span></span>`).join("")}`:""}
    </div></div>`;
}

/* ---------------- ドリル ---------------- */
let D=null;
function drillSelect(){
  stopTimer();
  const nodes=[...new Set(QS.map(q=>q.node))];
  app.innerHTML=`<div class="card"><h2>分野別ドリル</h2>
   <p class="muted">分野を選んでください（複数可）。選んだ範囲からシャッフルで出題します。</p>
   <div class="chips">${nodes.map(n=>`<span class="c" data-n="${n}">${NODES[n]||n} <span class="muted">${QS.filter(q=>q.node===n).length}</span></span>`).join("")}</div>
   <div class="navrow"><button class="primary" id="go">出題開始</button><button id="all">全分野から出題</button></div></div>`;
  app.querySelectorAll(".c").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  document.getElementById("go").onclick=()=>{
    const sel=[...app.querySelectorAll(".c.on")].map(c=>c.dataset.n);
    if(!sel.length){alert("分野を選ぶか「全分野から出題」を押してください。");return}
    startDrill(QS.filter(q=>sel.includes(q.node)));
  };
  document.getElementById("all").onclick=()=>startDrill(QS.slice());
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startDrill(pool,label){
  if(!pool.length){alert("対象の問題がありません。");return}
  D={pool:shuffle(pool.slice()),i:0,ok:0,label:label||"ドリル"};
  drillQ();
}
function drillQ(){
  if(D.i>=D.pool.length){ drillEnd(); return }
  const q=D.pool[D.i];
  app.innerHTML=`<div class="card">
    <div class="qmeta"><span class="tagchip">${D.label} ${D.i+1}/${D.pool.length}</span><span class="tagchip">${q.level}</span><span class="tagchip">正解 ${D.ok}</span></div>
    <div class="stem">${esc(q.stem)}</div>
    <div class="choices">${POS.map(p=>`<button class="choice" data-p="${p}"><span class="pos">${p}</span><span class="tx">${esc(q.choices[p])}</span></button>`).join("")}</div>
    <div id="after"></div>
    <div class="navrow"><div class="spacer"></div><button id="quit">やめる</button></div></div>`;
  document.getElementById("quit").onclick=drillEnd;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const p=b.dataset.p, hit=p===q.answer;
    const s=stats[q.id]=stats[q.id]||{o:0,x:0};
    if(hit){s.o++;s.last="o";D.ok++}else{s.x++;s.last="x"}
    save(K_STATS,stats);
    app.querySelectorAll(".choice").forEach(c=>{
      const cp=c.dataset.p;
      c.classList.add(cp===q.answer?"ok":(cp===p?"ng":"dim"));
      c.onclick=null;
    });
    document.getElementById("after").innerHTML=expBlock(q)+`<div class="navrow"><button class="primary" id="nx">次の問題 →</button></div>`;
    document.getElementById("nx").onclick=()=>{D.i++;drillQ()};
    document.getElementById("nx").focus();
  });
}
function drillEnd(){
  const done=D.i+(D.i<D.pool.length?0:0);
  app.innerHTML=`<div class="card"><h2>${D.label} 終了</h2>
   <p>${D.i}問解答、正解 ${D.ok}問${D.i?`（${pct(D.ok,D.i)}%）`:""}。</p>
   <div class="navrow"><button class="primary" id="tohome">ホームへ</button><button id="tomap">弱点マップ</button></div></div>`;
  document.getElementById("tohome").onclick=home;
  document.getElementById("tomap").onclick=weakMap;
  D=null;
}
function startReview(){
  const wrong=QS.filter(q=>stats[q.id]&&stats[q.id].last==="x");
  if(!wrong.length){
    app.innerHTML=`<div class="card"><h2>間違い直し</h2><p class="muted">いま直すべき誤答はありません。模試やドリルで間違えた問題がここに溜まります。</p>
    <div class="navrow"><button class="primary" id="tohome">ホームへ</button></div></div>`;
    document.getElementById("tohome").onclick=home; return;
  }
  startDrill(wrong,"間違い直し");
}

/* ---------------- 弱点マップ ---------------- */
function weakMap(){
  stopTimer();
  const byNode={};
  QS.forEach(q=>{
    const s=stats[q.id]; (byNode[q.node]=byNode[q.node]||{o:0,a:0,pages:new Set()});
    byNode[q.node].pages.add(q.pgl_page);
    if(s){byNode[q.node].a++; if(s.last==="o")byNode[q.node].o++;}
  });
  const rows=Object.keys(byNode).sort((x,y)=>{
    const px=byNode[x].a?pct(byNode[x].o,byNode[x].a):-1, py=byNode[y].a?pct(byNode[y].o,byNode[y].a):-1;
    return px-py;
  });
  const weakNs=rows.filter(n=>byNode[n].a>0 && pct(byNode[n].o,byNode[n].a)<60);
  app.innerHTML=`<div class="card"><h2>弱点マップ</h2>
   <p class="muted">直近の解答結果に基づく分野別正答率（弱い順）。分野名を押すと、その分野の関連用語と読むべきPGLページ、ドリル開始ボタンが出ます。</p>
   ${weakNs.length?`<div class="navrow" style="margin:2px 0 12px"><button class="primary" id="wk-all">苦手分野をまとめてドリル（${weakNs.length}分野・${QS.filter(q=>weakNs.includes(q.node)).length}問）</button></div>`:""}
   ${rows.map(n=>{
     const d=byNode[n], p=d.a?pct(d.o,d.a):0;
     return `<div class="noderow"><span class="nm" data-n="${n}">${NODES[n]||n}</span>
       <div class="bar"><i class="${d.a?barCls(p):""}" style="width:${d.a?p:0}%"></i></div>
       <span class="pct">${d.a?`${d.o}/${d.a}`:"未着手"}</span></div>`}).join("")}
   <div id="nodedetail" style="margin-top:14px"></div>
   <div class="navrow"><button class="primary" id="tohome">ホームへ</button><div class="spacer"></div><button class="ghost" id="st-reset" style="font-size:12px;color:var(--sub)">学習履歴をリセット</button></div></div>`;
  document.getElementById("tohome").onclick=home;
  document.getElementById("st-reset").onclick=()=>{
    if(!confirm("分野別正答率・間違い直しリスト・模試履歴をすべて消去します。よろしいですか？\n（解答途中の模試があれば、選んだ解答自体は残ります）"))return;
    localStorage.removeItem(K_STATS); localStorage.removeItem(K_HIST);
    stats={};
    const mk=load(K_MOCK,null);
    if(mk){mk.rec={};save(K_MOCK,mk)}
    if(M){M.rec={}}
    weakMap();
  };
  const wa=document.getElementById("wk-all");
  if(wa)wa.onclick=()=>startDrill(QS.filter(q=>weakNs.includes(q.node)),"苦手分野ドリル");
  app.querySelectorAll(".nm").forEach(el=>el.onclick=()=>{
    const n=el.dataset.n, d=byNode[n];
    const pages=[...d.pages].sort((a,b)=>a-b).join(", ");
    const terms=TERMMAP[n]||[];
    document.getElementById("nodedetail").innerHTML=`
     <div class="exp"><div class="vh">${NODES[n]||n} の復習チェーン</div>
      出題PGLページ: <b>p.${pages}</b> — 紙面のこの範囲を読み直してからドリルへ。
      ${terms.length?`<div style="margin-top:6px">関連用語: ${terms.map(t=>`<span class="tagchip">${esc(t.t)}<span class="muted">（p.${t.p}）</span></span>`).join(" ")}</div>`:""}
      <div class="navrow"><button class="primary" id="nd-drill">この分野をドリル</button></div></div>`;
    document.getElementById("nd-drill").onclick=()=>startDrill(QS.filter(q=>q.node===n),NODES[n]||n);
  });
}
function flushSave(){ try{ if(M) save(K_MOCK,M); save(K_STATS,stats); }catch(e){} }
window.addEventListener("pagehide",flushSave);
window.addEventListener("beforeunload",flushSave);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushSave(); });
document.getElementById("homebtn").onclick=()=>{
  if(M){save(K_MOCK,M)} home();
};
home();
</script>
</body>
</html>
